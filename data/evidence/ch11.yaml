- id: ch11_i2
  chapter: 11
  item: 2
  chapter_title: {ru: "Красные линии, на которые легко наступить программистам и технарям", en: "Common legal pitfalls for programmers and tech professionals"}
  title: {ru: "Не делать и не продавать игровые читы и помощники, в том числе ИИ‑помощники, которые «только читают экран и не трогают память», и не продавать модификации вроде добавления функций в WeChat", en: "Do not make or sell game cheats and aids, including AI aids that “only read the screen and never touch memory,” and do not sell modified builds that add features to software such as WeChat"}
  grade: A
  measure: freedom
  plain:
    ru: "Читы, проданные 20 пользователям, или доход 5000 юаней уже тянут на срок до 3 лет; в особо тяжких случаях — от 3 до 7 лет. Кто-то делал читы с просмотром сквозь стены и автоприцелом, за 3 месяца продал больше чем на 80000, получил 1 год условно на 1 год и штраф 5000 юаней. Кто-то поднял пиратский сервер на серверной программе, собрал больше 20000000 на пополнениях — самый тяжёлый срок 4 года, штраф до 10000000 юаней."
    en: "Selling a cheat to 20 person-times, or earning 5000 yuan, is enough for up to 3 years; especially serious cases get 3 to 7 years. Someone who made wall-hack and aim-assist cheats sold over 80000 yuan worth in 3 months, got 1 year suspended for 1 year and a 5000 yuan fine. Someone who took server-side code, ran a private server, and took over 20000000 yuan in top-ups got up to 4 years, with fines as high as 10000000 yuan"
  benefit:
    ru: "Предоставление программ и инструментов, специально предназначенных для проникновения в компьютерные информационные системы или незаконного управления ими, при тяжких обстоятельствах — до 3 лет лишения свободы и штраф (одновременно или только штраф). При особо тяжких — от 3 до 7 лет и штраф. Порог «тяжких»: предоставление инструмента 20 и более пользователям либо незаконный доход от 5000 юаней. Намеренный обход или разрушение технических мер защиты правообладателя может также квалифицироваться как нарушение авторских прав: до 3 лет, в тяжёлых случаях — от 3 до 10 лет. Официальные дела: Ван и другие делали и продавали читы с чтением и изменением памяти игры (просмотр сквозь стены, автоприцел); за 3 месяца продали больше чем на 80000 юаней, прибыль больше 30000; приговор — 1 год условно на 1 год, штраф 5000 юаней. Условный срок 1 год значит: год не сажают, если за этот год не совершить новое. Сян и другие продавали серию читов «TZ», оборот больше 200000 юаней; Сян — 3 года условно на 3 года, штраф 20000 юаней. Лю и другие получили серверную программу игры, изменили параметры и открыли пиратский сервер, собрали пополнения больше 20000000 юаней; сроки от 4 лет до 2 лет 6 месяцев, штрафы от 10000000 до 1300000 юаней. Не только игры: шанхайская компания сделала прошивку, добавляющую в WeChat десятки функций (автопересылка, лайки, массовая рассылка и т.п.); такие «маркетинговые телефоны» продали 2381 штуку. В 2019 году суд района Сюйхой (Шанхай) по нарушению авторских прав оштрафовал компанию на 500000 юаней, руководителя приговорил к 1 году 6 месяцам условно на 1 год 6 месяцев (по всей стране)."
    en: "Providing programs or tools specially used to intrude upon or illegally control computer information systems, when circumstances are serious, brings up to 3 years and a fine concurrently or alone. Concurrent means prison plus a fine; alone means fine only. Especially serious circumstances bring 3 to 7 years plus a fine. The threshold for “serious circumstances” is providing the tool to 20 person-times or more, or illegal gains of 5000 yuan or more. Illegal gains means the money earned from this. Intentionally bypassing or destroying technical protection measures set by the rights holder may also constitute copyright infringement, with up to 3 years, or 3 to 10 years in serious cases. Official case: Wang and others made and sold cheats that read and modified game memory for wall hacks and aim assist. In 3 months they sold over 80000 yuan and profited over 30000 yuan. Sentence: 1 year suspended for 1 year, fine 5000 yuan. Suspended for 1 year means a 1-year sentence that is not served yet; if you stay clean that year you need not go to prison. Xiang and others sold the “TZ” series of cheats with sales over 200000 yuan; Xiang got 3 years suspended for 3 years and a 20000 yuan fine. Liu and others obtained game server programs, changed parameters, ran private servers, and took over 20000000 yuan in top-ups. Sentences from 4 years to 2 years 6 months, fines from 10000000 to 1300000 yuan. Not only games. A Shanghai company made custom ROMs that added dozens of features to WeChat on the phone — auto-forward, like, mass message, and more. Those phones were sold as “marketing phones,” 2381 units. In 2019 the Shanghai Xuhui court convicted the company of copyright infringement, fined it 500000 yuan, and sentenced the person in charge to 1 year 6 months suspended for 1 year 6 months (nationwide)"
  sources:
    - {citation: "全国人大 (2020). 刑法（根据刑法修正案（十一）修正，第二百八十五条第三款、第二百一十七条第六项）", url: "https://jtgl.beijing.gov.cn/jgj/jgxx/flfg/fl/11033925/index.html"}
    - {citation: "最高人民法院、最高人民检察院 (2011). 关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释（第三条）. <https://ga.sz.gov.cn/ZWGK/ZCFG/ZCJD/content/post_1304363.html>（深圳市公安局转载）；最高人民检察院 (2026). 上海静安：严惩制售游戏外挂黑灰产共护清朗网络空间", url: "https://www.spp.gov.cn/spp/zdgz/202608/t20260825_735480.shtml"}
    - {citation: "最高人民检察院 (2021). 2020 年度检察机关保护知识产权典型案例（案例五）", url: "https://www.spp.gov.cn/spp/xwfbh/wsfbt/202104/t20210425_516525.shtml"}
    - {citation: "国家版权局 (2020). 2019 年度上海十大版权典型案件发布（上海市版权局发布，案例八：上海昱宫网络科技有限公司等侵犯著作权案）", url: "https://www.ncac.gov.cn/xxfb/ywxx/202004/t20200430_47269.html"}

- id: ch11_i4
  chapter: 11
  item: 4
  chapter_title: {ru: "Красные линии, на которые легко наступить программистам и технарям", en: "Common legal pitfalls for programmers and tech professionals"}
  title: {ru: "Краулер — только по открытым страницам без входа; не обходить антибот, не трогать персональные данные, собранное не продавать", en: "Crawl only public pages that need no login; do not bypass anti-scraping, do not touch personal information, and do not sell the data you crawl"}
  grade: A
  measure: freedom
  plain:
    ru: "Обход входа, token и подписи ради данных при тяжких обстоятельствах — до 3 лет, при особо тяжких — от 3 до 7 лет. С персональными данными ещё жёстче. Следы перемещений, содержание связи, кредитная история, имущество — от 50 записей уже «тяжкие». Проживание, здоровье, сделки — от 500; прочее — от 5000; либо доход от 5000 юаней — то же самое."
    en: "Bypassing login, token, signature, and similar protections to take data, when circumstances are serious, brings up to 3 years, or 3 to 7 years if especially serious. Crawling personal information is worse. Location tracks, communication content, credit, and property-type information at 50 records already counts as serious circumstances. Accommodation, health, and transaction types at 500 records, other types at 5000 records, or earning 5000 yuan, likewise"
  benefit:
    ru: "Получение данных из системы обходом защиты наказывается как в пункте 3 (скрипты выкупа билетов, секонд-киллов и накрутки): до 3 лет либо от 3 до 7 лет. Незаконное получение, продажа или предоставление персональных данных граждан при любом из порогов — «тяжкие»: следы перемещений, содержание связи, кредитная история, имущественная информация — от 50 записей; проживание, записи связи, здоровье, сделки — от 500; прочие персональные данные — от 5000; незаконный доход от 5000 юаней. При тяжких — до 3 лет и штраф (одновременно или только штраф); при особо тяжких — от 3 до 7 лет. Официальные дела: разработчик Ли замаскировал кражу фото из альбома телефона под «оценку внешности», получил 1751 фото лица; также перепродавал базы социнженерии — 3 года условно на 3 года. База социнженерии — свод утёкших персональных данных из разных источников. Сетевая техкомпания краулером снимала данные магазинов и заказов с платформы доставки еды, ущерб больше 40000 юаней — преследование по незаконному получению данных компьютерных информационных систем (по всей стране)."
    en: "Taking system data by bypassing protections has the same sentencing range as item 3 (ticket-snatching, flash-sale, and fake-order scripts): up to 3 years, or 3 to 7 years. Illegally obtaining, selling, or providing citizens’ personal information meets “serious circumstances” at any of the following: location tracks, communication content, credit, or property information of 50 records or more; accommodation, communication records, health, or transaction information of 500 records or more; other personal information of 5000 records or more; illegal gains of 5000 yuan or more. Serious circumstances bring up to 3 years and a fine concurrently or alone; especially serious cases bring 3 to 7 years. Official case: software developer Li disguised a function that stole phone albums as a “looks rating” app and obtained 1751 face photos. He also resold social-engineering database material and got 3 years suspended for 3 years. A social-engineering database is a database that aggregates personal information leaked from various places. A network technology company used a crawler to take store and order data from a food-delivery platform, caused over 40000 yuan in losses, and was prosecuted for illegally obtaining computer information system data (nationwide)"
  sources:
    - {citation: "全国人大 (2020). 刑法（根据刑法修正案（十一）修正，第二百八十五条第二款、第二百五十三条之一）", url: "https://jtgl.beijing.gov.cn/jgj/jgxx/flfg/fl/11033925/index.html"}
    - {citation: "最高人民法院、最高人民检察院 (2017). 关于办理侵犯公民个人信息刑事案件适用法律若干问题的解释（第三、四、五条）", url: "https://www.spp.gov.cn/xwfbh/wsfbt/201705/t20170509_190088.shtml"}
    - {citation: "最高人民检察院 (2022). 检察机关依法惩治侵犯公民个人信息犯罪典型案例（案例二）", url: "https://www.spp.gov.cn/spp/xwfbh/wsfbt/202212/t20221207_594915.shtml"}
    - {citation: "最高人民检察院 (2025). 检察机关依法惩治侵害企业数据安全犯罪 服务保障企业创新发展（案例一）", url: "https://www.spp.gov.cn/xwfbh/wsfbh/202501/t20250124_680670.shtml"}

- id: ch11_i6
  chapter: 11
  item: 6
  chapter_title: {ru: "Красные линии, на которые легко наступить программистам и технарям", en: "Common legal pitfalls for programmers and tech professionals"}
  title: {ru: "При увольнении сдать все доступы: не удалять базы, не оставлять бэкдоры, не менять пароли и не блокировать системы — даже если компания должна вам деньги", en: "When you leave, hand over all account access; do not delete databases, leave backdoors, or change passwords and lock the system — even if the company owes you money"}
  grade: A
  measure: freedom
  plain:
    ru: "Логин и пароль выдала компания — это не значит, что после увольнения ими можно пользоваться. Незаконное управление системой при тяжких обстоятельствах — до 3 лет. Удаление данных, из‑за которого система не работает, при тяжких последствиях — до 5 лет, при особо тяжких — от 5 лет. Уволенный инженер зашёл под прежним админом, удалил данные и логи, ущерб больше 120000 юаней — 3 года условно на 5 лет, штраф 30000 юаней."
    en: "Account passwords the company gave you do not mean you may still use them after you leave. Illegally controlling a system, when circumstances are serious, brings up to 3 years. Deleting data so the system cannot run, with serious consequences, brings up to 5 years, or 5 years or more if especially serious. An engineer who was dismissed logged in with the old admin account, deleted data and logs, caused over 120000 yuan in losses, and got 3 years suspended for 5 years plus a 30000 yuan fine"
  benefit:
    ru: "Незаконное управление компьютерной информационной системой при тяжких обстоятельствах — до 3 лет и штраф (одновременно или только штраф); при особо тяжких — от 3 до 7 лет. Удаление или изменение функций либо данных, из‑за чего система не работает нормально, при тяжких последствиях — до 5 лет; при особо тяжких — от 5 лет. Официальные дела: старший IT‑инженер Люй после увольнения зашёл на общий сервер компании под прежним админом, сменил пароль, удалил данные и логи, ущерб больше 120000 юаней — 3 года условно на 5 лет, штраф 30000 юаней. Сотрудник софтверной компании Бай при написании обновления намеренно вставил ошибочный код, клиентские системы перестали пускать во вход, ущерб больше 40000 юаней — преследование по повреждению компьютерных информационных систем (по всей стране)."
    en: "Illegally controlling a computer information system, when circumstances are serious, brings up to 3 years and a fine concurrently or alone; especially serious cases bring 3 to 7 years. Deleting or modifying system functions or data so the system cannot run normally, with serious consequences, brings up to 5 years; especially serious cases bring 5 years or more. Official case: senior IT engineer Lü, after being dismissed, logged into the company shared server with the old admin account. He changed the password, deleted data and logs, and caused over 120000 yuan in losses. Sentence: 3 years suspended for 5 years, fine 30000 yuan. Software-company employee Bai deliberately inserted faulty code into an upgrade program so the client system could not log in, causing over 40000 yuan in losses. He was prosecuted for destroying a computer information system (nationwide)"
  sources:
    - {citation: "全国人大 (2020). 刑法（根据刑法修正案（十一）修正，第二百八十五条第二款、第二百八十六条）", url: "https://jtgl.beijing.gov.cn/jgj/jgxx/flfg/fl/11033925/index.html"}
    - {citation: "最高人民法院、最高人民检察院 (2011). 关于办理危害计算机信息系统安全刑事案件应用法律若干问题的解释（第一、十一条）. <https://ga.sz.gov.cn/ZWGK/ZCFG/ZCJD/content/post_1304363.html>（深圳市公安局转载）；最高人民检察院 (2024). 检察机关「依法惩治网络犯罪 助力网络空间综合治理」典型案例（案例六）", url: "https://www.spp.gov.cn/xwfbh/wsfbh/202402/t20240223_644505.shtml"}
    - {citation: "最高人民检察院 (2025). 检察机关依法惩治侵害企业数据安全犯罪 服务保障企业创新发展（案例七）", url: "https://www.spp.gov.cn/xwfbh/wsfbh/202501/t20250124_680670.shtml"}

- id: ch11_i7
  chapter: 11
  item: 7
  chapter_title: {ru: "Красные линии, на которые легко наступить программистам и технарям", en: "Common legal pitfalls for programmers and tech professionals"}
  title: {ru: "При увольнении не уносить исходники, списки клиентов и техдокументацию, не загружать на личные облака и не переиспользовать у нового работодателя", en: "When you leave, do not take source code, client lists, or technical documents; do not upload them to a personal cloud drive; do not reuse them at the next employer"}
  grade: A
  measure: freedom
  plain:
    ru: "Авторские права на код, написанный на работе, обычно у компании; списки клиентов тоже могут быть коммерческой тайной — унести значит забрать чужое. Бывший сотрудник унёс исходники системы досмотра в новую фирму: сам — 5 лет и штраф 500000 юаней, новая компания — штраф 4000000 юаней. Кто-то через дыру в системе скачал больше 33000 проектных файлов — 1 год 10 месяцев. Компания может отдельно требовать возмещения."
    en: "Copyright in code written on the job generally belongs to the company; client lists may also count as trade secrets — taking them is taking the company’s things. A former employee who took security-screening system source code to a new company got 5 years and a 500000 yuan fine; the new company was fined 4000000 yuan. Someone who exploited a system flaw to download over 33000 design files got 1 year 10 months. The company can also sue you separately for damages"
  benefit:
    ru: "Нарушение обязанности хранить тайну, разглашение или использование коммерческой тайны при тяжких обстоятельствах — до 3 лет и штраф (одновременно или только штраф); при особо тяжких — от 3 до 10 лет и штраф. Закон о борьбе с недобросовестной конкуренцией также относит к нарушению два действия: получение тайны путём «электронного проникновения» (технический доступ в систему) и подстрекательство либо помощь в нарушении обязанности хранить тайну. Официальные дела: Сунь Мин и другие уволившиеся унесли исходники системы досмотра и ключевые алгоритмы в продукт новой компании; Сунь Мин — 5 лет и штраф 500000 юаней, новая компания — штраф 4000000 юаней. Тянь через уязвимость скачал больше 33000 проектных файлов — 1 год 10 месяцев, штраф 100000 юаней. Инженер Ян сохранил исходники модулей приложения на личном компьютере и в облаке, после смены работы сделал похожее приложение — преследование за нарушение коммерческой тайны (по всей стране)."
    en: "Violating confidentiality duties by disclosing trade secrets or using them yourself, when circumstances are serious, brings up to 3 years and a fine concurrently or alone; especially serious cases bring 3 to 10 years plus a fine. The Anti-Unfair Competition Law also lists two acts as infringement: obtaining trade secrets by “electronic intrusion” (technical intrusion into a system); and inducing or helping others to breach confidentiality. Official case: Sun and other former employees took security-screening system source code and core algorithms and used them in a new company’s product. Sun got 5 years and a 500000 yuan fine; the new company was fined 4000000 yuan. Tian exploited a system flaw to download over 33000 design files and got 1 year 10 months plus a 100000 yuan fine. Engineer Yang stored App module source code on a personal computer and in the cloud, then built a similar App after switching jobs, and was prosecuted for infringing trade secrets (nationwide)"
  sources:
    - {citation: "全国人大 (2020). 刑法（根据刑法修正案（十一）修正，第二百一十九条）", url: "https://jtgl.beijing.gov.cn/jgj/jgxx/flfg/fl/11033925/index.html"}
    - {citation: "全国人大常委会 (2025). 反不正当竞争法（2025 年修订，第十条）", url: "https://www.spp.gov.cn/spp/fl/202506/t20250627_699862.shtml"}
    - {citation: "最高人民检察院 (2025). 检察机关知识产权保护典型案例（案例七）", url: "https://www.spp.gov.cn/xwfbh/wsfbh/202504/t20250423_693691.shtml"}
    - {citation: "最高人民检察院 (2020). 2019 年度检察机关保护知识产权典型案例（案例十六）", url: "https://www.spp.gov.cn/xwfbh/wsfbh/202004/t20200425_459623.shtml"}
    - {citation: "最高人民检察院 (2025). 检察机关依法惩治侵害企业数据安全犯罪 服务保障企业创新发展（案例五）", url: "https://www.spp.gov.cn/xwfbh/wsfbh/202501/t20250124_680670.shtml"}

- id: ch11_i9
  chapter: 11
  item: 9
  chapter_title: {ru: "Красные линии, на которые легко наступить программистам и технарям", en: "Common legal pitfalls for programmers and tech professionals"}
  title: {ru: "Без письменного разрешения чужие системы не тестировать: «добрые намерения» и «потом сообщил» в нормах не снимают состава", en: "Do not test others’ systems without written authorization; “good intentions” and “reporting afterward” are not defenses in the statute"}
  grade: A
  measure: freedom
  plain:
    ru: "Для состава смотрят, было ли разрешение и сколько взяли, а не на намерения. 500 пар обычных логинов и паролей, либо доход 5000 юаней, либо ущерб другой стороне 10000 юаней — уже до 3 лет. Чтобы «доказать дыру», часто выгружают таблицу пользователей — и сразу переваливают за 500 пар. Если логин и пароль уже на руках, использование вне разрешённого диапазона тоже считается проникновением."
    en: "The statute looks at whether you had authorization and how much you obtained — not at what you meant. Obtaining 500 sets of ordinary account passwords, or earning 5000 yuan or causing the other side 10000 yuan in losses, is enough for up to 3 years. Exporting one user table “to prove the bug” often crosses 500 sets in a single pass. Having account passwords and using them outside the authorized scope also counts as intrusion"
  benefit:
    ru: "Системы обычных компаний и частных лиц — это компьютерные информационные системы вне сферы госдел, обороны и передовых наук. Проникновение в такие системы либо иные технические средства для получения хранимых, обрабатываемых или передаваемых данных при тяжких обстоятельствах — до 3 лет лишения свободы или арест и штраф (одновременно или только штраф). При особо тяжких — от 3 до 7 лет и штраф. Пороги «тяжких»: от 10 наборов учётных данных для сетевых финсервисов (платежи, ценные бумаги, фьючерсы и т.п.); от 500 наборов прочих учётных данных; незаконное управление от 20 систем; незаконный доход от 5000 юаней либо экономический ущерб от 10000 юаней. В 5 и более раз выше этих цифр — «особо тяжкие». Официальный пример: руководящий пример прокуратуры №36 закрепляет: «вход по логину и паролю за пределами полномочий — это проникновение в компьютерную информационную систему». То есть данные уже были, но применение вне разрешённого диапазона само по себе — проникновение. В том деле трое по рабочим логинам, паролям и токенам заходили в систему компании из другого региона, скачивали данные вне рабочих задач и продавали в сети, незаконный доход 37000 юаней. Приговоры: 4 года, 3 года 9 месяцев и 4 года, каждому штраф 40000 юаней (по всей стране)."
    en: "Systems of ordinary companies and individuals are computer information systems outside the fields of state affairs, national defense construction, and cutting-edge science and technology. Intruding into such systems, or using other technical means to obtain data stored, processed, or transmitted in them, when circumstances are serious, brings up to 3 years of fixed-term imprisonment or criminal detention, and a fine concurrently or alone. Especially serious cases bring 3 to 7 years plus a fine. “Serious circumstances” has several standards: obtaining 10 or more sets of identity-authentication information (account passwords and the like) for online financial services such as payment settlement, securities trading, or futures trading; obtaining 500 or more sets of other identity-authentication information; illegally controlling 20 or more computer information systems; illegal gains of 5000 yuan or more, or economic losses of 10000 yuan or more. Five times or more of those figures is “especially serious circumstances.” Official case: Prosecutorial Example No. 36 established one sentence — “using an account and password to log into a computer information system beyond the authorized scope is an act of intruding into a computer information system.” Meaning: you already have the account and password, but using them outside the authorized scope itself counts as intrusion. In that case three people used accounts, passwords, and tokens obtained at work to log into the company’s internal system from another place. They downloaded data outside their work scope, sold it online, and had illegal gains of 37000 yuan. They were sentenced to 4 years, 3 years 9 months, and 4 years respectively, each fined 40000 yuan (nationwide)"

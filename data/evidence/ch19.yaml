- id: ch19_i4
  chapter: 19
  item: 4
  chapter_title: {ru: "На работе, увольнение и производственные травмы", en: "Employment, resignation, and work injury"}
  title: {ru: "При сокращении сначала посчитайте N: за каждый полный год — месячный оклад, меньше полугода — полмесяца", en: "If you are laid off, calculate N first: one month’s wage per full year, half a month if under six months"}
  grade: A
  measure: money
  plain:
    ru: "при увольнении по сокращению компенсация так: полный год — один месячный оклад; от полугода до года — как за год; меньше полугода — половина месяца. Берут средний месячный доход за 12 месяцев до ухода, с премиями, надбавками и доплатами. Если оклад выше трёхкратной средней зарплаты по региону за прошлый год — считают от этого потолка, стаж в расчёте не больше 12 лет."
    en: "When you are laid off, statutory economic compensation is calculated like this: one month’s wage for each full year worked; at least six months but less than a year counts as a year; less than six months gets half a month. Monthly wage here is the average over the 12 months before you leave, including bonuses, allowances, and subsidies. If wages exceed three times the local average monthly wage for the prior year, pay is capped at three times that average, and years of service count for at most 12 years."
  benefit:
    ru: "законная компенсация при расторжении по инициативе работодателя — то, что называют N: «за каждый полный год работы — один месячный оклад; шесть месяцев и больше, но меньше года — как за год; меньше шести месяцев — половина месячного оклада». Если месячный доход выше трёхкратной средней зарплаты работников региона за прошлый год — расчёт от тройного потолка, стаж учитывают не больше двенадцати лет."
    en: "Statutory economic compensation under the Labor Contract Law is what the employer owes when you are laid off—commonly called N. The formula: “one month’s wage for each full year of service … six months or more but less than one year counts as one year; less than six months, half a month’s wage to the worker.” If monthly wage exceeds three times the local average monthly wage of employees for the prior year, use triple that average as the cap, and count at most twelve years of service."
  sources:
    - {citation: "全国人大常委会 (2007). 中华人民共和国劳动合同法（2008 年 1 月 1 日施行）（第四十七条）", url: "http://www.gov.cn/gongbao/content/2007/content_711013.htm"}

- id: ch19_i7
  chapter: 19
  item: 7
  chapter_title: {ru: "На работе, увольнение и производственные травмы", en: "Employment, resignation, and work injury"}
  title: {ru: "Не подписывайте «увольнение по личным причинам» — после этого N обычно не положен", en: "Do not sign “resignation for personal reasons”—once signed, N usually disappears"}
  grade: B
  measure: money
  plain:
    ru: "подписали, что уходите «по личным причинам» — как правило, теряете и компенсацию при увольнении, и пособие по безработице. Самостоятельный уход не входит в случаи выплаты N, кроме когда виноват работодатель: задержка зарплаты, нет соцстраха и т.п. Не обязаны подписывать в тот же день — можно выспаться и подумать."
    en: "Signing that you resigned for personal reasons usually wipes out both economic compensation and unemployment insurance. Voluntary resignation is not among the situations that trigger compensation, except when you leave because of employer faults such as unpaid wages or failure to pay social insurance. You do not have to sign the same day; sleep on it."
  benefit:
    ru: "экономическая компенсация положена только в перечисленных законом ситуациях. Уход по инициативе работника в список не входит, если только не уход из‑за нарушений работодателя (задержка зарплаты, неуплата соцстраха и др.). Подпись под «активным увольнением» обычно лишает и N, и пособия по безработице."
    en: "The Labor Contract Law limits economic compensation to the legally listed situations. A worker who initiates departure is not included unless the reason is statutory employer fault such as unpaid wages or failure to pay social insurance. Signing “voluntary resignation” usually voids both economic compensation and unemployment insurance."
  sources:
    - {citation: "全国人大常委会 (2007). 中华人民共和国劳动合同法（2008 年 1 月 1 日施行）（第三十八条、第四十六条）", url: "http://www.gov.cn/gongbao/content/2007/content_711013.htm"}

- id: ch19_i10
  chapter: 19
  item: 10
  chapter_title: {ru: "На работе, увольнение и производственные травмы", en: "Employment, resignation, and work injury"}
  title: {ru: "Повреждения от пыли, шума и химических ядов часто необратимы (пневмокониоз, шумовая тугоухость): средства защиты обязан выдать работодатель; работу без защиты можно отказаться выполнять", en: "Dust, noise, and chemical toxins often cause irreversible harm (for example pneumoconiosis and noise-induced deafness): the employer must supply protective gear, and you can refuse work with no protections"}
  grade: A
  measure: mortality
  plain:
    ru: "пневмокониоз, шумовая тугоухость и химический ожог глаз — установленные законом профзаболевания; лёгкие и слух, если испорчены, уже не вернуть. Вы вправе знать, какие вредности на месте, требовать защитные средства и оборудование. Работу без защиты можно не выполнять. Снижение зарплаты или увольнение за это недействительны."
    en: "Pneumoconiosis, noise-induced deafness, and chemical eye burns are all statutory occupational diseases. Once lungs or hearing are damaged, they cannot be restored. You have the right to know what hazards the job carries and to demand protective facilities and personal protective equipment from the employer. You may refuse work without protections. Pay cuts or dismissal for using these rights do not count."
  benefit:
    ru: "с 1 августа 2025 года в каталоге установленных профзаболеваний 12 крупных классов и 135 видов, в том числе 4 открытых пункта. Первым классом идут профессиональные пневмокониозы: силикоз, угольный, графитовый, сажевый, асбестоз, тальковый; также цементный, слюдяной, керамический, алюминиевый, сварочный, литейный — плюс открытый пункт. Среди профессиональных болезней уха, носа, горла и полости рта — шумовая тугоухость и контузионная глухота. Среди профессиональных болезней глаз — химический ожог глаз и электроофтальмия. Повреждения при пневмокониозе и шумовой тугоухости постоянны. Национальный институт охраны труда США (NIOSH) пишет, что силикоз — постоянное поражение лёгких, оно постепенно усиливается, известного излечения нет. Обзор в Lancet: даже после прекращения контакта с пылью функция лёгких может дальше ухудшаться по мере прогрессирования. Управление по охране труда США (OSHA): потеря слуха от шума постоянна, ни операция, ни лекарства её не исправляют. Закон даёт четыре права, которыми можно воспользоваться сразу. Первое — знать, какие профвредности на рабочем месте, какие последствия и какие меры защиты нужны. Второе — требовать у работодателя исправные защитные средства и индивидуальную защиту, улучшать условия. Третье — критиковать, сообщать и жаловаться на нарушения законов о профилактике профзаболеваний и на действия, угрожающие жизни и здоровью. Четвёртое — «отказываться от противоправных указаний и от принуждения к работе без мер защиты от профзаболеваний»: негодные указания и работу без защиты можно не выполнять. И «снижение зарплаты, льгот и иных выплат либо расторжение или прекращение трудового договора из‑за того, что работник законно воспользовался своими правами, недействительны». То есть за пользование этими правами нельзя законно урезать оплату или уволить (по всей стране)"
    en: "The statutory list of occupational diseases, effective 1 August 2025, has 12 major categories and 135 conditions, including 4 open-ended clauses. The first category is occupational pneumoconiosis. It covers silicosis, coal workers' pneumoconiosis, graphite pneumoconiosis, carbon black pneumoconiosis, asbestosis, and talc pneumoconiosis. Also cement pneumoconiosis, mica pneumoconiosis, potter's pneumoconiosis, aluminum pneumoconiosis, welder's pneumoconiosis, and foundry worker's pneumoconiosis, plus one open-ended clause. Occupational ear, nose, throat, and oral diseases include noise-induced deafness and blast-induced deafness. Occupational eye diseases include chemical eye burns and welder's flash keratitis. Harm from pneumoconiosis and noise-induced deafness is permanent. The US National Institute for Occupational Safety and Health (NIOSH) states that silicosis is permanent lung damage that progresses over time, with no known cure. A Lancet review states that after patients stop dust exposure, lung function can still worsen as the disease progresses. The US Occupational Safety and Health Administration (OSHA) states that noise-induced hearing loss is permanent and cannot be corrected by surgery or drugs. The law gives four rights you can cite on the spot. First, to know what occupational disease hazards exist in the workplace, what consequences they can cause, and what protective measures are required. Second, to demand qualified protective facilities and personal protective equipment and improved working conditions. Third, to criticize, report, and complain about violations of occupational disease prevention law and practices that endanger life and health. Fourth, “refuse unlawful orders and forced work without occupational disease protections”—you may refuse noncompliant orders and unprotected tasks. And “any reduction of wages, benefits, or other treatment, or termination or ending of the labor contract, because the worker lawfully exercised proper rights is void.” Pay cuts, benefit cuts, or dismissal for exercising these rights do not count (nationwide)"
  sources:
    - {citation: "国家卫生健康委、人力资源社会保障部、国家疾控局、全国总工会 (2024). 职业病分类和目录（2025 年 8 月 1 日起实施）", url: "https://www.gov.cn/zhengce/zhengceku/202412/content_6992843.htm"}
    - {citation: "新版目录 12 大类 135 种的口径见国家卫生健康委 (2024). 新版目录将职业病调整为 12 大类 135 种", url: "https://www.gov.cn/lianbo/bumen/202412/content_6992838.htm"}
    - {citation: "全国人大常委会 (2018). 职业病防治法（第三十九条）. <https://www.beijing.gov.cn/zhengce/zhengcefagui/qtwj/201711/t20171104_779851.html>（北京市人民政府转载）；National Institute for Occupational Safety and Health (2026). Silica Symptoms and Medical Monitoring：「permanent lung damage called silicosis. It is a progressive, debilitating, and sometimes fatal disease」「There is no known cure for silicosis」", url: "https://www.cdc.gov/niosh/silica/symptoms/index.html"}
    - {citation: "Leung CC, Yu IT, Chen W (2012). Silicosis. Lancet, 379(9830), 2008-2018：「Impairment of lung function increases with disease progression, even after the patient is no longer exposed」", url: "https://doi.org/10.1016/S0140-6736(12)60235-9"}
    - {citation: "Occupational Safety and Health Administration. Occupational Noise Exposure：「permanent hearing loss that cannot be corrected through surgery or with medicine」", url: "https://www.osha.gov/noise"}
  doi: "10.1016/S0140-6736(12)60235-9"

- id: ch19_i11
  chapter: 19
  item: 11
  chapter_title: {ru: "На работе, увольнение и производственные травмы", en: "Employment, resignation, and work injury"}
  title: {ru: "Травма на работе или ДТП по пути на работу или с работы: первым делом оформите признание производственной травмы; если работодатель не подаёт — подайте сами", en: "If you are injured at work or hit on the commute, apply for work-injury recognition first; if the employer will not file, file yourself"}
  grade: A
  measure: money
  plain:
    ru: "травма на работе из‑за работы — производственная. ДТП по пути на работу или домой, если основную ответственность несёте не вы, тоже считается. Без признания не будет оплаты лечения, зарплаты на период восстановления и компенсации за увечье. Работодатель обязан подать заявление в течение 30 дней. Не подал — вы, родственники или профсоюз в течение года можете подать в орган соцстраха сами."
    en: "Injuries at work from the job count as work injuries. Being hit on the way to or from work, when you are not mainly at fault, also counts. Without work-injury recognition, medical costs, wages paid while you heal, and disability benefits all vanish. The employer should file within 30 days. If it does not, you, your family, or the trade union can file with the social insurance agency within one year."
  benefit:
    ru: "без признания производственной травмы не будет оплаты лечения, зарплаты на период восстановления (оплаты за период временной нетрудоспособности) и компенсации за увечье. Если работодатель не подал заявление более 30 дней, положенные за это время выплаты по производственной травме он оплачивает сам"
    en: "Without work-injury recognition, medical costs, wages paid during the work-stoppage period for treatment (停工留薪期工资), and disability benefits all vanish. If the employer misses the 30-day filing deadline, it must pay all work-injury benefits due in that period itself"
  sources:
    - {citation: "国务院 (2010 修订). 工伤保险条例（国务院令第 586 号）第十四条列了七种「应当认定为工伤」，含「（六）在上下班途中，受到非本人主要责任的交通事故或者城市轨道交通、客运轮渡、火车事故伤害的」；第十七条「所在单位应当自事故伤害发生之日或者被诊断、鉴定为职业病之日起30日内，向统筹地区社会保险行政部门提出工伤认定申请」「用人单位未按前款规定提出工伤认定申请的，工伤职工或者其近亲属、工会组织在事故伤害发生之日或者被诊断、鉴定为职业病之日起1年内，可以直接向用人单位所在地统筹地区社会保险行政部门提出工伤认定申请」「用人单位未在本条第一款规定的时限内提交工伤认定申请，在此期间发生符合本条例规定的工伤待遇等有关费用由该用人单位负担」；第十九条「职工或者其近亲属认为是工伤，用人单位不认为是工伤的，由用人单位承担举证责任」；第二十条「自受理工伤认定申请之日起60日内作出工伤认定的决定」；第五十五条，对「工伤认定申请不予受理的决定不服的」「对工伤认定结论不服的」，「可以依法申请行政复议，也可以依法向人民法院提起行政诉讼」", url: "https://www.gov.cn/gongbao/content/2011/content_1778064.htm"}
    - {citation: "最高人民法院 (2014). 关于审理工伤保险行政案件若干问题的规定（法释〔2014〕9 号）第七条：「由于不属于职工或者其近亲属自身原因超过工伤认定申请期限的，被耽误的时间不计算在工伤认定申请期限内」，所列情形为「（一）不可抗力；（二）人身自由受到限制；（三）属于用人单位原因；（四）社会保险行政部门登记制度不完善；（五）当事人对是否存在劳动关系申请仲裁、提起民事诉讼」", url: "https://www.court.gov.cn/fabu/xiangqing/6775.html"}

- id: ch19_i12
  chapter: 19
  item: 12
  chapter_title: {ru: "На работе, увольнение и производственные травмы", en: "Employment, resignation, and work injury"}
  title: {ru: "Не верьте «дойти до рабочего места — и это уже производственная травма»: при внезапном недомогании сначала звоните 120, а не спешите отметиться", en: "Do not trust «making it to your desk counts as work injury»: if you feel suddenly unwell, call 120 first, not the time clock"}
  grade: A
  measure: mortality
  plain:
    ru: "если при недомогании мчаться на работу, денег это не добавит. Приравнивание к производственной травме требует, чтобы человек заболел в рабочее время и на рабочем месте; заболевание по дороге, не дойдя до места, не подходит. Если реанимация длилась больше 48 часов, тоже не считается. Те десятки минут, которые вы тратите на «соблюдение условий», обмениваются на шанс выжить."
    en: "Rushing to the office when you feel unwell will not earn extra money. «Deemed work injury» requires sudden illness during working hours and at the workstation; illness on the way before you arrive does not qualify. Rescue beyond 48 hours also does not qualify. Minutes spent chasing those conditions cost you your chance to survive."
  benefit:
    ru: "приравнивание требует «в рабочее время и на рабочем месте» внезапной смерти от болезни или смерти в течение 48 часов после безуспешной реанимации. Если ради этих условий откладывать помощь, вы рискуете жизнью ради компенсации, которую работодатель может и не выплатить."
    en: "«Deemed work injury» requires sudden illness «during working hours and at the workstation» with death, or death within 48 hours after failed emergency treatment. Delaying care to meet those conditions trades your chance to live for compensation you may never receive"
  sources:
    - {citation: "工伤保险条例第十五条第一款第（一）项：「在工作时间和工作岗位，突发疾病死亡或者在48小时之内经抢救无效死亡的」视同工伤；第十四条第（六）项只把上下班途中「受到非本人主要责任的交通事故或者城市轨道交通、客运轮渡、火车事故伤害的」列为工伤，途中突发疾病不在其中", url: "https://www.gov.cn/gongbao/content/2011/content_1778064.htm"}

- id: ch19_i16
  chapter: 19
  item: 16
  chapter_title: {ru: "На работе, увольнение и производственные травмы", en: "Employment, resignation, and work injury"}
  title: {ru: "Если на работе вас долго унижают, оскорбляют и притесняют, не терпите молча: сначала зафиксируйте доказательства, затем жалуйтесь, зовите полицию или идите в арбитраж — по ситуации", en: "If you face long-term bullying, insults, or harassment at work, do not just endure it: record evidence, then complain, report, or arbitrate depending on what happened"}
  grade: B
  measure: mortality
  plain:
    ru: "у тех, кого на работе притесняли, позже риск сердечно-сосудистых болезней и инсульта примерно на 60% выше, чем у остальных; чем сильнее притеснения, тем выше риск. Через несколько лет мысли о самоубийстве у таких людей примерно в два раза чаще. Оскорбления и унижения — не мелочь, которую «переживёшь»."
    en: "People bullied at work later face roughly 60% higher risk of heart disease and stroke, and more bullying means higher risk. Years later, bullied workers are about twice as likely to have suicidal thoughts as others. Insults and mistreatment are not something you shrug off."
  benefit:
    ru: "по здоровью: в трёх шведских и датских исследованиях участвовали 79 201 работник 18–65 лет; изначально без сердечно-сосудистых болезней, наблюдение в среднем 12,4 года. 9% сообщили о притеснениях на работе за последний год. У них риск сердечно-сосудистых заболеваний (ишемическая болезнь сердца и цереброваскулярные болезни) выше примерно на 59% (HR 1,59, 95% ДИ 1,28–1,98). При физическом насилии на работе — выше примерно на 25% (HR 1,25, 1,12–1,40); чем чаще инциденты, тем выше риск. В норвежском обследовании со случайной выборкой 1846 работников, три замера с интервалом 2–3 года: у притесняемых позже мысли о самоубийстве примерно в 2 раза чаще (OR 2,05, 95% ДИ 1,08–3,89); обратная связь не подтвердилась — мысли о самоубийстве сначала не повышали риск притеснений потом. По праву: отдельного закона о «травле на рабочем месте» нет, оценивают конкретные действия. Оскорбления, телесные наказания, избиения, незаконный обыск или лишение свободы работников — административная ответственность, вред — компенсация, состав преступления — уголовная ответственность. Если работодатель принуждает трудом силой или угрозами, можно немедленно расторгнуть договор без предупреждения и получить экономическую компенсацию. Работодатель обязан предотвращать сексуальные домогательства с использованием служебного положения или иерархии; пострадавший может требовать гражданской ответственности с виновного. Арбитраж по трудовому спору — 45 дней с принятия заявления, в сложных случаях ещё до 15 дней."
    en: "For health: three Swedish and Danish cohorts together, 79,201 employed people aged 18 to 65. None had cardiovascular disease at baseline; mean follow-up 12.4 years. 9% reported workplace bullying in the past year. Bullied workers had about 59% higher risk of cardiovascular disease (coronary and cerebrovascular disease) (HR 1.59, 95% CI 1.28–1.98). Those who faced workplace violence had about 25% higher risk (HR 1.25, 1.12–1.40). For both, more exposure meant higher risk. A Norwegian nationally sampled follow-up survey of 1,846 employed people, measured every two to three years for three rounds: bullied workers were about twice as likely to develop suicidal thoughts (OR 2.05, 95% CI 1.08–3.89). The reverse did not hold — prior suicidal thoughts did not predict later bullying. Legally, China has no dedicated «workplace bullying» statute; match the act to existing rules. Employers who insult, physically punish, beat, illegally search, or illegally detain workers face administrative penalties, must compensate harm, and bear criminal liability if applicable. If an employer uses violence or threats to force work, you may terminate the contract at once without prior notice and claim economic compensation. Employers must prevent and stop sexual harassment via authority or hierarchy; victims may hold harassers civilly liable. Labor arbitration closes within 45 days from acceptance; complex cases may extend up to 15 days more."
  numbers:
    - {kind: HR, value: 1.59, ci_low: 1.28, ci_high: 1.98}
    - {kind: HR, value: 1.25}
    - {kind: OR, value: 2.05, ci_low: 1.08, ci_high: 3.89}

    - {citation: "全国人大常委会. 中华人民共和国刑法（经刑法修正案十一修正的整合文本）第二百三十四条之一", url: "https://flk.npc.gov.cn/detail?id=ff808181796a636a0179822a19640c92"}
    - {citation: "最高人民检察院 (2012-04-09). 「少年卖肾买苹果手机」案诉至法院", url: "https://www.spp.gov.cn/gs/201204/t20120409_34342.shtml"}
    - {citation: "河北省廊坊市中级人民法院官网转载 (2014-09-02). 全国最大贩肾案终审 组织者摘肾 51 枚获利千万", url: "https://lfzy.hebeicourt.gov.cn/article/detail/2014/09/id/1430881.shtml"}

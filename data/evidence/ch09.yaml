- id: ch09_i5
  chapter: 9
  item: 5
  chapter_title: {ru: "Юридические подводные камни, на которые часто наступают обычные люди", en: "Legal red lines ordinary people often cross"}
  title: {ru: "«Подработка», где просят принимать деньги, снимать наличные и переводить со своей карты, — какой бы ни был «бонус», не делайте", en: "“Part-time work” that asks you to use your own card to receive money, withdraw cash, or transfer — do not do it no matter how large the tip"}
  grade: A
  measure: freedom
  plain:
    ru: "Такая подработка даёт несколько сотен, а цена — запись в деле. Кто-то с паспортом и 1 банковской картой пришёл в указанное место, помогал с переводами и снятием, заработал свыше 500 юаней. Прокуратура его не обвиняла, полиция всё равно задержала на 10 суток и оштрафовала на 1000 юаней. Другой передал свои и чужие банковские и телефонные карты группе для приёма и снятия — 2 года 3 месяца и штраф 22000 юаней."
    en: "These jobs earn a few hundred yuan; the price is a record. Someone took an ID card and 1 bank card to a designated place, helped with transfers and withdrawals, and earned a little over 500 yuan. Prosecutors did not charge him; police still detained him for 10 days and fined 1000 yuan. Another handed his and others’ bank cards and phone cards to a gang for collecting and cashing out, got 2 years 3 months, and was fined 22000 yuan (2.2万)."
  benefit:
    ru: "Кто заведомо помогает переводить, скупать, продавать или иным способом маскировать деньги и вещи от преступления — до 3 лет, плюс штраф одновременно с приговором или только штраф. Официальный пример: Ван по указанию пришёл с паспортом и 1 банковской картой в указанное место, помогал с переводами и снятием, заработал свыше 500 юаней. Прокуратура его не обвиняла; полиция по закону о борьбе с телеком- и сетевым мошенничеством задержала на 10 суток и оштрафовала на 1000 юаней. Мань передал свои и чужие банковские и телефонные карты группе для приёма, переводов и снятия — 2 года 3 месяца и штраф 22000 юаней (по всей стране). Перевод через виртуальную валюту — то же самое. Ань и ещё двое по указанию мошенников принимали деньги на свои карты, на площадке покупали виртуальную валюту и переводили на указанные счета, брали долю. Среди проверенных сумм — свыше 500000 юаней обманутых жертв. Троих за сокрытие преступного дохода приговорили к срокам от 2 лет 8 месяцев до 3 лет 3 месяцев, каждому штраф от 30000 до 40000 юаней (Пекин, Тунчжоу)"
    en: "Knowingly helping to transfer, buy, sell, or otherwise conceal money or property from crime brings up to 3 years, with a fine imposed together with or instead of imprisonment (sentenced and fined, or only fined). Official case: Wang followed instructions, brought an ID card and 1 bank card to a designated place, helped with transfers and withdrawals, and earned a little over 500 yuan. Prosecutors did not charge him; police detained him for 10 days under the Anti-Telecom and Online Fraud Law and fined 1000 yuan. Man handed his and others’ bank cards and phone cards to a gang for collecting, transferring, and cashing out, was sentenced to 2 years 3 months, and fined 22000 yuan (2.2万) (nationwide). Moving it out as crypto is the same. An and two others, on a fraud gang’s instructions, took money on their own bank cards. On a trading platform they bought virtual currency with the money and transferred it to accounts the other side named, taking a cut by ratio. More than 500000 yuan (50余万) of victims’ cheated funds was verified among it. The three were each sentenced for concealing criminal proceeds to between 2 years 8 months and 3 years 3 months, and each fined 30000 to 40000 yuan (3万 to 4万) (Beijing Tongzhou)"
  sources:
    - {citation: "全国人大 (2020). 刑法（根据刑法修正案（十一）修正，第三百一十二条）", url: "https://jtgl.beijing.gov.cn/jgj/jgxx/flfg/fl/11033925/index.html"}
    - {citation: "最高人民检察院 (2023). 检察机关依法惩治电信网络诈骗及其关联犯罪典型案例（案例九）", url: "https://www.spp.gov.cn/xwfbh/wsfbt/202311/t20231130_635188.shtml"}
    - {citation: "最高人民法院、最高人民检察院 (2025). 依法惩治掩饰、隐瞒犯罪所得、犯罪所得收益犯罪典型案例（案例一、五）", url: "https://www.spp.gov.cn/xwfbh/wsfbt/202508/t20250825_704514.shtml"}

- id: ch09_i19
  chapter: 9
  item: 19
  chapter_title: {ru: "Юридические подводные камни, на которые часто наступают обычные люди", en: "Legal red lines ordinary people often cross"}
  title: {ru: "Прежде чем ударить, посчитайте этот счёт: задержание, деньги, приговор", en: "Before you hit someone, count this ledger: detention, compensation, and prison"}
  grade: A
  measure: freedom
  plain:
    ru: "Счёт за один удар: задержание на 5–10 суток плюс штраф от 500 до 1000 юаней. Лёгкий вред здоровью — уже уголовное дело, до 3 лет; тяжкий вред — от 3 до 10 лет. Деньги отдельно: кто-то сломал другой стороне три ребра, выплатил 113000 юаней в примирении — и обвинения не было. Другой сломал лучевую кость, не выплатил — 10 месяцев."
    en: "The bill for one strike: detention for 5 to 10 days, plus a fine of 500 to 1000 yuan. Causing minor injury makes it a criminal case, up to 3 years; serious injury, 3 to 10 years. Money is separate: someone who broke three of the other person’s ribs paid 113000 yuan (11.3万) to settle and was not charged. Another broke the other person’s radius, did not pay, and got 10 months."
  benefit:
    ru: "Избиение или умышленное причинение вреда — задержание на 5–10 суток плюс штраф от 500 до 1000 юаней. Группой, в отношении инвалида, беременной, пожилого или ребёнка, неоднократно или сразу нескольких человек — задержание на 10–15 суток плюс штраф от 1000 до 2000 юаней. Лёгкий вред — состав умышленного причинения вреда: до 3 лет лишения свободы, краткосрочное заключение либо ограничение свободы (без заключения, но с ограничениями передвижения). Тяжкий вред — от 3 до 10 лет. По гражданскому праву ещё медицинские расходы, упущенный заработок (меньше заработали из‑за пропуска работы), уход, транспорт, доплата на питание в стационаре, питание. При инвалидности — отдельно компенсация за инвалидность. Считают как среднедушевой располагаемый доход городских жителей за прошлый год в месте суда, умноженный на 20 лет. Пострадавшему от 60 лет — минус год за каждый лишний год; от 75 лет — считают 5 лет. В 2022 году органы прокуратуры по стране приняли свыше 70000 дел о лёгком вреде; большинство — семейные, соседские споры или случайные стычки. Типичный пример Верховной прокуратуры: Лу сломал другой стороне три ребра (лёгкий вред второй степени), выплатил 113000 юаней и добился примирения — отказ в обвинении. Ши сломал лучевую кость (лёгкий вред второй степени), не выплатил — 10 месяцев лишения свободы (по всей стране; Закон об административных наказаниях действует с 1 января 2026 года)"
    en: "Hitting or intentionally injuring someone brings detention for 5 to 10 days plus a fine of 500 to 1000 yuan. Hitting in a group, hitting people with disabilities, pregnant women, the elderly, or children, hitting repeatedly, or hitting several people at once brings detention for 10 to 15 days plus a fine of 1000 to 2000 yuan. Causing minor injury is intentional injury, punishable by up to 3 years of fixed-term imprisonment, criminal detention (short custody), or public surveillance (not locked up but movement restricted). Causing serious injury brings 3 to 10 years. Civilly you also pay medical costs, lost wages (pay missed from work), nursing costs, transport, hospital meal allowance, and nutrition. Disabling someone adds disability compensation. Disability compensation is the prior year’s average urban disposable income where the trial court sits, times 20 years. For injured persons aged 60 or more, subtract one year per year of age; at 75 or more, use 5 years. In 2022 procuratorates nationwide accepted over 70000 (7万余) minor-injury cases, mostly from marriage, family, or neighbor disputes or chance events. Supreme People’s Procuratorate typical case: Lu broke three of the other person’s ribs (minor injury level 2), paid 113000 yuan (11.3万) to reach a settlement, and obtained non-prosecution. Shi broke the other person’s radius (minor injury level 2), did not pay, and got 10 months of fixed-term imprisonment (nationwide; Public Security Administration Punishment Law in force from 1 January 2026)"
  sources:
    - {citation: "全国人大常委会 (2025). 治安管理处罚法（2025 年修订，第九、五十一条）", url: "https://www.spp.gov.cn/spp/fl/202506/t20250627_699863.shtml"}
    - {citation: "全国人大 (1997). 刑法（第二百三十四条）", url: "https://www.spp.gov.cn/spp/fl/201802/t20180206_364975.shtml"}
    - {citation: "最高人民法院 (2022 修正). 关于审理人身损害赔偿案件适用法律若干问题的解释（法释〔2022〕14 号，第六至十二、十五条）", url: "https://www.court.gov.cn/zixun/xiangqing/357071.html"}
    - {citation: "最高人民检察院、公安部 (2023). 关于依法妥善办理轻伤害案件的指导意见", url: "https://www.spp.gov.cn/spp/xwfbh/wsfbt/202303/t20230302_604352.shtml"}
    - {citation: "最高人民检察院 (2023). 检察机关依法妥善办理轻伤害案件典型案例", url: "https://www.spp.gov.cn/xwfbh/dxal/202303/t20230302_605116.shtml"}

- id: ch09_i22
  chapter: 9
  item: 22
  chapter_title: {ru: "Юридические подводные камни, на которые часто наступают обычные люди", en: "Legal red lines ordinary people often cross"}
  title: {ru: "Не продавайте свои органы и не ищите доноров для других: за почку на руки свыше 20000, ту же почку перепродают за 200000; деньги конфискуют и штрафуют в 10–20 раз от суммы сделки", en: "Do not sell your own organs, and do not help others find donors: a kidney nets a little over 20000 yuan (2万多); the same kidney is resold for 200000 yuan (20万); the money is confiscated and a fine of 10 to 20 times the transaction amount is added"}
  grade: A
  measure: freedom
  plain:
    ru: "Живой орган можно жертвовать только супругу, прямым кровным родственникам или боковым кровным родственникам в пределах трёх поколений; любая купля-продажа незаконна. В деле в Пекине продавец почки получил лишь свыше 20000, а ту же почку больному продавали за 180000–220000. Выручку конфискуют и штрафуют в 10–20 раз от суммы сделки. Цена для тела после удаления почки — раздел 1, пункт 35 (оставшаяся почка работает за две)."
    en: "Living organs may only be donated to a spouse, direct blood relative, or collateral blood relative within three generations; buying and selling are both unlawful. In a Beijing case, the seller got only a little over 20000 yuan (2万多); the same kidney sold to the patient for 180000 to 220000 yuan (18万 to 22万). Money obtained is confiscated, then a fine of 10 to 20 times the transaction amount is added. The bodily cost after a kidney is removed is in Section 1, item 35 (the remaining kidney does the work of two)."
  benefit:
    ru: "«Положение о донорстве и трансплантации человеческих органов», статья 5: «Ни одна организация и ни одно лицо ни в какой форме не вправе торговать человеческими органами и заниматься связанной с этим деятельностью». Статья 10: «Ни одна организация и ни одно лицо не вправе забирать живые органы гражданина младше 18 лет для трансплантации». Статья 11: «Получатель живого органа ограничен супругом донора, прямыми кровными родственниками или боковыми кровными родственниками в пределах трёх поколений». Статья 37 задаёт наказание за торговлю органами. Кто торгует человеческими органами или занимается связанной деятельностью — ведомство здравоохранения народного правительства на уровне уезда и выше расследует. Сначала конфискуют незаконный доход — всю выручку от сделки. Затем штраф от 10 до 20 раз от суммы сделки. Участвовавшим медикам отзывают свидетельство о праве на практику и пожизненно запрещают работать в здравоохранении. При составе преступления — уголовная ответственность по закону (по всей стране; действует с 1 мая 2024 года; прежнее «Положение о трансплантации человеческих органов» одновременно отменено). Статья 234-1 УК: «Организация продажи человеческих органов другими — до 5 лет лишения свободы плюс штраф; при тяжких обстоятельствах — от 5 лет плюс штраф или конфискация имущества». Ещё три ситуации квалифицируют по статьям 234 и 232 УК. Первая: изъятие органов без согласия человека. Вторая: изъятие органов у лица младше 18 лет. Третья: принуждение или обман к донорству органов. Эти — как умышленное причинение вреда или умышленное убийство. Пример 1: Первый промежуточный народный суд Пекина 20 августа 2014 года в окончательном решении по делу Чжэн Вэя и ещё 14 человек — 51 почка, сумма свыше 10340000 юаней. Продавцы почек (доноры) «получили лишь вознаграждение от 20000 до 25000 юаней». Сторона больных, ждущих почку (реципиенты), платила «раньше 180000 или 190000 за почку, потом 210000 или 220000». Пункт изъятия — четырёхэтажный дом за 7500 юаней в месяц; старшая медсестра группы показала, что там «грязь и беспорядок, даже реанимационного оборудования нет». Организатор Чжэн Вэй за организацию продажи органов — 12 лет; остальные 14 — от 3 лет 6 месяцев до 9 лет. Пример 2: дело Верховной народной прокуратуры «подросток продал почку ради iPhone». 17-летнему Вану вечером 28 апреля 2011 года в Чэньчжоу удалили правую почку. Площадку операции дало отделение без лицензии на трансплантацию в больнице без соответствующей квалификации. При выписке 2 мая он получил 22000 юаней; сторона реципиента заплатила посреднику 150000 юаней и 10000 долларов США; главный виновник заработал свыше 56000 юаней. После операции у Вана недостаточность функции почек: «вред — тяжкий, инвалидность третьей степени»"
    en: "Article 5 of the Regulations on Human Organ Donation and Transplantation: “No organization or individual may buy or sell human organs in any form, or engage in activities related to buying or selling human organs.” Article 10: “No organization or individual may obtain living organs from a citizen under 18 years of age for transplant.” Article 11: “Recipients of living organs are limited to the living donor’s spouse, direct blood relatives, or collateral blood relatives within three generations.” Article 37 sets how buying and selling human organs are punished. Buying or selling human organs or engaging in related activities is handled by the health department of the local people’s government at county level or above. First confiscate the illegal gains — take all money from the deal. Then fine not less than 10 times and not more than 20 times the transaction amount. Medical staff who take part have their practice certificates revoked and are barred for life from health services. If a crime is constituted, criminal liability is pursued according to law (nationwide; in force from 1 May 2024; the former Regulations on Human Organ Transplantation are repealed at the same time). Criminal Law Article 234-1: “Whoever organizes another person to sell a human organ shall be sentenced to fixed-term imprisonment of not more than five years and shall also be fined; if the circumstances are serious, to fixed-term imprisonment of not less than five years and shall also be fined or have property confiscated.” Three further situations are convicted and punished under Articles 234 and 232. One is removing someone’s organ without their consent. Two is removing an organ from a person under eighteen. Three is forcing or deceiving someone into donating an organ. These are handled as intentional injury or intentional homicide. Case 1: The Beijing No. 1 Intermediate People’s Court finally judged Zheng and 14 others on 20 August 2014; the case involved 51 kidneys and over 10340000 yuan (1034万余) in amounts. Kidney sellers (donors) “received only remuneration ranging from 20000 to 25000 yuan (2万 to 2.5万).” The patient side (recipients) paid “formerly 180000 or 190000 yuan (18万 or 19万) per kidney, later 210000 or 220000 yuan (21万 or 22万).” The harvest site was a four-story building rented for 7500 yuan a month; the gang’s head nurse said the place was “filthy and chaotic, without even rescue equipment.” Organizer Zheng was sentenced to 12 years for organizing the sale of human organs; the other 14 got from 3 years 6 months to 9 years. Case 2: The “teen sold a kidney for an Apple phone” case published by the Supreme People’s Procuratorate. Seventeen-year-old Wang had his right kidney removed in Chenzhou on the night of 28 April 2011. The surgery site was a contracted department inside a hospital without transplant qualifications. On discharge on 2 May he received 22000 yuan (2.2万); the recipient side paid intermediaries 150000 yuan (15万) RMB and 10000 US dollars; the principal made over 56000 yuan (5.6万余). After surgery Wang had incomplete kidney function; “the injury constituted serious injury and grade-three disability”"
  sources:

    - {citation: "全国人大 (2020). 民法典（第一千二百零九条）", url: "https://www.spp.gov.cn/spp/fl/202006/t20200602_463888.shtml"}
    - {citation: "最高人民法院 (2020). 关于审理道路交通事故损害赔偿案件适用法律若干问题的解释（2020 年修正，第一条）. <https://gw.nscourt.gov.cn/nscourt/wzsy/swgk/sfwj/content/post_1473229.html>（深圳市南山区人民法院转载）；最高人民法院 (2026). 最高法发布道路交通事故损害赔偿典型案例（案例 1）", url: "https://www.court.gov.cn/zixun/xiangqing/499041.html"}

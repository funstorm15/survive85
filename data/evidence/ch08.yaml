- id: ch08_i8
  chapter: 8
  item: 8
  chapter_title: {ru: "Не рискуйте собой: закон и защита имущества", en: "Protect yourself: laws and personal safety"}
  title: {ru: "Ни в коем случае не одалживайте свои банковские карты, SIM-карты и платежные аккаунты другим людям — «помощь в обналичивании» не является законным подработком", en: "Never lend your bank cards, SIM cards, or payment accounts to anyone — “money laundering” is not a side hustle"}
  grade: A
  measure: freedom
  plain:
    ru: "Сдавать в аренду, одалживать или продавать другим лицам банковские карты, SIM-карты и платежные аккаунты — это само по себе незаконно. В таком случае взыскивается штраф в размере от 1 до 10 раз превышающий незаконно полученный доход; если дохода нет, максимальный штраф составляет 200 000 юаней. При особо тяжких нарушениях предусмотрено административное задержание на срок до 15 суток, а также внесение информации в кредитную историю и ограничение функций банковского аккаунта. Если вы осознавали, что другой человек использует ваши аккаунты для совершения преступления, а всё равно помогали ему получать и переводить деньги, это квалифицируется как преступление по статье «Пособничество в совершении преступления в сфере информационных технологий» — наказание до 3 лет лишения свободы."
    en: "Renting, lending, or selling your bank cards, SIM cards, or payment accounts is illegal on its own. Penalties include confiscation of all illegal earnings plus a fine of 1 to 10 times that amount; if no earnings were made, the maximum fine is 200000 yuan. In serious cases, offenders face up to 15 days in detention, a negative credit record, and restrictions on account functionality. If you knowingly assist criminals by receiving or transferring money using these accounts, you could be convicted of aiding information network criminal activities, punishable by up to 3 years in prison."
  benefit:
    ru: "Сдача в аренду, одалживание или продажа телефонных карт, банковских счетов, платежных аккаунтов и интернет-аккаунтов — это само по себе незаконно. В таком случае взыскивается штраф в размере от 1 до 10 раз превышающий незаконно полученный доход; если дохода нет, максимальный штраф составляет 200 000 юаней. При особо тяжких нарушениях предусмотрено административное задержание на срок до 15 суток. Кроме того, информация о нарушении может быть внесена в кредитную историю, функции аккаунта ограничатся, а также будет приостановлена возможность совершать операции без личного посещения банка. Если вы осознавали, что другой человек использует ваш аккаунт для совершения преступления в сети, а всё равно помогали ему с расчетами, при особо тяжких обстоятельствах это квалифицируется как преступление по статье «Пособничество в совершении преступления в сфере информационных технологий» — наказание до 3 лет лишения свободы и штраф (действует по всей стране)."
    en: "Engaging in any activity that involves renting, lending, or selling phone cards, bank accounts, payment accounts, or internet accounts is illegal. Authorities confiscate all illegal earnings and impose a fine of 1 to 10 times that amount; if no earnings exist, the maximum fine is 200000 yuan. Serious violations lead to detention of up to 15 days, a negative credit record, account restrictions, and suspension of all non-counter banking services. Knowingly providing payment settlement assistance to criminals constitutes aiding information network criminal activities (known as “helping information network crimes”), punishable by up to 3 years in prison and a fine nationwide."
  sources:
    - {citation: "全国人大常委会 (2022). 反电信网络诈骗法（第三十一、四十四条）", url: "https://www.spp.gov.cn/spp/fl/202209/t20220902_575631.shtml"}
    - {citation: "全国人大常委会 (2015). 刑法修正案（九）（第二十九条，即刑法第二百八十七条之二）", url: "https://www.spp.gov.cn/spp/fl/201802/t20180205_364562.shtml"}

- id: ch08_i10
  chapter: 8
  item: 10
  chapter_title: {ru: "Не рискуйте собой: закон и защита имущества", en: "Protect yourself: laws and personal safety"}
  title: {ru: "При конфликте сначала звоните в полицию, а не отвечайте ударом — тот, кто первым поднял руку, почти наверняка проиграет", en: "If a fight breaks out, call the police first — the one who strikes first almost always loses"}
  grade: A
  measure: freedom
  plain:
    ru: "За избиение другого человека грозит административный арест на срок от 5 до 10 дней и штраф от 500 до 1000 юаней. Если избиение совершено группой, в отношении пожилых, беременных, детей или инвалидов, либо повторялось неоднократно, срок ареста увеличивается до 10–15 дней, а штраф — до 1000–2000 юаней. Если в результате нанесены легкие телесные повреждения, дело переходит в уголовную плоскость: виновному грозит до 3 лет лишения свободности, а за тяжкие повреждения — от 3 до 10 лет. Если двое людей дерутся друг с другом, это не считается законной самообороной, и тот, кто первым начал драку, почти наверняка проиграет. Лучше отойти в людное место и вызвать полицию, чем отвечать ударом."
    en: "Anyone who assaults another person faces 5 to 10 days in jail and a fine of 500 to 1000 yuan. If they act in a group, target the elderly, pregnant women, children, or disabled individuals, or repeat the assault multiple times, the penalty rises to 10 to 15 days in jail and a fine of 1000 to 2000 yuan. Causing minor injuries to another person turns it into a criminal case, punishable by up to 3 years in prison; serious injuries bring a sentence of 3 to 10 years. When two people fight each other, it does not qualify as self-defense — the person who strikes first almost always suffers the consequences. Moving to a crowded area and calling the police is far more effective than retaliating."
  benefit:
    ru: "За избиение или умышленное причинение вреда здоровью предусмотрен арест от 5 до 10 дней и штраф от 500 до 1000 юаней. Если избиение совершено группой, в отношении уязвимых категорий людей или неоднократно, срок ареста увеличивается до 10–15 дней, а штраф — до 1000–2000 юаней. Групповые драки квалифицируются как хулиганство, за что максимально грозит 15 дней ареста и штраф 2000 юаней; хулиганство — это провокация конфликта без видимой причины. За умышленное причинение вреда здоровью, если это признается уголовным преступлением, грозит до 3 лет лишения свободности; за тяжкие повреждения — от 3 до 10 лет. Драка двух людей юридически считается взаимным насилием, а не самообороной. Однако если противник первым начал атаку и использовал явно чрезмерные методы, либо вы пытались уклониться, а он продолжал нападать, ваша ответная реакция обычно признается законной самообороной. Превышением самообороны считается лишь случай, когда ответные действия явно выходят за рамки необходимости и приводят к серьезному вреду здоровью; даже в таких случаях наказание должно быть смягчено или отменено (действует по всей стране с 1 января 2026 года согласно Закону об административных правонарушениях)."
    en: "Under the law, anyone who assaults another person or intentionally harms them faces 5 to 10 days in jail and a fine of 500 to 1000 yuan. Those who act in a group, target vulnerable groups, repeat the assault, or attack multiple people at once receive 10 to 15 days in jail and a fine of 1000 to 2000 yuan. Group fights are treated as hooliganism, carrying a maximum penalty of 15 days in jail and a 2000 yuan fine. Intentional bodily harm that meets criminal criteria results in up to 3 years in prison; serious injuries bring a sentence of 3 to 10 years. Legally, mutual fighting does not count as self-defense. However, if the other person strikes first and uses excessive force, or if you try to avoid the fight but they keep attacking, your retaliation is generally deemed lawful self-defense. Only when your response clearly exceeds what is necessary and causes major harm does it qualify as excessive self-defense, which still warrants a reduced or waived penalty (nationwide, effective January 1, 2026 under the Public Security Administration Punishment Law)."
  sources:
    - {citation: "全国人大常委会 (2025). 治安管理处罚法（2025 年修订，第三十、五十一条）", url: "https://www.spp.gov.cn/spp/fl/202506/t20250627_699863.shtml"}
    - {citation: "全国人大 (1997). 刑法（第二十、二百三十四条）", url: "https://www.spp.gov.cn/spp/fl/201802/t20180206_364975.shtml"}
    - {citation: "最高人民法院、最高人民检察院、公安部 (2020). 关于依法适用正当防卫制度的指导意见（法发〔2020〕31 号，第 6、9、11、14 条）", url: "https://www.court.gov.cn/zixun/xiangqing/251611.html"}

- id: ch08_i17
  chapter: 8
  item: 17
  chapter_title: {ru: "Не рискуйте собой: закон и защита имущества", en: "Protect yourself: laws and personal safety"}
  title: {ru: "Прочитайте документ до подписания: не подписывайте за других и не ставьте подпись на чистом листе", en: "Read the document thoroughly before signing; never sign on behalf of others or on blank paper"}
  grade: A
  measure: money
  plain:
    ru: "Подпись имеет юридическую силу, равно как и оттиск пальца. Аргументы вроде «я не успел прочитать» или «я думал, это что-то другое» в суде почти никогда не принимаются. Поэтому важно потратить время на полное прочтение документа, сразу задавать вопросы по непонятным моментам и делать фото. Никогда не подписывайте за других, не ставьте подпись на чистом листе, а на копии паспорта обязательно укажите цель использования. Электронная подпись и подтверждение по лицу также считаются действительной подписью."
    en: "Once signed, a document becomes legally binding — fingerprints carry the same weight as signatures. Claims like “I didn’t read it” or “I thought it was something else” rarely hold up in court. Therefore, take the time to read everything, clarify any doubts immediately, and document it all. Never sign for someone else or on blank paper, and always specify the purpose when copying ID cards. Digital signatures and facial recognition verification also count as valid signatures."
  benefit:
    ru: "Законно заключенный договор защищен законом и обязателен для обеих сторон. После подписания необходимо полностью выполнять все условия. Согласно статье 490 Гражданского кодекса, договор считается заключенным в момент, когда стороны «подписывают, ставят печать или оттиск пальца». Оттиск пальца является равноправным способом подписания наряду с подписью и печатью, поэтому договор считается заключенным и при использовании оттиска. Аргументы вроде «я не успел прочитать» в суде почти не имеют шансов на успех. Не подписывая документ, вы избегаете несения чужих долгов и ответственности (по всей стране)."
    en: "Legally executed contracts are protected by law and bind both parties. Once signed, obligations must be fulfilled as agreed. Article 490 of the Civil Code states that contracts formed in writing become effective when parties “sign, affix seals, or press fingerprints.” Fingerprints are treated equally with signatures and seals, so a contract remains valid even with just a fingerprint. Attempts to deny responsibility by claiming lack of awareness won’t succeed in court. Avoiding such signatures prevents you from inheriting debts or liabilities that aren’t yours (nationwide)."
  sources:
    - {citation: "全国人大 (2020). 民法典（第四百六十五、四百九十、五百零九条）", url: "https://www.spp.gov.cn/spp/fl/202006/t20200602_463888.shtml"}

- id: ch08_i18
  chapter: 8
  item: 18
  chapter_title: {ru: "Не рискуйте собой: закон и защита имущества", en: "Protect yourself: laws and personal safety"}
  title: {ru: "При оформлении займа составьте четкий договор; прежде чем выступать поручителем, подумайте, готовы ли вы отвечать за долг", en: "Write a clear loan agreement when lending money; think carefully before acting as a guarantor"}
  grade: A
  measure: money
  plain:
    ru: "В договоре займа нужно указать все важные сведения: кто кредитор, кто заемщик, сумму, процентную ставку, срок и способ погашения, после чего обязательно подписать документ обеими сторонами. Деньги лучше переводить по безналичному расчету, а не давать наличными — так проще доказать факт займа в суде. Прежде чем выступить поручителем, обратите внимание на наличие в договоре слов «солидарная ответственность». При обычном поручительстве кредитор сначала должен подать иск к заемщику и попытаться взыскать долг через принудительное исполнение, только после этого может требовать выплаты от поручителя. Если же в договоре указана солидарная ответственность, кредитор имеет право требовать погашения долга напрямую от вас."
    en: "The loan agreement must include all key details: who the lender and borrower are, the amount, interest rate, term, and repayment method, plus both signatures. Always use bank transfers instead of cash — this makes it much easier to pursue legal action if needed. Before agreeing to be a guarantor, check whether the contract mentions “joint and several liability.” Under a standard guarantee, creditors must first sue the borrower and exhaust all collection efforts before they can demand repayment from you. But if you sign a joint and several liability guarantee, creditors can demand payment from you directly."
  benefit:
    ru: "Договор займа должен составляться в письменной форме; в нем обычно указываются вид займа, валюта, цель, сумма, процентная ставка, срок и способ погашения. Только при наличии всех этих данных можно успешно обратиться в суд. Если в договоре поручительства не указан тип ответственности или формулировка нечеткая, такой договор считается заключенным на условиях обычного поручительства. В этом случае поручитель может не беспокоиться до тех пор, пока кредитор не подаст иск к заемщику, не инициирует принудительное взыскание его имущества, а после этого долг так и не будет погашен. При наличии же соглашения о солидарной ответственности такой защиты у поручителя нет: кредитор вправе требовать выплаты от него напрямую (по всей стране)."
    en: "Loan contracts must be in writing, with standard clauses covering the type of loan, currency, intended use, amount, interest rate, term, and repayment method. This clarity is essential for any future legal action. If a guarantee contract does not explicitly state the type of guarantee or leaves details ambiguous, it is treated as a standard guarantee. Under such terms, creditors must first pursue legal action against the borrower and attempt to enforce repayment before they can turn to you. However, if you agree to a joint and several liability guarantee, you lose this protection — creditors can demand payment from you immediately. (Nationwide)"
  sources:
    - {citation: "全国人大 (2020). 民法典（第六百六十八、六百八十一、六百八十六、六百八十七条）", url: "https://www.spp.gov.cn/spp/fl/202006/t20200602_463888.shtml"}

- id: ch08_i28
  chapter: 8
  item: 28
  chapter_title: {ru: "Не рискуйте собой: закон и защита имущества", en: "Protect yourself: laws and personal safety"}
  title: {ru: "Не выступайте «номинальным законным представителем», не одалживайте свой паспорт для регистрации компании", en: "Don’t be a “nominal legal representative” — don’t lend your ID to register a company"}
  grade: B
  measure: freedom
  plain:
    ru: "Закон предполагает, что законный представитель — это именно тот человек, который управляет делами компании. Фраза «я лишь числюсь в списке, ничего не знаю» не является основанием для освобождения от ответственности. Если законный представитель при исполнении своих обязанностей причинил вред другим лицам, сначала компания выплачивает компенсацию, а потом вправе потребовать возмещения средств с виновного представителя. Для тех, кто уже числится в списке, закон позволяет подать заявление об отказе от должности, а компания обязана назначить нового законного представителя в течение 30 дней."
    en: "The law assumes the legal representative is the person actually managing the company; claiming “I’m just a figurehead and know nothing” does not serve as a valid excuse to avoid liability. If a legal representative causes harm to others while performing duties, the company must compensate first, then may seek reimbursement from the negligent representative. For those already serving in this role, company law allows them to resign, provided the company appoints a new legal representative within 30 days."
  benefit:
    ru: "Законный представитель обычно назначается из числа директоров или управляющих, которые фактически руководят делами компании, и закон предполагает, что именно вы отвечаете за все действия организации. Если такой представитель причинил вред другим лицам при выполнении своих обязанностей, сначала компания выплачивает компенсацию, а потом вправе потребовать возмещения средств с виновного представителя. Директора и высшее руководство обязаны действовать в интересах компании и с должной добросовестностью. Если при исполнении обязанностей они причинили вред другим лицам, а также проявили умысел или грубую небрежность, то должны возмещать ущерб из собственных средств. Факт «неосведомленности» не является законным основанием для освобождения от ответственности (по всей стране, с июля 2024 года)."
    en: "The legal representative is intended to be the director or manager who actually runs the company’s affairs, meaning the law regards this person as the true manager. Should such a representative cause harm to others while on duty, the company pays compensation first and then can recover those funds from the responsible representative. Directors and senior executives also owe duties of loyalty and diligence to the company — they must act in its best interests and with due care. If they cause harm to others through intentional acts or gross negligence, they must personally bear the financial responsibility. “Lack of awareness” is not a legally valid defense against liability (nationwide, effective July 2024)."
  sources:
    - {citation: "全国人大常委会 (2023). 公司法（2023 年修订，第十、十一、一百八十、一百九十一条）", url: "https://www.gov.cn/yaowen/liebiao/202312/content_6923395.htm"}

- id: ch08_i29
  chapter: 8
  item: 29
  chapter_title: {ru: "Не рискуйте собой: закон и защита имущества", en: "Protect yourself: laws and personal safety"}
  title: {ru: "Не берите на себя ответственность за чужие вещи при пересечении границы и не принимайте посылки неизвестного происхождения", en: "Don’t carry items for strangers when traveling, and don’t accept packages of unknown origin"}
  grade: B
  measure: freedom
  plain:
    ru: "В консульском департаменте МИД рекомендуют гражданам, выезжающим за рубеж, не брать на себя ответственность за перевозку чужих вещей, особенно запрещённых предметов или предметов, о которых вы ничего не знаете. Если в вашем багаже обнаружат наркотики или контрабанду, вам придётся самостоятельно доказывать, что вы не знали, что внутри находится. То же самое касается получения посылок внутри страны, особенно если вас просят сначала оплатить доставку, а потом вернуть деньги."
    en: "The Consular Department of the Ministry of Foreign Affairs advises travelers to avoid carrying luggage or items for others, especially prohibited goods or anything they know nothing about. If drugs or contraband are later found in your luggage, you’ll be responsible for proving that you had no knowledge of them. The same applies to receiving parcels domestically — especially when someone asks you to pay upfront and promises a refund later."
  benefit:
    ru: "В консульском департаменте МИД настоятельно рекомендуют гражданам избегать перевозки чужих вещей, особенно запрещённых или неизвестных предметов. Это помогает предотвратить ситуации, когда человек невольно становится перевозчиком запрещённых предметов и несёт за это юридическую ответственность. Если в багаже обнаружат наркотики или контрабанду, доказывать, что вы не знали, что внутри находится, придётся самостоятельно."
    en: "Following this advice helps prevent unknowingly transporting prohibited items, thus avoiding any legal consequences. It also protects you from being held liable if contraband is discovered in your luggage."
  sources:
    - {citation: "外交部领事司 (2026). 对准备出国的中国公民有哪些建议？（中国领事服务网，2026 年 7 月 13 日）", url: "https://cs.mfa.gov.cn/zggmcgx/lsbhyxz/cjwd_149483/202607/t20260713_11981016.html"}
    - {citation: "湖北省邮政管理局 (2025). 关于防范利用寄递渠道实施诈骗的风险提示（2025 年 3 月 25 日）", url: "https://hb.spb.gov.cn/hubsyzglj/c100057/c100058/202503/17998076d1f74959b1d4378ddb9d3564.shtml"}

- id: ch08_i44
  chapter: 8
  item: 44
  chapter_title: {ru: "Не рискуйте собой: закон и защита имущества", en: "Protect yourself: laws and personal safety"}
  title: {ru: "Члены семьи набрали долги из-за азартных игр: не спешите их выплачивать. Закон не защищает долги по азартным играм, а деньги, взятые в долг для этой цели, не считаются общим долгом супругов", en: "Family members have gambling debts — don’t rush to pay them: gambling debts aren’t legally protected, nor are loans taken for gambling considered joint marital debts"}
  grade: B
  measure: money
  plain:
    ru: "Долги, образовавшиеся в результате азартных игр, не защищаются законом. Если кредитор знал или должен был знать, что деньги пойдут на игры, такой долг также не защищается. Суммы, взятые в долг одним из супругов для азартных игр, не могут считаться общим долгом пары. Без судебного решения суд не вправе обязать непричастного супруга нести ответственность за выплату."
    en: "Money owed from gambling isn’t protected by courts. Even if creditors know the borrower is using the funds for gambling, those loans still get no legal protection. Any debt incurred by one spouse for gambling purposes can’t be treated as a joint marital obligation. Without a court ruling, the non-borrowing spouse can’t be held responsible for repayment."
  benefit:
    ru: "В уведомлении Верховного суда от 2017 года указаны четыре пункта. Долги, возникшие в результате преступной деятельности, такой как азартные игры или употребление наркотиков, не защищаются законом. Если кредитор знал или должен был знать, что деньги пойдут на подобные цели, такой долг также не защищается. Если один из супругов берёт деньги в долг для совершения преступления и требует признать этот долг общим, суд отклоняет такое требование. Без судебного разбирательства невозможно возложить гражданскую ответственность на непричастного супруга (вся территория страны, с 2017 года)."
    en: "A 2017 notice from the Supreme People’s Court outlines four key points: Debts arising from illegal activities like gambling or drug use aren’t legally protected. Loans given to someone for such activities — even when creditors are aware of the purpose — also receive no legal protection. If one spouse takes out a loan in their own name for illegal acts and later tries to classify it as a joint marital debt, courts won’t approve this claim. Without a formal court trial, the non-borrowing spouse can’t be forced to bear any civil liability related to the debt (applies nationwide since 2017)."

- id: ch08_i3
  chapter: 8
  item: 3
  chapter_title: {ru: "Не рискуйте собой: закон и защита имущества", en: "Protect yourself: laws and personal safety"}
  title: {ru: "Запомните главные правила защиты от мошенничества: не верьте незнакомым звонкам, не разглашайте личную информацию, не переходите по ссылкам и тщательно проверяйте любые переводы. Все семь самых распространённых видов мошенничества строятся по одной схеме", en: "Remember the core anti-fraud rules: don’t trust unsolicited calls, don’t share personal information, don’t click on suspicious links, and always verify any transfer requests. All seven of the most common scam types follow this same pattern"}
  grade: B
  measure: money
  plain:
    ru: "Если вам предлагают перевести деньги, делиться экраном, скачивать незнакомые приложения, переходить по ссылкам или сообщать коды подтверждения, сначала положите трубку, а затем позвоните в официальные службы для проверки. Семь самых распространённых видов мошенничества — это обман с выполнением заданий за вознаграждение, фиктивные инвестиции, поддельные кредиты, подделка сотрудников служб поддержки, имитация сотрудников правоохранительных органов, так называемые «схемы с убийством свиней» и обман с выполнением заданий под предлогом романтических отношений. Во всех случаях цель — заставить вас сначала перевести деньги. Предотвратить обман заранее гораздо проще, чем потом пытаться вернуть потерянные средства."
    en: "If someone asks you to transfer money, share your screen, download an unknown app, click a link, or share verification codes, hang up first and then call the official number to verify. The seven most common scam types are fake “task reward” schemes, fraudulent investment offers, fake loan scams, impersonation of customer service agents, impersonation of police or judicial officials, romance scams, and fake “task reward” schemes involving seduction. All of them aim to get you to send money first. Spotting them in advance is far cheaper than trying to recover lost funds later."
  benefit:
    ru: "Закон обязывает государственные органы и соответствующие службы информировать население о способах совершения телекоммуникационного мошенничества. Полиция совместно с финансовыми, телекоммуникационными и интернет-органами создала систему предупреждения и предотвращения мошенничества, которая своевременно предупреждает людей, которым грозит обман. Номер 96110 — это единый общенациональный телефон такого предупреждения, звонки с которого необходимо принимать. Согласно отчёту Министерства общественной безопасности за июнь 2026 года, 10 самых распространённых видов мошенничества составляют 85% всех подобных преступлений. Обман с выполнением заданий за вознаграждение встречается чаще всего — на его долю приходится 25%. Фиктивные инвестиции приносят наибольшие убытки: они составляют около 40% от общей суммы потерь. Ниже приведены характерные признаки каждого из этих видов мошенничества, выявленные полицией провинции Фуцзянь. Обман с выполнением заданий за вознаграждение: «Тот, кто предлагает вам заработать вместе, скорее всего, хочет забрать ваши деньги»; при этом первоначальный взнос не возвращается, даже если задание не выполнено. Фиктивные инвестиции: в чатах «тролли» выставляют примеры высокой прибыли, сначала выплачивая небольшие суммы, а затем побуждая вкладывать больше; для вывода средств требуют уплаты «налогов». Поддельные кредиты: «Для получения кредита не нужно вносить залог или делать банковские транзакции; если вам предлагают это — это обман». Подделка сотрудников служб поддержки: они утверждают, что у вас активирована подписка, из-за которой списываются средства и портится кредитная история, и требуют перевести деньги для отмены. Имитация сотрудников правоохранительных органов: «У правоохранительных органов не существует так называемых „безопасных счетов“; любые „правоохранительные органы“, которые ведут расследование или составляют протоколы по телефону, в QQ, WeChat или в интернете — это мошенники». «Схемы с убийством свиней»: «Не стоит доверять „возлюбленному“, с которым вы никогда не встречались, а видели только фото или видео»; такие люди часто просят деньги, ссылаясь на срочные нужды, но никогда не соглашаются на видеосвязь или встречу. Обман с выполнением заданий под предлогом романтических отношений: сначала предлагают встретиться и «выполнить задание», после чего требуют всё больше и больше денег. Предотвратить обман заранее гораздо проще, чем потом пытаться заблокировать перевод средств. Вернуть деньги удастся лишь в том случае, если они ещё не были списаны с вашего счёта; подробности блокировки перевода описаны во втором пункте (звоните по номеру 110 или 96110 с просьбой заблокировать операцию) (данные по всей стране, с декабря 2022 года)."
    en: "By law, government agencies and relevant departments must inform the public about common tactics used in telecom and online fraud. Public security authorities, together with financial, telecom, and internet regulators, run a nationwide early warning and prevention system to reach out to people at risk of being scammed. 96110 is this unified national hotline for such warnings — you should always answer calls from it. According to a June 2026 report from the Ministry of Public Security, the top 10 most common scam types account for 85% of all telecom fraud cases. Fake “task reward” schemes are the most prevalent, making up 25% of all cases. Fraudulent investment offers cause the greatest financial losses, accounting for roughly 40% of total fraud-related losses. The Fujian Provincial Public Security Department has outlined specific identifying features for each type. For fake “task reward” schemes: “Anyone urging you to join a money-making scheme is likely trying to take your money; they won’t refund your initial deposit unless you complete endless tasks.” For fraudulent investment offers: “Fake promoters post fake profit reports in online groups; they give small initial returns to encourage you to invest more, then demand ‘taxes’ before allowing any withdrawals.” For fake loan scams: “Legitimate loans never require upfront deposits or proof of bank transactions; any such requests are a red flag.” For impersonation of customer service agents: “They claim you have an active membership that will incur automatic fees and harm your credit score, pressuring you to transfer money to cancel it.” For impersonation of police or judicial officials: “No legitimate police or judicial agency has any so-called ‘safe accounts’; any ‘law enforcement’ contact via phone, QQ, WeChat, or online platforms is a scam.” For romance scams: “Never trust anyone you’ve only met via photos or video calls; they often invent urgent reasons to ask for money without ever agreeing to a video chat or in-person meeting.” For seduction-based “task reward” schemes: “They arrange a meeting first, then demand you complete ‘tasks’ that require ever-larger payments.” Spotting these scams early is far cheaper than trying to reverse unauthorized transfers later. How much money you can recover depends on whether it remains in your account at the time of reporting; for details on how to request a transfer reversal, see section 2 (call 110 or 96110 to request a reversal). (Nationwide, effective December 2022)"
  sources:
    - {citation: "全国人大常委会 (2022). 反电信网络诈骗法（第八、二十、三十四条）", url: "https://www.spp.gov.cn/spp/fl/202209/t20220902_575631.shtml"}
    - {citation: "公安部 (2026). 公安部发布会：通报当前电信网络诈骗犯罪的最新形势、特点提示防范电信网络诈骗要点（2026 年 6 月 12 日）：「以上这10类案件就占了全部电诈案件的85%。其中，刷单返利诈骗发案最高，占所有电诈案件的25%；虚假网络投资理财诈骗损失最高，约占全部电诈案件损失的40%」", url: "https://www.mps.gov.cn/n2254536/n2254544/n2254552/n10491781/index.html"}
    - {citation: "福建省公安厅 (2023). 96110 来电，请务必接听. <http://gat.fujian.gov.cn/ztzl/fjjffpzxrx/spjq/202303/t20230306_6126156.htm>（省级公安机关页面，含「来电不轻信，信息不透露，链接不点击，转账多核实」口诀及「警惕 192 开头的诈骗电话」提示）；福建省公安厅 (2023 到 2024). 识骗技巧专栏：刷单", url: "http://gat.fujian.gov.cn/ztzl/fjjffpzxrx/spjq/202307/t20230703_6196881.htm"}

- id: ch08_i5
  chapter: 8
  item: 5
  chapter_title: {ru: "Не рискуйте собой: закон и защита имущества", en: "Protect yourself: laws and personal safety"}
  title: {ru: "Если вас обвиняют или вызывают на допрос, сразу пригласите адвоката — не пытайтесь решить дело миром и не удаляйте записи", en: "If accused or summoned, hire a lawyer first — don’t settle privately or delete records"}
  grade: A
  measure: freedom
  plain:
    ru: "При первом вызове на допрос вы уже имеете право пригласить адвоката. По требованию адвоката следственный изолятор обязан организовать встречу в течение 48 часов; разговоры не подлежат прослушиванию. На вопросы, не связанные с этим делом, вы вправе не отвечать."
    en: "You can hire a lawyer right from the first time you’re called in for questioning. If the lawyer requests a meeting, the detention center must arrange it within 48 hours, and those talks cannot be monitored. You’re allowed to refuse answering any questions unrelated to the case."
  benefit:
    ru: "С момента первого допроса или с момента применения к вам принудительных мер (ограничения свободы передвижения) вы имеете право нанять адвоката. В период предварительного расследования, пока дело находится в ведении полиции, вы можете пригласить только адвоката, но не иное лицо в качестве защитника. По требованию адвоката следственный изолятор обязан организовать встречу в течение 48 часов; встречи не подлежат прослушиванию. Никого нельзя принудить к признанию вины. Вы вправе отказаться отвечать на вопросы, не относящиеся к делу. Продолжительность вызова на допрос или принудительного доставления не превышает 12 часов; в особо сложных и серьёзных случаях — 24 часа. Вызов на допрос — это уведомление явиться на допрос; принудительное доставление — это принудительное приведение на допрос. Нельзя многократно вызывать человека, чтобы фактически лишить его свободы. Лица, которые создают ложные обвинения против других с целью привлечения их к уголовной ответственности, наказываются лишением свободы на срок до 3 лет; при тяжких последствиях — от 3 до 10 лет. Если после задержания или ареста дело закрывается, уголовное преследование прекращается или выносится оправдательный приговор, вы вправе требовать государственную компенсацию; размер компенсации рассчитывается исходя из средней дневной заработной платы работников страны за предыдущий год (по всей стране)."
    en: "Starting from the first interrogation or from the moment you’re placed under compulsory measures restricting your freedom, you have the right to appoint a lawyer. While the case remains under police investigation, only lawyers may represent you — no one else can serve as a defense counsel. Upon a lawyer’s request, the detention center must arrange a meeting within 48 hours, and such meetings are not monitored. No one may be forced to confess guilt, and you may refuse answering questions unrelated to the case. A summons or compulsory appearance lasts at most 12 hours; for especially serious and complex cases, this limit extends to 24 hours. A summons merely notifies you to come for questioning, while compulsory appearance means you’re physically taken there. Repeated summonses must not be used to detain someone indefinitely. Anyone fabricating facts to falsely accuse another and seeking criminal punishment for them faces up to three years in prison; if serious harm results, the sentence rises to three to ten years. If charges are dropped, prosecution is refused, or a court acquits you after detention or arrest, you may claim state compensation calculated daily based on the previous year’s national average wage for workers."
  sources:
    - {citation: "全国人大常委会 (2018). 刑事诉讼法（2018 年修正，第三十四、三十五、三十九、五十二、一百一十九、一百二十条）", url: "https://www.spp.gov.cn/zdgz/201810/t20181027_396818.shtml"}
    - {citation: "全国人大 (1997). 刑法（第二百四十三条）", url: "https://www.spp.gov.cn/spp/fl/201802/t20180206_364975.shtml"}

- id: ch08_i7
  chapter: 8
  item: 7
  chapter_title: {ru: "Не рискуйте собой: закон и защита имущества", en: "Protect yourself: laws and personal safety"}
  title: {ru: "После употребления алкоголя не садитесь за руль — даже на электромобиле или для «простого перемещения авто»", en: "Don’t touch the steering wheel after drinking — even for e‑bikes or “just moving the car a bit”"}
  grade: A
  measure: freedom
  plain:
    ru: "за вождение в нетрезвом виде водительское удостоверение временно изымается на 6 месяцев, а штраф составляет от 1000 до 2000 юаней. При повторном нарушении грозит административный арест и окончательная утрата прав. За вождение в состоянии опьянения права изымаются навсегда, в течение 5 лет нельзя сдавать экзамен заново; кроме того, наступает уголовная ответственность по статье о опасном вождении, остается судимость, что влияет на проверку биографии и доступ к некоторым профессиям. Страховая компания также не возместит ущерб: в случае ДТП после употребления алкоголя автостраховка не выплачивает компенсацию. Даже если вы планируете лишь «немного подвинуть машину», это всё равно считается вождением."
    en: "Driving after drinking results in a 6‑month suspension of your license and a fine of 1000–2000 yuan. A second offense brings up to 10 days in jail and permanent license revocation. Drunk driving leads to immediate license cancellation; you can’t reapply for 5 years and may face criminal charges for dangerous driving, leaving a criminal record that affects background checks and certain jobs. Auto insurance won’t cover any claims: once you’ve been drinking, your policy becomes void. Even “just moving the car a bit” counts as driving."
  benefit:
    ru: "за вождение в нетрезвом виде водительское удостоверение временно изымается на 6 месяцев, а штраф составляет от 1000 до 2000 юаней. При повторном нарушении грозит арест на срок до 10 суток и окончательная утрата прав. За вождение в состоянии опьянения права изымаются навсегда, в течение 5 лет нельзя сдавать экзамен заново; наступает уголовная ответственность по статье о опасном вождении, предусматривается краткосрочное лишение свободы и штраф. Для водителей коммерческого транспорта наказания ещё строже: за обычное вождение в нетрезвом виде — арест на 15 суток, штраф 5000 юаней и запрет управлять транспортом в течение 5 лет; за вождение в состоянии опьянения — запрет на 10 лет, при этом в дальнейшем управлять коммерческим транспортом уже не разрешат никогда. Если в результате вождения в нетрезвом виде или в состоянии опьянения произошло тяжкое ДТП и наступила уголовная ответственность, водитель лишается права управлять транспортом на всю жизнь. Все виды коммерческой автостраховки не покрывают ущерб в случае ДТП после употребления алкоголя или наркотиков (действует по всей стране)."
    en: "Temporary suspension of the license for 6 months and a fine ranging from 1000 to 2000 yuan for driving after drinking. Repeat offenders face up to 10 days in jail and permanent license revocation. Drunk driving results in immediate license cancellation; reapplication is prohibited for 5 years, and criminal liability for dangerous driving is pursued, leading to imprisonment and monetary penalties. For commercial drivers the penalties are harsher: 15 days in jail, a 5000‑yuan fine, and a 5‑year ban on driving commercially; drunk driving entails a 10‑year ban, after which they can never drive commercially again. If drinking or being drunk leads to a major accident and a criminal conviction, driving privileges are revoked for life. Commercial auto insurance policies explicitly exclude any claims arising from driving under the influence of alcohol or drugs (nationwide)."
  sources:
    - {citation: "全国人大常委会 (2021). 道路交通安全法（2021 年修订，第八十九、九十一、九十九条）. <https://jtgl.beijing.gov.cn/jgj/jgxx/flfg/fl/205308/index.html>（北京市公安交通管理局转载）；国务院 (2004). 道路交通安全法实施条例（国务院令第 405 号，第七十二条）", url: "https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_3745.htm"}

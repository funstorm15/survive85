- id: ch06_i1
  chapter: 6
  item: 1
  chapter_title: {ru: "Обратный список", en: "The anti-list"}
  title: {ru: "Не стоит принимать комплексные витамины ради долголетия или профилактики сердечно-сосудистых заболеваний", en: "Don’t take multivitamins just to live longer or protect your heart and blood vessels"}
  grade: A
  contested: true
  measure: money
  plain:
    ru: "В рамках исследования PHS II 14 641 мужчина-врач (около 14 000) принимали комплексные витамины в течение 11,2 лет (это медианное значение — у половины участников период наблюдения был дольше, у другой половины — короче). Среди тех, кто принимал витамины, и тех, кто их не принимал, количество случаев серьезных сердечно-сосудистых проблем и смертности оказалось одинаковым. Всего в анализ вошли 9 рандомизированных контролируемых исследований с участием более 50 000 человек — в них также не выявлено никакой связи между приемом витаминов и снижением смертности. Экономия от отказа от покупки витаминов составляет 200–700 юаней в год. Однако это не относится к людям, у которых выявлен дефицит конкретных веществ, а также к беременным женщинам, которым необходима фолиевая кислота."
    en: "14,400 male doctors took multivitamins for 11 years. The number of serious heart or blood vessel problems and deaths among them was no different from those who didn’t take them. When nine studies involving over 50,000 people were combined, there was still no effect on overall mortality. Skipping multivitamins saves you 200–700 yuan each year. This does not apply to people who truly lack certain nutrients or pregnant women needing folic acid."
  benefit:
    ru: "Согласно результатам исследования PHS II, среди участников, принимавших витамины, и тех, кто их не принимал, частота возникновения основных сердечно-сосудистых событий оказалась одинаковой (отношение рисков HR = 1,01; 95% доверительный интервал: 0,91–1,10). Аналогичная картина наблюдалась и в отношении общей смертности (HR = 0,94; 95% ДИ: 0,88–1,02). Американская организация USPSTF, оценивающая эффективность профилактических мер, в 2022 году проанализировала 9 рандомизированных исследований с участием 51 550 человек и пришла к выводу, что комплексные витамины не влияют на общую смертность. Уровень доказательности оценивается как I — то есть доказательств недостаточно для однозначных выводов. Популярность витаминов объясняется их рекламным слоганом «одна таблетка обеспечивает организм всеми необходимыми веществами» и их низкой стоимостью (всего несколько юаней в день)."
    en: "The PHS II trial followed 14,641 male doctors for a median of 11.2 years. Both groups — those taking multivitamins and those who didn’t — showed the same rate of major cardiovascular events. The hazard ratio was 1.01 (meaning no real difference), with a 95% confidence interval of 0.91–1.10. Similarly, overall mortality rates were identical, with a hazard ratio of 0.94 (95% CI 0.88–1.02). In 2022, USPSTF evaluated nine randomized controlled trials involving 51,550 participants and concluded there is no link between multivitamin use and reduced mortality; they assigned it a Grade I rating, meaning evidence is insufficient to draw any firm conclusions. The idea that multivitamins are a good deal stems partly from the convenience of “one pill for all nutrients” and their low daily cost."
  numbers:
    - {kind: HR, value: 1.01, ci_low: 0.91, ci_high: 1.1}
    - {kind: HR, value: 0.94}
  sources:
    - {citation: "Sesso HD et al. (2012). Multivitamins in the prevention of cardiovascular disease in men: the Physicians' Health Study II randomized controlled trial. JAMA", url: "https://doi.org/10.1001/jama.2012.14805"}
    - {citation: "US Preventive Services Task Force (2022). Vitamin, Mineral, and Multivitamin Supplementation to Prevent Cardiovascular Disease and Cancer. JAMA", url: "https://doi.org/10.1001/jama.2022.8970"}
  doi: "10.1001/jama.2012.14805"

- id: ch06_i7
  chapter: 6
  item: 7
  chapter_title: {ru: "Обратный список", en: "The anti-list"}
  title: {ru: "Не стоит делать себе «полный ПЭТ-КТ» или «панель онкомаркеров», если нет симптомов", en: "Don’t get a whole-body PET-CT or tumor marker panel just because you have no symptoms"}
  grade: A
  measure: mortality
  plain:
    ru: "У людей без симптомов чаще всего находят ложную тревогу. Среди тех, кому делают КТ всего тела, больше чем у 80% находят хотя бы одно «отклонение», почти у 40% зовут на повторную проверку, а большинство находок доброкачественные. У женщин, которым смотрят маркеры рака яичников, смертность от этого рака не стала ниже, а кого-то из-за ложной тревоги напрасно оперировали."
    en: "When people without symptoms get screened, what turns up most often is a false alarm. Over eight in ten who get a whole-body CT have at least one “abnormality” noted, and nearly four in ten are called back for more tests, yet most findings are benign. Women screened with ovarian-cancer markers do not die less of ovarian cancer, and some have had surgery for nothing after a false alarm."
  benefit:
    ru: "Американская организация USPSTF, оценивающая профилактические меры, присвоила рекомендации по использованию CA-125 и УЗИ для скрининга рака яичников у женщин без симптомов категорию D, то есть такие обследования не рекомендуются. Основанием послужили результаты исследования PLCO: уровень смертности от рака яичников в группе скрининга составил 0,34%, в контрольной группе — 0,29% (отношение рисков RR 1,18; 95% доверительный интервал 0,82–1,71). Таким образом, польза от такого скрининга отсутствует. Доля людей, которым из-за ложноположительных результатов пришлось перенести операцию, в различных исследованиях составляет от 0,2% до 3,25%, при этом у не более чем 15% из них возникают серьёзные осложнения. В другом исследовании у 1192 человек без симптомов проводили полный КТ: у 86% выявили хотя бы одно «отклонение», а у 37% потребовалось дополнительное обследование. В большинстве случаев эти изменения оказались доброкачественными. На первый взгляд такие обследования кажутся выгодными, ведь идея «раннего выявления и лечения» звучит очень убедительно."
    en: "The USPSTF, which evaluates preventive measures in the U.S., gave a D rating to using CA-125 and ultrasound to screen asymptomatic women for ovarian cancer — meaning it does not recommend this screening. Their basis is the PLCO trial, which showed a 0.34% death rate from ovarian cancer in the screened group versus 0.29% in the control group (RR 1.18, 95% CI 0.82–1.71). Screening offers no real benefit. The rate of unnecessary surgery due to false positives ranges from 0.2% to 3.25% across studies, with up to 15% of those patients experiencing serious complications. Another study screened 1,192 symptom-free individuals with whole-body CT; 86% had at least one “abnormality” noted, and 37% were advised to undergo further tests. Most of these findings were benign. The idea that screening is “worth it” because it enables early detection stems largely from intuition rather than solid evidence."
  numbers:
    - {kind: RR, value: 1.18, ci_low: 0.82, ci_high: 1.71}
  sources:
    - {citation: "US Preventive Services Task Force (2018). Screening for Ovarian Cancer: US Preventive Services Task Force Recommendation Statement. JAMA（同一份建议另有 USPSTF 官方页）. <https://doi.org/10.1001/jama.2017.21926>、", url: "https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/ovarian-cancer-screening"}
    - {citation: "Furtado CD et al. (2005). Whole-body CT screening: spectrum of findings and recommendations in 1192 patients. Radiology", url: "https://doi.org/10.1148/radiol.2372041741"}
  doi: "10.1148/radiol.2372041741"

- id: ch06_i10
  chapter: 6
  item: 10
  chapter_title: {ru: "Обратный список", en: "The anti-list"}
  title: {ru: "Не тратьте крупные суммы на БАДы, пастообразные «рецепты» и тоники ради «поддержания организма»", en: "Don’t spend a lot on health products, herbal pastes, or tonics to “tone the body”"}
  grade: C
  measure: money
  plain:
    ru: "Мультивитамины, рыбий жир, витамин D и другие частые составы в первых шести пунктах этого раздела уже разобраны по одному — пользы не видно. Фраза на упаковке «БАД — не лекарство и не заменяет лечение болезней» обязательна по правилам регулятора БАДов. Если деньги идут родителям «в гости с пакетом», намерение нормальное — выбран не тот предмет."
    en: "Multivitamins, fish oil, vitamin D, and other common ingredients have already been checked one by one in the first six items of this section; none showed a benefit. The line on the pack — “Health food is not a drug and cannot replace drug treatment of disease” — is required by the agency that regulates health foods. If the money is meant as a gift for parents brought to the door, the intention is fine; only the product is the wrong choice."
  benefit:
    ru: "Выигрыш — сэкономленные деньги. Основание — первые 6 пунктов этого раздела. Самые частые составы БАДов — мультивитамины, рыбий жир, витамин D, антиоксиданты, глюкозамин, витамин C — в рандомизированных контролируемых испытаниях не дали ожидаемой пользы. Цифры — в полях «Эффект» тех 6 пунктов. Правила регулятора говорят, что можно заявлять, а не доказывают бесполезность. Главное государственное управление по регулированию рынка требует: на лицевой стороне упаковки БАДа не менее 20% площади занимает фраза «БАД — не лекарство и не заменяет лечение болезней». Тем же правилом назначение БАДов ограничено рамкой «дополнять пищевые нутриенты, поддерживать или улучшать состояние организма либо снижать факторы риска болезни». Кажется выгодным, потому что формула «не лечит, только поддерживает» почти не опровержима, и при подарке платят за отношения, а не за доказательства."
    en: "What you get back is the money saved. The reasons are in the first 6 items of this section. The most common ingredients in health products — multivitamins, fish oil, vitamin D, antioxidants, glucosamine, vitamin C — showed no expected benefit in randomized controlled trials. The numbers for each are in those 6 items’ Benefit lines. Regulatory rules only say what may be claimed; they are not evidence that a product is useless. The State Administration for Market Regulation requires that the front of a health-food pack dedicate no less than 20% of its area to one sentence: “Health food is not a drug and cannot replace drug treatment of disease.” The same rules lock the use of health foods to “supplementing dietary nutrients, maintaining or improving the body’s health state, or lowering disease risk factors.” It looks worthwhile because “does not treat disease, only tones” is hard to falsify, and when the money is spent as a gift it rides on reciprocity, not evidence."
  sources:
    - {citation: "国家市场监督管理总局 (2019). 市场监管总局就《保健食品标注警示用语指南》和《保健食品原料目录与保健功能目录管理办法》有关情况举办专题新闻发布会", url: "https://www.samr.gov.cn/tssps/sjdt/tpxw/art/2023/art_4b658b824b1b4b0ba57c09a56cc93aad.html"}

- id: ch06_i25
  chapter: 6
  item: 25
  chapter_title: {ru: "Обратный список", en: "The anti-list"}
  title: {ru: "Не верьте, что «сила воли как мышца: чуть попользовался — и кончилась»", en: "Don’t believe “willpower is like a muscle; use it a while and it’s gone”"}
  grade: A
  measure: time
  plain:
    ru: "Популярная версия: сначала сделай что-то, требующее самоконтроля, и дальше сорвёшься легче, значит волю надо беречь. 23 лаборатории и 2141 человек повторили этот опыт по одному протоколу — эффект почти ноль. Не объясняйте себя фразой «сегодня воля кончилась» и не платите за курсы «накопить волю»."
    en: "The popular claim is: do one self-control task first, then you break more easily afterward, so conserve willpower. Twenty-three labs and 2141 people redid the experiment under the same protocol; the result was almost zero. Stop explaining yourself with “willpower is used up today,” and don’t pay for courses that teach you to stockpile willpower."
  benefit:
    ru: "Многолабораторное заранее зарегистрированное повторение: 23 лаборатории, всего 2141 участник. По стандартной схеме Sripada и соавт. повторили парадигму последовательных задач: сначала задача, «съедающая» самоконтроль, затем вторая, тоже требующая самоконтроля. Сводка: эффект самоистощения очень мал, и 95% доверительный интервал включает 0 (d = 0,04, 95% CI −0,07 до 0,15). Авторы обсуждают, ещё ли держится модель «самоконтроль — ограниченный ресурс». Другое такое же заранее зарегистрированное повторение: 36 лабораторий, 3531 человек, величина эффекта d = 0,06 — тоже слишком мала, чтобы считать."
    en: "A multi-lab preregistered replication had 23 laboratories and 2141 participants. They redid the sequential-task paradigm under Sripada and colleagues’ standardized protocol: first a depleting self-control task, then a second task that needs self-control. Pooled results showed a very small ego-depletion effect, and the 95% credible interval included 0 (d = 0.04, 95% CI −0.07 to 0.15). The authors discuss whether the “self-control is a limited resource” model still stands. Another similarly preregistered redo, 36 labs and 3531 people, found effect size d = 0.06 — again too small to count."
  sources:
    - {citation: "Hagger MS, Chatzisarantis NLD, Alberts H, et al. (2016). A Multilab Preregistered Replication of the Ego-Depletion Effect. Perspectives on Psychological Science, 11(4), 546–573", url: "https://doi.org/10.1177/1745691616652873"}
    - {citation: "Vohs et al. (2021). A Multisite Preregistered Paradigmatic Test of the Ego-Depletion Effect. Psychological Science", url: "https://doi.org/10.1177/0956797621989733"}
  doi: "10.1177/1745691616652873"

    - {citation: "Johnson SB, Park HS, Gross CP, Yu JB (2018). Complementary Medicine, Refusal of Conventional Cancer Therapy, and Survival Among Patients With Curable Cancers. JAMA Oncology, 4(10), 1375-1381", url: "https://doi.org/10.1001/jamaoncol.2018.2487"}

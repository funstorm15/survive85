- id: ch16_i1
  chapter: 16
  item: 1
  chapter_title: {ru: "Как жить с хроническим заболеванием", en: "How to live after a chronic disease diagnosis"}
  title: {ru: "Принимайте лекарства по назначению врача до конца и не бросайте, когда стало лучше", en: "Take the medicine as prescribed for the full course; do not stop because you feel better"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "у тех, кто принимает лекарства так, как сказал врач, вероятность умереть за тот же срок примерно вдвое ниже, чем у тех, кто пьёт с перерывами. Эту цифру надо смотреть со скидкой. Даже у тех, кто исправно принимал пустышку, смертность ниже: часть выигрыша от того, что люди, которые умеют не бросать лечение, и так внимательнее к здоровью."
    en: "People who take the medicine for the full course, as the doctor said, have about half the chance of dying over the same period as people who take it on and off. Discount this figure. People who take even a dummy medicine for the full course also die less often, which shows that part of the benefit comes from \"people who can keep taking medicine were already paying more attention to their health.\""
  benefit:
    ru: "21 исследование, вместе 46847 человек (метаанализ): по сравнению с теми, кто принимает лекарства с перерывами, у принимающих по назначению вероятность умереть за тот же срок примерно на 44% ниже. Исходное значение — отношение шансов 0,56, 95% ДИ 0,50–0,63 (доверительный интервал). Если смотреть только лечение с подтверждённым действием, ниже примерно на 45% (0,55, 0,49–0,62)."
    en: "Pooled from 21 studies and 46847 people (meta-analysis): compared with people who take medicine on and off, people who take it as prescribed have about a 44% lower chance of dying over the same period. The original value is an odds ratio of 0.56, 95% CI 0.50–0.63 (confidence interval). Looking only at treatments that truly work, about 45% lower (0.55, 0.49–0.62)"
  sources:
    - {citation: "Simpson SH, Eurich DT, Majumdar SR, et al. (2006). A meta-analysis of the association between adherence to drug therapy and mortality. BMJ, 333(7557), 15", url: "https://doi.org/10.1136/bmj.38875.675486.55"}
  doi: "10.1136/bmj.38875.675486.55"

- id: ch16_i4
  chapter: 16
  item: 4
  chapter_title: {ru: "Как жить с хроническим заболеванием", en: "How to live after a chronic disease diagnosis"}
  title: {ru: "Не отменяйте основное лечение ради «народных» средств и БАДов", en: "Do not stop standard treatment to try folk remedies or health supplements"}
  grade: B
  measure: mortality
  plain:
    ru: "у людей с излечимым раком, которые пользуются только альтернативными методами и не проходят обычное лечение, риск смерти в 2,5 раза выше, чем при обычном лечении. Те, кто на фоне лечения ещё применяют дополнительные методы, чаще отказываются от операции, химиотерапии и лучевой терапии — лишние смерти отсюда. Некоторые травы ослабляют препараты против отторжения и антикоагулянты; прежде чем их принимать, спросите лечащего врача."
    en: "For a cancer that could otherwise be treated, people who use only alternative therapy and skip standard treatment have 2.5 times the risk of death of people on standard treatment. People who use complementary therapy while also being treated more often refuse surgery, chemotherapy, and radiotherapy, and the extra deaths come from that. Some herbs also weaken anti-rejection drugs and anticoagulants; ask the treating doctor before taking any."
  benefit:
    ru: "два исследования по данным онкологического регистра США — пациенты без метастазов с излечимым раком молочной железы, простаты, лёгкого и толстой кишки. Первое — только альтернативная терапия, без операции, химио-, лучевой и гормональной терапии. По сравнению с подобранными по условиям пациентами на стандартном лечении риск смерти 2,5 раза (HR 2,50, 95% ДИ 1,88–3,27, примерно в 1,5 раза выше). Рак молочной железы — 5,68 раз (3,22–10,04), лёгкого — 2,17 (1,42–3,32), толстой кишки — 4,57 (1,66–12,61). Второе — стандартное лечение плюс дополнительная (комплементарная) терапия. Доля отказа от операции 7,0% против 0,1%, от химиотерапии 34,1% против 3,2%, от лучевой 53,0% против 2,3%, от гормональной 33,7% против 2,8%. Пятилетняя выживаемость 82,2% против 86,6%, риск смерти 2,08 раз (HR 2,08, 1,50–2,90, примерно вдвое выше). После учёта задержек и отказов от лечения связь дополнительной терапии сама по себе со смертью не видна (HR 1,39, 0,83–2,33). Вывод авторов: лишняя смертность — из-за отказа от стандартного лечения. Государственное управление по контролю рынка требует на этикетке БАД: (保健食品不是药物，不能代替药物治疗疾病). Национальный центр дополнительного и интегративного здоровья США (NCCIH) указывает: зверобой продырявленный («дубровник», «зверобой») ослабляет действие ряда препаратов, в том числе циклоспорин против отторжения трансплантата и антикоагулянта варфарин."
    en: "Two US cancer-registry studies looked at non-metastatic, potentially curable breast, prostate, lung, and colorectal cancer. The first compared patients who used only alternative therapy and did none of surgery, chemo/radiotherapy, or endocrine treatment with matched standard-care patients: death risk 2.5-fold (HR 2.50, 95% CI 1.88–3.27, about 1.5 times higher). Breast cancer 5.68-fold (3.22–10.04), lung 2.17-fold (1.42–3.32), colorectal 4.57-fold (1.66–12.61). The second looked at standard treatment plus complementary therapy: refusal rates were surgery 7.0% vs 0.1%, chemo 34.1% vs 3.2%, radiotherapy 53.0% vs 2.3%, endocrine therapy 33.7% vs 2.8%. Five-year survival 82.2% vs 86.6%; death risk 2.08-fold (HR 2.08, 1.50–2.90, about double). After accounting for delay and refusal, complementary therapy alone was not linked to death (HR 1.39, 0.83–2.33). The author’s conclusion: extra deaths came from refusing standard treatment. China’s State Administration for Market Regulation requires health-food labels to state: “Health food is not medicine and cannot replace drugs to treat disease.” The US National Center for Complementary and Integrative Health (NCCIH) states that St John’s wort (贯叶连翘) weakens several drugs, including cyclosporine for transplant rejection and the anticoagulant warfarin"
  numbers:

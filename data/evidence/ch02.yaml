- id: ch02_i1
  chapter: 2
  item: 1
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Как можно раньше бросайте курить", en: "Quitting smoking, the earlier the better"}
  grade: A
  measure: mortality
  plain:
    ru: "В среднем курильщики живут на 10 лет меньше, чем некурящие. Если бросить курить до 40 лет, можно устранить примерно 90% риска преждевременной смерти, связанного с курением. Чем раньше вы бросите, тем больше лет вы сохраните себе. Если после перелома продолжать курить, кость не срастается примерно в 2,3 раза чаще, чем у некурящих, поэтому до полного срастания кости курить не стоит."
    en: "On average, smokers live more than 10 years less than non-smokers. Quitting before age 40 eliminates roughly 90% of the extra death risk caused by continued smoking. The earlier you quit, the more years you gain. If you keep smoking after a fracture, the chance that the bone fails to heal is about 2.3 times that of a non-smoker, so don’t smoke until the bone has healed."
  benefit:
    ru: "В одном американском исследовании, где просто отслеживали состояние участников без их разделения на группы, выяснилось, что курильщики живут на 10 лет меньше, чем те, кто никогда не курил. Бросив курить до 40 лет, можно устранить около 90% риска смерти, связанного с продолжением курения. При этом люди, бросившие курить в возрасте 25–34 лет, живут на 10 лет дольше, в 35–44 года — на 9 лет, а в 45–54 года — на 6 лет (в исследовании указывалось именно количество лет жизни). Аналогичные исследования в Китае показали, что в 2010-х годах риск смерти среди городских мужчин-курильщиков был в 1,65 раза выше, чем у некурящих (коэффициент относительного риска 1,65), а у сельских мужчин — в 1,22 раза. После 10 лет воздержания от курения этот риск практически исчезает. После перелома это тоже так. В объединённом анализе 19 наблюдательных исследований, где людей только отслеживали без разделения на группы, у курящих шансы несращения перелома (кость не срастается) были примерно в 2,3 раза выше, чем у некурящих (ОШ 2,32, 95% ДИ 1,76–3,06, с поправкой на другие факторы). При переломах большеберцовой кости голени и при открытых переломах показатель тоже повышен. В шведском рандомизированном испытании среди 50 человек, которые после экстренной операции по поводу перелома прошли 6-недельную программу отказа от курения, хотя бы одно послеоперационное осложнение возникло у 20%. Среди 55 человек, не проходивших программу, — у 38%. Если операция назначена заранее, бросать курить можно начать за 4–8 недель до неё: с еженедельным сопровождением и никотинзаместительными средствами. Так послеоперационных осложнений меньше примерно на 58% (относительный риск 0,42, 95% ДИ 0,27–0,65, 2 испытания, 210 человек)."
    en: "One U.S. study that tracked participants without assigning them to groups found that current smokers have a life expectancy more than 10 years shorter than those who never smoked. Quitting before age 40 removes about 90% of this excess mortality risk. Quitting between ages 25–34 adds roughly 10 years to life expectancy; between 35–44, about 9 years; and between 45–54, about 6 years (as reported in the original source). Similar Chinese research from the 2010s shows that urban male smokers have a 1.65 times higher death risk than non-smokers (RR 1.65), while rural male smokers have a 1.22 times higher risk. After 10 years of sustained abstinence, this smoking-related risk nearly disappears. The same holds after a fracture. Pooling 19 observational studies that only tracked people without assigning groups, smokers’ odds of non-union (the bone failing to knit) were about 2.3 times those of non-smokers (OR 2.32, 95% CI 1.76–3.06, adjusted for other factors). The excess was also seen in fractures of the tibia (shin bone) and in open fractures. In a Swedish randomized trial, 50 people who joined a 6-week smoking cessation program after emergency fracture surgery had at least one postoperative complication in 20% of cases, versus 38% among the 55 who did not join. For scheduled surgery, you can start quitting 4 to 8 weeks before the operation, with weekly coaching and nicotine replacement. That lowers postoperative complications by about 58% (RR 0.42, 95% CI 0.27–0.65, 2 trials, 210 people)."
  numbers:
    - {kind: RR, value: 1.65}
    - {kind: OR, value: 2.32, ci_low: 1.76, ci_high: 3.06}
    - {kind: RR, value: 0.42, ci_low: 0.27, ci_high: 0.65}
  sources:
    - {citation: "Jha P et al. (2013). 21st-century hazards of smoking and benefits of cessation in the United States. NEJM", url: "https://doi.org/10.1056/NEJMsa1211128"}
    - {citation: "Chen Z et al. (2015). Contrasting male and female trends in tobacco-attributed mortality in China: evidence from successive nationwide prospective cohort studies. Lancet", url: "https://doi.org/10.1016/S0140-6736(15)00340-2"}
    - {citation: "Oberg M et al. (2011). Worldwide burden of disease from exposure to second-hand smoke: a retrospective analysis of data from 192 countries. Lancet. <https://doi.org/10.1016/S0140-6736(10)61388-8>（二手烟那两个数字）；Scolaro JA et al. (2014). Cigarette smoking increases complications following fracture: a systematic review. J Bone Joint Surg Am", url: "https://doi.org/10.2106/JBJS.M.00081"}
    - {citation: "Nåsell H et al. (2010). Effect of smoking cessation intervention on results of acute fracture surgery: a randomized controlled trial. J Bone Joint Surg Am", url: "https://doi.org/10.2106/JBJS.I.00627"}
  doi: "10.1056/NEJMsa1211128"

- id: ch02_i3
  chapter: 2
  item: 3
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Отказ от курения: не обходитесь только силой воли, сначала возьмите лекарства — шанс успеха вырастет более чем вдвое", en: "Don’t rely solely on willpower to quit smoking — get medication first: success rates more than double"}
  grade: A
  measure: mortality
  plain:
    ru: "Ограничившись только силой воли, большинство людей не смогут бросить курить. У тех, кто принимает варениклин, вероятность успешного отказа от курения более чем в два раза выше, чем у людей, получающих плацебо. У тех, кто использует никотиновые заменители вроде пластырей и жвачек, этот показатель примерно на 50% выше, чем у тех, кто не принимает никаких лекарств. Если же применять сразу и пластырь, и жвачку, шанс успеха вырастет ещё примерно на 20%."
    en: "Relying on sheer willpower alone rarely works for most smokers. People taking varenicline are more than twice as likely to succeed compared to those taking a placebo. Those using nicotine replacement products also have a 50% higher success rate than non-medication users. Combining patches with gum or lozenges further boosts success rates by roughly 20%."
  benefit:
    ru: "В результате анализа 41 рандомизированного исследования с участием 17 395 человек выяснилось, что у группы, принимающей варениклин, вероятность успешного отказа от курения в 2,32 раза выше, чем у группы с плацебо (отношение рисков — 2,32, 95% доверительный интервал — 2,15–2,51; это доказательства высокой достоверности). Этот показатель также выше, чем у людей, принимающих бупропион (отношение рисков — 1,36, рост вероятности — примерно 36%) и у тех, кто использует только один вид никотинового заменителя (отношение рисков — 1,25, рост вероятности — примерно 25%). При сравнении никотиновых заменителей с отказом от курения без лекарств: по данным 133 исследований с участием 64 640 человек, вероятность успеха у первых выше примерно на 55% (отношение рисков — 1,55, 95% доверительный интервал — 1,49–1,61). Если же использовать пластырь вместе с более быстродействующей формой никотинового заменителя (жвачкой или таблетками для рассасывания), вероятность успеха вырастет примерно на 27% по сравнению с применением только одного вида заменителя (отношение рисков — 1,27, 95% доверительный интервал — 1,17–1,37; данные 16 исследований с участием 12 169 человек, доказательства высокой достоверности)."
    en: "A pooled analysis of 41 randomized trials involving 17,395 participants shows that varenicline increases smoking cessation rates by 2.32 times compared to placebo (RR 2.32, 95% CI 2.15–2.51; high-certainty evidence). Varenicline also outperforms bupropion (RR 1.36, a 36% relative increase) and single-form nicotine replacement therapy (RR 1.25, a 25% relative increase). Across 133 trials with 64,640 participants, nicotine replacement products raise success rates by about 55% versus no medication at all (RR 1.55, 95% CI 1.49–1.61). Using both a patch and a fast-acting form such as gum or lozenges yields a 27% relative improvement over patch-only use (RR 1.27, 95% CI 1.17–1.37; high-certainty evidence from 16 trials with 12,169 participants)."
  numbers:
    - {kind: RR, value: 2.32, ci_low: 2.15, ci_high: 2.51}
    - {kind: RR, value: 1.36}
    - {kind: RR, value: 1.25}
    - {kind: RR, value: 1.55, ci_low: 1.49, ci_high: 1.61}
    - {kind: RR, value: 1.27, ci_low: 1.17, ci_high: 1.37}
    - {kind: RR, value: 2.61}
    - {kind: RR, value: 1.37}
  sources:
    - {citation: "Livingstone-Banks J, Fanshawe TR, Thomas KH, et al. (2023). Nicotine receptor partial agonists for smoking cessation. Cochrane Database of Systematic Reviews, 5, CD006103. <https://doi.org/10.1002/14651858.CD006103.pub8>（恶心、失眠的相对风险在全文 Results 的 Adverse events 一节）；Hartmann-Boyce J, Chepkin SC, Ye W, Bullen C, Lancaster T (2018). Nicotine replacement therapy versus control for smoking cessation. Cochrane Database of Systematic Reviews, 5, CD000146", url: "https://doi.org/10.1002/14651858.CD000146.pub5"}
    - {citation: "Theodoulou A, Chepkin SC, Ye W, et al. (2023). Different doses, durations and modes of delivery of nicotine replacement therapy for smoking cessation. Cochrane Database of Systematic Reviews, 6, CD013308", url: "https://doi.org/10.1002/14651858.CD013308.pub2"}
    - {citation: "上海市卫生健康委员会 (2021). 选对药物，让戒烟轻松一点：「市场上可见的戒烟药物主要有三种，即尼古丁替代疗法药物、安非他酮、伐尼克兰」，「尼古丁替代疗法药物属于非处方药（OTC），可通过药店柜台购买；而安非他酮、伐尼克兰属于处方药，须到医院戒烟门诊或呼吸内科就诊，凭医师处方经药师调配后才能得到」", url: "https://wsjkw.sh.gov.cn/jtyx/20211119/df50681e01ba49f896d54f771d8176ae.html"}
  doi: "10.1002/14651858.CD000146.pub5"

- id: ch02_i7
  chapter: 2
  item: 7
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Отказ от сладких напитков, даже безсахарных, не решает проблему", en: "Not drinking sugary drinks — even switching to sugar-free ones doesn’t help"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "У людей, выпивающих более двух бутылок сладких напитков в день, вероятность смерти в тот же период примерно на 20% выше, чем у тех, кто почти не пьёт такие напитки. У тех, кто пьёт от одной до двух бутылок в день, этот показатель выше примерно на 10%. Замена на безсахарные варианты не приносит пользы: у людей, выпивающих более двух таких напитков в день, вероятность смерти выше примерно на 25%."
    en: "People who drink more than two sugary drinks per day have about a 20% higher chance of dying during the same period compared to those who rarely drink them. Those who consume one to two per day still face a roughly 10% higher risk. Switching to sugar-free versions brings no benefit: individuals drinking two or more sugar-free drinks daily actually have a 25% higher risk of death."
  benefit:
    ru: "В США проведены два крупных исследования с участием большой группы людей. В них не проводилось разделение участников на группы; в общей сложности в них участвовало около 118 тысяч человек, зафиксировано 36 тысяч случаев смерти. У людей, выпивающих более двух порций таких напитков в день, риск смерти выше примерно на 21% по сравнению с теми, кто пьёт менее одной порции в месяц (отношение рисков HR 1,21). У тех, кто выпивает от одной до двух порций в день, этот показатель выше примерно на 14% (HR 1,14). В европейском исследовании EPIC, в котором участвовало 450 тысяч человек из 10 стран, также не проводилось разделение на группы. У людей, выпивающих более двух порций сладких газированных напитков в день, риск смерти выше примерно на 8% по сравнению с теми, кто пьёт менее одной порции в месяц (HR 1,08, 95% доверительный интервал 1,01–1,16). Для напитков с искусственными подсластителями (безсахарных вариантов) этот показатель выше примерно на 26% (HR 1,26, доверительный интервал 1,16–1,35). Если учитывать все виды газированных напитков вместе, риск смерти выше примерно на 17% (HR 1,17, доверительный интервал 1,11–1,22)."
    en: "Two large U.S. studies followed large groups of people without any subgroup categorization; together they included around 118,000 participants and documented 36,000 deaths. Those drinking two or more sugary drinks daily had a 21% higher risk of death compared to those consuming less than one per month (HR 1.21). For those drinking one to two per day, the risk rose by about 14% (HR 1.14). The European EPIC study followed 450,000 people across 10 countries under similar conditions; again no subgroups were defined. Compared to those drinking less than one sugary drink per month, daily consumers of two or more sugary drinks faced an 8% higher risk (HR 1.08, 95% CI 1.01–1.16). Those drinking two or more sugar-free drinks daily had a 26% higher risk (HR 1.26, 95% CI 1.16–1.35). When all types of soft drinks were considered together, the risk increase was about 17% (HR 1.17, 95% CI 1.11–1.22)."
  numbers:
    - {kind: HR, value: 1.21}
    - {kind: HR, value: 1.14}
    - {kind: HR, value: 1.08, ci_low: 1.01, ci_high: 1.16}
    - {kind: HR, value: 1.26}
    - {kind: HR, value: 1.17}
  sources:
    - {citation: "Malik VS et al. (2019). Long-Term Consumption of Sugar-Sweetened and Artificially Sweetened Beverages and Risk of Mortality in US Adults. Circulation", url: "https://doi.org/10.1161/CIRCULATIONAHA.118.037401"}
    - {citation: "Mullee A, Romaguera D, Pearson-Stuttard J, et al. (2019). Association Between Soft Drink Consumption and Mortality in 10 European Countries. JAMA Internal Medicine, 179(11), 1479-1490", url: "https://doi.org/10.1001/jamainternmed.2019.2478"}
  doi: "10.1161/CIRCULATIONAHA.118.037401"

- id: ch02_i9
  chapter: 2
  item: 9
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Замена обычной соли на низконатриевую (калийную) соль дома", en: "Switch household salt to low‑sodium (potassium‑rich) salt"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "Людям, перенёсшим инсульт или старше 60 лет с гипертонией, замена обычной соли на низконатриевую снижает вероятность смерти за пять лет примерно на 12%, а риск повторного инсульта — примерно на 14%."
    en: "For people who have had a stroke or are over 60 with hypertension, switching to low‑sodium salt can lower their chance of dying within five years by about 12% and the risk of another stroke by roughly 14%."
  benefit:
    ru: "В китайской сельской местности провели рандомизированное исследование с участием 20 995 человек — как перенёсших инсульт, так и старше 60 лет с гипертонией. Их наблюдали в течение 4,74 года. В итоге у тех, кто использовал низконатриевую соль, риск смерти оказался ниже примерно на 12% (отношение рисков 0,88), риск инсульта — ниже примерно на 14% (отношение рисков 0,86), а риск основных сердечно-сосудистых событий — ниже примерно на 13% (отношение рисков 0,87). Разницы в частоте случаев повышенного уровня калия в крови между группами не выявлено."
    en: "A randomized trial conducted in rural China enrolled 20,995 participants — all stroke survivors or adults aged 60+ with hypertension — and followed them for 4.74 years. Those using low‑sodium salt had a 12% lower risk of death (RR 0.88), a 14% lower risk of stroke (RR 0.86), and a 13% lower risk of major cardiovascular events (RR 0.87) compared with the regular‑salt group. No statistically significant difference emerged between the groups regarding episodes of excessively high blood potassium levels."
  numbers:
    - {kind: RR, value: 0.88}
    - {kind: RR, value: 0.86}
    - {kind: RR, value: 0.87}
  sources:
    - {citation: "Neal B et al. (2021). Effect of Salt Substitution on Cardiovascular Events and Death. NEJM", url: "https://doi.org/10.1056/NEJMoa2105675"}
  doi: "10.1056/NEJMoa2105675"

- id: ch02_i11
  chapter: 2
  item: 11
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Ежедневно нужно делать 7000–8000 шагов или набирать 150–300 минут быстрой ходьбы в неделю", en: "Walking 7,000–8,000 steps per day, or accumulating 150–300 minutes of brisk walking each week"}
  grade: A
  measure: mortality
  plain:
    ru: "Люди, которые делают примерно 7800 шагов в день, имеют вероятность умереть в тот же период примерно на 45% ниже, чем те, кто делает лишь 3500 шагов. То же самое справедливо и для времени: при 150–300 минутах быстрой ходьбы в неделю риск смерти снижается примерно на 30% по сравнению с полным отсутствием физической активности. После достижения определённого уровня дальнейшее увеличение шагов не даёт дополнительного эффекта: для людей старше 60 лет достаточно 6000–8000 шагов в день. Достаточно соблюсти хотя бы одно из этих условий."
    en: "People who walk roughly 7,800 steps daily have a mortality risk roughly 45% lower than those walking only 3,500 steps. The same pattern holds when measured by time: those who engage in 150–300 minutes of brisk walking weekly face about 30% lower risk than inactive individuals. Beyond a certain threshold, further increases bring little extra benefit; for people over 60, 6,000–8,000 steps per day is sufficient. Meeting either step target is enough."
  benefit:
    ru: "В 15 исследованиях, в которых участвовали 47471 человек, зафиксировано 3013 случаев смерти. Людей разделили на четыре группы по количеству ежедневных шагов: в самой малочисленной группе медианное значение составляло 3553 шага в день, в остальных — 5801, 7842 и 10901 шаг в день соответственно. Риск смерти в этих трёх группах был ниже примерно на 40%, 45% и 53% по сравнению с самой малочисленной группой (HR 0,60; 0,55; 0,47). Для людей старше 60 лет после достижения 6000–8000 шагов в день дополнительный эффект от увеличения нагрузки практически исчезает, а для моложе 60 лет — после 8000–10000 шагов. Ещё одно исследование показало, что полезный эффект начинает проявляться при достижении 3867 шагов в день; после этого каждые дополнительные 1000 шагов снижают риск смерти примерно на 15%. Если рассматривать время активности, то люди, выполняющие от 1 до 2 раз уровня рекомендованной нормы (7,5–15 MET·ч в неделю, что соответствует 150–300 минутам быстрой ходьбы), имеют риск смерти на 31% ниже (HR 0,69) по сравнению с неактивными людьми; при достижении 3–5 раз уровня нормы этот показатель снижается до 39% (HR 0,61). Дальнейшее увеличение нагрузки не даёт дополнительного снижения риска, но и не вредит (при более чем 10-кратном превышении нормы HR остаётся на уровне 0,69). В исследовании с использованием акселерометров выяснилось, что четверть участников с наибольшей физической активностью имеет риск смерти на 48% ниже, чем четверть с наименьшей активностью (HR 0,52). Акселерометр — это прибор, надеваемый на тело для точного измерения объёма физической активности."
    en: "Fifteen studies tracking large groups of people were combined for analysis without subgrouping. These studies included 47,471 participants and 3,013 deaths. When grouped by daily step counts, the lowest group had a median of 3,553 steps/day; the next three groups had medians of 5,801, 7,842, and 10,901 steps/day. Their mortality risks were roughly 40%, 45%, and 53% lower than the lowest group (HR 0.60, 0.55, 0.47 respectively). For those over 60, benefits plateau after reaching 6,000–8,000 steps/day; for younger adults, the plateau appears at 8,000–10,000 steps/day. Another analysis found benefits begin at around 3,867 steps/day; each additional 1,000 steps/day reduces mortality risk by roughly 15%. When measured by exercise time, individuals meeting 1–2 times the recommended weekly activity level (7.5–15 MET·h/week, equivalent to 150–300 minutes of brisk walking) had a mortality risk about 31% lower than inactive people (HR 0.69). Those below this threshold still saw a 20% reduction (HR 0.80), while those exceeding it 3–5 times saw a maximum reduction of 39% (HR 0.61). Further increases bring no additional benefit, though they pose no harm (HR 0.69 at >10 times the threshold). A final study using accelerometers showed that the top quarter of participants in terms of moderate-to-vigorous activity had a mortality risk roughly 48% lower than the bottom quarter (HR 0.52). Accelerometers are wearable devices that measure actual physical activity levels."
  numbers:
    - {kind: HR, value: 0.6}

- id: ch02_i12
  chapter: 2
  item: 12
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "При гипертонии и повышенном уровне холестерина следует принимать лекарства строго по назначению врача, не прекращая терапию самостоятельно", en: "People with hypertension and high cholesterol should take their medication regularly as prescribed; never stop on their own"}
  grade: A
  measure: mortality
  plain:
    ru: "Каждое снижение систолического артериального давления на 10 мм рт. ст. уменьшает риск смертности примерно на 13 %, а риск инсульта — примерно на 27 %. Каждое снижение уровня холестерина ЛПНП на 1,0 ммоль/л снижает риск смертности примерно на 10 %. Люди, регулярно принимающие лекарства по назначению, имеют на 30–45 % меньший риск смерти, чем те, кто часто пропускает приём препаратов."
    en: "For every 10 mmHg drop in blood pressure, mortality decreases by roughly 13%, while stroke risk drops by about 27%. Each 1.0 mmol/L reduction in LDL cholesterol achieved by statins lowers mortality by roughly 10%. Those who take their medication as directed have a 30% to 45% lower risk of death compared to those who frequently miss doses."
  benefit:
    ru: "Анализ множества рандомизированных исследований показывает, что снижение систолического давления на 10 мм рт. ст. уменьшает риск смертности примерно на 13 % (отношение рисков — 0,87). Также снижается риск развития основных сердечно-сосудистых осложнений — примерно на 20 % (отношение рисков — 0,80), риск инсульта — примерно на 27 % (отношение рисков — 0,73), а риск сердечной недостаточности — примерно на 28 % (отношение рисков — 0,72). Приём статинов способствует снижению уровня холестерина ЛПНП; каждое снижение этого показателя на 1,0 ммоль/л уменьшает риск смертности примерно на 10 % (отношение рисков — 0,90) и риск основных сердечно-сосудистых осложнений — примерно на 22 % (отношение рисков — 0,78). Анализ длительных наблюдательных исследований также подтверждает, что люди, принимающие лекарства строго по назначению (не менее 80 % случаев), имеют значительно меньший риск смерти: приём статинов снижает этот риск примерно на 45 % (отношение рисков — 0,55), а приём гипотензивных препаратов — примерно на 29 % (отношение рисков — 0,71)."
    en: "Pooled data from multiple randomized controlled trials show that a 10 mmHg reduction in systolic blood pressure (the “high” number in a blood pressure reading) lowers mortality by about 13% (RR 0.87) and major cardiovascular events by roughly 20% (RR 0.80). Stroke risk drops by around 27% (RR 0.73), while heart failure risk decreases by about 28% (RR 0.72). Statins also reduce LDL cholesterol; each 1.0 mmol/L drop lowers mortality by roughly 10% (RR 0.90) and major vascular events by about 22% (RR 0.78). Observational studies further indicate that patients who adhere to prescribed treatment regimens (≥80% compliance) enjoy significantly lower mortality rates: statin adherence reduces risk by about 45% (RR 0.55), while adherence to antihypertensive therapy lowers risk by roughly 29% (RR 0.71)."
  numbers:
    - {kind: RR, value: 0.87}
    - {kind: RR, value: 0.8}
    - {kind: RR, value: 0.73}
    - {kind: RR, value: 0.72}
    - {kind: RR, value: 0.9}
    - {kind: RR, value: 0.78}
    - {kind: RR, value: 0.55}
    - {kind: RR, value: 0.71}
  sources:
    - {citation: "Ettehad D et al. (2016). Blood pressure lowering for prevention of cardiovascular disease and death: a systematic review and meta-analysis. Lancet", url: "https://doi.org/10.1016/S0140-6736(15)01225-8"}
    - {citation: "Cholesterol Treatment Trialists' (CTT) Collaboration (2010). Efficacy and safety of more intensive lowering of LDL cholesterol: a meta-analysis of data from 170 000 participants in 26 randomised trials. Lancet", url: "https://doi.org/10.1016/S0140-6736(10)61350-5"}
    - {citation: "Chowdhury R et al. (2013). Adherence to cardiovascular therapy: a meta-analysis of prevalence and clinical consequences. European Heart Journal", url: "https://doi.org/10.1093/eurheartj/eht295"}
    - {citation: "健康中国行动推进委员会 (2019). 健康中国行动（2019—2030年），（十一）心脑血管疾病防治行动（湖南省卫生健康委员会转载）", url: "https://wjw.hunan.gov.cn/wjw/ztzl/knowledge/tzggzcfg/202003/t20200303_11359594.html"}
    - {citation: "Joint Committee on the Chinese Guidelines for Lipid Management (2023). 中国血脂管理指南（2023 年）. 中华心血管病杂志, 51(3), 221-255", url: "https://doi.org/10.3760/cma.j.cn112148-20230119-00038"}
    - {citation: "Li JJ et al. (2023). 2023 Chinese guideline for lipid management. Frontiers in Pharmacology, 14, 1190934（上一份指南的英文版，中文原文未取得，相关内容按英文版核对）", url: "https://doi.org/10.3389/fphar.2023.1190934"}
  doi: "10.1016/S0140-6736(15)01225-8"

- id: ch02_i13
  chapter: 2
  item: 13
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Спать примерно 7 часов в сутки и соблюдать режим", en: "Getting about 7 hours of sleep each night with a consistent schedule"}
  grade: A
  measure: mortality
  plain:
    ru: "У людей, которые долгое время спят менее 7 часов в сутки, вероятность смерти в тот же период выше примерно на 10%. Чем больше нарушен режим сна, тем выше этот риск. У тех, кто спит наиболее регулярно, риск смерти ниже на 20–50% по сравнению с теми, у кого режим сна самый хаотичный. То есть от регулярности режима сна зависит риск смерти гораздо сильнее, чем от его продолжительности."
    en: "People who regularly get less than 7 hours of sleep have roughly a 10% higher chance of dying over time. The more irregular their schedule, the greater the risk. Those with the most regular sleep patterns enjoy a 20%–50% lower mortality risk compared to those with the least regular patterns. In other words, how consistent your sleep schedule is matters more than the total number of hours you sleep."
  benefit:
    ru: "В результате анализа 16 исследований, в которых участвовали 1,38 млн человек, зафиксировано 113 тысяч случаев смерти. У людей, спящих меньше положенного, риск смерти выше примерно на 12% (отношение рисков — 1,12). У тех, кто спит дольше нормы, этот показатель выше на 30% (отношение рисков — 1,30). В другом исследовании, разделившем участников по продолжительности сна, самый низкий риск смерти наблюдался у тех, кто спит по 7 часов в сутки. У тех, кто спит меньше 7 часов, риск повышается примерно на 6% за каждый недостающий час (отношение рисков — 1,06). У тех, кто спит дольше 7 часов, риск вырастает примерно на 13% за каждый дополнительный час (отношение рисков — 1,13). В рамках исследования UK Biobank, в котором участвовали около 61 тысяч человек, данные о режиме сна собирались с помощью носимых устройств. Всех участников разделили на 5 групп по степени регулярности режима сна. У четырех групп с более регулярным режимом риск смерти был на 20–48% ниже, чем у самой хаотичной группы. Регулярность режима сна оказывается более точным предиктором смертности, чем его продолжительность. Еще одно исследование UK Biobank, в котором участвовали 51 562 человека, показало, что у тех, у кого наблюдалась большая разница между временем сна в будние и выходные дни, риск развития сердечно-сосудистых заболеваний выше примерно на 30% (отношение рисков — 1,30, 95% доверительный интервал — 1,11–1,54). Эта связь сохраняется и у людей с нормальной продолжительностью сна."
    en: "A pooled analysis of 16 longitudinal studies — involving 1.38 million participants and 113 000 deaths — shows that short sleepers face a 12% higher risk of death (RR 1.12), while long sleepers face a 30% higher risk (RR 1.30). When sleep duration is grouped into categories, the 7‑hour bracket shows the lowest risk; each additional hour beyond 7 raises risk by about 13% (RR 1.13), and each hour less than 7 raises it by roughly 6% (RR 1.06). In the UK Biobank, wrist‑watch data from ~61 000 participants were used to rank them into five groups based on schedule regularity; the four more regular groups had a 20%–48% lower mortality risk than the least regular group. Another UK Biobank study tracked 51 562 individuals for new cardiovascular events; those with a social jet‑lag of 2 hours or more faced a 30% higher risk (HR 1.30, 95% CI 1.11–1.54), and this link persisted even among people getting a normal amount of sleep."
  numbers:
    - {kind: RR, value: 1.12}
    - {kind: RR, value: 1.3}
    - {kind: RR, value: 1.06}
    - {kind: RR, value: 1.13}
    - {kind: HR, value: 1.3, ci_low: 1.11, ci_high: 1.54}
  sources:
    - {citation: "Cappuccio FP et al. (2010). Sleep duration and all-cause mortality: a systematic review and meta-analysis of prospective studies. Sleep", url: "https://doi.org/10.1093/sleep/33.5.585"}
    - {citation: "Yin J et al. (2017). Relationship of Sleep Duration With All-Cause Mortality and Cardiovascular Events: A Systematic Review and Dose-Response Meta-Analysis of Prospective Cohort Studies. JAHA", url: "https://doi.org/10.1161/JAHA.117.005947"}
    - {citation: "Windred DP et al. (2024). Sleep regularity is a stronger predictor of mortality risk than sleep duration: A prospective cohort study. Sleep", url: "https://doi.org/10.1093/sleep/zsad253"}
    - {citation: "Kumar N, Krishnamurthy S (2026). Social jet lag is associated with incident cardiovascular disease independent of sleep duration and cardiac genetic risk. Journal of Internal Medicine", url: "https://doi.org/10.1111/joim.70133"}
  doi: "10.1093/sleep/33.5.585"

- id: ch02_i14
  chapter: 2
  item: 14
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Регулярно играйте в теннис, бадминтон, настольный теннис и другие ракетные виды спорта", en: "Play racket sports such as tennis, badminton and table tennis regularly"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "У людей, которые регулярно играют в теннис, бадминтон или настольный теннис, вероятность умереть за тот же период примерно в два раза ниже, чем у тех, кто этим не занимается; вероятность смерти от сердечно-сосудистых заболеваний снижается примерно на 56%. У пловцов этот показатель ниже примерно на 28%. В этих данных не наблюдается разницы между бегунами и футболистами."
    en: "People who regularly play tennis, badminton, or table tennis have about half the risk of dying during the same period compared to non-players. Their risk of dying from cardiovascular causes is roughly 56% lower. Swimmers enjoy a similar benefit, with a 28% lower risk. No significant difference was observed between runners and soccer players in this data set."
  benefit:
    ru: "В Великобритании провели длительное исследование с участием 80 300 человек, в ходе которого сравнивали группу людей, занимающихся определённым видом спорта, и тех, кто этим не занимается. У участников, играющих в ракетные виды спорта, риск смерти снижается примерно на 47% (отношение рисков 0,53, 95% ДИ 0,40–0,69). Вероятность смерти от сердечно-сосудистых заболеваний у них ниже примерно на 56% (отношение рисков 0,44, 95% ДИ 0,24–0,83). Под ракетными видами спорта в данном исследовании понимаются теннис, бадминтон и настольный теннис. У пловцов эти показатели составляют 0,72 и 0,59 соответственно; у любителей аэробики — 0,73 и 0,64, а у велосипедистов — 0,85. Между бегунами и футболистами статистически значимой разницы не выявлено."
    en: "A UK-based study tracking 80,300 participants compared those who engaged in racket sports with those who did not. The former group had a 47% lower overall mortality risk (hazard ratio 0.53, 95% CI 0.40–0.69). Their risk of cardiovascular death was 56% lower (0.44, 95% CI 0.24–0.83). Racket sports here include tennis, badminton, and table tennis. For swimmers, these figures were 0.72 and 0.59 respectively; for aerobic exercise enthusiasts they were 0.73 and 0.64, and for cyclists 0.85. No statistically significant differences were found between runners and soccer players."
  sources:
    - {citation: "Oja P, Kelly P, Pedisic Z, et al. (2017). Associations of specific types of sports and exercise with all-cause and cardiovascular-disease mortality: a cohort study of 80 306 British adults. British Journal of Sports Medicine, 51(10), 812-817", url: "https://doi.org/10.1136/bjsports-2016-096822"}
  doi: "10.1136/bjsports-2016-096822"

- id: ch02_i16
  chapter: 2
  item: 16
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "30–60 минут силовых тренировок в неделю", en: "30–60 minutes of strength training per week"}
  grade: A
  measure: mortality
  plain:
    ru: "Люди, которые тренируются с силой 30–60 минут в неделю, имеют на 10–20% меньшую вероятность умереть за тот же период, чем те, кто не тренируется. Большее количество тренировок не даёт дополнительных преимуществ. Наилучший эффект достигается при совмещении силовых и аэробных упражнений."
    en: "People who engage in 30–60 minutes of strength training each week have a 10–20% lower risk of dying during that period compared to those who don’t train at all. Training beyond this amount won’t bring any extra benefit. Combining strength training with aerobic exercise yields the best results."
  benefit:
    ru: "При анализе нескольких проспективных исследований (без разделения участников на группы) выяснилось, что у людей, регулярно занимающихся силовыми тренировками, риск смерти ниже на 10–17% по сравнению с теми, кто не тренируется. Оптимальная продолжительность тренировок — около 30–60 минут в неделю; при большем объёме польза не возрастает, а снижается примерно на 10–20%. Люди, совмещающие силовые и аэробные упражнения, имеют ещё меньший риск смерти, чем те, кто не занимается ничем."
    en: "When multiple observational studies are pooled together (without subgroup analysis), individuals who perform strength training show a 10%–17% reduction in mortality risk relative to non‑trainers. This benefit peaks at roughly 30–60 minutes of weekly training, delivering a 10%–20% risk drop; more training does not further improve outcomes. Those who also do aerobic exercise enjoy an even lower mortality risk than those who do neither type of exercise."
  sources:
    - {citation: "Momma H et al. (2022). Muscle-strengthening activities are associated with lower risk and mortality in major non-communicable diseases: a systematic review and meta-analysis of cohort studies. British Journal of Sports Medicine", url: "https://doi.org/10.1136/bjsports-2021-105061"}
  doi: "10.1136/bjsports-2021-105061"

- id: ch02_i17
  chapter: 2
  item: 17
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Не сидите подряд слишком долго — время от времени вставайте и двигайтесь", en: "Don’t sit for too long at a time — get up and move every now and then"}
  grade: A
  measure: mortality
  plain:
    ru: "У людей, которые сидят дольше всего, вероятность умереть за тот же период в 2,6 раза выше, чем у тех, кто сидит меньше. Длительное непрерывное сидение само по себе добавляет риск. Однако если ежедневно выполнять 60–75 минут физических упражнений средней интенсивности, дополнительный риск от долгого сидения практически исчезает."
    en: "People who sit the longest have a 2.6 times higher chance of dying during the same period compared to those who sit the least. Sitting continuously for long stretches adds extra risk on top of that. However, if you get 60–75 minutes of moderate-intensity activity each day, this extra risk from prolonged sitting is largely offset."
  benefit:
    ru: "В США проводилось длительное исследование, в котором участников не разделяли на группы, а просто фиксировали данные с помощью акселерометров. Людей разделили на четыре категории по общей продолжительности ежедневного сидения. В группе с самым длительным сидением риск смерти оказался в 2,63 раза выше, чем в группе с минимальным сидением (отношение рисков — 2,63). При разделении по длительности одного непрерывного периода сидения получилось, что в группе с самым длительным сидением риск выше в 1,96 раза по сравнению с группой с минимальным сидением (отношение рисков — 1,96). Это показывает, что как общая продолжительность сидения, так и длительность одного периода сидения влияют на риск отдельно друг от друга. В другом метаанализе, объединившем данные исследований с участием более миллиона человек, также не проводилось разделение на группы. У людей, которые сидят более 8 часов в день и почти не занимаются физической активностью, риск смерти выше в 1,59 раза по сравнению с теми, кто сидит менее 4 часов в день и ведёт наиболее активный образ жизни. При ежедневной физической активности в 60–75 минут средней интенсивности дополнительный риск от долгого сидения практически нивелируется. У самой активной группы, даже если они сидят более 8 часов в день, отношение рисков составляет всего 1,04, статистически значимой разницы не наблюдается."
    en: "One U.S. observational study used accelerometers to measure activity levels without grouping participants. It divided people into four groups based on their total daily sitting time. Those in the group with the most daily sitting time had a 2.63 times higher risk of death than those in the group with the least (HR 2.63). The study also split participants into four groups based on the longest continuous sitting period; those in the group with the longest continuous sitting time had a 1.96 times higher risk than those in the group with the shortest continuous sitting time (HR 1.96). This shows that both total daily sitting time and the length of each continuous sitting period are independently linked to mortality risk. Another meta-analysis of millions of participants also used observational data without grouping. It found that people who sat for over 8 hours a day and did little to no exercise had a 1.59 times higher risk of death compared to those who sat for less than 4 hours a day and were the most active. For the most active group, even if they sat for over 8 hours a day, their risk ratio was only 1.04 — no statistically significant difference was observed."
  numbers:
    - {kind: HR, value: 2.63}
    - {kind: HR, value: 1.96}
    - {kind: HR, value: 1.59}
  sources:
    - {citation: "Diaz KM et al. (2017). Patterns of Sedentary Behavior and Mortality in U.S. Middle-Aged and Older Adults: A National Cohort Study. Annals of Internal Medicine", url: "https://doi.org/10.7326/M17-0212"}
    - {citation: "Ekelund U et al. (2016). Does physical activity attenuate, or even eliminate, the detrimental association of sitting time with mortality? A harmonised meta-analysis of data from more than 1 million men and women. Lancet", url: "https://doi.org/10.1016/S0140-6736(16)30370-1"}
  doi: "10.7326/M17-0212"

- id: ch02_i19
  chapter: 2
  item: 19
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Пейте как можно меньше или вообще не пейте", en: "Drink less or no alcohol"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "После того как человек выпивает более 100 г чистого спирта в неделю, чем больше он пьёт, тем раньше умирает. 100 г чистого спирта — это примерно 2,5 л пива. Люди в возрасте 40 лет, выпивающие 100–200 г спирта в неделю, живут примерно на полгода меньше; при потреблении 200–350 г — на 1–2 года меньше; при превышении 350 г — на 4–5 лет меньше. С точки зрения общего здоровья, самый выгодный вариант — вообще не пить."
    en: "After consuming 100 g of pure alcohol per week, the more one drinks, the earlier they tend to die. 100 g of pure alcohol is roughly equivalent to 2.5 L of beer. At age 40, people who drink 100–200 g per week lose about half a year of life expectancy; those drinking 200–350 g lose 1–2 years; and those drinking over 350 g lose 4–5 years. Overall, the healthiest amount to consume is none at all."
  benefit:
    ru: "В результате анализа 83 исследований с последующим наблюдением за 600 000 человек, не разделявшихся на группы, минимальный риск смертности наблюдался при потреблении не более 100 г чистого спирта в неделю. Эта доза соответствует примерно 2,5 л пива с содержанием алкоголя 5% или 300 мл 40-градусной водки. У людей в возрасте 40 лет, выпивающих 100–200 г спирта в неделю, ожидаемая продолжительность жизни сокращается примерно на 6 месяцев; при потреблении 200–350 г — на 1–2 года; при превышении 350 г — на 4–5 лет. Согласно данным Глобального исследования бремени болезней GBD 2016, самое безопасное количество алкоголя — это 0 порций в неделю. В другом исследовании, скорректированном на системные погрешности, риск смертности у людей, выпивающих ежедневно от 1,3 до 24 г спирта, оказался на 7% ниже (отношение рисков 0,93) по сравнению с теми, кто вообще не пьёт; однако статистически значимой разницы в этом исследовании не выявлено. При ежедневном потреблении от 45 до 64 г спирта риск смертности возрастает на 19% (отношение рисков 1,19), а при более 65 г — на 35% (отношение рисков 1,35)."
    en: "A combined analysis of 83 longitudinal studies involving 600,000 drinkers showed that the lowest mortality risk occurs at consumption levels of no more than 100 g of pure alcohol per week — roughly 2.5 L of beer at 5% alcohol content, or 300 mL of 40% alcohol spirits. At age 40, drinking 100–200 g per week shortens life expectancy by about 6 months; 200–350 g shortens it by 1–2 years; and over 350 g shortens it by 4–5 years. The Global Burden of Disease Study 2016 also concluded that zero alcohol consumption per week carries the lowest overall health risk. One adjusted analysis found that daily consumption of 1.3–24 g of alcohol was linked to a 7% lower mortality risk (RR 0.93) compared to lifelong abstainers, though this difference was not statistically significant. Daily consumption of 45–64 g raised risk by 19% (RR 1.19), and 65 g or more raised it by 35% (RR 1.35)."
  numbers:
    - {kind: RR, value: 0.93}
    - {kind: RR, value: 1.19}
    - {kind: RR, value: 1.35}
  sources:
    - {citation: "Wood AM et al. (2018). Risk thresholds for alcohol consumption: combined analysis of individual-participant data for 599 912 current drinkers in 83 prospective studies. Lancet", url: "https://doi.org/10.1016/S0140-6736(18)30134-X"}
    - {citation: "GBD 2016 Alcohol Collaborators (2018). Alcohol use and burden for 195 countries and territories, 1990–2016: a systematic analysis for the Global Burden of Disease Study 2016. Lancet", url: "https://doi.org/10.1016/S0140-6736(18)31310-2"}
    - {citation: "Zhao J et al. (2023). Association Between Daily Alcohol Intake and Risk of All-Cause Mortality: A Systematic Review and Meta-analyses. JAMA Network Open", url: "https://doi.org/10.1001/jamanetworkopen.2023.6185"}
  doi: "10.1016/S0140-6736(18)30134-X"

- id: ch02_i21
  chapter: 2
  item: 21
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Хотите пить меньше? Сначала посчитайте, сколько выпили за неделю, а потом поговорите с врачом несколько минут", en: "To drink less, first tally how much you drink each week, then chat briefly with a doctor"}
  grade: A
  measure: mortality
  plain:
    ru: "Врач за несколько минут оценит ваш уровень потребления алкоголя, объяснит связанные риски и поможет установить цель. В среднем через год вы будете выпивать на 20 граммов чистого спирта меньше в неделю — это примерно пол-литра пива. Более длительные беседы не приносят дополнительной пользы. Для тех, кто уже не может остановиться, в зарубежных странах существуют два препарата, доказавших свою эффективность: примерно у одного из 12 пациентов они помогают полностью отказаться от чрезмерного употребления алкоголя."
    en: "A doctor can spend a few minutes reviewing your weekly alcohol intake, explaining the associated risks, and helping you set a realistic goal. After a year, people following this approach typically cut their weekly consumption by about 20 grams of pure alcohol — roughly equivalent to half a liter of beer. Longer consultations do not bring any additional benefits. For those already struggling with heavy drinking, two medications have been proven effective abroad: for every 12 patients treated, roughly one person stops drinking excessively after treatment."
  benefit:
    ru: "В результате анализа 34 рандомизированных исследований с участием 15 197 человек выяснилось, что люди, получившие краткосрочную консультацию, через год выпивали на 20 граммов чистого спирта меньше в неделю по сравнению с теми, кто получал минимальное вмешательство или не получал его вовсе (95 % доверительный интервал — от 12 до 28 граммов; качество доказательств — среднее). В этих исследованиях средний исходный уровень потребления алкоголя составлял 244 грамма в неделю. Под «краткосрочной консультацией» подразумеваются не более 5 встреч общей продолжительностью менее 60 минут; более длительные беседы не дают дополнительных преимуществ. Что касается медикаментов: по данным 122 рандомизированных исследований с участием 22 803 человек, акампросат позволяет каждому двенадцатому пациенту (95 % доверительный интервал — от 8 до 26) полностью отказаться от любого употребления алкоголя; пероральный налтрексон в дозе 50 мг в день даёт аналогичный эффект — ещё один человек из 12 (диапазон 8–26) перестаёт злоупотреблять алкоголем."
    en: "Data from 34 randomized trials involving 15,197 participants show that individuals receiving brief interventions ended up drinking 20 grams less pure alcohol per week than those receiving minimal or no intervention (95% confidence interval: 12–28 grams; evidence of moderate quality). The average baseline consumption among these participants was 244 grams per week. “Brief interventions” here refer to no more than five counseling sessions totaling under 60 minutes; longer sessions provide no extra advantage. Regarding medications: 122 trials with 22,803 participants indicate that acamprosate helps one additional person per 12 treated to abstain from any drinking (95% CI: 8–26). Oral naltrexone at 50 mg daily also yields similar results — one extra abstainer per 12 patients (95% CI: 8–26)."
  sources:
    - {citation: "Kaner EF, Beyer FR, Muirhead C, et al. (2018). Effectiveness of brief alcohol interventions in primary care populations. Cochrane Database of Systematic Reviews, 2, CD004148", url: "https://doi.org/10.1002/14651858.CD004148.pub4"}
    - {citation: "Jonas DE, Amick HR, Feltner C, et al. (2014). Pharmacotherapy for adults with alcohol use disorders in outpatient settings: a systematic review and meta-analysis. JAMA, 311(18), 1889–1900", url: "https://doi.org/10.1001/jama.2014.3628"}
  doi: "10.1002/14651858.CD004148.pub4"

- id: ch02_i30
  chapter: 2
  item: 30
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Дайте горячему напитку остыть, прежде чем пить — не пейте слишком горячий чай, суп или кофе", en: "Let hot drinks cool down before drinking; avoid tea, soup, and coffee that are piping hot"}
  grade: A
  measure: mortality
  plain:
    ru: "Вероятность развития рака пищевода при употреблении очень горячего чая в 8 раз выше, чем при питье тёплого чая; даже при употреблении «горячего» напитка этот риск выше в 2 раза. Если выпить чай менее чем через 2 минуты после заваривания, риск возрастает в 5 раз по сравнению с теми, кто выжидает более 4 минут."
    en: "Drinking tea that is extremely hot raises your risk of esophageal cancer by 8 times compared to drinking lukewarm tea. Even “hot” tea doubles that risk. If you drink tea less than two minutes after pouring it, your risk is 5 times higher than if you wait at least four minutes to drink it."
  benefit:
    ru: "В северных районах Ирана, где рак пищевода встречается особенно часто, провели сравнение 300 пациентов с этим заболеванием и 571 здорового человека. Все показатели сравнивались с теми, кто пил тёплый чай. У людей, употреблявших «горячий» чай, вероятность развития плоскоклеточного рака пищевода оказалась примерно в 2,07 раза выше (отношение шансов — 2,07; 95% доверительный интервал: 1,28–3,35). У тех, кто пил «очень горячий» чай, этот показатель вырос до 8,16 раз (диапазон: 3,93–16,9). А у людей, выпивавших чай менее чем через 2 минуты после заваривания, риск был в 5,41 раза выше, чем у тех, кто выжидал более 4 минут (диапазон: 2,63–11,1)."
    en: "In a high-risk area for esophageal cancer in northern Iran, researchers compared 300 patients with esophageal cancer to 571 healthy individuals. All results below are compared to people who drank lukewarm tea. Those who drank “hot” tea had roughly 2.07 times the risk of developing squamous cell carcinoma of the esophagus (95% CI: 1.28–3.35). For those who drank “extremely hot” tea, the risk was about 8.16 times higher (95% CI: 3.93–16.9). People who drank tea less than two minutes after pouring it had 5.41 times the risk of those who waited at least four minutes to drink it (95% CI: 2.63–11.1)."
  sources:
    - {citation: "Islami F, Pourshams A, Nasrollahzadeh D, et al. (2009). Tea drinking habits and oesophageal cancer in a high risk area in northern Iran: population based case-control study. BMJ, 338, b929", url: "https://doi.org/10.1136/bmj.b929"}
    - {citation: "Loomis D, Guyton KZ, Grosse Y, et al. (2016). Carcinogenicity of drinking coffee, mate, and very hot beverages. Lancet Oncology, 17(7), 877-878", url: "https://doi.org/10.1016/S1470-2045(16)30239-X"}
    - {citation: "Yu C, Tang H, Guo Y, et al. (2018). Hot tea consumption and its interactions with alcohol and tobacco use on the risk for esophageal cancer: a population-based cohort study. Annals of Internal Medicine, 168(7), 489-497", url: "https://doi.org/10.7326/M17-2000"}
  doi: "10.1136/bmj.b929"

- id: ch02_i32
  chapter: 2
  item: 32
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Поддерживайте ИМТ в пределах 20–25: при избыточном весе нужно худеть", en: "Keeping BMI between 20–25; losing weight if overweight"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "Вероятность смертности минимальна при ИМТ в диапазоне 20–25. При ИМТ 27,5–30 она возрастает примерно на 20%, при 30–35 — на 45%, при 35–40 — почти в два раза. Для жителей Восточной Азии избыточный вес опаснее: каждое увеличение ИМТ на 5 повышает риск примерно на 39%."
    en: "Mortality is lowest when BMI falls within 20–25. At BMI 27.5–30, risk rises by roughly 20%; at 30–35, it increases by about 45%; at 35–40, it nearly doubles. East Asian individuals are especially sensitive to excess weight — for every 5-point rise in BMI, risk climbs by roughly 40%."
  benefit:
    ru: "В анализе, охватившем данные 239 исследований (без разделения на группы), участвовали только люди, никогда не курившие, не имевшие хронических заболеваний на момент вступления в исследование и прожившие после этого более 5 лет. Результаты показали, что риск смертности минимален при ИМТ 20–25. При ИМТ 25–27,5 он выше на 7% (отношение рисков — 1,07), при 27,5–30 — на 20% (1,20), при 30–35 — на 45% (1,45), при 35–40 — на 94% (1,94), а при 40–60 — в 2,76 раза (1,76). Для жителей Восточной Азии каждое увеличение ИМТ на 5 единиц повышает риск на 39% (1,39)."
    en: "This analysis combined individual data from 239 longitudinal studies (no subgrouping was performed). Only three groups remained in the final dataset: non-smokers, individuals without chronic illnesses at enrollment, and those who survived at least five years after enrollment. Results showed that mortality risk was lowest at BMI 20–25. Between 25–27.5, risk rose by about 7% (HR 1.07); at 27.5–30, it climbed by 20% (HR 1.20); at 30–35, by 45% (HR 1.45); at 35–40, by 94% (HR 1.94); and at 40–60, it was 2.76 times higher (HR 2.76). For East Asian populations, each additional 5 kg/m² of BMI above 25 raised mortality risk by roughly 39% (HR 1.39)."
  numbers:
    - {kind: HR, value: 1.07}
    - {kind: HR, value: 1.2}
    - {kind: HR, value: 1.45}
    - {kind: HR, value: 1.94}
    - {kind: HR, value: 2.76}
    - {kind: HR, value: 1.39}
  sources:
    - {citation: "Global BMI Mortality Collaboration (2016). Body-mass index and all-cause mortality: individual-participant-data meta-analysis of 239 prospective studies in four continents. Lancet", url: "https://doi.org/10.1016/S0140-6736(16)30175-1"}
  doi: "10.1016/S0140-6736(16)30175-1"

- id: ch02_i39
  chapter: 2
  item: 39
  chapter_title: {ru: "Как не умереть медленно", en: "Avoid a slow death"}
  title: {ru: "Чем дольше человек работает в ночную смену, тем выше риск сердечно-сосудистых заболеваний; при возможности стоит сменить работу", en: "The longer you work night shifts, the higher your cardiovascular risk — switch if you can"}
  grade: A
  measure: mortality
  plain:
    ru: "У людей, работающих в ночную смену, сердечно-сосудистых заболеваний примерно на 13% больше, а смертности от них — на 27%. Причем чем дольше человек трудится в ночную смену, тем выше этот риск: каждые дополнительные 5 лет такой работы повышают вероятность сердечно-сосудистых заболеваний примерно на 7%. Поэтому, если есть возможность, стоит сменить работу как можно раньше. Что касается связи ночных смен с раком, то доказательная база здесь значительно слабее, чем утверждают популярные мифы."
    en: "People who work night shifts develop cardiovascular disease about 13% more often than those who don’t, and cardiovascular deaths rise by roughly 27%. The longer you work nights, the worse it gets: for every additional five night shifts, cardiovascular disease risk climbs another 7%. So, when you weigh the long-term costs, it makes sense to switch shifts early on. As for cancer risk, the evidence linking night shifts to cancer is far weaker than commonly believed."
  benefit:
    ru: "Анализ 23 исследований показал, что у людей, работающих в ночную смену, риск развития сердечно-сосудистых заболеваний выше примерно на 13% (отношение рисков RR 1,13; 95% доверительный интервал 1,10–1,16). Смертность от таких заболеваний выше примерно на 27% (RR 1,27; 1,18–1,36). В пересчете на годы работы в ночную смену каждые дополнительные 5 лет повышают риск сердечно-сосудистых заболеваний примерно на 7% (RR 1,07; 1,04–1,09) и риск смерти от них — примерно на 5% (RR 1,05; 1,03–1,06). Среди конкретных заболеваний риск ишемической болезни сердца выше примерно на 22% (RR 1,22; 1,16–1,28), смертность от нее — также примерно на 22% (RR 1,22; 1,10–1,36). Риск смерти от ишемической болезни сердца выше примерно на 39% (RR 1,39; 1,06–1,84), а от инсульта — примерно на 49% (RR 1,49; 1,04–2,12). При этом статистически значимого повышения общего риска инсульта не наблюдается (RR 1,06; 0,95–1,18)."
    en: "A pooled analysis of 23 studies — all observational, no subgroup adjustments — shows that night-shift workers face a roughly 13% higher risk of cardiovascular events (RR 1.13, 95% CI 1.10–1.16). Cardiovascular deaths rise by about 27% (RR 1.27, 1.18–1.36). Over time, each extra five night shifts adds roughly 7% to cardiovascular disease risk (RR 1.07, 1.04–1.09) and about 5% to cardiovascular mortality (RR 1.05, 1.03–1.06). Specific conditions show similar trends: coronary heart disease incidence rises by 22% (RR 1.22, 1.16–1.28) and mortality by the same amount; ischemic heart disease deaths increase by 39% (RR 1.39, 1.06–1.84); stroke mortality climbs by 49% (RR 1.49, 1.04–2.12). Stroke incidence, however, shows no significant rise (RR 1.06, 0.95–1.18)."
  numbers:
    - {kind: RR, value: 1.13, ci_low: 1.1, ci_high: 1.16}
    - {kind: RR, value: 1.27}
    - {kind: RR, value: 1.07}
    - {kind: RR, value: 1.05}
  sources:
    - {citation: "Xi J, Ma W, Tao Y, et al. (2025). Association between night shift work and cardiovascular disease: a systematic review and dose-response meta-analysis. Frontiers in Public Health", url: "https://doi.org/10.3389/fpubh.2025.1668848"}
    - {citation: "Esposito G, Bravi F, Santucci C, et al. (2025). Night shift work and breast cancer risk in healthcare workers: a systematic review and meta-analysis. Occupational Medicine", url: "https://doi.org/10.1093/occmed/kqaf040"}
    - {citation: "Shen QM, Li ZY, Tan YT, et al. (2026). Night shift work and risk of total and site-specific cancer: results from a prospective cohort study among Chinese men. Scandinavian Journal of Work, Environment & Health", url: "https://doi.org/10.5271/sjweh.4290"}
    - {citation: "Czeisler CA, Johnson MP, Duffy JF, et al. (1990). Exposure to bright light and darkness to treat physiologic maladaptation to night work. New England Journal of Medicine, 322(18), 1253-1259", url: "https://doi.org/10.1056/NEJM199005033221801"}
    - {citation: "Eastman CI, Stewart KT, Mahoney MP, Liu L, Fogg LF (1994). Dark goggles and bright light improve circadian rhythm adaptation to night-shift work. Sleep, 17(6), 535-543：「Both bright light and goggles were significant factors for producing circadian rhythm phase shifts. The combination of bright light plus goggles was the most effective」「Goggles were necessary for producing phase delays」", url: "https://doi.org/10.1093/sleep/17.6.535"}
    - {citation: "Crowley SJ, Lee C, Tseng CY, Fogg LF, Eastman CI (2003). Combinations of bright light, scheduled dark, sunglasses, and melatonin to facilitate circadian entrainment to night shift work. Journal of Biological Rhythms, 18(6), 513-523：「With bright light during the night shift, almost all of the earlier participants achieved complete re-entrainment, and the phase delay shift was so large that darker sunglasses and melatonin could not increase its magnitude」", url: "https://doi.org/10.1177/0748730403258422"}
  doi: "10.3389/fpubh.2025.1668848"

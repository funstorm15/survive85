- id: ch28_i1
  chapter: 28
  item: 1
  chapter_title: {ru: "Не ломайте здоровье ради внешности", en: "Don't harm your body just to change its appearance"}
  title: {ru: "Не стоит прибегать к экстремальным диетам, голоданию или вызыванию рвоты для контроля веса — если хотите похудеть, делайте это с помощью физических упражнений", en: "Do not use extreme dieting, fasting, or making yourself vomit to control weight. If you want to lose weight, lose it on the exercise side"}
  grade: A
  measure: mortality
  plain:
    ru: "У людей с нервной анорексией вероятность умереть примерно в 5.9 раза больше, чем у ровесников. Если 1000 человек проследить один год, умирает 5.1, и примерно каждый пятый из умерших покончил с собой. У тех, кто сидит на диете, расстройство пищевого поведения возникает легче: учеников 44 средних школ проследили три года, и у девочек на жёсткой диете болезнь возникала в 18 раз чаще, чем у тех, кто еду не ограничивал. Хотите держать вес — больше двигайтесь и не доводите себя голодом."
    en: "People with anorexia nervosa (the illness of starving yourself past the point of health) are about 5.9 times as likely to die as people the same age. Follow 1000 of them for 1 year and 5.1 die, and about 1 in 5 of those deaths are suicide. People who diet are more likely to get an eating disorder. Students at 44 secondary schools were followed for 3 years, and girls who dieted severely were 18 times as likely to get ill as girls who did not diet. If you want to control your weight, exercise more. Do not eat so little that you are hungry."
  benefit:
    ru: "36 исследований посчитали вместе. У людей с нервной анорексией суммарное время наблюдения — 166642 человеко-лет (годы наблюдения каждого человека, сложенные вместе). Их стандартизированное отношение смертности равно 5.86, то есть вероятность умереть примерно в 5.9 раза больше, чем у ровесников. На 1000 человеко-лет приходится 5.1 смерти: 1000 человек за один год — это 5.1 умерших. Среди умерших около 1/5 умерли от самоубийства. У нервной булимии стандартизированное отношение смертности 1.93, у других расстройств пищевого поведения 1.92, то есть каждое примерно в 1.9 раза больше, чем у ровесников. Другое исследование шло в 44 средних школах штата Виктория в Австралии: учеников 14–15 лет проследили 3 года, одну и ту же группу проверяли 6 раз. Новые случаи у девочек — 21.8 на 1000 человеко-лет, то есть на 1000 девочек за год приходится 21.8 новых случаев. У девочек на жёсткой диете риск заболеть в 18 раз выше, чем у тех, кто не ограничивал еду, у умеренно ограничивавших — в 5 раз. Затем вычли влияние того, что человек и раньше сидел на диете, и того, что психические симптомы уже были. После этого ни ИМТ (индекс массы тела: вес, делённый на квадрат роста), ни объём движения, ни пол больше не предсказывали новое расстройство. Вывод авторов: у подростков контроль веса движением, а не ограничением еды, по-видимому, связан с более низким риском расстройства пищевого поведения"
    en: "36 studies taken together. The people with anorexia nervosa had been followed for 166642 person-years in all (the years each person was followed, added up). Their standardized mortality ratio was 5.86, that is, the chance of death is about 5.9 times that of people the same age. There were 5.1 deaths per 1000 person-years, which means 5.1 deaths if 1000 people are followed for 1 year. About 1/5 of the people who died died by suicide. The standardized mortality ratio for bulimia was 1.93, and for other eating disorders it was 1.92, about 1.9 times people the same age in each case. Another study, in 44 secondary schools in Victoria, Australia, followed students aged 14 to 15 for 3 years, and the same students were checked across 6 rounds. New eating disorders in girls were 21.8 per 1000 person-years, that is, 21.8 new cases if 1000 girls are followed for 1 year. Girls who dieted severely had 18 times the risk of girls who did not diet. Girls who dieted moderately had 5 times the risk. After a further adjustment for past dieting and psychiatric symptoms, taking out the effect of having dieted before and of already having psychiatric symptoms, BMI (body mass index, weight divided by height squared), amount of exercise, and sex no longer predicted a new eating disorder. The authors' conclusion was that \"among adolescents, controlling weight with exercise rather than restricting food seems to carry a lower risk of an eating disorder.\""
  sources:
    - {citation: "Arcelus J et al. (2011). Mortality rates in patients with anorexia nervosa and other eating disorders. A meta-analysis of 36 studies. Arch Gen Psychiatry", url: "https://doi.org/10.1001/archgenpsychiatry.2011.74"}
    - {citation: "Patton GC et al. (1999). Onset of adolescent eating disorders: population based cohort study over 3 years. BMJ", url: "https://doi.org/10.1136/bmj.318.7186.765"}
  doi: "10.1001/archgenpsychiatry.2011.74"

- id: ch28_i4
  chapter: 28
  item: 4
  chapter_title: {ru: "Не ломайте здоровье ради внешности", en: "Don't harm your body just to change its appearance"}
  title: {ru: "Таблетки для похудения, «жиросжигающий» кофе, конфеты для стройности и «энзимные» сливы (сливы, якобы вымоченные в энзимах) с обещанием «быстро похудеть» — не покупать", en: "Do not buy weight-loss pills, weight-loss coffee, slimming candies, or enzyme plums (plums claimed to have been soaked in enzymes) that promise you will get thin fast"}
  grade: A
  measure: mortality
  plain:
    ru: "В таких продуктах часто находят тайно добавленный сибутрамин: раньше это было лекарство для похудения, в 2010 году в Китае его сняли. У людей старше 55 лет с лишним весом и болезнью сердца или диабетом, которые принимали его больше трёх лет, несмертельный инфаркт случался примерно на треть чаще, а инсульт — примерно на тридцать шесть процентов чаще. Веса при этом ушло всего на 1.7 килограмма больше. Когда это находит выборочная проверка, вы уже всё съели."
    en: "These products are often found with a diet drug (sibutramine) added in secret. It used to be a weight-loss drug, and China stopped it in 2010. Overweight people aged 55 or older, who had heart disease or diabetes, took it for more than 3 years. Non-fatal heart attacks were about 30% higher, and strokes were about 36% higher. The weight lost was only 1.7 kg more. By the time a spot check finds it, you have already swallowed it."
  benefit:
    ru: "В испытание SCOUT набрали 9804 человека. Всем было больше 55 лет, у всех был лишний вес или ожирение и при этом сердечно-сосудистая болезнь или диабет 2 типа. Их по жребию разделили на тех, кто принимает препарат, и тех, кто не принимает; лечение в среднем длилось 3.4 года. Главная конечная точка — несколько бед, которые договорились считать заранее: несмертельный инфаркт, несмертельный инсульт, успешная реанимация после остановки сердца, сердечно-сосудистая смерть. Частота этих событий 11.4% против 10.0%. HR 1.16 (95% CI 1.03–1.31, P=0.02): у принимавших вероятность беды выше примерно на 16%. Истинное значение примерно лежит между «выше на 3%» и «выше на 31%». Несмертельный инфаркт 4.1% против 3.2%, HR 1.28 (1.04–1.57), выше примерно на 30%. Несмертельный инсульт 2.6% против 1.9%, HR 1.36 (1.04–1.77), выше примерно на 36%. Сердечно-сосудистая смерть и смерть от всех причин не выросли; «от всех причин» — это все причины, сложенные вместе. После распределения по жребию группа сибутрамина в среднем сбросила на 1.7 кг больше. Бывшее Государственное управление по контролю пищевых продуктов и лекарственных средств по оценке безопасности решило, что «риск лечения ради похудения больше пользы», и в октябре 2010 года уведомлением остановило производство, продажу и применение препаратов сибутрамина и его фармацевтической субстанции. И сибутрамин, и фенолфталеин запрещено добавлять в пищевые продукты, «оздоровительные» продукты тоже входят сюда"
    en: "The SCOUT trial enrolled 9804 people. All were 55 or older, overweight or obese, and had cardiovascular disease or type 2 diabetes. They drew lots and were split into a group that took the drug and a group that did not. Treatment lasted 3.4 years on average. The main endpoint was a set of bad events chosen in advance: non-fatal heart attack, non-fatal stroke, coming back after cardiac arrest, and cardiovascular death. The rate of these events was 11.4% vs 10.0%. HR 1.16 (95% CI 1.03-1.31, P=0.02). The chance of an event was about 16% higher for the people who took the drug. The true value roughly sits between 3% higher and 31% higher. Non-fatal heart attack was 4.1% vs 3.2%, HR 1.28 (1.04-1.57), about 30% higher. Non-fatal stroke was 2.6% vs 1.9%, HR 1.36 (1.04-1.77), about 36% higher. Cardiovascular death and all-cause death did not increase. All-cause means every cause added together. After the draw, the sibutramine group lost 1.7 kg more on average. The former State Food and Drug Administration, on the basis of a safety assessment, held that \"the risks of weight-loss treatment outweigh the benefits,\" and in October (10) 2010 it notified a stop to the production, sale, and use of sibutramine preparations and the raw drug. Both sibutramine and phenolphthalein (a laxative chemical) are prohibited as additives in food, and health food counts as food."
  numbers:
    - {kind: HR, value: 1.16, ci_low: 1.03, ci_high: 1.31}
    - {kind: HR, value: 1.28}
    - {kind: HR, value: 1.36}
  sources:
    - {citation: "James WPT et al. (2010). Effect of sibutramine on cardiovascular outcomes in overweight and obese subjects. NEJM", url: "https://doi.org/10.1056/NEJMoa1003114"}
    - {citation: "天津市市场监督管理委员会. 警惕部分食品中违法添加「盐酸西布曲明」和「酚酞」", url: "https://scjg.tj.gov.cn/tjsscjdglwyh_52651/hdpt/cjwtyxfts/202007/t20200720_2972549.html"}
  doi: "10.1056/NEJMoa1003114"

- id: ch28_i5
  chapter: 28
  item: 5
  chapter_title: {ru: "Не ломайте здоровье ради внешности", en: "Don't harm your body just to change its appearance"}
  title: {ru: "Анаболические стероиды («уколы для массы», «таблетки») — не средство нарастить мышцы", en: "Do not use anabolic steroids (“muscle‑building injections” or “oral pills”) to build muscle"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "У мужчин с положительным тестом на допинг в спортзале риск смерти в 3 раза выше, чем у ровесников, а в больницу за год они ходят больше чем вдвое чаще. И прыщи, и рост груди у мужчин, и проблемы с эрекцией достаются как минимум одному из каждых десяти, кто принимает такие препараты. В Китае это рецептурные лекарства: канал, который продаёт их без рецепта, уже сам нарушает закон."
    en: "Men who test positive on a gym doping check have 3 times the risk of death of people the same age, and they go to the hospital more than twice as often each year. Acne, male breast growth, and trouble getting an erection each hit at least 1 in 10 of the people who use these drugs. In China these drugs are prescription drugs, and a channel that sells them to you without a prescription is itself breaking the law."
  benefit:
    ru: "Датская ретроспективная подобранная выборка (545 мужчин с положительным тестом на андрогенные анаболические стероиды в фитнес-клубах с 2006-01-03 по 2018-03-01, к ним подобрано 5450 контролей; дополнительно для повторной проверки взяты 644 отказавшихся от теста и 6440 контролей): смертность пользователей в 3 раза выше, чем у контролей, HR 3.0 (95% CI 1.3–7.0); медиана числа госпитализаций/обращений в год 0.81 против 0.36 (P<0.0001); акне, гинекомастия и эректильная дисфункция затрагивают более 10% пользователей, все три показателя значительно выше, чем в контроле (P<0.0001); результаты повторной проверки совпадают. «Положение о борьбе с допингом» (反兴奋剂条例), статья 7: государство строго контролирует запрещённые вещества, включённые в допинговый список, любые лица и организации не вправе незаконно производить, продавать, импортировать и экспортировать их; тем же Положением анаболические препараты и пептидные гормоны отнесены к рецептурным лекарствам"
    en: "The Danish researchers matched each steroid user with a control of the same age. The original cohort comprised 545 men whose androgenic steroid tests were positive between 2006‑01‑03 and 2018‑03‑01; they were paired with 5450 controls. An additional validation used 644 refusers and 6440 controls. Results showed a three‑fold increase in mortality among users (HR = 3.0; 95 % CI 1.3–7.0). The true multiple sits roughly between 1.3 and 7. The median yearly number of hospital visits was 0.81 versus 0.36 (P < 0.0001). Median means that half of the users had more visits and half fewer; such a low P‑value indicates this difference is highly unlikely to be random. Acne, gynecomastia, and erectile dysfunction each affected over 10 % of users – at least one in ten – a rate far above that of controls (P < 0.0001). The validation cohort yielded the same findings. Article 7 of China’s Anti‑Doping Regulations states that all substances on the prohibited list are strictly controlled; no entity may produce, sell, import, or export them illegally. The same regulation designates anabolic agents and peptide hormones as prescription drugs, meaning they may be obtained only with a doctor’s prescription; “anabolic agents” is the official term used in legislation."
  numbers:
    - {kind: HR, value: 3, ci_low: 1.3, ci_high: 7}
  sources:
    - {citation: "Horwitz H et al. (2019). Health consequences of androgenic anabolic steroid use. J Intern Med", url: "https://doi.org/10.1111/joim.12850"}
    - {citation: "国务院 (2004). 反兴奋剂条例（国务院令第 398 号，第七条、第九条）", url: "http://www.gov.cn/gongbao/content/2004/content_63129.htm"}
  doi: "10.1111/joim.12850"

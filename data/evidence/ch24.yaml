  chapter_title: {ru: "Как сэкономить деньги и избежать лишних хлопот при обращении за медпомощью", en: "Seeking medical care: How to save money and avoid unnecessary hassle"}
  title: {ru: "При тяжёлой травме или болезни идите сразу к стойке сортировки неотложки, не стойте в очереди у окна регистрации", en: "For a severe injury or illness, go straight to the emergency triage desk, and do not queue at the registration window"}
  grade: A
  measure: time
  plain:
    ru: "Неотложка сортирует не по очереди прихода, а по тяжести, ступенями. Ступень ставят у стойки сортировки на входе в неотложку, а не у окна регистрации. Сразу назовите самое опасное: сильное кровотечение, нехватка воздуха, спутанное сознание, боль в груди как при болезни сердца, боль, которую невозможно терпеть."
    en: "The emergency department does not go by who arrived earlier. It sorts people into Level I through Level IV by how serious the condition is. The place that sets the level is the triage desk at the emergency entrance, not the registration window. When you arrive, report the most dangerous thing: heavy bleeding, not being able to get air, not being fully conscious, chest pain like a heart problem, or pain you cannot stand."
  benefit:
    ru: "В показателях контроля качества неотложной медицины Национального комитета здравоохранения за 2024 год сказано, что сортировка неотложки должна «делить пациентов на ступени по тяжести». Ступень I: «неотложно-критические пациенты, помощь нужна немедленно». Ступень II: «неотложно-тяжёлые, оценка и помощь часто идут одновременно». Ступень III: «неотложные, помощь нужна в короткий срок». Ступень IV: «не неотложные или подострые, их смотрят по очереди в обычной зоне». Сортировка — это когда при входе в неотложку отдельный человек оценивает тяжесть и задаёт порядок приёма. Пекинский стандарт исполнения задаёт сроки ответа по ступеням. Ступень 1: «сразу оценить и начать помощь, направить пациента в реанимацию или палату спасения». Ступень 2: «сразу следить за жизненными показателями, помощь в пределах 10 минут, направить в палату спасения». Ступень 3: «смотреть раньше пациентов ступени 4, ждать в обычной зоне; если ожидание больше 30 минут, оценить снова». Ступень 4: «приём по очереди, и если состояние не меняется, ждать приходится долго; если ожидание больше 4 часов, можно оценить снова». В пекинском стандарте среди показателей ручной оценки ступени 1 есть «острое нарушение сознания». У ступени 2 есть «продолжающаяся или тяжёлая кровопотеря», «тяжёлая одышка», «боль в груди, похожая на сердечную», «сильная боль любой причины (7–10 баллов)». Сортировка должна «держать принцип: сначала критические и тяжёлые». У входа в отделение неотложки на видном месте должна быть зона сортировки (ступени I–IV — общенациональный калибр, сроки ответа — пекинский стандарт)."
    en: "The National Health Commission's 2024 edition of the emergency-medicine quality-control indicators says emergency triage must \"sort patients into levels by how critical the condition is.\" \"Level I is a critical emergency and needs treatment at once.\" \"Level II is a severe emergency, and assessment and treatment often go on together.\" \"Level III is an urgent case and needs to be seen within a short time.\" \"Level IV is a non-urgent or less urgent case and is seen in order in the ordinary treatment area.\" Triage means that, on entering the emergency department, someone first rates how serious it is and sets the order of care. Beijing's implementation standard gives the response required at each level. Level 1: \"assess and treat at once, and move the patient into the resuscitation room or the rescue room.\" Level 2: \"monitor vital signs at once, start treatment within 10 minutes, and move the patient into the rescue room.\" Level 3: \"treat ahead of level 4 patients, and have the patient wait in the ordinary treatment area; if the wait is longer than 30 minutes, assess again.\" Level 4: \"seen in order, and the wait is long unless the condition changes; if the wait is longer than 4 hours, another assessment is allowed.\" In the Beijing standard, the manual rating indicators for level 1 include \"acute disturbance of consciousness.\" Those for level 2 include \"active or severe blood loss,\" \"severe difficulty breathing,\" \"chest pain that looks like a heart cause,\" and \"severe pain from any cause (7 to 10 points).\" Triage must \"keep to the rule that critical and severe cases are seen first,\" and the entrance of the emergency department should have a triage area in a prominent place (the level standard is the national rule, and the response times are the Beijing standard)."
  sources:
    - {citation: "国家卫生健康委办公厅 (2024). 关于印发急诊医学等 6 个专业医疗质量控制指标（2024 年版）的通知（国卫办医政函〔2024〕150 号）附件 1，指标四「急诊分级分诊执行率」", url: "https://www.gov.cn/zhengce/zhengceku/202405/content_6951260.htm"}
    - {citation: "北京市卫生健康委员会 (2019). 北京市加强急诊预检分诊分级工作方案及附件《北京市医院急诊预检分诊分级标准（试行）》：「坚持急危重症优先就诊原则。按照患者病情的严重程度，遵循从重到轻、从病情迅速变化到相对稳定的原则，合理安排患者就诊顺序。」「在急诊科入口的显著位置，设置急诊预检分诊区域」「院前医疗急救医生应按照相关标准对患者进行初步分级，对1、2级患者需及时通知所送医院急诊科做好接诊准备」", url: "http://wjw.beijing.gov.cn/zwgk_20040/ylws/201912/t20191216_1242338.html"}

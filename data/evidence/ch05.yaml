- id: ch05_i5
  chapter: 5
  item: 5
  chapter_title: {ru: "Не тратьте деньги впустую", en: "Do not waste money"}
  title: {ru: "Не покупать лотерейные билеты", en: "Not buying lottery tickets"}
  grade: A
  measure: money
  plain:
    ru: "Согласно правилам, минимальная доля выручки, выделяемая на призы в лотереях типа «лотто» и цифровых, составляет 50%, а в «Двойном шаре» — 51%. Это значит, что в среднем за долгий период каждый вложенный вами юань принесёт лишь 0,51 юаня, а 49% вы теряете. В 2024 году по всей стране было продано лотерейных билетов на 623,486 млрд юаней, из которых 161,031 млрд юаней направились в фонд благотворительности и не стали призами для игроков."
    en: "According to regulations, at least 50% of sales revenue from lottery games must be paid out as prizes; for the Double Color Ball game, this figure is 51%. In other words, for every 1 yuan you spend, you can expect to receive back only 0.51 yuan on average over time — meaning you lose 49% of your money. In 2024, China sold 623.486 billion yuan worth of lottery tickets; of that amount, 161.031 billion yuan went directly into public welfare funds and was never distributed as prizes."
  benefit:
    ru: "Минимальная доля выручки, выделяемая на призы, установлена Министерством финансов: для лотерей типа «лотто» и цифровых — 50%, для мгновенных — 65%, для ставочных — 73%. В «Двойном шаре» на призы выделяют 51% от выручки, то есть с каждых 100 юаней лишь 51 юань идёт на выплаты. В среднем за долгий период каждый вложенный вами юань принесёт лишь 0,51 юаня, а 49% вы теряете. В 2024 году по всей стране было продано лотерейных билетов на 623,486 млрд юаней, из которых 161,031 млрд юаней направились в фонд благотворительности и не вернулись к покупателям билетов (Китай, 2024 г.)."
    en: "Fiscal regulations set minimum payout ratios: 50% for lottery and number-based games, 65% for instant-win games, and 73% for wagering games. For the Double Color Ball game, 51% of sales revenue is allocated to prizes, which means only 51 yuan out of every 100 yuan spent is paid out as winnings. On a personal level, this translates to an average return of just 0.51 yuan per 1 yuan spent over time — a net loss of 49%. In 2024, total lottery sales in China reached 623.486 billion yuan; 161.031 billion yuan of that amount was earmarked for public welfare and never returned to players (China, 2024)."
  sources:
    - {citation: "财政部 (2015). 关于规范和加强彩票资金构成比例管理的通知（财综〔2015〕94 号）", url: "http://m.mof.gov.cn/czxw/201511/t20151113_1560814.htm"}
    - {citation: "财政部 (2025). 财政部公告 2025 年第 8 号（2024 年彩票公益金筹集分配情况）", url: "http://zhs.mof.gov.cn/zhengcefabu/202508/t20250828_3970977.htm"}
    - {citation: "中国福利彩票双色球游戏规则（第十四条）", url: "https://mzj.nc.gov.cn/ncsmzj/flcp/202111/5dccc1a5da89434e94a62f8ea0e5887e.shtml"}

- id: ch05_i6
  chapter: 5
  item: 6
  chapter_title: {ru: "Не тратьте деньги впустую", en: "Do not waste money"}
  title: {ru: "При появлении фраз «высокая доходность», «гарантия возврата средств» или «стабильная прибыль» — сразу уходите", en: "Walk away the moment you see “high returns,” “guaranteed returns,” or “sure profits”"}
  grade: A
  measure: money
  plain:
    ru: "По словам регулирующих органов: если доходность превышает 6%, стоит задуматься; при 8% — это уже опасно; а при 10% и выше готовьтесь к полной потере вложенных средств. Согласно новым правилам, финансовые организации больше не имеют права гарантировать возврат средств и доходность. Убытки от участия в незаконных финансовых схемах несёт сам инвестор — в случае проблем никто не возместит вам потери."
    en: "Regulatory authorities themselves state that any product offering a return rate above 6% should raise red flags, those above 8% are highly risky, and anything above 10% means you should expect to lose all your principal. Legitimate financial products are no longer allowed to guarantee returns or principal safety. Any losses incurred from participating in illegal fundraising efforts must be borne by the individual investor; there is no one to compensate you if things go wrong."
  benefit:
    ru: "В 2018 году председатель бывшей Комиссии по банковскому и страховому надзору на форуме в Луцзяцуй произнёс следующие слова: «При доходности выше 6% стоит задуматься, при 8% — это уже опасно, а при 10% и выше готовьтесь к полной потере капитала». Новые нормативы запрещают финансовым учреждениям обещать гарантии возврата средств и доходности, а также требуют, чтобы в случае трудностей с выплатами они не вносили средства в качестве компенсации. Поэтому в официальных финансовых продуктах понятие «гарантированный возврат средств» больше не существует. Убытки от участия в незаконных финансовых схемах полностью ложатся на самих участников — в случае проблем никто не возместит вам потери (Китай, 2018, 2021 гг.)."
    en: "In 2018, the former chairperson of the China Banking and Insurance Regulatory Commission stated at the Lujiazui Forum: “Any product offering a return rate above 6% should raise red flags, those above 8% are highly risky, and anything above 10% means you should expect to lose all your principal.” New regulations for asset management require financial institutions to “not guarantee returns or principal safety,” and also stipulate that “when facing difficulties in fulfilling payment obligations, financial institutions must not provide any form of financial support to honor their commitments.” Hence, legitimate financial products no longer offer any guarantee of principal safety. Any losses from illegal fundraising efforts are “to be borne by the individual investors themselves”; no one will compensate you if you suffer losses (China, 2018, 2021)."
  sources:
    - {citation: "郭树清 (2018). 防范化解金融风险 奋力跨越重大关口（第十届陆家嘴论坛讲话，国家金融监督管理总局官网）：「在打击非法集资过程中，努力通过多种方式让人民群众认识到，高收益意味着高风险，收益率超过6%的就要打问号，超过8%的就很危险，10%以上就要准备损失全部本金」", url: "https://www.nfra.gov.cn/cn/view/pages/ItemDetail.html?docId=182418"}
    - {citation: "天津市地方金融管理局转载", url: "https://jrgz.tj.gov.cn/ztlm/ztzl/jrjfwphjr/202006/t20200625_2744709.html"}
    - {citation: "中国人民银行 et al. (2018). 关于规范金融机构资产管理业务的指导意见（银发〔2018〕106 号，第二条、第六条）", url: "https://www.gov.cn/gongbao/content/2018/content_5323101.htm"}
    - {citation: "国务院 (2021). 防范和处置非法集资条例（国务院令第 737 号，第二十五条）", url: "https://www.gov.cn/gongbao/content/2021/content_5588815.htm"}

- id: ch05_i7
  chapter: 5
  item: 7
  chapter_title: {ru: "Не тратьте деньги впустую", en: "Do not waste money"}
  title: {ru: "Не гасите кредитную карту минимальным платежом и не берите рассрочку или потребкредит на покупки; если занимать всё же приходится, сначала переведите проценты в годовую ставку и сравнивайте её", en: "Do not use a credit card's minimum payment, and do not open an installment plan or a consumer loan for spending. If you must borrow, turn the interest into an annual rate before you compare"}
  grade: C
  measure: money
  plain:
    ru: "Минимальный платёж — это заём с процентом по дням, в пересчёте на год около 18%. Беспроцентный период при этом сгорает. Если в рассрочке написано «комиссия 0,6% в месяц», в пересчёте на год это около 13,8%, а не 7,2%. Долг каждый месяц уменьшается, а комиссию всё время считают от исходной суммы. Какой заём дороже, смотрите только по годовой ставке, не по дневному проценту и не по месячной ставке."
    en: "The minimum payment is a loan that charges interest by the day, about 18% over a year, and using it cancels the interest-free period. An installment that says \"0.6% fee per month\" is about 13.8% a year, not 7.2%. The principal is being paid down each month, but the fee is still charged on the original amount. To see which loan costs more, look only at the annual rate, not the daily interest or the monthly fee rate."
  benefit:
    ru: "До 2020 года у ставки по овердрафту кредитной карты были верхний и нижний предел: верхний предел — «дневная ставка пять десятитысячных», нижний — 0,7 от верхнего предела. Пять десятитысячных в день, сложенные за год, дают 18,25%. Это простой процент: считают 18,25% за год, и процент не прибавляют к долгу. С 2021 года цену назначают банк-эмитент и держатель карты между собой. После минимального платежа на непогашенный долг каждый день начисляют процент с полной суммы, и беспроцентный период одновременно сгорает. Народный банк уже требует, чтобы эмитент заметно показывал годовую ставку (ставку в пересчёте на целый год) и «не показывал только дневную ставку и дневную сумму платежа». С 2021 года все организации, которые дают деньги в долг, в рекламе и в договоре должны заметно писать годовую ставку. Дневную и месячную ставку можно писать рядом, но не заметнее годовой. В годовую ставку входят процент и все сборы, прямо связанные с займом. Если долг гасят частями, сколько денег вы реально использовали, считают по остатку долга после каждого платежа. Народный банк давал пример: заём 100 000 юаней на 12 месяцев, каждый месяц комиссия за рассрочку 0,5% от исходного долга. В момент займа ещё 1 000 юаней сервисного сбора. По простому проценту годовая ставка около 12,80%. По сложному проценту (метод внутренней нормы доходности) около 13,58%. Если смотреть только на ставки, кажется, что за год уйдёт 0,5% × 12 + 1% = 7%. На деле это почти вдвое больше, потому что долг каждый месяц уменьшается, а комиссию за рассрочку всё время считают от 100 000 юаней. По тому же счёту кредитная карта на 12 платежей с комиссией 0,6% за платёж и без других сборов номинально даёт 7,2% за год. По сложному проценту годовая ставка около 13,8%, примерно в 1,9 раза выше номинала. На сроке от 6 до 36 платежей множитель держится между 1,8 и 2. Если деньги даёт человек или обычная компания, это частный заём. Процент сверх 4-кратной однолетней LPR на день договора суд в части превышения не поддерживает. Однолетняя LPR на 20-е число 8-го месяца 2026 года — 3,0%, 4-кратная величина — 12%. Процент, заранее вычтенный из суммы займа, суд считает от денег, которые реально дошли до рук, и эту сумму берёт как долг. Эта черта не достаёт банки и потребительские финансовые компании с лицензией. Не применяется она и к 7 видам местных финансовых организаций: компании микрозайма, ломбарды, лизинговые компании и другие. Поэтому 12% на их займы не натягивают, смотрите годовую ставку в договоре (Китай, 2020 и 2021 годы)."
    en: "Before 2020, credit-card overdraft interest had a ceiling and a floor. The ceiling was a daily rate of five per ten thousand. The floor was 0.7 times the ceiling. Five per ten thousand comes to 18.25% over a year. That is simple interest: counted at 18.25% a year, the interest is not rolled back into the principal. From 2021, the price is set by agreement between the card issuer and the cardholder. After you use the minimum payment, the unpaid principal is charged interest in full every day, and the interest-free period is cancelled at the same time. The central bank already requires card issuers to show the annualized rate (the rate restated over a full year) in an obvious way, and \"must not show only the daily rate and the daily repayment amount.\" From 2021, every lending institution, in advertisements and in contracts, has to write the annualized rate in an obvious way. A daily rate and a monthly rate may be written alongside it, but they must not be more prominent than the annualized rate. The annualized rate has to include the interest and every fee that is directly tied to the loan. Where principal is repaid in installments, how much money you actually had the use of is counted on the principal left after each installment. The People's Bank of China gave a worked example: borrow 100,000 yuan, repay over 12 months, and pay 0.5% of the original principal each month as an installment fee. At the moment of borrowing you also pay a 1,000 yuan service fee. On simple interest, the annualized rate is about 12.80%. On compound interest (the internal-rate-of-return method), it is about 13.58%. Looking only at the fee rate, it looks like 0.5% × 12 + 1% = 7% a year. The real figure is about twice that, because the principal falls each month while the installment fee is still charged on 100,000 yuan. The same method, applied to a credit card in 12 installments at 0.6% fee per installment and no other fee, is nominally 7.2% a year. On compound interest it is about 13.8% a year, about 1.9 times the nominal figure. From 6 to 36 installments, the multiple stays between 1.8 and 2 times. If the person lending you the money is an individual or an ordinary company, it is private lending. If the agreed rate is more than 4 times the one-year LPR at the time the contract is signed, the court does not support the part above that. The one-year LPR on 20 August 2026 (2026-8-20) was 3.0%. Four times that is 12%. Interest taken out of the loan at the start is counted by the court on the money you actually received, and that received sum is the principal. This line does not reach banks, consumer-finance companies, and other licensed financial institutions. It also does not apply to seven types of local financial organizations, including small-loan companies, pawnshops, and financial leasing companies. So you cannot put 12% onto their loans. Look at the annualized rate written in the contract (China, 2020 and 2021)."
  sources:
    - {citation: "中国人民银行 (2020). 关于推进信用卡透支利率市场化改革的通知（银发〔2020〕327 号）", url: "https://xining.pbc.gov.cn/zhengwugongkai/4081330/4406346/4693549/4159909/index.html"}
    - {citation: "中国人民银行 (2021). 中国人民银行公告〔2021〕第 3 号（第一、三、四条，附件《采用内部收益率法计算贷款年化利率示例》第三例）", url: "https://www.gov.cn/zhengce/zhengceku/2021-03/31/content_5597156.htm"}
    - {citation: "最高人民法院 (2020 年第二次修正). 关于审理民间借贷案件适用法律若干问题的规定（第一、二十五、二十六条）. <http://gongbao.court.gov.cn/Details/94b6623974526df7d2430a3c73f050.html>（最高人民法院公报）；最高人民法院 (2020). 关于新民间借贷司法解释适用范围问题的批复（法释〔2020〕27 号）", url: "https://www.court.gov.cn/fabu/xiangqing/285171.html"}
    - {citation: "全国银行间同业拆借中心受中国人民银行授权 (2026). 2026 年 8 月 20 日贷款市场报价利率（LPR）公告", url: "https://www.chinamoney.com.cn/chinese/rdgz/20260820/3399885.html"}

- id: ch05_i16
  chapter: 5
  item: 16
  chapter_title: {ru: "Не тратьте деньги впустую", en: "Do not waste money"}
  title: {ru: "Не занимать деньги для инвестиций, не использовать кредитное плечо, не покупать то, чего не понимаешь", en: "Don’t borrow money to invest, avoid leverage, and never buy assets you don’t understand"}
  grade: B
  measure: money
  plain:
    ru: "Если взять кредит на покупку акций, а их цена упадёт ниже определённого уровня, вы не сможете внести дополнительные средства, и акции будут принудительно проданы. Тогда убыток, изначально лишь на бумаге, мгновенно становится реальным — у вас не остаётся даже шанса дождаться, пока цена вернётся к прежнему уровню. Согласно правилам регулятора, лицам, которые открыли счёт менее полугода назад или чьи средства на счёте в среднем за последние 20 торговых дней не превышают 500 тысяч юаней, запрещено открывать кредитные счета. Сам этот порог говорит о том, что такой инструмент не предназначен для обычных инвесторов."
    en: "When you use borrowed money to buy stocks, any drop below a set threshold leaves you unable to add more funds, so your positions get automatically sold off. The paper losses instantly become real losses, leaving you no chance to wait for the price to rebound. Regulatory rules state that people who have held an account for less than six months or whose average daily assets over the past 20 trading days are under 500,000 RMB cannot open margin trading accounts. This threshold alone makes it clear this tool isn’t meant for ordinary investors."
  benefit:
    ru: "Кредитное плечо — это использование заёмных средств для покупки акций, что увеличивает масштаб убытков. После покупки акций на заёмные средства их рыночная стоимость может опуститься ниже установленного брокером уровня поддержания залога. Если вы не сможете внести дополнительные средства для восстановления этого уровня, брокер принудительно продаст ваши акции. Убыток, изначально лишь на бумаге, мгновенно становится реальным — у вас не остаётся даже шанса дождаться, пока цена вернётся к прежнему уровню. Согласно правилам регулятора, клиентам, которые занимаются торговлей ценными бумагами менее полугода, не обладают достаточной способностью нести риски, а их средства на счёте в среднем за последние 20 торговых дней не превышают 500 тысяч юаней, запрещено открывать кредитные счета. Сам этот порог говорит о том, что такой инструмент не предназначен для обычных инвесторов (Китай, 2015 г.)."
    en: "Leverage essentially means borrowing money to make purchases, which also magnifies potential losses. After opening a margin account, the market value of your collateral may fall below the minimum maintenance margin set by your broker, which governs the assets you’ve pledged to them. If the value drops below this threshold and you fail to add more collateral to bring it back up, your positions get forcibly liquidated, with the broker selling them on your behalf. Paper losses turn into actual losses right away, with no window to wait for a price recovery. The same regulatory rules apply here: clients with less than six months of trading experience, insufficient risk tolerance, or average daily securities assets under 500,000 RMB over the past 20 trading days are barred from opening credit trading accounts. This requirement further proves it is not a suitable tool for regular investors (China, 2015)."
  sources:
    - {citation: "中国证监会 (2015). 证券公司融资融券业务管理办法（证监会令第 117 号，第十二条）", url: "https://www.csrc.gov.cn/csrc/c106256/c1654005/content.shtml"}
    - {citation: "上海证券交易所. 《上海证券交易所融资融券交易实施细则》解读（投资者教育材料）", url: "https://www.sse.com.cn/services/tradingservice/margin/edu/c/10074042/files/a1f1c4833302451fb9130dbb94116c56.pdf"}

- id: ch05_i17
  chapter: 5
  item: 17
  chapter_title: {ru: "Не тратьте деньги впустую", en: "Do not waste money"}
  title: {ru: "Замена активно управляемых фондов широкими индексными фондами в качестве долгосрочной базы портфеля (той части средств, которую держат без изменений)", en: "Using broad-market index funds instead of actively managed funds as a long-term core holding (the portion of money you keep invested for years)"}
  grade: B
  contested: true
  measure: money
  plain:
    ru: "Совокупность акций, которую покупают в активно управляемых фондах, уже очень близка к составу всего рынка. Однако дополнительная комиссия за управление реально вычитается из вашего конечного дохода. Если сравнивать результаты фондов, рассматривая их как случайные результаты, лишь немногие из них способны заработать достаточно, чтобы покрыть эти расходы."
    en: "The collection of stocks held by actively managed funds already closely mirrors the overall market. Yet the extra management fees they charge are deducted straight from your actual returns. When we repeatedly re-randomize fund performance data to test how much luck plays a role, very few funds manage to generate enough outperformance to offset those fees."
  benefit:
    ru: "В совокупности американские активно управляемые фонды акций ведут себя почти так же, как весь рынок: их портфели состоят из примерно тех же акций. Однако высокие затраты на управление напрямую снижают чистую доходность инвесторов после вычета комиссий. В исследовании с помощью метода бутстрепа случайно переставляли результаты фондов, чтобы определить, насколько можно полагаться на удачу. Оказалось, что лишь немногие фонды способны генерировать сверхдоходы, достаточные для покрытия своих расходов: их преимущество перед рынком не перекрывает уплаченные комиссии (исследование опубликовано в США в 2010 году). S&P Dow Jones Indices ежегодно проводит подсчет: в 2024 году 65% американских активно управляемых фондов крупных компаний показали худшие результаты, чем индекс S&P 500. За последние 24 года в среднем 64% таких фондов отставали от рынка. За последние 15 лет по состоянию на конец 2024 года ни в одной категории не наблюдалось преобладания фондов, опережающих индекс."
    en: "Collectively, U.S. actively managed equity funds hold a portfolio very similar to the broader market. However, their high management costs directly translate into lower net returns for investors after fees are deducted. This research used a bootstrap simulation method to repeatedly shuffle fund performance data and gauge how much could be attributed to luck alone. The results show that only a tiny fraction of funds achieve excess returns large enough to cover their fees (U.S., published 2010). S&P Dow Jones Indices conducts an annual review: in 2024, 65% of U.S. actively managed large-cap equity funds underperformed the S&P 500. Over a 24-year span, an average of 64% underperformed each year. In the 15 years ending 2024, no single fund category saw a majority of active funds outperforming their respective benchmarks."
  sources:
    - {citation: "Fama EF, French KR (2010). Luck versus Skill in the Cross-Section of Mutual Fund Returns. The Journal of Finance 65(5):1915-1947", url: "https://doi.org/10.1111/j.1540-6261.2010.01598.x"}
  doi: "10.1111/j.1540-6261.2010.01598.x"

- id: ch05_i23
  chapter: 5
  item: 23
  chapter_title: {ru: "Не тратьте деньги впустую", en: "Do not waste money"}
  title: {ru: "Для крупных покупок, не являющихся необходимыми, вводится 24-часовой период раздумий; при онлайн-шопинге можно воспользоваться правом на возврат без объяснения причин в течение семи дней", en: "Implementing a 24-hour cooling-off period for non-essential big-ticket purchases; making full use of the seven-day no-questions-asked return policy for online shopping"}
  grade: C
  measure: money
  plain:
    ru: "Вы сэкономите деньги на тех вещах, которые на следующий день уже не захотите иметь. Товары, купленные в интернете, можно вернуть без объяснения причин в течение семи дней с момента получения. Есть несколько категорий товаров, на которые это правило не распространяется: изготовленные по вашему заказу, скоропортящиеся продукты, цифровые товары после вскрытия упаковки, а также периодические издания."
    en: "What you save is exactly the money spent on items you no longer want the very next day. For online purchases, you can return them for any reason within seven days of delivery. There are a few categories excluded from this policy: custom-made items, perishable goods, digital products that have been opened, and newspapers and periodicals."
  benefit:
    ru: "Экономия получается именно на той части импульсивных покупок, которые человеку на следующий день уже не нужны. Точную долю таких покупок назвать невозможно. При онлайн-шопинге право на возврат без объяснения причин действует в течение семи дней с момента получения заказа. Исключения составляют четыре категории товаров: изготовленные на заказ, скоропортящиеся, цифровые товары после вскрытия упаковки и периодические издания (Китай, действует с 2017 года)."
    en: "What you save is precisely that portion of impulse buys you no longer want after a day. There is no single universal percentage representing this share. As mentioned, online purchases can be returned within seven days of receipt, with the same exclusions applying. This policy has been in effect in China since 2017."
  sources:
    - {citation: "国家市场监督管理总局 (2020 修订). 网络购买商品七日无理由退货暂行办法（总局令第 31 号）", url: "https://www.gov.cn/zhengce/zhengceku/2020-11/03/content_5557118.htm"}

- id: ch05_i27
  chapter: 5
  item: 27
  chapter_title: {ru: "Не тратьте деньги впустую", en: "Do not waste money"}
  title: {ru: "Сформируйте резерв на 3–6 месяцев жизни, разместив его там, где он будет доступен в любой момент", en: "Set aside an emergency fund equal to 3–6 months of living expenses in a readily accessible account"}
  grade: C
  measure: money
  plain:
    ru: "Отложите сумму, равную расходам на 3–6 месяцев, на счёт, из которого можно снимать средства в любой момент. Тогда при потере работы или болезни вам не придётся брать кредиты под 18% годовых, а также не придётся продавать свои инвестиции с убытком. Средства на банковских счетах защищены системой страхования вкладов: в одном банке выплата производится максимум до 500 тысяч юаней."
    en: "Keep 3 to 6 months’ worth of living expenses in an account you can withdraw from at any time. This way, if you lose your job or fall ill, you won’t have to borrow money at an 18% annual interest rate, nor will you need to sell your investments at a loss. Deposits in banks are protected by deposit insurance, which covers up to 500,000 RMB per bank in China."
  benefit:
    ru: "Наличие такого резерва позволяет избежать необходимости брать займы или продавать инвестиции с убытком в случае безработицы или болезни. Минимальная годовая процентная ставка по потребительским кредитам и кредитным картам описана в пункте 7 данного раздела (не пользуйтесь минимальными платежами по кредитным картам). Вклады в банках защищены страхованием; в одном банке выплата производится максимум до 500 тысяч юаней (Китай, 2015 г.)."
    en: "An emergency fund eliminates the need to borrow money or sell investments at a loss during unexpected events like job loss or illness. For details on the minimum annual interest rates for consumer loans and credit card payments, see Section 7 of this chapter (which advises against relying on minimum credit card payments)."
  sources:
    - {citation: "国务院 (2015). 存款保险条例（国务院令第 660 号，第五条）", url: "https://www.gov.cn/zhengce/content/2015-03/31/content_9562.htm"}
    - {citation: "中国人民银行、国家金融监督管理总局、中国证券监督管理委员会 (2025). 金融机构客户尽职调查和客户身份资料及交易记录保存管理办法（令〔2025〕第 11 号，第七、二十八、五十二条，2026 年 1 月 1 日起施行）", url: "https://www.pbc.gov.cn/tiaofasi/144941/144957/5916164/index.html"}
    - {citation: "中共上海市委金融委员会办公室 (2025-12-01). 央行等三部门发布新规，银行取钱不再「一刀切」式询问：「文件删除了“个人存取现金超5万元需登记资金来源”」", url: "https://jrj.sh.gov.cn/ZXYW178/20251201/1da352ee5150414b8db1ce248f4e37c6.html"}

- id: ch05_i45
  chapter: 5
  item: 45
  chapter_title: {ru: "Не тратьте деньги впустую", en: "Do not waste money"}
  title: {ru: "Не стоит тратить деньги на покупку таких виртуальных валют, как биткоин или тетер: даже если кто-то уговаривает вас вложиться, не поддавайтесь — сделки с ними не защищены законом, и в случае убытков вернуть средства через суд не получится", en: "Don’t spend money on virtual currencies like Bitcoin or Tether; even if others try to get you to invest, don’t join in: these transactions receive no legal protection, so you won’t be able to recover any losses through court"}
  grade: A
  measure: money
  plain:
    ru: "В Китае виртуальные валюты официально не признаются деньгами, поэтому сделки по их покупке могут быть признаны недействительными, а любые понесённые убытки ложатся на покупателя. Например, один человек заплатил около 448 000 юаней за тетер, но позже не смог вывести средства с платформы, а суд отклонил его иск о возврате денег. Если же виртуальные валюты украли, это уже уголовное преступление: виновных привлекают к ответственности по статье о краже."
    en: "China does not recognize virtual currencies as legal tender. Individual purchases of such coins can be ruled invalid by courts, meaning any losses fall on the buyer. One person paid roughly 448,000 yuan to buy Tether, but later couldn’t withdraw funds from the platform; his lawsuit was dismissed. Theft of crypto is a separate criminal matter — thieves are prosecuted for theft."
  benefit:
    ru: "В феврале 2026 года восемь государственных ведомств, включая Народный банк Китая, выпустили уведомление № 42, в котором прямо указано, что биткоин, эфир, тетер и другие виртуальные валюты «не обладают законной платёжной силой, их нельзя и не следует использовать в качестве денег в коммерческом обороте». Обмен юаней на виртуальные валюты, торговля ими, а также привлечение инвестиций через такие активы считаются незаконной финансовой деятельностью и подлежат строгому запрету. Иностранным организациям также запрещено предоставлять подобные услуги жителям Китая. Для частных инвесторов в документе указано: «Любые гражданско-правовые сделки по покупке виртуальных валют, токенов реальных активов или связанных с ними финансовых продуктов, противоречащие общественному порядку и нравственности, признаются недействительными, а все связанные с ними убытки несёт сам инвестор». Это положение сохранили в новом уведомлении, отменив предыдущее от 2021 года. Судебная практика подтверждает это: в 2018–2019 годах гражданин Тан заплатил 448 000 юаней за тетер через двух продавцов, но позже не смог воспользоваться активами. Его иск о возврате средств суд отклонил, а решение подтвердила и апелляция (г. Исин, провинция Цзянсу, март 2025 года). Важно понимать: запрет на использование виртуальных валют касается только гражданско-правовых споров между инвестором и продавцом, а случаи кражи относятся к уголовной ответственности."
    en: "In February 2026, eight Chinese authorities issued Notice No. 42 (Yinfa [2026] 42), stating that Bitcoin, Ethereum, Tether and similar virtual currencies “have no legal tender status and must not be used as currency in any market.” Converting RMB to crypto, trading one crypto for another, or using crypto for fundraising are all illegal financial activities, strictly prohibited. Foreign firms may not offer such services to Chinese residents. The notice also clarifies that any civil transaction involving virtual currencies or tokenized real‑world assets that runs counter to public order is void, with all resulting losses borne by the parties involved. This provision echoes wording from the 2021 Notice No. 237, which was also repealed. A court case illustrates this: between February 2018 and July 2019, Mr. Tang paid about 448,000 yuan to two alleged platform operators for Tether; after the platform became inaccessible he sued for repayment. The court ruled his investment contract invalid and dismissed his claim, a decision upheld on appeal (Yixing, Jiangsu, March 2025). Theft of crypto is a separate crime; for example, a hacker stole crypto worth over 4 million yuan from a victim, and the thief was sentenced to seven years in prison and fined 20,000 yuan (Zhengzhou, Henan)."
  sources:
    - {citation: "中国人民银行、国家发展改革委、工业和信息化部、公安部、市场监管总局、金融监管总局、中国证监会、国家外汇局 (2026). 关于进一步防范和处置虚拟货币等相关风险的通知（银发〔2026〕42 号，第一、十九条）. <https://www.csrc.gov.cn/csrc/c100028/c7614318/content.shtml>（中国证监会发布）；宜兴市人民法院 (2025). 投资虚拟货币受损 风险责任自行承担", url: "https://yx.wxfy.gov.cn/article/detail/2025/09/id/8970543.shtml"}
    - {citation: "【新时代检察好故事】偷了虚拟币 被判盗窃罪 (2024). <https://www.yw.gov.cn/art/2024/2/2/art_1229143073_59471301.html>（义乌市人民政府网转载）；人民法院报 (2024). 非法窃取虚拟货币行为的刑法定性. <http://www.sdcourt.gov.cn/jningzcfy/386500/386502/31441533/index.html>（邹城市人民法院网转载）；Federal Bureau of Investigation (2022). Scammers Target and Exploit Owners of Cryptocurrencies in Liquidity Mining Scam (Alert Number I-072122-PSA)", url: "https://www.ic3.gov/PSA/2022/PSA220721"}

- id: ch21_i4
  chapter: 21
  item: 4
  chapter_title: {ru: "Выезд за границу, путешествия и безопасность за рубежом", en: "Traveling abroad, trips, and safety overseas"}
  title: {ru: "Купите страховку с лечением за рубежом и медицинской перевозкой, а не только от задержки рейса", en: "Buy a policy that covers overseas medical care and medical evacuation, and do not buy only flight-delay insurance"}
  grade: C
  measure: money
  plain:
    ru: "За лечение за границей платите сами. Домашняя медстраховка (ибао) почти ничего не покрывает, консульство тоже не выкладывает деньги вперёд. Семью валит не приём врача, а больница после тяжёлой травмы и то, чтобы доставить человека домой: для этого нужен специальный самолёт или медицинское сопровождение. В туристической страховке смотрите на пару лимитов: лечение за рубежом и срочная медицинская перевозка с возвращением."
    en: "Medical bills abroad come out of your own pocket. China's basic medical insurance almost never pays them, and the embassy or consulate will not advance the money either. What can really drag a family under is not the outpatient fee. It is the hospital stay after a serious injury, and getting the person home, which takes a special flight or a medical escort. When you buy travel insurance, look mainly at 2 limits: overseas medical expenses, and emergency medical evacuation and return."
  benefit:
    ru: "За лечение за границей платите сами. Домашняя медстраховка за рубежом почти ничего не возмещает. Консульская защита эти деньги тоже не выкладывает вперёд, см. «пункт 3» (что консульская защита может и чего не может). Основание — статья 26 положения. Семью валит не приём врача, а больница после тяжёлой травмы и медицинская перевозка. Доставить человека из зарубежной больницы домой специальным самолётом или с медицинским сопровождением — из самых дорогих вещей, которые человек оплачивает сам. Центр по контролю заболеваний США говорит: срочно перевезти больного из глухого места в хорошую больницу за свой счёт может стоить больше 100000 долларов США. При покупке сначала смотрите на пару лимитов. Лимит на лечение за рубежом. И лимит на срочную медицинскую перевозку и возвращение: сколько максимально выплатят, чтобы после беды перевести в другую больницу и доставить человека домой."
    en: "Medical bills abroad are yours to pay. Domestic yibao (医保 — basic medical insurance) basically does not reimburse care abroad. Consular protection does not advance this money either. See item 3 of this section (what consular protection can and cannot do). The basis is Article 26 of the regulations. What can really drag a family under is not the outpatient fee. It is the hospital stay after a serious injury, and medical evacuation. Moving a person from a hospital abroad back to China takes a special flight or a medical escort, and that is among the most expensive items you pay for yourself. The US Centers for Disease Control and Prevention says that emergency transport of a patient from a remote place to a good hospital, if you pay it yourself, can cost more than 100000 US dollars. When you buy insurance, look first at 2 limits. The first is the limit for overseas medical expenses. The other is the limit for emergency medical evacuation and return, which is how much can be paid, at most, for a transfer after something happens and for sending the person home."
  sources:
    - {citation: "国务院 (2023). 领事保护与协助条例（国令第 763 号）. <https://www.gov.cn/zhengce/zhengceku/202307/content_6891761.htm>（第二十六条）；美国疾病控制与预防中心. Travelers' Health: Travel Insurance：「Medical evacuation insurance covers emergency transportation from a remote area to a high-quality hospital, which could otherwise cost more than $100,000.」", url: "https://wwwnc.cdc.gov/travel/page/insurance"}

- id: ch21_i5
  chapter: 21
  item: 5
  chapter_title: {ru: "Выезд за границу, путешествия и безопасность за рубежом", en: "Traveling abroad, trips, and safety overseas"}
  title: {ru: "Любую «высокооплачиваемую работу за рубежом» считайте мошенничеством: если вас увезут в телефонное мошенничество, по возвращении выезд могут закрыть", en: "Treat every \"high-paying job overseas\" as a scam; if you are tricked into telecom fraud and come back, you may also be barred from leaving the country"}
  grade: A
  measure: freedom
  plain:
    ru: "Месячная зарплата неправдоподобно высокая, про образование и опыт не спрашивают, нормальный договор не подписывают, сначала зовут собраться в приграничном городе и ещё забирают паспорт на хранение. На такую работу уедете — и человек, и паспорт уже не у вас. Если на выезде документы липовые, пограничный контроль вас остановит и не выпустит. Кто за рубежом нарушил закон или совершил преступление и этим задел национальную безопасность и интересы, по возвращении может от 6 месяцев до 3 лет не иметь права на выезд."
    en: "The monthly pay is absurdly high, they do not ask about education or experience, they do not sign a proper contract, they tell you to gather first in a border city, and they keep your passport for you. If you take that kind of work, neither you nor the passport is in your own hands. If the papers are false when you exit, border inspection will stop you and will not let you through. If you break the law abroad, or harm national security and national interests, you may also be barred from leaving the country for 6 months to 3 years after you come back."
  benefit:
    ru: "Официальная квалификация таких дел прямая. В последние годы бывает так: «человек по обману выезжает или под выдуманным поводом незаконно выезжает, чтобы за рубежом заниматься трансграничными азартными играми, телефонным и интернет-мошенничеством и другой незаконной деятельностью, и это серьёзно бьёт по жизни и имуществу людей». Речь о тех, кого выманили, или кто сам сочинил повод и уехал тихо, чтобы там играть и заниматься телефонным мошенничеством. Новое правило сжимает это с той и с другой стороны. На выезде: «повод для выезда, въезда, пребывания и проживания должен быть настоящим и законным». Если подали липовые материалы или соврали, миграционные органы вправе не выдать документы и не выпустить за границу. На возвращении: «если гражданин Китая за рубежом занимается незаконной или преступной деятельностью и вредит национальной безопасности и интересам, можно… решить, что со дня возвращения ему от 6 месяцев до 3 лет нельзя выезжать». Кто получил административное задержание за то, что обманом добыл документы или незаконно выехал либо въехал, тоже от 6 месяцев до 3 лет не выезжает."
    en: "The official description of this kind of case is direct. In recent years there have been people who \"leave the country because they were deceived, or illegally leave the country on a made-up pretext, to engage in cross-border gambling, telecom and network fraud, and other illegal activity, seriously harming the safety of the public's lives and property.\" That means being tricked into going, or inventing a reason and slipping out, and then gambling and running telecom fraud over there. The new rule tightens both ends of this. On the way out: \"The reason given for an application to exit or enter, or to stay or reside, shall be true and lawful.\" If you hand in false materials or tell a lie, the immigration authority has the power not to issue you documents and not to let you leave. On the way back: \"Where a Chinese citizen engages in illegal or criminal activity abroad and harms national security and national interests, a decision may be made... that the person shall not leave the country for a period of not less than 6 months and not more than 3 years from the date of return.\" A person placed in administrative detention for obtaining documents by fraud, or for illegal exit or entry, is likewise barred from leaving the country for 6 months to 3 years."
  sources:
    - {citation: "国务院 (2026). 关于出境入境管理的规定（国令第 841 号）. <https://www.gov.cn/zhengce/zhengceku/202607/content_7077173.htm>（第三、四条）；司法部、公安部、国家移民局 (2026). 就《国务院关于出境入境管理的规定》答记者问", url: "https://www.gov.cn/zhengce/202608/content_7077270.htm"}

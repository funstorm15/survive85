- id: ch01_i1
  chapter: 1
  item: 1
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Пристегните ремень безопасности — как спереди, так и сзади", en: "Always wear seat belts, both front and back"}
  grade: A
  measure: mortality
  plain:
    ru: "Если водитель или пассажир спереди пристегнут ремень, вероятность их гибели в аварии снижается примерно вдвое. Для пассажиров легких грузовиков этот показатель падает на 60%. Среди погибших в автомобилях США в 2022 году, у которых удалось установить факт пристегнутого ремня, половина не были пристегнуты."
    en: "Wearing a seat belt in the front seat cuts the risk of dying in a crash by roughly half. For drivers and passengers in light trucks, the reduction is about 60%. Among U.S. crash victims in 2022 whose seat belt use was documented, half were not wearing one."
  benefit:
    ru: "По оценкам Национального управления безопасностью дорожного движения США (NHTSA), пристегнутый ремень снижает риск получения смертельных травм у пассажиров легковых автомобилей на 45%, а у пассажиров легких грузовиков — на 60%. Среди погибших в легковых автомобилях США в 2022 году, у половины из тех, у кого удалось установить факт пристегнутого ремня, его не было. По данным Всемирной организации здравоохранения (ВОЗ), ремень безопасности способен снизить риск гибели в автомобиле максимум на 50%. ВОЗ оценивает, что в 2021 году в Китае от дорожно-транспортных происшествий погибло 248 099 человек, то есть 17,4 человека на 100 тысяч населения."
    en: "According to NHTSA estimates, seat belts lower the risk of fatal injury for front‑seat occupants of cars by 45% and for those in light trucks by 60%. In 2022, half of the U.S. fatalities in passenger cars had no recorded seat belt use. The World Health Organization states that seat belts can reduce the risk of death inside a vehicle by up to 50%. WHO also estimates that in 2021, 248,099 people died in road crashes in China, which translates to 17.4 deaths per 100,000 people."
  sources:
    - {citation: "NHTSA (2024). Occupant Protection in Passenger Vehicles: 2022 Data (DOT HS 813 573)：「Among killed passenger vehicle occupants with known restraint use, 48 percent of those in the front row and 60 percent of those in the second row were unrestrained.」", url: "https://crashstats.nhtsa.dot.gov/Api/Public/ViewPublication/813573"}
    - {citation: "WHO (2025). Road traffic injuries fact sheet", url: "https://www.who.int/news-room/fact-sheets/detail/road-traffic-injuries"}
    - {citation: "WHO GHO RS_196/RS_198 (China, 2021)", url: "https://ghoapi.azureedge.net/api/RS_196?$filter=SpatialDim%20eq%20%27CHN%27"}
    - {citation: "国家统计局 (2022). 中国统计年鉴 2022，表 24-5 道路交通事故情况（2021 年）：死亡人数 62218 人", url: "https://www.stats.gov.cn/sj/ndsj/2022/html/C24-05.jpg"}

- id: ch01_i2
  chapter: 1
  item: 2
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Надевание шлема при езде на мотоцикле и электровелосипеде", en: "Wearing a helmet and fastening the strap while riding motorcycles or e-bikes"}
  grade: A
  measure: mortality
  plain:
    ru: "Если мотоциклист надевает шлем и затягивает ремешок, вероятность его гибели в аварии снижается примерно на 40%. Шанс получить травму головы — ниже примерно на 70%. Ремешок обязательно нужно затянуть: если он просто болтается на голове, это не считается надеванием шлема."
    en: "Wearing a helmet and fastening the strap properly reduces a motorcyclist’s risk of dying in an accident by roughly 40%. The chance of suffering a head injury drops by about 70%. The strap must be tightened; a helmet that simply hangs loosely on the head does not count as being worn."
  benefit:
    ru: "В исследовании Cochrane объединили эти нескольких работ. У мотоциклистов, носящих шлем, риск смерти снижается на 42%. Исходное значение OR составляет 0,58, а 95% доверительный интервал — от 0,50 до 0,68. Вероятность получения травмы головы уменьшается на 69% (OR 0,31, 95% CI от 0,25 до 0,38)."
    en: "Cochrane pooled data from multiple studies. For motorcyclists wearing helmets, the risk of death fell by 42%. The original odds ratio was 0.58, with a 95% confidence interval ranging from 0.50 to 0.68. Head injuries were reduced by 69% (odds ratio 0.31; 95% CI 0.25–0.38)."
  numbers:
    - {kind: OR, value: 0.58, ci_low: 0.5, ci_high: 0.68}
    - {kind: OR, value: 0.31, ci_low: 0.25, ci_high: 0.38}
  sources:
    - {citation: "Liu BC et al. (2008). Helmets for preventing injury in motorcycle riders. Cochrane Database of Systematic Reviews", url: "https://doi.org/10.1002/14651858.CD004333.pub3"}
  doi: "10.1002/14651858.CD004333.pub3"

- id: ch01_i3
  chapter: 1
  item: 3
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Установка дымовых извещателей; зимой в домах с отоплением углём или газом — ещё и извещателей на угарный газ", en: "Install smoke alarms; those heating with coal or gas in winter should also add a carbon monoxide alarm"}
  grade: B
  measure: mortality
  plain:
    ru: "Дымовой извещатель, который работает исправно, снижает вероятность гибели при пожаре в доме примерно на 60%. В 40% случаев во время пожара люди спят, и обычный запах дыма их не разбудит. В домах, где зимой отапливаются углём или газом, стоит установить ещё и извещатель на угарный газ. В 2018 году в Китае от отравления угарным газом умерло 11 523 человека; в три зимних месяца 70% из них погибли именно дома. В том же году зафиксировано 11 500 случаев смерти от этого вещества."
    en: "A properly functioning smoke alarm can cut the risk of dying in a home fire by roughly 60%. Forty percent of fire victims are asleep at the time, so they won’t wake up just from the smell of smoke. For anyone heating their home with coal or gas during winter, adding a carbon monoxide alarm is essential. In China, 11,500 people died from carbon monoxide poisoning in 2018; 70% of those deaths occurred at home during the three winter months."
  benefit:
    ru: "В Северной Каролине провели исследование домов, где случались пожары, и сравнили семьи, в которых пожары произошли, с теми, где этого не случилось. В домах с исправно работающим дымовым извещателем риск смерти от пожара снижался примерно на 60%. Значение OR составило 0,39, а 95% доверительный интервал — от 0,18 до 0,83. В период с 2018 по 2020 год в США в 24% домов, где случались смертельные пожары, не было дымовых извещателей, а в 41% случаев люди спали во время возгорания. В 2018 году в Китае зафиксировано 11 523 случая смерти от отравления угарным газом; из них в декабре 72,59%, в январе — 67,42%, а в феврале — 66,48% произошли в домашней обстановке."
    en: "A study in North Carolina examined homes that had experienced fires versus those that hadn’t. It found that having a working smoke alarm lowered the death risk by about 60%. The odds ratio was 0.39, with a 95% confidence interval ranging from 0.18 to 0.83. Between 2018 and 2020, 24% of fatal residential fires in the U.S. happened in homes without smoke alarms, and 41% of victims were asleep when the fire started. In 2018, China reported 11,523 deaths from carbon monoxide poisoning; of these, 72.59% occurred at home in December, 67.42% in January, and 66.48% in February."
  numbers:
    - {kind: OR, value: 0.39, ci_low: 0.18, ci_high: 0.83}
  sources:
    - {citation: "Marshall SW et al. (1998). Fatal residential fires: who dies and who survives? JAMA", url: "https://doi.org/10.1001/jama.279.20.1633"}
    - {citation: "USFA (2022). Fatal Fires in Residential Buildings (2018-2020), Topical Fire Report Series 22(2)", url: "https://www.usfa.fema.gov/downloads/pdf/statistics/v22i2.pdf"}
    - {citation: "You J et al. (2020). Number of Deaths due to Carbon Monoxide Poisoning by Month and by Place of Death — China, 2018. China CDC Weekly", url: "https://doi.org/10.46234/ccdcw2020.008"}
  doi: "10.1001/jama.279.20.1633"

- id: ch01_i5
  chapter: 1
  item: 5
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Не собирайте, не покупайте и не ешьте дикие грибы; никакие «народные способы» их распознавания не работают", en: "Do not pick, buy, or eat wild mushrooms; any “folk tricks” for identification are useless"}
  grade: A
  measure: mortality
  plain:
    ru: "Только в 2025 году по всей стране зафиксировано 828 случаев отравления грибами; пострадали 2165 человек, 13 из них умерли. В том же году учёные выявили 34 новых вида грибов, ранее не считавшихся ядовитыми. Мифы вроде «серебряная игла определяет яд», «если гриб съели насекомые — он безопасен» или «только ярко окрашенные грибы опасны» полностью не соответствуют действительности."
    en: "In 2025 alone, there were 828 cases of mushroom poisoning across China, affecting 2,165 people, with 13 fatalities. That same year, 34 previously unknown poisonous mushroom species were identified. Myths such as using a silver needle to test for toxicity, assuming mushrooms safe if insects eat them, or that only brightly colored varieties are toxic are all false."
  benefit:
    ru: "В 2025 году Центр по контролю заболеваний провёл анализ 828 случаев отравления грибами, затронувших 2165 человек; летальность составила 0,6%. В период с 2019 по 2024 год ежегодно регистрировалось от 276 до 676 подобных случаев, а уровень смертности колебался от 0,87% до 2,86%. За один лишь 2025 год было идентифицировано 138 видов ядовитых грибов, включая 34 вида, ранее не ассоциировавшихся с отравлениями в Китае."
    en: "The Chinese CDC investigated 828 mushroom poisoning cases in 2025 involving 2,165 individuals; the mortality rate was 0.6%. From 2019 to 2024, annual cases ranged from 276 to 676, with mortality rates between 0.87% and 2.86%. In 2025 alone, 138 poisonous mushroom species were identified, including 34 new ones never documented before as causing poisoning."
  sources:
    - {citation: "Mushroom Poisoning Outbreaks — China, 2025. China CDC Weekly (2026)：「In 2025, China CDC investigated 828 mushroom poisoning incidents across 27 provincial-level administrative divisions (PLADs), affecting 2,165 individuals and causing 13 deaths - a case fatality rate of 0.6%, the lowest of the past six years. In total, 138 poisonous mushroom species were identified, including 34 newly recorded in poisoning incidents in China.」「From 2019 to 2024, the annual number of incidents ranged from 276 to 676, and the case fatality rate ranged from 0.87% to 2.86%.」", url: "https://doi.org/10.46234/ccdcw2026.120"}
    - {citation: "同刊 2024 年度报告", url: "https://doi.org/10.46234/ccdcw2025.106"}
    - {citation: "中国疾病预防控制中心职业卫生所 尹萸、李海蛟 (2019). 防控蘑菇中毒，任重而道远：「方法4：虫食或生蛆的蘑菇无毒。错！」「方法6：与银器、大葱、大蒜、大米同煮可使其变色的蘑菇有毒。错！」「因此，目前没有简单易行、快速有效的识别蘑菇是否有毒的方法」", url: "https://www.chinacdc.cn/jkkp/zyjk/zdzs/201908/t20190802_301109.html"}
    - {citation: "北京市疾病预防控制中心 (2023). 远离毒蘑菇，不做「菇勇者」：「民间流传辨别毒蘑菇的方法，如看颜色和形状、看生长环境、用银器辨毒、看分泌物、看有无生蛆生虫等均不可靠」", url: "https://www.bjcdc.org/cdcmodule/jkfw/yyyspjk/jkyf/swzdyf/2023/35518.shtml"}
    - {citation: "北京市市场监督管理局 (2026). 关于防范误食野生蘑菇中毒的风险提示：「请立即就医，切勿自行处理，以免延误诊疗时机。妥善保存剩余野生蘑菇、食物残渣等样本」", url: "https://scjgj.beijing.gov.cn/zwxx/scjgdt/202606/t20260625_4715961.html"}
  doi: "10.46234/ccdcw2026.120"

- id: ch01_i6
  chapter: 1
  item: 6
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Электровелосипеды нельзя везти в подъезды, в лифты и заряжать дома", en: "Electric bicycles must not be pushed into stairwells, elevators, or charged indoors"}
  grade: A
  measure: mortality
  plain:
    ru: "Согласно «Положению об обеспечении пожарной безопасности в многоквартирных домах», утверждённому Министерством по чрезвычайным ситуациям, запрещено везти электровелосипеды в подъезды, в лифты или заряжать их дома. Нарушителей ждут штрафы: для обычных граждан — от 500 до 1000 юаней, для предпринимателей — от 2000 до 10000 юаней. Однако самое опасное — такой пожар может охватить единственный путь для эвакуации из дома."
    en: "Pushing an electric bike into a stairwell, elevator, or charging it at home is strictly prohibited under the Ministry of Emergency Management’s regulations on fire safety in high-rise residential buildings. Those who violate the rules face fines of $500–$1,000 for individuals and $2,000–$10,000 for businesses. Even these fines are the least of the concerns — the real danger is that a fire could block your only escape route."
  benefit:
    ru: "В указанном положении МЧС чётко прописано: «Запрещается парковать электровелосипеды или заряжать их в общественных холлах, коридорах, на лестничных клетках и у выходов из многоквартирных домов». На этих территориях парковка и зарядка категорически запрещены. Нарушителей ждут те же штрафы, что и выше."
    en: "The regulations explicitly forbid parking or charging electric bikes in public lobbies, hallways, stairwells, or near emergency exits of high-rise buildings. Noncompliance results in the same fines mentioned above."
  sources:
    - {citation: "应急管理部 (2021). 高层民用建筑消防安全管理规定（应急管理部令第 5 号，第三十七条、第四十七条）", url: "https://www.gov.cn/zhengce/zhengceku/2021-08/01/content_5628815.htm"}
    - {citation: "应急管理部 (2023). 关于政协第十三届全国委员会第五次会议第00969号提案答复的函：「2021年，全国共接报电动自行车火灾1.8万起，造成65人死亡、222人受伤，直接财产损失达2.21亿元，其中发生在建筑物内3782起，造成60人死亡、175人受伤」", url: "https://www.mem.gov.cn/gk/jytabljggk/zxwytadfzy/2022zx/202301/t20230119_440918.shtml"}
    - {citation: "应急管理部 (2025). 2025年1月15日新闻发布会：「每百万辆电动自行车火灾数量由2023年的5.6起下降至3起，火灾起数同比下降42.2%，伤亡人数下降超过90%」", url: "https://www.mem.gov.cn/xw/xwfbh/2025n01y15xwfbh_6337/"}
    - {citation: "应急管理部 (2024). 对十四届全国人大一次会议第7187号建议的答复：「将电动车（蓄电池）违规在室内停放或充电、未按要求设置防火分区等问题作为消防安全重大风险隐患专项排查整治2023行动整治重点」「向社会宣传提示\"车入楼、线出户、自拆改\"的火灾危险危害」", url: "https://www.mem.gov.cn/gk/jytabljggk/rddbjydfzy/2023_5984/202401/t20240130_476731.shtml"}
    - {citation: "北京市东城区人民政府转载北京消防 (2025). 北京消防条例：电动自行车、电池进电梯，个人最高可罚1000元：「禁止携带电动自行车、充电电池进入电梯轿厢。违规拒不改正的，可对单位处2000元以上1万元以下罚款，对个人处500元以上1000元以下罚款」", url: "https://www.bjdch.gov.cn/ztzl/aqsczbgjsnxd/zdgz/202504/t20250410_4061604.html"}

- id: ch01_i7
  chapter: 1
  item: 7
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Измерение давления и приём лекарств для его снижения до нормы", en: "Measuring blood pressure and taking meds to reach target levels"}
  grade: A
  measure: mortality
  plain:
    ru: "Каждое снижение систолического давления на 10 мм рт. ст. уменьшает вероятность серьёзных сердечно-сосудистых заболеваний примерно на 20%, инсульта — на 27%, сердечной недостаточности — на 28%, а риск смерти — на 13%. Среди жителей Китая в возрасте от 35 до 75 лет у 44,7% диагностировано высокое давление, но лишь у 7,2% оно находится под контролем."
    en: "For every 10 mmHg drop in blood pressure, the risk of major cardiovascular problems falls by 20%, stroke risk drops 27%, heart failure risk drops 28%, and overall mortality risk declines by 13%. Among Chinese adults aged 35–75, 44.7% have hypertension, but only 7.2% have their blood pressure under proper control."
  benefit:
    ru: "Анализ 123 клинических исследований с участием более 610 тысяч человек показал: снижение систолического давления на 10 мм рт. ст. ведёт к уменьшению основных сердечно-сосудистых осложнений примерно на 20%. Исходное значение относительного риска составляет 0,80, а 95% доверительный интервал — от 0,77 до 0,83. Систолическое давление — это большее из двух показателей артериального давления. Частота инсультов снижается примерно на 27% (RR 0,73), сердечной недостаточности — на 28% (RR 0,72). Общая смертность уменьшается на 13% (RR 0,87, 95% ДИ от 0,84 до 0,91). В ходе скрининга 1,7 миллиона жителей Китая в возрасте от 35 до 75 лет было выявлено, что у 44,7% имеется высокое давление: из них о своём диагнозе знают 44,7%, лечатся — 30,1%, а контроль над давлением достигнут лишь у 7,2%."
    en: "Data from 123 clinical trials involving over 610,000 participants shows that a 10 mmHg reduction in systolic blood pressure lowers the incidence of major cardiovascular events by roughly 20%. The relative risk is 0.80, with a 95% confidence interval of 0.77–0.83. Systolic blood pressure is the higher of the two readings taken during a measurement. Stroke risk drops by 27% (RR 0.73), heart failure risk drops by 28% (RR 0.72), and overall mortality drops by 13% (RR 0.87, 95% CI 0.84–0.91). A screening program in China involving 1.7 million adults aged 35–75 found that 44.7% had hypertension; of these, 44.7% were aware of their condition, 30.1% were receiving treatment, and only 7.2% had their blood pressure under control."
  numbers:
    - {kind: RR, value: 0.8, ci_low: 0.77, ci_high: 0.83}
    - {kind: RR, value: 0.73, ci_low: 0.84, ci_high: 0.91}
    - {kind: RR, value: 0.72, ci_low: 0.84, ci_high: 0.91}
    - {kind: RR, value: 0.87, ci_low: 0.84, ci_high: 0.91}
  sources:
    - {citation: "Ettehad D et al. (2016). Blood pressure lowering for prevention of cardiovascular disease and death: a systematic review and meta-analysis. Lancet", url: "https://doi.org/10.1016/S0140-6736(15)01225-8"}
    - {citation: "Lu J et al. (2017). Prevalence, awareness, treatment, and control of hypertension in China (China PEACE Million Persons Project). Lancet", url: "https://doi.org/10.1016/S0140-6736(17)32478-9"}
  doi: "10.1016/S0140-6736(15)01225-8"

- id: ch01_i8
  chapter: 1
  item: 8
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "После 35 лет при наличии избыточного веса стоит сдать анализ на уровень глюкозы в крови; если результат в норме, повторять исследование раз в три года", en: "After age 35, anyone who is overweight should get a fasting blood glucose test; if the result is normal, repeat it every three years"}
  grade: A
  measure: mortality
  plain:
    ru: "Всего за несколько десятков юаней можно сдать анализ крови и выявить преддиабет на самой ранней стадии, когда никаких симптомов ещё нет. Официальные рекомендации США гласят: людям в возрасте от 35 до 70 лет с избыточным весом или ожирением следует проходить такой скрининг. Если результаты в пределах нормы, повторять его нужно раз в три года."
    en: "For just a few dozen yuan, a single blood test can detect prediabetes even when there are absolutely no symptoms at all. Official US screening guidelines recommend this test for anyone aged 35 to 70 who is overweight or obese. If the test comes back normal, they should repeat it every three years."
  benefit:
    ru: "Американская рабочая группа по профилактическим услугам — это официальный орган, вырабатывающий рекомендации по скринингам в США. В настоящее время она советует проводить проверку на преддиабет и сахарный диабет 2 типа у взрослых в возрасте от 35 до 70 лет с избыточным весом или ожирением, даже при отсутствии каких-либо симптомов. Избыточный вес определяется как индекс массы тела ≥25, ожирение — как ≥30. Уровень рекомендации — B. В документе также указано: «Для людей с нормальным уровнем глюкозы в крови раз в три года проводить такой скрининг является разумной практикой»."
    en: "The US Preventive Services Task Force is the official body that issues screening recommendations in the US. Its current guidance states that adults aged 35 to 70 who are overweight or obese — even with no symptoms at all — should be screened for prediabetes and type 2 diabetes. Overweight is defined as a BMI of 25 or higher, while obesity means a BMI of 30 or higher. This recommendation is rated as a Grade B. The Task Force also explicitly notes: “It is reasonable to screen adults with normal blood glucose levels for prediabetes every three years.”"
  sources:
    - {citation: "US Preventive Services Task Force (2021). Screening for Prediabetes and Type 2 Diabetes. <https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/screening-for-prediabetes-and-type-2-diabetes>：「at a lower BMI (≥23) if the patient is Asian American」；国家卫生健康委办公厅 (2024). 居民体重管理核心知识（2024 年版）释义：「根据《成年人体重判定》（WS/T 428-2013）行业标准……24.0≤BMI＜28.0 为超重，BMI≥28.0 为肥胖」", url: "https://www.gov.cn/zhengce/zhengceku/202407/P020240703481519509521.pdf"}
    - {citation: "Wang L et al. (2021). Prevalence and Treatment of Diabetes in China, 2013-2018. JAMA：「In 2018, among adults with diabetes, 36.7% (95% CI, 34.7%-38.6%) reported being aware of their condition」「These rates did not change significantly from 2013.」", url: "https://doi.org/10.1001/jama.2021.22208"}
  doi: "10.1001/jama.2021.22208"

- id: ch01_i9
  chapter: 1
  item: 9
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Не превышать скорость и не садиться за руль в нетрезвом виде", en: "Don’t speed or drive after drinking"}
  grade: B
  measure: mortality
  plain:
    ru: "При увеличении средней скорости движения на 1% вероятность гибели людей в ДТП возрастает примерно на 4%. Для алкоголя не существует безопасного порога «выпить немного — и всё будет в порядке». Даже при низкой концентрации алкоголя в крови риск уже начинает расти."
    en: "On average, for every 1% increase in speed, the chance of a fatal crash rises by roughly 4%. There is no “safe” level of alcohol consumption when it comes to driving; even very low blood alcohol concentrations already raise the risk of accidents."
  benefit:
    ru: "Согласно данным Всемирной организации здравоохранения (ВОЗ), при повышении средней скорости на 1% риск смертельных ДТП увеличивается на 4%. Риск от вождения в нетрезвом виде начинает расти уже при очень низких концентрациях алкоголя в крови."
    en: "According to the World Health Organization (WHO), a 1% rise in average speed translates to a 4% increase in the likelihood of fatal crashes. The risk of a fatal crash also climbs steadily as blood alcohol concentration rises, even at very low levels."
  numbers:
    - {kind: OR, value: 3.6}
    - {kind: OR, value: 3.4}
  sources:
    - {citation: "WHO (2025). Road traffic injuries fact sheet：「Drivers using mobile phones are approximately 4 times more likely to be involved in a crash than drivers not using a mobile phone.」「Hands-free phones are not much safer than hand-held phone sets.」", url: "https://www.who.int/news-room/fact-sheets/detail/road-traffic-injuries"}
    - {citation: "Dingus TA et al. (2016). Driver crash risk factors and prevalence evaluation using naturalistic driving data. PNAS 113(10):2636-2641", url: "https://doi.org/10.1073/pnas.1513271113"}
    - {citation: "中华人民共和国道路交通安全法（2021 年修正）第二十二条第二款：「过度疲劳影响安全驾驶的，不得驾驶机动车」；第九十条：「处警告或者二十元以上二百元以下罚款」", url: "https://flk.npc.gov.cn/detail?id=ff8081817ab231eb017abd617ef70519"}
    - {citation: "中华人民共和国道路交通安全法实施条例（2017 年修订）第六十二条：驾驶机动车不得有「（三）拨打接听手持电话、观看电视等妨碍安全驾驶的行为」「（七）连续驾驶机动车超过4小时未停车休息或者停车休息时间少于20分钟」", url: "https://flk.npc.gov.cn/detail?id=ff8080816f3cbb3c016f40f566c10e23"}
    - {citation: "公安部 (2021). 道路交通安全违法行为记分管理办法（公安部令第 163 号）第十一条：一次记 3 分的有「（六）驾驶机动车有拨打、接听手持电话等妨碍安全驾驶的行为的」「（十四）连续驾驶载货汽车超过4小时未停车休息或者停车休息时间少于20分钟的」；第九条：一次记 9 分的有「（七）连续驾驶中型以上载客汽车、危险物品运输车辆超过4小时未停车休息或者停车休息时间少于20分钟的」", url: "http://www.gov.cn/gongbao/content/2022/content_5679697.htm"}
  doi: "10.1073/pnas.1513271113"

- id: ch01_i12
  chapter: 1
  item: 12
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Детей у воды нужно держать под присмотром; при катании на лодках и плавании в естественных водоемах следует надевать спасательные жилеты", en: "Keep young children in sight near water; wear life jackets when boating or swimming"}
  grade: A
  measure: mortality
  plain:
    ru: "Если ребенок наденет спасательный жилет перед падением в воду, вероятность утонуть снижается примерно вдвое. До сих пор утопление остается главной причиной смерти детей в возрасте от 1 до 14 лет в Китае. Уровень смертности от утопления в сельской местности примерно в два раза выше, чем в городах."
    en: "Wearing a life jacket while in the water cuts the risk of drowning to roughly half compared to not wearing one. Drowning remains the leading cause of death among children aged 1–14 in China. The drowning mortality rate in rural areas is roughly twice that in cities."
  benefit:
    ru: "Исследование, проведенное на основе данных Береговой охраны США, сопоставляло людей с похожими условиями. У тех, кто попадал в воду во время отдыха на лодке, риск утонуть при ношении спасательного жилета был примерно вдвое ниже. Исходное значение скорректированного отношения рисков составляло 0,51, а 95% доверительный интервал — от 0,35 до 0,74. Уровень смертности от утопления среди лиц младше 20 лет в Китае снизился с 6,60 случаев на 100 тысяч человек в 2013 году до 3,28 случаев на 100 тысяч человек в 2021 году; в сельской местности этот показатель примерно в два раза выше, чем в городах. Утопление по-прежнему остается главной причиной смерти детей в возрасте от 1 до 14 лет. В 2021 году на долю утопления пришлось 31,1% всех случаев смерти от травм среди лиц в возрасте от 0 до 19 лет, а на долю дорожно-транспортных происшествий — 27,9%."
    en: "Research using U.S. Coast Guard data compared similar groups of people. For individuals who fell overboard while boating recreationally, wearing a life jacket lowered their drowning risk by about half. The unadjusted RR was 0.51, with a 95% CI of 0.35–0.74. In China, the drowning mortality rate among people under 20 fell from 6.60 per 100,000 in 2013 to 3.28 per 100,000 in 2021; rural rates remained roughly twice those in cities. Drowning continues to be the top cause of death for children aged 1–14. In 2021, drowning accounted for 31.1% of all injury-related deaths among those aged 0–19, while road traffic injuries accounted for 27.9%."
  numbers:
    - {kind: RR, value: 0.51, ci_low: 0.35, ci_high: 0.74}
  sources:
    - {citation: "Cummings P et al. (2011). Association between wearing a personal floatation device and death by drowning among recreational boaters. Injury Prevention", url: "https://doi.org/10.1136/ip.2010.028688"}
    - {citation: "Li Z et al. (2023). Unintentional Drowning Mortality Among Individuals Under Age 20 — China, 2013–2021. China CDC Weekly：「in China, it is deemed the primary cause of death for children between the ages of 1 and 14. According to 2021 data, the rate of unintentional drowning in this age group is 3.23 per 100,000, surpassing road traffic injuries, the second leading cause of fatalities, by 0.99 per 100,000.」「rural areas exhibited roughly double the mortality rate found in urban areas」", url: "https://doi.org/10.46234/ccdcw2023.198"}
    - {citation: "Zhou J et al. (2024). Injury Mortality of Children and Adolescents Aged 0–19 Years — China, 2010–2021. China CDC Weekly：「drowning and road traffic crashes were the top two causes of child injury deaths, explaing 31.1% and 27.9% of total injury deaths」", url: "https://doi.org/10.46234/ccdcw2024.057"}
  doi: "10.1136/ip.2010.028688"

- id: ch01_i13
  chapter: 1
  item: 13
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Упражнения на равновесие и силу ног для людей старше 60 лет, а также модернизация ванной комнаты и лестниц в доме", en: "Exercising balance and leg strength for people over 60, plus home modifications"}
  grade: A
  measure: mortality
  plain:
    ru: "Если заниматься упражнениями на равновесие 2–3 раза в неделю, например тайцзицюанем, количество падений среди пожилых людей снижается примерно на 23%, а число тех, кто уже падал, — на 15%. Если в доме установить антискользящие покрытия и поручни, этот показатель снизится ещё примерно на 20%. Падения являются главной причиной смерти пожилых людей в Китае в возрасте старше 65 лет от травм; при этом более половины всех падений происходит именно дома."
    en: "Doing balance exercises such as Tai Chi two or three times weekly can cut the overall number of falls among older adults by roughly 23%. It also reduces the proportion of people who have fallen at least once by about 15%. Adding simple home modifications — like anti-slip mats and handrails — can lower fall rates by another 20% or so. Falls are the leading cause of injury-related deaths among Chinese seniors aged 65 and above; alarmingly, over half of all falls happen right at home."
  benefit:
    ru: "В исследовании Cochrane были проанализированы 108 клинических испытаний с участием 23 407 человек. Регулярные упражнения позволяют снизить количество падений у пожилых людей на 23%. Исходный показатель отношения частот падений (RaR) составляет 0,77, а 95% доверительный интервал — от 0,71 до 0,83. Число людей, которые уже падали, снижается на 15% (RR 0,85). Если пригласить специалистов для оценки безопасности дома и его модернизации, показатель падений уменьшится примерно на 20% (RR 0,81, 95% CI 0,68–0,97). Занятия тайцзицюанем снижают риск падений примерно на 29% (RR 0,71). В Китае падения остаются главной причиной смерти пожилых людей в возрасте старше 65 лет от травм; по данным мониторинга за 2018 год, 55,97% всех падений пожилых людей происходят в их собственных домах."
    en: "Cochrane analyzed 108 separate trials involving 23,407 participants. Collectively, these studies show that regular exercise lowers fall rates among older adults by 23%. The relative risk of falls dropped to 0.77, with a 95% confidence interval ranging from 0.71 to 0.83. The proportion of individuals experiencing at least one fall also fell by 15% (relative risk 0.85). Professional home safety assessments and modifications further reduced fall rates by roughly 20% (RR 0.81; 95% CI 0.68–0.97). Practicing Tai Chi specifically lowered fall risk by about 29% (RR 0.71). In China, falls remain the top cause of injury-related mortality for seniors over 65; data from 2018 indicates that 55.97% of all falls among this age group occur at home."
  numbers:
    - {kind: RR, value: 0.85, ci_low: 0.68, ci_high: 0.97}
    - {kind: RR, value: 0.81, ci_low: 0.68, ci_high: 0.97}
    - {kind: RR, value: 0.71}
  sources:
    - {citation: "Sherrington C et al. (2019). Exercise for preventing falls in older people living in the community. Cochrane Database of Systematic Reviews", url: "https://doi.org/10.1002/14651858.CD012424.pub2"}
    - {citation: "Gillespie LD et al. (2012). Interventions for preventing falls in older people living in the community. Cochrane Database of Systematic Reviews", url: "https://doi.org/10.1002/14651858.CD007146.pub3"}
    - {citation: "Lu Z et al. (2021). Characteristics of Falls Among Older People — China, 2018. China CDC Weekly", url: "https://doi.org/10.46234/ccdcw2021.013"}
  doi: "10.1002/14651858.CD012424.pub2"

- id: ch01_i14
  chapter: 1
  item: 14
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Анализ на наличие антител к гепатиту B и вакцинация при их отсутствии", en: "Get tested for hepatitis B markers; if no antibodies, get vaccinated"}
  grade: A
  measure: mortality
  plain:
    ru: "Проверка на наличие антител обойдётся в несколько десятков юаней. В ходе 30-летнего исследования в Цидуне у людей, получивших вакцину сразу после рождения, вероятность развития первичного рака печени оказалась ниже примерно на 84%, а доля носителей вируса гепатита B — ниже примерно на 72%. Взрослым, у которых при анализе не обнаружены антитела, рекомендуют пройти трёхкратный курс вакцинации за полгода; его стоимость составит примерно 100–200 юаней."
    en: "The test itself is very inexpensive. In Qidong’s 30‑year follow‑up study, infants who received the hepatitis B vaccine at birth had an 84% lower risk of developing primary liver cancer and a 72% lower rate of carrying the hepatitis B virus compared to unvaccinated peers. Adults found to have no antibodies should receive three vaccine doses over six months at a cost of roughly 100–300 yuan."
  benefit:
    ru: "В вышеупомянутом исследовании участники распределялись по группам, а не индивидуально, и наблюдение за ними велось в течение 30 лет. Вакцинация новорождённых позволила снизить частоту случаев первичного рака печени примерно на 84%. Доверительный интервал для этого показателя составляет от 23% до 97%. Доля людей с положительным результатом теста на наличие антигена HBsAg снизилась примерно на 72% (доверительный интервал — от 68% до 75%); этот показатель отражает долю носителей вируса среди населения. За период с 1992 по 2014 год общая доля носителей HBsAg в Китае уменьшилась на 52%, а среди детей младше 5 лет — на 97%."
    en: "This Qidong trial used group randomization rather than individual assignment and was tracked for three decades. Vaccination at birth cut primary liver cancer incidence by 84% (95% CI 23%–97%). The prevalence of hepatitis B surface antigen (HBsAg) fell by 72% (95% CI 68%–75%), reflecting a comparable drop in the proportion of people carrying the virus. Nationwide in China, HBsAg prevalence dropped 52% between 1992 and 2014, and fell 97% among children under five."
  sources:
    - {citation: "Qu C et al. (2014). Efficacy of neonatal HBV vaccination on liver cancer and other liver diseases over 30-year follow-up of the Qidong hepatitis B intervention study. PLoS Medicine：「The estimated efficacy of catch-up vaccination on HBsAg seroprevalence in early adulthood was 21% (95% CI 10%-30%), substantially weaker than that of the neonatal vaccination (72%, 95% CI 68%-75%).」", url: "https://doi.org/10.1371/journal.pmed.1001774"}
    - {citation: "Cui F et al. (2017). Prevention of Chronic Hepatitis B after 3 Decades of Escalating Vaccination Policy, China. Emerging Infectious Diseases", url: "https://doi.org/10.3201/eid2305.161477"}
    - {citation: "中国疾控中心. 乙型肝炎（疫苗免疫预防、常见问答第 4 问）", url: "https://www.chinacdc.cn/jkyj/mygh02/ymkyfjb/yxgy/"}
    - {citation: "CDC. Pink Book, Chapter 10: Hepatitis B（Immunogenicity and Vaccine Efficacy、Serologic Testing of Vaccine Recipients）", url: "https://www.cdc.gov/pinkbook/hcp/table-of-contents/chapter-10-hepatitis-b.html"}
    - {citation: "CDC (2023). Screening and Testing for Hepatitis B Virus Infection: CDC Recommendations — United States, 2023（表 1、Persons Who Are Fully Vaccinated Against HBV Infection）", url: "https://www.cdc.gov/mmwr/volumes/72/rr/rr7201a1.htm"}
  doi: "10.1371/journal.pmed.1001774"

- id: ch01_i16
  chapter: 1
  item: 16
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Чем раньше женщины получают вакцину против ВПЧ, тем лучше", en: "The earlier women get the HPV vaccine, the better"}
  grade: A
  measure: mortality
  plain:
    ru: "Согласно данным исследования, проведенного среди 1,67 млн женщин в Швеции, у тех, кто получил вакцину против ВПЧ до 17 лет, вероятность развития инвазивного рака шейки матки составила лишь около одной восьмой от показателя среди непривитых. У женщин, привитых в возрасте от 17 до 30 лет, этот риск снизился примерно вдвое. Следовательно, чем раньше сделана прививка, тем больше пользы."
    en: "Data from 1.67 million Swedish women show that those who received the HPV vaccine before age 17 have only about one‑eighth the risk of developing invasive cervical cancer compared to unvaccinated women. For women vaccinated between 17 and 30, the risk is roughly half that of non‑vaccinated peers. Therefore, getting vaccinated earlier offers the greatest benefit."
  benefit:
    ru: "В ходе того же исследования было установлено, что у привитых женщин частота возникновения инвазивного рака шейки матки значительно ниже, чем у непривитых. У тех, кто привился до 17 лет, этот показатель снизился примерно на 88% (отношение рисков — 0,12; 95% доверительный интервал — от 0,00 до 0,34). У женщин, привитых в возрасте от 17 до 30 лет, снижение составило около 53% (отношение рисков — 0,47; 95% доверительный интервал — от 0,27 до 0,75)."
    en: "Swedish research on 1.67 million women found that vaccinated individuals have a much lower incidence of invasive cervical cancer. Before age 17, vaccination reduces risk by roughly 88% (IRR 0.12, 95% CI 0.00–0.34). Vaccination between 17 and 30 still lowers risk by about 53% (IRR 0.47, 95% CI 0.27–0.75)."
  numbers:
    - {kind: IRR, value: 0.12, ci_low: 0, ci_high: 0.34}
    - {kind: IRR, value: 0.47, ci_low: 0.27, ci_high: 0.75}
  sources:
    - {citation: "Lei J et al. (2020). HPV Vaccination and the Risk of Invasive Cervical Cancer. New England Journal of Medicine", url: "https://doi.org/10.1056/NEJMoa1917338"}
    - {citation: "WHO. Cervical cancer fact sheet：「HPV vaccination is a priority for all girls aged 9–14 years, before they become sexually active.」", url: "https://www.who.int/news-room/fact-sheets/detail/cervical-cancer"}
  doi: "10.1056/NEJMoa1917338"

- id: ch01_i19
  chapter: 1
  item: 19
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Скрининг колоректального рака с 45–50 лет: иммунохимический тест на скрытую кровь в кале или колоноскопия", en: "Starting colorectal cancer screening at ages 45–50: use fecal immunochemical tests or colonoscopies"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "Если раз в пару лет делать недорогой тест на скрытую кровь в кале, вероятность смерти от колоректального рака снижается примерно на 16%; у людей, прошедших хотя бы один такой скрининг, этот показатель падает ещё на 25%. А у тех, кому назначили колоноскопию, вероятность заболеть раком в течение последующих 10 лет снижается с 1,20% до 0,98%."
    en: "Getting a low-cost fecal occult blood test every year or two lowers the chance of dying from colorectal cancer by roughly 16%. For people who’ve had at least one round of screening, this risk drops by about 25%. In the group invited to undergo a colonoscopy, the likelihood of developing colorectal cancer over the next decade fell from 1.20% to 0.98%."
  benefit:
    ru: "В рамках исследования Cochrane были проанализированы множество научных работ. У людей, проходивших скрининг с помощью иммунохимического теста на скрытую кровь в кале, риск смерти от колоректального рака снижался примерно на 16%. Исходное значение относительного риска составляло 0,84, а 95% доверительный интервал — от 0,78 до 0,90. У тех, кто прошёл хотя бы один такой скрининг, этот показатель падал примерно на 25% (относительный риск 0,75). В рандомизированном исследовании NordICC выяснилось, что у людей, которым назначили колоноскопию, частота возникновения колоректального рака за 10 лет снизилась с 1,20% до 0,98%. Исходное значение относительного риска здесь составляло 0,82, а 95% доверительный интервал — от 0,70 до 0,93."
    en: "Cochrane pooled data from multiple studies showing that individuals undergoing fecal occult blood screening have a roughly 16% lower risk of dying from colorectal cancer. The original RR was 0.84, with a 95% CI ranging from 0.78 to 0.90. For those who’ve had at least one screening round, this risk reduction reaches 25% (RR 0.75). The NordICC randomized trial likewise found that among participants invited to get a colonoscopy, colorectal cancer incidence dropped from 1.20% to 0.98% over 10 years; its RR was 0.82, with a 95% CI of 0.70–0.93."
  numbers:
    - {kind: RR, value: 0.84, ci_low: 0.78, ci_high: 0.9}
    - {kind: RR, value: 0.75}
    - {kind: RR, value: 0.82, ci_low: 0.7, ci_high: 0.93}
  sources:
    - {citation: "Hewitson P et al. (2007). Screening for colorectal cancer using the faecal occult blood test, Hemoccult. Cochrane Database of Systematic Reviews", url: "https://doi.org/10.1002/14651858.CD001216.pub2"}
    - {citation: "Bretthauer M et al. (2022). Effect of Colonoscopy Screening on Risks of Colorectal Cancer and Related Death. New England Journal of Medicine", url: "https://doi.org/10.1056/NEJMoa2208375"}
  doi: "10.1002/14651858.CD001216.pub2"

- id: ch01_i20
  chapter: 1
  item: 20
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Людям с сердечно-сосудистыми заболеваниями и пожилым людям стоит делать прививку от гриппа каждый год", en: "People with cardiovascular disease and older adults should get a flu shot each year"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "В ходе исследования, проведённого среди людей, перенёсших инфаркт миокарда, ежегодная прививка от гриппа позволила снизить уровень смертности за год с 4,9% до 2,9%. Для людей с сердечно-сосудистыми заболеваниями и пожилых людей такая прививка обойдётся в 50–150 юаней в год."
    en: "In a trial involving people after a heart attack, the yearly death rate dropped from 4.9% to 2.9% after they received the flu vaccine. For people with cardiovascular disease and older adults, getting one shot each autumn for just 50 to 150 yuan can make a real difference."
  benefit:
    ru: "В этом исследовании приняли участие 2571 человек, перенёсший инфаркт миокарда; их случайным образом разделили на две группы. Ни врачи, ни пациенты не знали, какая именно прививка им вводится. В итоге за 12 месяцев общий уровень смертности среди тех, кто получил вакцину, составил 2,9%, а среди группы с плацебо — 4,9%. Значение относительного риска составило 0,59, а 95% доверительный интервал — от 0,39 до 0,89. Плацебо представляет собой инъекцию без действующего вещества. Относительный риск сердечно-сосудистой смертности также равен 0,59. В другом исследовании, объединившем эти нескольких работ, у людей, получивших вакцину, частота основных сердечно-сосудистых осложнений составила 3,6%, а в контрольной группе — 5,4%. Значение относительного риска здесь равно 0,66, а 95% доверительный интервал — от 0,53 до 0,83. Относительный риск сердечно-сосудистой смертности равен 0,74; его 95% доверительный интервал — от 0,42 до 1,30, то есть разница находится в пределах погрешности и не считается статистически значимой."
    en: "This trial included 2,571 participants after a myocardial infarction; neither doctors nor patients knew who got the vaccine or the placebo. Over 12 months, the overall death rate was 2.9% in the vaccine group versus 4.9% in the placebo group. The hazard ratio was 0.59, with a 95% confidence interval of 0.39 to 0.89. Cardiovascular death rates also showed a hazard ratio of 0.59. Another study pooled multiple trials and found that flu vaccination lowered the rate of major cardiovascular events to 3.6% from 5.4% in the control group; the relative risk was 0.66, with a 95% confidence interval of 0.53 to 0.83. Cardiovascular death risk showed a relative risk of 0.74, though this fell within the margin of error and was not statistically significant (95% CI 0.42 to 1.30)."
  numbers:
    - {kind: HR, value: 0.59, ci_low: 0.39, ci_high: 0.89}
    - {kind: RR, value: 0.66, ci_low: 0.53, ci_high: 0.83}
    - {kind: RR, value: 0.74, ci_low: 0.42, ci_high: 1.3}
  sources:
    - {citation: "Fröbert O et al. (2021). Influenza Vaccination After Myocardial Infarction: A Randomized, Double-Blind, Placebo-Controlled, Multicenter Trial. Circulation", url: "https://doi.org/10.1161/CIRCULATIONAHA.121.057042"}
    - {citation: "Behrouzi B et al. (2022). Association of Influenza Vaccination With Cardiovascular Risk: A Meta-analysis. JAMA Network Open", url: "https://doi.org/10.1001/jamanetworkopen.2022.8873"}
  doi: "10.1161/CIRCULATIONAHA.121.057042"

- id: ch01_i21
  chapter: 1
  item: 21
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Вакцинация против опоясывающего герпеса после 50 лет", en: "Getting the shingles vaccine after age 50"}
  grade: A
  measure: mortality
  plain:
    ru: "В ходе третьей фазы клинических испытаний эта вакцина предотвратила развитие опоясывающего герпеса у 97% участников, результаты были схожими во всех возрастных группах. Недостаток лишь в том, что обе дозы стоят около трёх-четырёх тысяч юаней, и это полностью оплачивается из личного бюджета. Эти деньги позволяют снизить вероятность заболевания почти на 97%."
    en: "In Phase 3 trials, this vaccine proved 97% effective at preventing shingles across all age groups. The downside is that both doses cost several thousand yuan, all paid by the patient. In exchange, there’s a 97% reduction in the likelihood of developing shingles."
  benefit:
    ru: "В третьей фазе испытаний приняли участие 15 400 человек из 18 стран. Участников случайным образом разделили на две группы: одной вводили вакцину, другой — плацебо; наблюдение за ними продолжалось в среднем 3,2 года. В итоге у 6 человек из группы вакцинированных и у 210 человек из группы плацебо развился опоясывающий герпес. Если пересчитать эти показатели на 1000 человек в год, то получится 0,3 случая против 9,1 случая соответственно. Кроме того, в данных расчётах учитывается 0001 случая, 0001 случая и ещё 0001 случая. Согласно исследованию, общая эффективность вакцины составляет 97,2% (95% доверительный интервал: 93,7–99,0; p<0001). Для всех возрастных групп этот показатель находится в диапазоне от 96,6% до 97,9%."
    en: "This Phase 3 trial involved 15,400 participants from 18 countries. Participants were randomly assigned to receive either the vaccine or a placebo, with follow-up lasting an average of 3.2 years. Over that time, 6 cases of shingles occurred in the vaccine group versus 210 in the placebo group. Expressed per 1,000 person-years, these figures translate to 0.3 versus 9.1 cases. One thousand person-years represents the number of cases observed in a group of 1,000 people over one year. The original report states, “The overall vaccine efficacy against shingles is 97.2% (95% CI 93.7–99.0, P<0.001).” Effectiveness ranged from 96.6% to 97.9% across all age brackets."
  sources:
    - {citation: "Lal H, Cunningham AL, Godeaux O, et al. (2015). Efficacy of an adjuvanted herpes zoster subunit vaccine in older adults. New England Journal of Medicine, 372(22), 2087-2096：「There were solicited or unsolicited reports of grade 3 symptoms in 17.0% of vaccine recipients and 3.2% of placebo recipients. The proportions of participants who had serious adverse events or potential immune-mediated diseases or who died were similar in the two groups.」", url: "https://doi.org/10.1056/NEJMoa1501184"}
  doi: "10.1056/NEJMoa1501184"

- id: ch01_i24
  chapter: 1
  item: 24
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Тяжелым курильщикам раз в год следует делать низкодозовую КТ грудной клетки", en: "Heavy smokers should get a low-dose chest CT once a year"}
  grade: A
  measure: mortality
  plain:
    ru: "Тяжелым курильщикам, соответствующим критериям, рекомендуется раз в год проходить низкодозовую КТ грудной клетки. Это снижает риск смерти от рака легких на 20% по сравнению с обычной рентгенографией, а общий риск смертности — на 6,7%. Однако придется оплачивать повторные обследования при выявлении подозрительных изменений и переживать в ожидании результатов."
    en: "Eligible heavy smokers who get a low-dose CT once a year have a 20% lower risk of dying from lung cancer and a 6.7% lower overall risk of death compared to those who only get regular chest X-rays. The trade-offs are extra follow-up tests after any suspicious findings and the resulting worry during the waiting period."
  benefit:
    ru: "При рандомизированного исследования NLST в США приняли участие 53 454 человека в возрасте от 55 до 74 лет с более чем 30-летним стажем курения, которые бросили примерно 15 лет назад. В результате у тех, кто проходил низкодозовую КТ, риск смерти от рака легких снизился на 20,0% по сравнению с группой, проходившей обычную рентгенографию. Доверительный интервал 95% CI составляет от 6,8 до 26,7%. Общий риск смертности снизился на 6,7% (95% CI: 1,2–13,6)."
    en: "The NLST trial in the U.S. enrolled 53,454 participants aged 55–74 with at least 30 pack-years of smoking history and who had quit smoking no more than 15 years prior. Those who underwent low-dose CT had a 20.0% relative reduction in lung cancer deaths versus those who only got chest X-rays. The 95% confidence interval is 6.8–26.7. Overall mortality dropped by 6.7% relative to controls, with a 95% CI of 1.2–13.6."
  sources:
    - {citation: "National Lung Screening Trial Research Team (2011). Reduced Lung-Cancer Mortality with Low-Dose Computed Tomographic Screening. New England Journal of Medicine：「The rate of positive screening tests was 24.2% with low-dose CT and 6.9% with radiography over all three rounds. A total of 96.4% of the positive screening results in the low-dose CT group and 94.5% in the radiography group were false positive results.」", url: "https://doi.org/10.1056/NEJMoa1102873"}
  doi: "10.1056/NEJMoa1102873"

- id: ch01_i25
  chapter: 1
  item: 25
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "При возникновении депрессии или суицидальных мыслей звоните по номеру 12356; дома не храните снотворные и пестициды", en: "Call 12356 if you’re depressed or having suicidal thoughts; don’t keep sleeping pills or pesticides at home"}
  grade: B
  measure: mortality
  plain:
    ru: "Убирая из дома предметы, способные привести к гибели, можно добиться хороших результатов: после ограничения доступа к обезболивающим уровень суицидов снизился на 43%; после установки защитных ограждений в местах частых прыжков с высоты — на 86%. Поэтому дома не стоит хранить снотворные и пестициды. Когда накатывают плохие мысли, сразу звоните по бесплатному номеру 12356 — он работает по всей стране не менее 18 часов в сутки."
    en: "Removing lethal items from easy reach is a proven way to cut suicide risk: after restricting access to painkillers, suicide rates linked to them dropped by 43%; installing barriers at locations where people often jump off cliffs cut rates by 86%. That’s why it’s a good idea to avoid storing sleeping pills and pesticides at home. If you’re feeling overwhelmed, call 12356 — this national helpline is available at least 18 hours a day."
  benefit:
    ru: "В обзоре, охватывающем исследования последних 10 лет, подчеркивается, что ограничение доступа к смертоносным средствам дает всё более убедительные результаты. После контроля над обезболивающими уровень суицидов, связанных с их применением, снизился на 43%. В местах частых прыжков с высоты после установки защитных ограждений уровень суицидов упал на 86% (диапазон достоверности — от 79% до 91%). Программы по развитию когнитивных навыков в школах позволяют снизить число попыток суицида примерно на 55% (OR 0.45, 95% CI 0.24–0.85). Лекарства от депрессии и психотерапия также являются важной частью профилактики суицидов. С 1 мая 2025 года по всей Китаю действует бесплатная психологическая линия помощи 12356, работающая не менее 18 часов в сутки."
    en: "A recent review of nearly a decade’s worth of research confirms that limiting people’s access to lethal means is an effective suicide prevention strategy. After controls on painkiller availability were put in place, suicide cases tied to these drugs fell by 43%. Installing protective barriers at common suicide hotspots reduced rates by 86% (the 95% confidence interval ranges from 79% to 91%). School-based cognitive intervention programs also lowered rates of attempted suicide by roughly 55% (OR 0.45, 95% CI 0.24–0.85). Antidepressant medications and psychotherapy are also key components of suicide prevention. Starting May 1, 2025, the 12356 helpline will be available nationwide in China, operating at least 18 hours each day."
  numbers:
    - {kind: OR, value: 0.45, ci_low: 0.24, ci_high: 0.85}
  sources:
    - {citation: "Zalsman G et al. (2016). Suicide prevention strategies revisited: 10-year systematic review. Lancet Psychiatry", url: "https://doi.org/10.1016/S2215-0366(16)30030-X"}
    - {citation: "国家卫生健康委 (2024). 关于应用\"12356\"全国统一心理援助热线电话号码的通知（国卫医政函〔2024〕259 号）", url: "https://www.gov.cn/zhengce/zhengceku/202412/content_6994470.htm"}
  doi: "10.1016/S2215-0366(16)30030-X"

- id: ch01_i30
  chapter: 1
  item: 30
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Использование презервативов на протяжении всего полового акта, а также отказ от совместного использования игл", en: "Always use condoms during sex and never share needles"}
  grade: A
  measure: mortality
  plain:
    ru: "Если использовать презерватив на протяжении всего полового акта, вероятность заражения ВИЧ при гетеросексуальных контактах снижается примерно на 70% и более. При этом эффект от «частого использования» практически не отличается от отсутствия использования вовсе. Презерватив также защищает от сифилиса, гонореи и других инфекций, передающихся половым путем."
    en: "Using a condom every time throughout sex cuts the chance of HIV transmission between heterosexual partners by roughly 70% or more. “Most of the time” just isn’t enough — that still leaves the risk nearly as high as not using one at all. Condoms also protect against syphilis, gonorrhea, and other STIs."
  benefit:
    ru: "В одном исследовании были проанализированы 25 работ, в которых участвовали 10 676 гетеросексуальных пар, где у одного партнера был ВИЧ, а у другого — нет. По сравнению с людьми, никогда не использующими презервативы, у тех, кто применяет их строго каждый раз, риск передачи ВИЧ снижается примерно на 71%. Исходное значение относительного риска составляет 0,29, а 95% доверительный интервал — от 0,20 до 0,43. По сравнению с теми, кто использует презервативы нерегулярно, этот показатель ниже примерно на 77% (относительный риск 0,23, 95% доверительный интервал от 0,13 до 0,40). Авторы исследования пришли к выводу, что хотя презервативы и не являются идеальным средством защиты, их регулярное использование позволяет снизить риск передачи ВИЧ более чем на 70%. Такая же защита распространяется и на сифилис, гонорею, хламидиоз и другие инфекции, передающиеся половым путем."
    en: "One study pooled data from 25 separate studies involving 10,676 heterosexual couples in which one partner was HIV‑positive and the other was not. Compared to couples who never used condoms, those who consistently used them saw their HIV transmission risk drop by about 71%. The reported relative risk was 0.29, with a 95% confidence interval of 0.20–0.43. When compared to couples who used condoms only intermittently, the risk was lower by roughly 77% (RR = 0.23; 95% CI 0.13–0.40). The authors concluded that although condoms are not perfect, “consistent use can reduce HIV transmission by more than 70%.” This same level of protection also applies to syphilis, gonorrhea, chlamydia, and other sexually transmitted infections."
  numbers:
    - {kind: RR, value: 0.29, ci_low: 0.2, ci_high: 0.43}
    - {kind: RR, value: 0.23, ci_low: 0.13, ci_high: 0.4}
  sources:
    - {citation: "Giannou FK, Tsiara CG, Nikolopoulos GK, et al. (2016). Condom effectiveness in reducing heterosexual HIV transmission: a systematic review and meta-analysis of studies on HIV serodiscordant couples. Expert Review of Pharmacoeconomics & Outcomes Research, 16(4), 489-499", url: "https://doi.org/10.1586/14737167.2016.1102635"}
    - {citation: "Fonner VA et al. (2016). Effectiveness and safety of oral HIV preexposure prophylaxis for all populations. AIDS. <https://doi.org/10.1097/QAD.0000000000001145>（暴露前预防 PrEP）；WHO (2025). Sexually transmitted infections (STIs) fact sheet：「When used correctly and consistently, condoms offer one of the most effective methods of protection against STIs, including HIV. Although highly effective, condoms do not offer protection for STIs that cause extra-genital ulcers (i.e., syphilis or genital herpes).」", url: "https://www.who.int/news-room/fact-sheets/detail/sexually-transmitted-infections-(stis)"}
  doi: "10.1586/14737167.2016.1102635"

- id: ch01_i32
  chapter: 1
  item: 32
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Как только возникла мысль о самоубийстве, сразу расскажите об этом близкому человеку и отдайте эти несколько десятков минут ему", en: "As soon as suicidal thoughts arise, tell someone nearby and hand over those first few minutes"}
  grade: B
  measure: mortality
  plain:
    ru: "Среди 82 человек, совершивших попытку самоубийства, 47,6 % отметили, что с момента возникновения мысли до реальных действий прошло не более 10 минут. Нужно пережить не всю жизнь, полную неразрешимых проблем, а лишь эти несколько десятков минут. У 76,8 % из этой же группы в этот период был контакт с кем-то, просто они не поделились своими мыслями. В дальнейшем примерно 2 % людей, попавших в больницу из-за самоповреждений, умирают от самоубийства в течение года, а спустя 9 лет — около 7 %. Большинство же в итоге не идут по этому пути."
    en: "Among 82 people who attempted suicide, 47.6% reported that only 10 minutes or less passed from the first appearance of suicidal thoughts to the actual attempt. What they had to endure was not a lifetime of mental anguish, but just those few minutes. Of the same group, 76.8% had some contact with others during that time, though they did not voice their feelings. Looking ahead, about 2% of people who ended up in the hospital due to self-harm died by suicide within a year, while roughly 7% did so after nine years or more; the vast majority did not follow that path."
  benefit:
    ru: "В ходе опроса 82 человек, совершивших попытку самоубийства, в течение 3 дней после госпитализации 47,6 % (39 человек) сообщили, что с момента первого возникновения мысли о самоубийстве до реальных действий прошло не более 10 минут. У тех, у кого этот период затягивался, показатели по шкале суицидальных намерений были значительно выше. Однако длительность этого периода не влияла на результаты по шкале импульсивности. 76,8 % (63 человека) отметили, что в это время имели какой-то контакт с партнером, родственниками или друзьями. Авторы пришли к выводу, что временное окно для вмешательства обычно очень узкое, поэтому у специалистов в этот период мало возможностей для помощи; поэтому необходимо распространять знания о признаках и методах вмешательства среди обычных людей. Еще один систематический обзор объединил 90 исследований с последующим наблюдением. Среди людей, обратившихся в больницу из-за самоповреждений, доля тех, кто снова нанесет себе вред, но не умрет, в течение года составляет в среднем 16 %. Доля умерших от самоубийства за год — 2 %. Спустя более 9 лет от самоубийства умирает около 7 %."
    en: "Interviews conducted within three days of admission with those 82 individuals showed that 47.6% (39 people) stated the interval between the first emergence of suicidal thoughts and the actual attempt was no more than 10 minutes. Those whose process took longer displayed significantly higher scores on measures of suicidal intent. However, impulse scores showed no correlation with the duration of this period. Additionally, 76.8% (63 people) reported having some sort of interaction with a partner, family member, or friend during those minutes. The authors conclude that the window for intervention is usually very brief, leaving limited room for professionals to step in; thus, it is crucial to spread awareness of warning signs and basic intervention methods to ordinary people. Another systematic review compiled findings from 90 follow-up studies. For those seeking medical care after self-harm, the median rate of repeated self-harm without resulting in death was 16% after one year, while the suicide mortality rate at that point stood at 2%. After nine years or more of follow-up, roughly 7% had died by suicide."
  sources:
    - {citation: "Deisenhammer EA, Ing CM, Strauss R, Kemmler G, Hinterhuber H, Weiss EM (2009). The duration of the suicidal process: how much time is left for intervention between consideration and accomplishment of a suicide attempt? Journal of Clinical Psychiatry, 70(1), 19-24", url: "https://doi.org/10.4088/JCP.07m03904"}
    - {citation: "Owens D, Horrocks J, House A (2002). Fatal and non-fatal repetition of self-harm: systematic review. British Journal of Psychiatry, 181, 193-199", url: "https://doi.org/10.1192/bjp.181.3.193"}
  doi: "10.4088/JCP.07m03904"

- id: ch01_i37
  chapter: 1
  item: 37
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Если вы занимаетесь азартными играми до такой степени, что берёте в долг, а настроение постоянно подавленное, сначала позвоните на 12356, а затем передайте свою банковскую карту и пароли от платежных систем родственникам", en: "When gambling leads to borrowing money and persistent low mood, call 12356 first and then hand over your bank cards and payment passwords to family members"}
  grade: B
  measure: mortality
  plain:
    ru: "Среди людей, обращавшихся за помощью по проблемам азартных игр, уровень смертности от самоубийств в 15 раз выше, чем у сверстников, а общая смертность — в 1,8 раза выше. Главным признаком, предвещающим суицид, является депрессия. Поэтому, если вы играете в азартные игры до долгов и чувствуете постоянную подавленность, сразу звоните на 12356."
    en: "Individuals who have sought treatment for gambling problems are 15 times more likely to die by suicide and 1.8 times more likely to die overall compared to their peers. Depression serves as a key warning sign for potential suicide. Therefore, if you find yourself gambling despite owing money and feeling persistently down, call 12356 right away."
  benefit:
    ru: "В Швеции провели национальное регистровое исследование 2099 человек, у которых в период с 2005 по 2016 год в специализированных клиниках диагностировали расстройство азартного поведения — неспособность контролировать игру, несмотря на её негативные последствия. По сравнению со сверстниками, общая смертность этих людей в возрасте от 20 до 74 лет оказалась в 1,8 раза выше, а смертность от самоубийств — в 15 раз выше (эти показатели называются стандартизированным коэффициентом смертности SMR). За время наблюдения умерли 67 человек, из них 21 — в результате самоубийства. Ключевым фактором риска суицида выступает депрессия. В 2023 году авторы опубликовали уточнение: для мужчин этот показатель составляет 12,1 раза, для женщин — 16,1 раза. С 1 мая 2025 года в Китае по всей стране начала работать круглосуточная психологическая помощь по номеру 12356, доступная не менее 18 часов в день (данные Швеции и общенациональная статистика)."
    en: "A nationwide Swedish registry study examined 2,099 individuals diagnosed with gambling disorder between 2005 and 2016. Gambling disorder is defined as an inability to control gambling habits, which negatively impacts daily life. Compared to the general Swedish population aged 20–74, these individuals showed a 1.8-fold increase in overall mortality and a 15-fold increase in suicide mortality (these figures represent standardized mortality ratios). Over the follow-up period, 67 participants died, including 21 from suicide. Depression proved to be a reliable predictor of suicide risk. In a 2023 correction, researchers reported that the suicide risk was 12.1 times higher for men and 16.1 times higher for women. Starting May 1, 2025, China launched a nationwide mental health hotline at 12356, available at least 18 hours per day."
  sources:
    - {citation: "Karlsson A, Håkansson A. (2018). Gambling disorder, increased mortality, suicidality, and associated comorbidity: A longitudinal nationwide register study. Journal of Behavioral Addictions, 7(4), 1091–1099", url: "https://doi.org/10.1556/2006.7.2018.112"}
    - {citation: "Karlsson A, Håkansson A. (2023). Corrigendum to: Gambling disorder, increased mortality, suicidality, and associated comorbidity. Journal of Behavioral Addictions, 12(1), 302", url: "https://doi.org/10.1556/2006.2023.10000"}
    - {citation: "国家卫生健康委 (2024). 关于应用\"12356\"全国统一心理援助热线电话号码的通知（国卫医政函〔2024〕259 号）", url: "https://www.gov.cn/zhengce/zhengceku/202412/content_6994470.htm"}
  doi: "10.1556/2006.7.2018.112"

- id: ch01_i41
  chapter: 1
  item: 41
  chapter_title: {ru: "Как не умереть раньше времени", en: "How to avoid premature death"}
  title: {ru: "Перед выходом на дикий лёд необходимо просверлить отверстия и измерить его толщину — не стоит выходить, если она меньше 15 см. Избегайте льда на реках и вблизи лунок для ловли рыбы", en: "Drill holes to measure ice thickness before stepping onto it; don’t go out if it’s under 15 cm thick. Avoid ice over rivers and near ice-fishing holes"}
  grade: C
  measure: mortality
  plain:
    ru: "Официальные российские рекомендации гласят, что для безопасного катания взрослым людям толщина льда должна составлять минимум 15 см. В США и Канаде минимальный порог — 10 см, причём учитывается только свежий прозрачный лёд. Мутный лёд по прочности уступает прозрачному вдвое, поэтому его толщину следует удваивать. На одном и том же водоёме толщина льда может сильно различаться: в одном месте она составит 30 см, а в нескольких шагах оттуда — всего 2-3 см, поэтому измерять её нужно постоянно во время движения."
    en: "Official Chinese guidelines state that ice must be at least 15 cm thick before adults can safely skate on it. In the U.S. and Canada, the minimum threshold is 10 cm, but only for newly formed, transparent ice. White ice is only half as strong, so its thickness must be doubled to be considered safe. Even on the same body of water, ice can be 12 cm thick in one spot and just 2–3 cm a few steps away; therefore, you must measure it as you go."
  benefit:
    ru: "Согласно данным Метеорологического управления Китая, при толщине льда 15 см взрослые люди могут безопасно кататься на нём. Для открытия открытых катков также требуется, чтобы толщина льда достигала 15 см. Управление водных ресурсов Пекина указывает, что для открытия официальных естественных катков толщина льда должна составлять 15 см, а в течение последующей недели температура воздуха должна удерживаться в диапазоне от -8°C до +1°C без сильных ветров. На диких водоёмах часто встречаются лунки, пробитые рыбаками, после чего лёд в этом месте снова замерзает с трудом. Руководство Департамента природных ресурсов штата Миннесота (США) касается только свежих прозрачных льдов: если их толщина меньше 4 дюймов (около 10 см), выходить на них нельзя, а при такой толщине можно ходить и ловить рыбу. Мутный лёд, образовавшийся после таяния и повторного замерзания снега, по прочности уступает прозрачному вдвое, поэтому его толщину следует удваивать. На одном и том же водоёме толщина льда может сильно различаться: в одном месте она составит 30 см, а в нескольких шагах оттуда — всего 2-3 см. Лёд на проточных водах обычно опасен, особенно вблизи ручьёв, мостов и водопропускных труб. Лёд у берега также может быть тоньше, чем в открытой части водоёма. Национальное метеорологическое управление США устанавливает такой же порог толщины льда в 4 дюйма для ходьбы, ловли рыбы и катания. Канадский центр охраны труда и безопасности ссылается на рекомендации Красного Креста Канады: для группы людей, выходящих на лёд для катания или ходьбы, требуется толщина 15 см, а для массовых катальных мероприятий — 20 см. Все эти рекомендации являются мерами безопасности, однако никакие исследования не подтверждают, насколько снижается количество смертельных случаев при их соблюдении (в Китае, США и Канаде)."
    en: "According to the China Meteorological Administration, ice must reach 15 cm thickness before adults can skate on it, and outdoor rinks must also meet this standard to open. The Beijing Municipal Water Authority adds that natural ice rinks must have 15 cm of ice, plus stable temperatures between -8°C and 1°C without strong winds for at least a week before they become safe. Natural ice often contains holes drilled by anglers, which rarely freeze shut again. Minnesota’s Department of Natural Resources specifies that only transparent, newly formed ice under 4 inches (≈10 cm) thick is safe for walking or ice fishing; white ice formed after snow melts is only half as strong, so its thickness must be doubled. Ice thickness can vary dramatically across a single water body — sometimes 12 cm in one area and just 2–3 cm a few feet away. Ice over flowing water is especially hazardous, particularly near streams, bridges, and culverts; shore ice is often thinner than ice farther out. The U.S. National Weather Service sets the same minimum threshold of 4 inches for walking, ice fishing, and skating. The Canadian Centre for Occupational Health and Safety cites the Canadian Red Cross: groups of skaters or walkers need at least 15 cm of ice, while larger gatherings require 20 cm. These are safety guidelines only; no studies have quantified how many lives they actually save (nationwide, in the U.S. and Canada)."
  sources:
    - {citation: "中国气象局 (2019). 想要冰上健步走，多厚的冰才安全？", url: "https://www.cma.gov.cn/kppd/kppdqxyr/kppdtyqx/201901/t20190124_513302.html"}
    - {citation: "北京市水务局 (2024). 北京正规河湖冰场还未达开放标准，别冒险滑「野冰」：「立春之后，随着气温回暖，冰面一天比一天薄，有些地方融化、渗水，随时有破裂的危险，所以立春之后不能上冰」「如果冰层的下部分看起来是丝丝的冰柱，就要特别注意，因为这些竖茬的冰说明冰层内部已经变酥」", url: "https://swj.beijing.gov.cn/swdt/ztzl/fnsbaqztxc/fnszlxx/202412/t20241226_3973959.html"}
    - {citation: "Minnesota Department of Natural Resources. General ice thickness guidelines", url: "https://www.dnr.state.mn.us/safety/ice/thickness.html"}
    - {citation: "Minnesota Department of Natural Resources. Ice safety", url: "https://www.dnr.state.mn.us/safety/ice/index.html"}
    - {citation: "Minnesota Department of Natural Resources. Steps for surviving immersion", url: "https://www.dnr.state.mn.us/safety/ice/survival.html"}
    - {citation: "National Weather Service. Winter Weather Safety: Ice and Frost", url: "https://www.weather.gov/safety/winter-ice-frost"}

- id: ch34_i12
  chapter: 34
  item: 12
  chapter_title: {ru: "Домашние лекарства: как не навредить себе", en: "Do not let medicines kept at home cause serious harm"}
  title: {ru: "Пока пьёте средство от простуды или от аллергии с хлорфенирамином (扑尔敏) или дифенгидрамином, не садитесь за руль, не работайте на высоте и не управляйте механизмами", en: "After a cold medicine or an anti-allergy medicine that contains chlorphenamine (also called chlorpheniramine) or diphenhydramine, do not drive while you are taking it, and do not work at a height or operate a machine"}
  grade: B
  measure: mortality
  plain:
    ru: "Во многие комплексные средства от простуды добавлены противоаллергические компоненты вроде хлорфенирамина и дифенгидрамина, и от них клонит в сон. Государственное управление по контролю за лекарствами предупреждает: пока пьёте такие средства, не садитесь за руль, не работайте на высоте и не управляйте механизмами. На автомобильном тренажёре люди после дифенгидрамина вели машину хуже, чем после алкоголя. То, что сами не чувствуете сонливости, не значит, что за рулём всё в порядке."
    en: "Many combination cold medicines mix in an anti-allergy ingredient such as chlorphenamine or diphenhydramine, and taking it makes you drowsy. The national drug regulator says that while you are taking this kind of drug, do not drive, do not work at a height, and do not operate a machine. On a driving simulator, people who had taken diphenhydramine drove worse than people who had drunk alcohol. Feeling that you are not drowsy does not mean the driving is fine."
  benefit:
    ru: "В бюллетене о нежелательных реакциях на лекарства за 2010 год Государственное управление по контролю за лекарствами пишет: таблетки «витамин C иньцяо» (维C银翘片) содержат хлорфенирамина малеат, его же называют пуэрмин (扑尔敏). Нежелательные реакции в основном сонливость, чувство слабости, дремота и сухость во рту. Бюллетень советует врачам и аптекам говорить пациенту: на время приёма нельзя управлять самолётом, машиной и судном, нельзя работать на высоте, работать с механизмами и с точными приборами. В обращении к публике о применении лекарств за 2020 год то же управление пишет: в комплексных средствах от простуды часто есть противоаллергические компоненты вроде хлорфенирамина и дифенгидрамина, и от них клонит в сон. Тем, кто водит, управляет механизмами или работает на высоте, такие средства надо применять с осторожностью. В американском испытании на автомобильном тренажёре было 40 водителей с сезонным аллергическим насморком, возраст от 25 до 44 лет. Каждый с интервалом в неделю менял условие и каждый раз ехал 1 час: дифенгидрамин 50 мг, фексофенадин 60 мг, алкоголь до концентрации в крови около 0.1%, плацебо. Фексофенадин — противоаллергическое средство, от которого не клонит в сон. Способность держать скорость машины впереди была хуже всего после дифенгидрамина; после алкоголя и после фексофенадина она была заметно лучше. Способность держаться в полосе ухудшалась и после алкоголя, и после дифенгидрамина. Когда машина впереди внезапно перекрывала путь, медленнее всего реагировали после алкоголя: в среднем 2.21 секунды, после фексофенадина — 1.95 секунды. После фексофенадина ехали примерно так же, как после плацебо. Вывод авторов: дифенгидрамин влияет на вождение сильнее, чем алкоголь. По тому, насколько сонным водитель называл себя сам, не было видно, хорошо ли он едет, поэтому решать, можно ли садиться за руль, по ощущению «клонит или не клонит» нельзя."
    en: "A 2010 adverse-reaction bulletin from the National Medical Products Administration says that vitamin C Yinqiao tablets (维C银翘片) contain chlorphenamine maleate, also called chlorpheniramine (扑尔敏). The adverse reactions are mainly drowsiness, a feeling of weakness, sleepiness, and a dry mouth. The bulletin advises doctors and pharmacies to tell the patient: while taking the drug, do not operate an aircraft, a vehicle, or a boat, and do not do work at a height, mechanical work, or operate a precision instrument. A 2020 public medication notice from the National Medical Products Administration says that combination cold medicines often contain an anti-allergy ingredient such as chlorphenamine or diphenhydramine, and that taking them causes drowsiness. People who drive, operate machinery, or work at a height should be cautious. A US driving-simulator trial enrolled 40 drivers with seasonal allergic rhinitis, aged 25 to 44. Each person switched treatment a week apart and drove for 1 hour under each: diphenhydramine 50 mg, fexofenadine 60 mg, alcohol up to a blood alcohol concentration of about 0.1%, and a placebo. Fexofenadine is an anti-allergy drug that does not cause drowsiness. The ability to match the speed of the car ahead was worst after diphenhydramine, and clearly better both after alcohol and after fexofenadine. The ability to hold the lane got worse both after alcohol and after diphenhydramine. When the car ahead suddenly blocked the way, the reaction was slowest after alcohol, a mean of 2.21 seconds, and after fexofenadine it was 1.95 seconds. Driving on fexofenadine was about the same as driving on placebo. The authors' conclusion is that diphenhydramine affects driving more than alcohol does. The drowsiness a driver reported did not show how well they drove, so \"whether I feel drowsy\" cannot decide whether they can drive."
  sources:
    - {citation: "国家食品药品监督管理局 (2010). 药品不良反应信息通报（第32期）关注中西药复方制剂维C银翘片的安全性问题", url: "https://www.nmpa.gov.cn/xxgk/yjjsh/ypblfytb/20100919162601498.html"}
    - {citation: "国家药品监督管理局 (2020). 2020年公众十大用药提示丨（三）感冒用药须谨慎，安全合理是关键", url: "https://www.nmpa.gov.cn/xxgk/kpzhsh/kpzhshyp/20201111095256170.html"}
    - {citation: "Weiler JM, Bloomfield JR, Woodworth GG, et al. (2000). Effects of fexofenadine, diphenhydramine, and alcohol on driving performance. A randomized, placebo-controlled trial in the Iowa driving simulator. Annals of Internal Medicine, 132(5):354-363", url: "https://doi.org/10.7326/0003-4819-132-5-200003070-00004"}

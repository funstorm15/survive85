- id: ch34_i1
  chapter: 34
  item: 1
  chapter_title: {ru: "Домашние лекарства: как не навредить себе", en: "Do not let medicines kept at home cause serious harm"}
  title: {ru: "Прежде чем пить сразу два средства от простуды или два обезболивающих, сверьте состав: парацетамол должен быть только в одном, а если приняли лишнее — в тот же день в больницу, даже когда ничего не болит", en: "Before taking two cold medicines or painkillers at the same time, read the ingredient list, keep acetaminophen in a single product, and go to the hospital the same day if you took too much even without feeling ill"}
  grade: B
  measure: mortality
  plain:
    ru: "Во многих средствах от простуды есть парацетамол. Если принять такие коробки вместе, получается двойная доза, а лишнее бьёт по печени. В США среди людей с острой печёночной недостаточностью из-за него почти три из десяти умерли, не дождавшись пересадки печени. В китайских инструкциях советуют не больше 2 граммов в сутки, а в США ещё напоминают: на фоне лекарства не пить больше 3 бокалов алкоголя в день. Если приняли лишнее, в больницу сразу, даже когда ничего не болит: противоядие работает тем лучше, чем раньше его дать."
    en: "Many cold medicines contain acetaminophen. Taking 2 boxes together means a double dose, and too much harms the liver. In the United States, among people whose liver failed suddenly because of it, nearly 3 in 10 died before they could get a new liver. Leaflets in China advise at most 2 grams a day. The United States also warns against more than 3 cups of alcohol a day while taking it. If you took too much, go to the hospital right away even if you feel fine. The antidote works better the sooner it is used."
  benefit:
    ru: "В 22 больницах США за 6 лет подряд зарегистрировали 662 случая острой печёночной недостаточности. Из них 275 (42%) вызвал парацетамол (对乙酰氨基酚), медиана проглоченной дозы — 24 грамма. Из этих 275 человек 131 (48%) приняли лишнее случайно, не намеренно. Среди случайных передозировок в 38% человек одновременно пил 2 или больше препаратов с этим веществом. Из этих 275 человек 27% умерли, не дождавшись пересадки печени, 8% пересадку получили. В 2020 году Государственное управление по контролю за лекарствами Китая потребовало писать в инструкциях безрецептурных препаратов: передозировка вызывает тяжёлое повреждение печени, рекомендуемый максимум — не больше 2 граммов в сутки. Там же должно быть сказано: по возможности не сочетать средство с другими, где есть парацетамол или другие жаропонижающие и обезболивающие. Правила США требуют, чтобы первая строка предупреждения на таких безрецептурных упаковках называла три ситуации повреждения печени: доза выше суточного максимума, одновременный приём другого препарата с парацетамолом, больше 3 бокалов алкоголя в день на фоне лечения. В том же китайском объявлении сказано, что в инструкции к формам замедленного высвобождения нужно писать: если лишнее принял взрослый или ребёнок, сразу к врачу, есть неприятные ощущения или нет. Противоядие называется N-ацетилцистеин; в инструкции указано давать его как можно раньше: в первые 12 часов эффект удовлетворительный, после 24 часов он слабее. Многоцентровое исследование в США с 1976 по 1985 год проследило 2540 пациентов с передозировкой, которым дали это противоядие. Среди тех, у кого по концентрации в крови повреждение печени было вероятным, при начале лечения в первые 10 часов повреждение развилось у 6.1%. Если лечение начинали через 10–24 часа, повреждение было у 26.4%. Если противоядие начинали в первые 8 часов после передозировки, защита была при любой концентрации в крови."
    en: "Over 6 years, 22 hospitals in the United States registered 662 cases of acute liver failure in a row. Of these, 275 (42%) were caused by acetaminophen, and the median dose swallowed was 24 grams. Of these 275 people, 131 (48%) had taken too much by accident, not on purpose. Among the people who took too much by accident, 38% were taking more than a single medicine that contained this ingredient at the same time. Of these 275 people, 27% died before a liver transplant, and 8% received a transplant. In 2020 the National Medical Products Administration required over-the-counter leaflets to state that using too much causes severe liver damage, and that the suggested maximum in a day is not more than 2 grams. The leaflet must also say to avoid combining the drug with medicines that contain acetaminophen or other fever and pain drugs. US rules require the opening line of the warning on this kind of over-the-counter drug to name the liver-harm situations: going over the maximum for a day, taking it together with another medicine that contains acetaminophen, and drinking more than 3 cups of alcohol a day during treatment. The same notice also requires the leaflet for an extended-release product to state that if an adult or a child takes too much, they should be seen at once, whether they feel unwell or not. The antidote is called N-acetylcysteine. The leaflet says to use it as early as possible: within 12 hours the effect is satisfactory, and after 24 hours the effect is poorer. A multicenter study in the United States from 1976 to 1985 followed 2540 overdose patients who were given this antidote. Among patients whose blood level marked them as likely to develop liver injury, liver injury appeared in 6.1% of those who started the antidote within 10 hours, and in 26.4% of those who started it only from 10 to 24 hours. Started within 8 hours after the overdose, it protected the patient no matter how high the blood level was."
  sources:
    - {citation: "Larson AM, Polson J, Fontana RJ, et al.; Acute Liver Failure Study Group (2005). Acetaminophen-induced acute liver failure: results of a United States multicenter, prospective study. Hepatology, 42(6):1364-1372", url: "https://doi.org/10.1002/hep.20948"}
    - {citation: "国家药监局关于修订对乙酰氨基酚常释及缓释制剂说明书的公告（2020年第15号）及附件1《对乙酰氨基酚常释制剂处方药说明书修订要求》、附件2《对乙酰氨基酚常释制剂非处方药说明书修订要求》、附件3《对乙酰氨基酚缓释制剂说明书修订要求》（湖南省药品监督管理局转载）", url: "http://mpa.hunan.gov.cn/mpa/xxgk/tzgg/wjtz/202003/t20200311_11809335.html"}
    - {citation: "21 CFR 201.326(a)(1)(iii)(A) Liver warning", url: "https://www.ecfr.gov/current/title-21/chapter-I/subchapter-C/part-201/subpart-G/section-201.326"}
    - {citation: "Smilkstein MJ, Knapp GL, Kulig KW, Rumack BH (1988). Efficacy of oral N-acetylcysteine in the treatment of acetaminophen overdose: analysis of the national multicenter study (1976 to 1985). New England Journal of Medicine, 319(24):1557-1562", url: "https://doi.org/10.1056/NEJM198812153192401"}
    - {citation: "MedlinePlus. Acetaminophen (In case of emergency/overdose)", url: "https://medlineplus.gov/druginfo/meds/a681004.html"}
  doi: "10.1002/hep.20948"

- id: ch34_i3
  chapter: 34
  item: 3
  chapter_title: {ru: "Домашние лекарства: как не навредить себе", en: "Do not let medicines kept at home cause serious harm"}
  title: {ru: "Людям старше 60 лет, у кого ранее были кровотечения в желудке и которые принимают антикоагулянты или гормоны, перед приёмом обезболивающих вроде ибупрофена следует проконсультироваться с врачом", en: "People over 60, with a history of stomach bleeding, taking anticoagulants or steroids should consult a doctor before using painkillers like ibuprofen"}
  grade: A
  measure: mortality
  plain:
    ru: "Обезболивающие вроде ибупрофена, напроксена и аспирина вредят желудку. В испытаниях с большими дозами риск желудочного кровотечения и прободения у тех, кто принимает ибупрофен, примерно в 4 раза выше, чем у тех, кто его не принимает. Риск выше у людей в возрасте, у тех, у кого желудок уже кровоточил, у тех, кто одновременно принимает лекарства против свёртывания крови или гормоны, и у тех, кто во время лечения пьёт больше 3 бокалов алкоголя в день."
    en: "Painkillers such as ibuprofen, naproxen, and aspirin can harm the stomach. In the high-dose trials, people taking ibuprofen had about 4 times the risk of stomach bleeding or a hole in the stomach wall, compared with people not taking it. The risk is higher for older people, people who have had stomach bleeding, people who are also taking a blood thinner or a steroid drug, and people who drink more than 3 cups of alcohol a day."
  benefit:
    ru: "Эти препараты относятся к группе нестероидных противовоспалительных средств (НПВС); к ним относятся ибупрофен, напроксен и диклофенак. В одном метаанализе были обобщены результаты 280 рандомизированных исследований с участием 124513 человек, где эти препараты сравнивались с плацебо. По сравнению с плацебо риск перфорации, закупорки или кровотечения в верхних отделах ЖКТ составил: для ибупрофена RR 3.97 (95% CI 2.22–7.10, то есть примерно в 4 раза выше); для напроксена — 4.22 (2.71–6.56); для диклофенака — 1.89 (1.16–3.09). Все эти НПВС также примерно вдвое повышают риск развития сердечной недостаточности. Согласно требованиям американских регуляторов, на упаковках таких безрецептурных препаратов должно быть предупреждение о риске кровотечений в желудке. В этом предупреждении перечислены шесть групп людей с повышенным риском: возраст старше 60 лет, наличие в анамнезе язвы или кровотечения в желудке, одновременный приём антикоагулянтов или гормонов, одновременный приём других НПВС, употребление более трёх алкогольных напитков в день во время лечения, а также превышение рекомендованной дозы или длительность приёма, указанных в инструкции."
    en: "These medications are classified as nonsteroidal anti-inflammatory drugs (NSAIDs); common examples include ibuprofen, naproxen, and diclofenac. A meta-analysis encompassing 280 randomized trials involving 124,513 participants demonstrated that compared to placebo, ibuprofen raised the risk of upper gastrointestinal perforation, obstruction, or bleeding by an RR of 3.97 (95% CI 2.22–7.10; roughly about 4 times). Naproxen showed an RR of 4.22 (2.71–6.56), while diclofenac resulted in an RR of 1.89 (1.16–3.09). All NSAIDs also approximately double the risk of heart failure. U.S. regulations mandate that over-the-counter NSAIDs carry warnings about stomach bleeding; these warnings specifically identify six high-risk groups: individuals over 60, those with prior stomach ulcers or bleeding, people on anticoagulants or steroids, individuals concurrently taking multiple NSAIDs, drinkers consuming more than three alcoholic beverages daily, and users exceeding recommended dosages or duration."
  numbers:
    - {kind: RR, value: 3.97, ci_low: 2.22, ci_high: 7.1}
  sources:
    - {citation: "Coxib and traditional NSAID Trialists' (CNT) Collaboration; Bhala N, Emberson J, Merhi A, et al. (2013). Vascular and upper gastrointestinal effects of non-steroidal anti-inflammatory drugs: meta-analyses of individual participant data from randomised trials. Lancet, 382(9894):769-779", url: "https://doi.org/10.1016/S0140-6736(13)60900-9"}
    - {citation: "21 CFR 201.326(a)(2)(iii)(A) Stomach bleeding warning", url: "https://www.ecfr.gov/current/title-21/chapter-I/subchapter-C/part-201/subpart-G/section-201.326"}
  doi: "10.1016/S0140-6736(13)60900-9"

- id: ch34_i7
  chapter: 34
  item: 7
  chapter_title: {ru: "Домашние лекарства: как не навредить себе", en: "Do not let medicines kept at home cause serious harm"}
  title: {ru: "При обычной простуде не просите у врача антибиотики", en: "Do not ask a doctor for antibiotics for an ordinary cold"}
  grade: A
  measure: mortality
  plain:
    ru: "От простуды антибиотики не ускоряют выздоровление по сравнению с тем, чтобы их не пить. У взрослых риск побочных эффектов больше, чем вдвое. Если гнойные выделения из носа длятся меньше 10 дней, определённой пользы от антибиотика тоже нет."
    en: "Antibiotics for a cold do not make you better any faster than not taking them. For an adult who takes them, the risk of side effects is more than twice the risk of not taking them. If a runny nose with pus has lasted under 10 days, antibiotics have no definite benefit either."
  benefit:
    ru: "Систематический обзор Cochrane свёл 6 рандомизированных испытаний, 1147 человек. При простуде доля тех, кто не выздоровел или у кого симптомы держались, у принимавших антибиотик и у принимавших плацебо заметно не различалась (RR 0.83, 95% CI 0.60–1.14, разница не значима). Риск нежелательных реакций в 1.8 раза выше, чем в группе плацебо (95% CI 1.01–3.21). У взрослых он выше в 2.62 раза (1.32–5.18), у детей не растёт (0.91, 0.51–1.63). При остром гнойном насморке, если гнойные выделения длятся меньше 10 дней, явной пользы от антибиотика тоже нет (RR 0.73, 0.47–1.13). Нежелательных реакций при этом больше (RR 1.46, 1.10–1.94, выше примерно на 46%). Вывод авторов: ни при простуде, ни при таком насморке антибиотики рутинно не рекомендуются."
    en: "A Cochrane systematic review pooled 6 randomized trials and 1147 people. Compared with a placebo, antibiotics for a cold made no clear difference in the share who had not recovered or whose symptoms persisted (RR 0.83, 95% CI 0.60–1.14, and the difference is not significant). The risk of adverse reactions was 1.8 times the placebo group (95% CI 1.01–3.21). For adults it was 2.62 times (1.32–5.18). For children it did not rise (0.91, 0.51–1.63). For acute purulent rhinitis with a pus-filled runny nose lasting under 10 days, antibiotics also had no clear benefit (RR 0.73, 0.47–1.13). Adverse reactions were more common, though (RR 1.46, 1.10–1.94, about 46% higher). The authors' conclusion is that routine antibiotics are not recommended in either situation."
  numbers:
    - {kind: RR, value: 0.83, ci_low: 0.6, ci_high: 1.14}
    - {kind: RR, value: 0.73}
    - {kind: RR, value: 1.46}
  sources:
    - {citation: "Kenealy T, Arroll B (2025). Antibiotics for the common cold and acute purulent rhinitis. Cochrane Database of Systematic Reviews, 11:CD000247", url: "https://doi.org/10.1002/14651858.CD000247.pub4"}
  doi: "10.1002/14651858.CD000247.pub4"

- id: ch34_i9
  chapter: 34
  item: 9
  chapter_title: {ru: "Домашние лекарства: как не навредить себе", en: "Do not let medicines kept at home cause serious harm"}
  title: {ru: "Обезболивающие не пейте дольше 15 дней в месяц, комбинированные — дольше 10, иначе головная боль может быть от самих таблеток", en: "Do not take painkillers on more than 15 days a month, or combination painkillers on more than 10 days, or the headache may be caused by the medicine"}
  grade: B
  measure: mortality
  plain:
    ru: "Если голова болит часто и обезболивающее идёт каждый день, от таблеток может болеть ещё сильнее. В международной классификации головной боли это называют головной болью от чрезмерного приёма лекарств. Диагноза уже достаточно, если голова болит больше 15 дней в месяц, обычное обезболивающее вы пьёте больше 15 дней или комбинированное больше 10 дней, и так дольше 3 месяцев подряд. У большинства после отмены лишнего лекарства становится лучше."
    en: "If headaches keep coming and you take a painkiller every day, you may hurt more the more you take. The international headache classification calls this a medication-overuse headache, a headache brought on by the medicine itself. Headache on more than 15 days in a month, plus an ordinary painkiller on more than 15 days or a combination painkiller on more than 10 days, running past 3 months, is enough for the diagnosis. Most people improve after they stop the medicine they were taking too much of."
  benefit:
    ru: "В 3-м издании «Международной классификации головных болей» Международного общества головной боли даны критерии диагноза: у человека уже была головная боль, теперь она бывает больше 15 дней в месяц, и он регулярно принимает лекарства от неё сверх меры дольше 3 месяцев. Для неопиоидных обезболивающих — парацетамола, аспирина, ибупрофена — порог избытка это 15 дней в месяц и больше. Для комбинированных обезболивающих порог — 10 дней в месяц и больше. Комбинированное средство — это когда вместе сложены препараты двух и более классов с обезболивающим действием либо добавлен вспомогательный компонент вроде кофеина, например парацетамол с кодеином. Если несколько неопиоидных обезболивающих чередовать, дни суммируют. В пояснении к классификации сказано: эпидемиологические данные нескольких стран показывают, что среди людей с головной болью больше 15 дней в месяц больше половины приходится на эту форму. У большинства больных после отмены избыточного лекарства становится лучше, и профилактика головной боли тоже начинает работать сильнее."
    en: "The 3rd edition of the International Classification of Headache Disorders, from the International Headache Society, gives the diagnostic criteria. The person already has a headache disorder, has headache on more than 15 days a month, and has regularly overused a medicine for headache for more than 3 months. For non-opioid painkillers such as acetaminophen, aspirin, and ibuprofen, the overuse line is 15 days a month or more. For combination painkillers the line is 10 days a month or more. A combination painkiller means more than a single class of pain-relieving drug combined, or a painkiller with an added ingredient such as caffeine, for example acetaminophen plus codeine. If you rotate several non-opioid painkillers, the days are added together. The classification states that epidemiological evidence from several countries shows that, among people with headache on more than 15 days a month, more than half have this kind of headache. Most patients improve after they stop the overused medicine, and treatment to prevent headaches also works better."
  sources:
    - {citation: "Headache Classification Committee of the International Headache Society (2018). The International Classification of Headache Disorders, 3rd edition. Cephalalgia, 38(1):1-211", url: "https://doi.org/10.1177/0333102417738202"}
    - {citation: "ICHD-3 在线版 8.2 Medication-overuse headache（含 8.2.3、8.2.5）", url: "https://ichd-3.org/8-headache-attributed-to-a-substance-or-its-withdrawal/8-2-medication-overuse-headache-moh/"}
  doi: "10.1177/0333102417738202"

- id: ch34_i11
  chapter: 34
  item: 11
  chapter_title: {ru: "Домашние лекарства: как не навредить себе", en: "Do not let medicines kept at home cause serious harm"}
  title: {ru: "Пока принимаете цефалоспорины, метронидазол и похожие антибактериальные средства и ещё 7 дней после отмены, не пейте алкоголь и не трогайте спиртовые лекарства вроде настойки хосян чжэнци и сиропов от кашля", en: "While taking an antibacterial such as a cephalosporin or metronidazole, and for 7 days after stopping, do not drink alcohol, and do not take an alcohol-containing medicine such as Huoxiang Zhengqi oral liquid or cough syrup"}
  grade: B
  measure: mortality
  plain:
    ru: "Часть цефалоспоринов и такие средства, как метронидазол, при встрече с алкоголем дают покраснение лица, пот и сердцебиение, а в тяжёлых случаях — одышку и падение давления. Срабатывает не только крепкий алкоголь и пиво: то же делают спиртовые лекарства вроде настойки хосян чжэнци и сиропов от кашля. Не трогайте их всё время приёма и ещё 7 дней после отмены."
    en: "Some cephalosporins, and drugs such as metronidazole, make the face flush and bring on sweating and a racing heart if they meet alcohol. A severe case brings trouble breathing and a drop in blood pressure. It is not only liquor and beer. An alcohol-containing medicine such as Huoxiang Zhengqi oral liquid (藿香正气水, a Chinese medicine liquid that contains alcohol) or cough syrup can do it too. Do not touch alcohol from the time you are taking the drug through 7 days after you stop."
  benefit:
    ru: "Это дисульфирамоподобная реакция. В разъяснении о безопасном применении лекарств за 2023 год управление по контролю за лекарствами провинции Фуцзянь пишет: алкоголь до или после части цефалоспоринов может вызвать такую реакцию. Там сказано, что она «серьёзно вредит здоровью и даже угрожает жизни». Симптомы: покраснение лица, пот, сердцебиение, вплоть до одышки, падения давления и анафилактического шока. По «Клиническим указаниям по применению лекарств» Фармакопеи КНР в разъяснении перечислены, среди прочего, цефазолин, цефтриаксон, цефоперазон, метронидазол, тинидазол и фуразолидон. Там же написано: в течение 7 дней после приёма нельзя пить алкоголь и принимать лекарства или еду с алкоголем. В примерах — шоколад с ликёром и настойка хосян чжэнци (藿香正气水). Причина: фермент, который лекарство подавляет, часто восстанавливается только за 4–5 дней. Больница в Гуанчжоу собрала 82 случая за 2 года. Цефалоспорины вызвали 57 (69.51%), нитроимидазолы — метронидазол, тинидазол и сходные — 10 (12.20%). Алкоголь пришёл из спиртных напитков в 40 случаях (48.78%) и из лекарств с этанолом в 31 случае (37.80%). Среди принятых внутрь были настойка хосян чжэнци, сироп от кашля, жидкий экстракт имуцао (益母草流浸膏) и другие. Из 82 случаев лёгких было 68, средней тяжести 9, тяжёлых 5; облегчение наступало за 1–3 часа, смертей не было. Американская инструкция к метронидазолу требует не пить алкоголь во время лечения и минимум 3 дня после отмены и не пользоваться средствами с пропиленгликолем."
    en: "This is called a disulfiram-like reaction. A 2023 medication-safety article from the Fujian drug regulator says that drinking before or after some cephalosporins can set off this reaction, and that it \"can seriously harm health and can even threaten life.\" Symptoms include a flushed face, sweating, and palpitations, and even difficulty breathing, a drop in blood pressure, and anaphylactic shock. Following the Clinical Medication Notices of the Pharmacopoeia of the People's Republic of China, the drugs it lists include cefazolin, ceftriaxone, cefoperazone, metronidazole, tinidazole, and furazolidone, among others. It states that drinking alcohol, and taking or eating drugs or foods that contain alcohol, is forbidden for 7 days after the dose. The examples include liqueur chocolates and Huoxiang Zhengqi oral liquid. The reason given is that the enzyme the drug inhibits often takes 4 to 5 days to recover. A hospital in Guangzhou reviewed 82 cases over 2 years. Cephalosporins caused 57 cases (69.51%). Nitroimidazoles, the class that includes metronidazole and tinidazole, caused 10 cases (12.20%). The alcohol came from alcoholic drinks in 40 cases (48.78%) and from ethanol-containing medicines in 31 cases (37.80%). Medicines taken by mouth included Huoxiang Zhengqi oral liquid, cough syrup, and motherwort fluid extract (益母草流浸膏). Of the 82 cases, 68 were mild, 9 were moderate, and 5 were severe. They eased within 1 to 3 hours. Nobody died. The US leaflet for metronidazole requires no alcohol during treatment and for at least 3 days after stopping, and no products that contain propylene glycol."
  sources:
    - {citation: "福建省药品监督管理局（福建省药品科普与监管数据中心）(2023). 2023年“全国安全用药月”原创科普小知识——为什么吃头孢不能喝酒", url: "https://yjj.scjgj.fujian.gov.cn/ztzl/kpzl/qgaqyyy/202312/t20231215_6334595.htm"}
    - {citation: "房财富, 涂星, 刘韬, 黄红兵, 邱孟, 梁蔚婷 (2015). 我院双硫仑样反应82例分析. 中国药房, 26(29):4089-4091", url: "https://doi.org/10.6039/j.issn.1001-0408.2015.29.19"}
    - {citation: "Pfizer (2026). FLAGYL 375 (metronidazole) capsules, prescribing information: Contraindications, Interaction with Alcohol. DailyMed", url: "https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=a2883ca1-5a9a-4259-9d80-46ab67274384"}

- id: ch13_i1
  chapter: 13
  item: 1
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "Если человек лежит без дыхания, немедленно начните сильно нажимать на грудину, попросив кого-то вызвать скорую (120) и принести дефибриллятор AED", en: "Immediate chest compressions can save lives when someone collapses and stops breathing — call 120 and fetch an AED too"}
  grade: A
  measure: mortality
  plain:
    ru: "Скорее всего, вы будете помогать своим близким: в 79,2% случаев остановка сердца происходит дома. При проведении сердечно-легочной реанимации вероятность выживания и выписки из больницы повышается с 3,9% до 16,1%. Если человек не откликается и не дышит, сразу приступайте к нажатиям. Расположите руки посередине линии между сосками, нажимайте сильно со скоростью 2 раза в секунду без перерыва. Попросите второго человека вызвать скорую и принести дефибриллятор; ваши руки при этом не должны останавливаться."
    en: "Most people you’d need to help are family members — 79.2% of cardiac arrests happen at home. When someone performs CPR, the survival rate jumps from 3.9% to 16.1%. If a person is unresponsive and not breathing, start compressions right away. Position your hands at the midpoint between the nipples, press down hard at 2 times per second, and keep going. Ask a second person to call 120 and bring an AED; you must not stop compressing."
  benefit:
    ru: "Согласно данным 79 исследований, охвативших 142 740 человек (метаанализ): в общей сложности лишь 7,6% людей с остановкой сердца вне стен больницы выживают и выписываются домой. Однако при проведении сердечно-легочной реанимации этот показатель возрастает с 3,9% до 16,1%. В 53% случаев рядом с пострадавшим находятся свидетели происшествия, но лишь в 32% из них реанимация действительно проводится. В Китае при регистрации BASIC-OHCA было зафиксировано 38 227 случаев оказания первой помощи; в 30 282 из них (79,2%) остановка сердца произошла дома. У этих пациентов доля людей, получивших реанимацию, составила 20,3%, а доля выживших — 1,2%. Порядок действий таков: сначала реанимация, затем вызов скорой и принесение дефибриллятора. После включения аппарата следуйте его голосовым подсказкам."
    en: "Meta-analysis of 79 studies involving 142,740 participants shows that overall, only 7.6% of people suffering from out-of-hospital cardiac arrest survive to leave the hospital. For those receiving CPR from bystanders, the survival rate rises from 3.9% to 16.1%. While 53% of cardiac arrests are witnessed by someone nearby, only 32% actually get CPR. The BASIC-OHCA registry in China recorded 38,227 emergency cases; among them, 30,282 cases (79.2%) occurred at home. In this group, the bystander CPR rate was 20.3%, and the survival rate was just 1.2%. The correct sequence is to start compressions first, then ask someone else to call 120 and fetch an AED; once the AED is powered on, follow its voice prompts."
  sources:
    - {citation: "Sasson C et al. (2010). Predictors of survival from out-of-hospital cardiac arrest: a systematic review and meta-analysis. Circulation: Cardiovascular Quality and Outcomes", url: "https://doi.org/10.1161/CIRCOUTCOMES.109.889576"}
    - {citation: "Zheng J et al. (2023). Incidence, process of care, and outcomes of out-of-hospital cardiac arrest in China: a prospective study of the BASIC-OHCA registry. The Lancet Public Health", url: "https://doi.org/10.1016/S2468-2667(23)00173-1"}
    - {citation: "International Federation of Red Cross and Red Crescent Societies (2025). International First Aid, Resuscitation and Education Guidelines 2025，第 154 页：「If the person is breathing abnormally (gasping, taking irregular breaths or not breathing), start CPR immediately」；第 161 页：「In the first few minutes after cardiac arrest, a person may have agonal breathing (an irregular and laboured breathing pattern, or gasping noisily). This type of breathing is not normal. If there is any doubt about whether breathing is normal, assume it is not」", url: "https://www.ifrc.org/sites/default/files/2026-03/IFRC%20International%20First%20Aid,%20Resuscitation%20and%20Education%20Guidelines%202025.pdf"}
    - {citation: "全国人大 (2020). 民法典（第一百八十四条）", url: "https://www.spp.gov.cn/spp/fl/202006/t20200602_463888.shtml"}
  doi: "10.1161/CIRCOUTCOMES.109.889576"

- id: ch13_i3
  chapter: 13
  item: 3
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "Внезапное искривление рта, слабость в одной руке, невнятная речь — немедленно звоните 120, не ждите и не садитесь за руль!", en: "Sudden facial drooping, weakness in one arm, and slurred speech — call 120 immediately; don’t wait or drive yourself"}
  grade: A
  measure: mortality
  plain:
    ru: "Если у человека искривился рот, он не может поднять одну руку и говорит невнятно, нужно немедленно вызывать скорую помощь. При введении препарата для растворения тромба в течение первых 3 часов после начала симптомов вероятность восстановления способности к самообслуживанию возрастает примерно в 1,75 раза по сравнению с отсутствием лечения. Если терапия начата спустя 3–4,5 часа, этот показатель снижается до 1,26 раза. После 4,5 часов разница между группами практически исчезает. Обязательно запишите точное время появления симптомов. Не давайте пострадавшему ни воду, ни лекарства, и ни в коем случае не садитесь за руль самостоятельно."
    en: "If someone’s face suddenly droops, they can’t lift one arm, and their speech becomes slurred, call 120 right away. Administering medication within 3 hours of symptom onset can increase the chance of regaining basic independence by about 1.75 times compared to not receiving treatment. Waiting 3 to 4.5 hours reduces this benefit to only 1.26 times. After 4.5 hours, there is virtually no difference. Be sure to note the exact time symptoms first appeared. Do not give water or medicine, and never drive the person to the hospital yourself."
  benefit:
    ru: "В этом исследовании проведён метаанализ этих 16 рандомизированных клинических испытаний, в которых приняли участие 6756 пациентов. Внутривенное введение препарата для растворения тромба позволяет восстановить проходимость сосудов. При применении альтеплазы в течение первых 3 часов после начала симптомов вероятность возвращения к самостоятельному образу жизни (оцениваемая по шкале Rankin 0–1) увеличивается в 1,75 раза по сравнению с отсутствием терапии. Доверительный интервал для этого показателя составляет 95% CI 1,35–2,27. Если лечение начато спустя 3–4,5 часа, этот коэффициент снижается до 1,26 (1,05–1,51). После 4,5 часов разница между группами становится статистически незначимой: показатель равен 1,15 (0,95–1,40)."
    en: "This conclusion comes from a meta-analysis of 16 randomized trials involving 6,756 patients. Intravenous thrombolysis means delivering medication to reopen blocked blood vessels. When alteplase is given within 3 hours of symptom onset, the odds of the patient regaining basic independence — defined as a modified Rankin score of 0–1 — increase by a factor of 1.75. The 95% confidence interval for this effect is 1.35–2.27. In other words, the likelihood of a good recovery is roughly 1.75 times higher with treatment. Waiting 3 to 4.5 hours lowers this advantage to 1.26 (95% CI 1.05–1.51), while after 4.5 hours the difference becomes statistically insignificant at 1.15 (95% CI 0.95–1.40)."
  sources:
    - {citation: "Emberson J, Lees KR, Lyden P, et al. (2014). Effect of treatment delay, age, and stroke severity on the effects of intravenous thrombolysis with alteplase for acute ischaemic stroke: a meta-analysis of individual patient data from randomised trials. Lancet, 384(9958), 1929-1935", url: "https://doi.org/10.1016/S0140-6736(14)60584-5"}
    - {citation: "中国卒中学会急救医学分会 (2017). 脑卒中院前急救专家共识. 中华急诊医学杂志, 26(10), 1107-1114", url: "http://www.cem.org.cn/rhtml/20171002/index.htm"}
    - {citation: "Prabhakaran S et al. (2026). 2026 Guideline for the Early Management of Patients With Acute Ischemic Stroke. Stroke", url: "https://doi.org/10.1161/STR.0000000000000513"}
    - {citation: "American Heart Association (2026). Top Things to Know: 2026 Guideline for the Early Management of Patients With AIS，第 3 点", url: "https://professional.heart.org/en/science-news/2026-guideline-for-the-early-management-of-patients-with-acute-ischemic-stroke/top-things-to-know"}
  doi: "10.1016/S0140-6736(14)60584-5"

- id: ch13_i7
  chapter: 13
  item: 7
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "Боль, чувство давления и сжатия в груди, которые не проходят более 15 минут — звоните в скорую, не пытайтесь справиться с этим самостоятельно и не садитесь за руль", en: "Chest pressure, tightness, or heaviness lasting more than 15 minutes without relief — call 120; do not drive yourself"}
  grade: B
  measure: mortality
  plain:
    ru: "Если боль, давление и сжатие в груди не проходят более 15 минут, нужно немедленно вызвать скорую помощь. При своевременном вмешательстве — в течение 55 минут после прибытия в больницу — вероятность смерти в течение 30 дней составляет 2,8%. Если же помощь оказывается позже, этот показатель возрастает до 9,7%. С каждой минутой задержки повреждается всё больше участков сердечной мышцы. Ни в коем случае не садитесь за руль — потеря сознания за рулем может привести к новой аварии."
    en: "If you feel chest pressure, tightness, or heaviness that lasts over 15 minutes without easing up, call 120 right away. For patients treated within 55 minutes of arrival at the hospital, the mortality rate within 30 days is 2.8%. For those treated later than 55 minutes, the rate rises to 9.7%. Every minute of delay means more heart muscle tissue dies. Do not drive yourself — losing consciousness while behind the wheel could lead to a second accident."
  benefit:
    ru: "В Израиле провели масштабное исследование острого коронарного синдрома, в котором участвовали пациенты с инфарктом миокарда с подъемом сегмента ST. Анализировался период времени от момента поступления в больницу до расширения закупоренного сосуда с помощью баллона. У пациентов, которым помощь оказали в течение 55 минут, смертность за 30 дней составила 2,8% (5 случаев из 178). У тех, кому потребовалось больше времени, этот показатель вырос до 9,7% (15 случаев из 155)."
    en: "Israel conducted a nationwide study on acute coronary syndrome. The research focused on patients experiencing ST-segment elevation myocardial infarction, a specific type of heart attack. It measured the time interval from hospital admission to the point when a balloon catheter was used to reopen the blocked blood vessel. For patients treated within 55 minutes, 5 out of 178 (2.8%) died within 30 days. For those treated after 55 minutes, 15 out of 155 (9.7%) died within the same timeframe."
  sources:
    - {citation: "Karkabi B, Meir G, Zafrir B, et al. (2021). Door-to-balloon time and mortality in patients with ST-elevation myocardial infarction. European Heart Journal - Quality of Care and Clinical Outcomes", url: "https://doi.org/10.1093/ehjqcco/qcaa037"}
    - {citation: "NICE (2010, 2016 更新). Recent-onset chest pain of suspected cardiac origin: assessment and diagnosis (CG95), 第 1.2.1.3 条：「pain in the chest and/or other areas (for example, the arms, back or jaw) lasting longer than 15 minutes」「chest pain associated with nausea and vomiting, marked sweating, breathlessness, or particularly a combination of these」", url: "https://www.nice.org.uk/guidance/cg95/chapter/Recommendations"}
    - {citation: "International Federation of Red Cross and Red Crescent Societies (2025). International First Aid, Resuscitation and Education Guidelines 2025，第 357–358 页：「Access EMS even if the pain has only lasted a couple of minutes」「Symptoms may be more subtle or uncommon in some populations, such as people who are female, elderly or have diabetes」", url: "https://www.ifrc.org/sites/default/files/2026-03/IFRC%20International%20First%20Aid,%20Resuscitation%20and%20Education%20Guidelines%202025.pdf"}
    - {citation: "NHS. Heart attack：「Do not drive yourself to A&E」", url: "https://www.nhs.uk/conditions/heart-attack/symptoms/"}
  doi: "10.1093/ehjqcco/qcaa037"

- id: ch13_i12
  chapter: 13
  item: 12
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "При сильном кровотечении сначала плотно прижмите рану рукой; если на конечностях это не помогает, накладывайте турникет и сразу звоните в скорую помощь", en: "For severe bleeding, first press firmly on the wound with your hand; if this fails on limbs, apply a tourniquet and call 120 immediately"}
  grade: A
  measure: mortality
  plain:
    ru: "сначала плотно прижмите рану рукой или куском ткани; если на конечностях это не помогает, накладывайте турникет и сразу звоните в скорую помощь, после чего не снимайте его. Среди раненых в боевых условиях 90% тех, кому турникет наложили до развития шока, выжили; среди тех, кому его наложили уже после шока, выжило лишь 10%, а все 5 человек, которым турникет не наложили, погибли. Нужно накладывать турникет выше раны, затягивать до остановки кровотечения и обязательно отмечать время. Не используйте в качестве турникета шнурки или веревки. На шее и туловище можно только прижимать рану, но не накладывать турникет."
    en: "Begin by pressing hard on the wound with your hand or a cloth; if bleeding on a limb persists, fasten a tourniquet and call 120 right away. Once applied, never loosen it. Among battlefield casualties, 90% who received a tourniquet before going into shock survived, compared to only 10% who got one after shock set in; all five patients who needed a tourniquet but did not receive one died. Position the tourniquet above the wound, twist it until bleeding ceases, and record the time. Never substitute shoelaces or ordinary rope. For neck or torso injuries, only compression is allowed—no tourniquets may be used."
  benefit:
    ru: "в течение 6 лет 11 травматологических центров первого уровня в штате Техас (США) приняли 1 026 пациентов с повреждениями сосудов конечностей; у 181 из них (17,6%) турникет был наложен до прибытия в больницу. При прямом сравнении без учета других факторов смертность среди пациентов с турникетом составила 3,9%, а без него — 5,2%. После статистической корректировки по всем остальным факторам наложение турникета остается значимым фактором выживания: скорректированное отношение шансов (OR) равно 5,86, а 95% доверительный интервал — от 1,41 до 24,47. В военно-полевом госпитале Багдада среди 232 раненых выживаемость составила 90% у тех, кому турникет наложили до развития шока, и лишь 10% у тех, кому его наложили после шока; все 5 человек, которым турникет не наложили, погибли, а среди тех, кому его наложили, выжило 87%. Порядок действий таков: сначала прямое прижатие раны (подойдет любая ткань или полотенце) → при неэффективности на конечностях — наложение турникета → вызов скорой помощи → не снимать турникет до прибытия врачей."
    en: "Over six years, 11 Level I trauma centers in Texas treated 1,026 patients with limb vascular injuries; 181 of them (17.6%) had a tourniquet applied prior to arrival. Unadjusted mortality rates were 3.9% for those with a tourniquet and 5.2% for those without. After adjusting for other factors, tourniquet use remained strongly linked to survival; the adjusted odds ratio was 5.86, with a 95% confidence interval ranging from 1.41 to 24.47. At a Baghdad field hospital, 90% of 232 injured patients who received a tourniquet before shock survived, versus just 10% who got one after shock occurred; all five patients needing a tourniquet but not receiving one perished, while 87% of those with a tourniquet survived. The recommended sequence is: direct manual compression using any cloth or towel → if bleeding on a limb persists, apply a tourniquet → call 120 → never loosen it."
  numbers:
    - {kind: OR, value: 5.86, ci_low: 1.41, ci_high: 24.47}
  sources:
    - {citation: "Teixeira PGR et al. (2018). Civilian Prehospital Tourniquet Use Is Associated with Improved Survival in Patients with Peripheral Vascular Injury. Journal of the American College of Surgeons", url: "https://doi.org/10.1016/j.jamcollsurg.2018.01.047"}
    - {citation: "Kragh JF et al. (2009). Survival with emergency tourniquet use to stop bleeding in major limb trauma. Annals of Surgery", url: "https://doi.org/10.1097/SLA.0b013e31818842ba"}
    - {citation: "中国医师协会急诊医师分会 et al. (2020). 止血带的急诊应用专家共识. 中华急诊医学杂志 29(6):773-779：「院前急救时，止血带一旦使用则不建议松开，除非得到可以替代的彻底止血的救治」「最长使用时间不应超过2 h。但如果客观情况无法到医院救治或者无替代止血办法，则在得到正规救援前不解除止血带」. <https://doi.org/10.3760/cma.j.issn.1671-0282.2020.06.006>，全文", url: "http://www.cem.org.cn/rhtml/20200606/index.htm"}
    - {citation: "International Federation of Red Cross and Red Crescent Societies (2025). International First Aid, Resuscitation and Education Guidelines 2025，第 255–256 页：「Emergency medical services (EMS) should be accessed for all severe bleeding」「Once a tourniquet has been applied, keep it in place until EMS arrive」，步骤为「1. Ask the person to apply direct pressure to their injury with their hands」「3. Access EMS」「4. Apply direct pressure to the bleed」「5. If direct pressure is ineffective and the person is bleeding from an arm or leg, consider applying a tourniquet」", url: "https://www.ifrc.org/sites/default/files/2026-03/IFRC%20International%20First%20Aid,%20Resuscitation%20and%20Education%20Guidelines%202025.pdf"}
  doi: "10.1016/j.jamcollsurg.2018.01.047"

- id: ch13_i13
  chapter: 13
  item: 13
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "При укусе или царапине от собаки или кошки сначала нужно промыть рану под проточной водой с мылом в течение 15 минут, а затем в тот же день сделать прививку", en: "For dog or cat bites and scratches, rinse the area with soap and running water for 15 minutes, then get vaccinated on the same day"}
  grade: A
  measure: mortality
  plain:
    ru: "Как только начинаются симптомы бешенства, вероятность летального исхода приближается к 100%, поэтому промывание и прививка — единственный способ защиты. Сначала нужно промыть рану под проточной водой с мылом в течение 15 минут, а затем в тот же день сделать прививку. Если кожа проколота или на ней есть царапины, которые облизала животное, это относится к III уровню воздействия, и требуется пассивная иммунизация. То, домашнее животное или привитое оно, не влияет на классификацию раны — решающим фактором является её состояние, а не происхождение животного."
    en: "Once rabies symptoms appear, the fatality rate is practically 100%. Rinsing with soap and water followed by vaccination is the sole safeguard. First, rinse the affected area with alternating streams of soap and running water for 15 minutes, then seek medical care on the same day. If the skin is broken and the wound has been licked, this constitutes a category III exposure, requiring the extra passive immunization product. The fact that a pet has been vaccinated does not alter this classification; exposure level is determined solely by the nature of the injury, not by the animal’s background."
  benefit:
    ru: "Согласно официальным рекомендациям Государственного комитета здравоохранения и Национального управления по контролю за заболеваниями от 2023 года: «Вероятность летального исхода при бешенстве практически равна 100%». Процедура лечения описывается так: «Необходимо тщательно промыть все места укусов и царапин под проточной водой с мылом (или другим слабощелочным моющим средством) в течение примерно 15 минут». При лёгком укусе без повреждения кожных покровов или царапине без кровотечения классифицируется как II уровень воздействия, требующий прививки. При сквозном укусе или повреждении кожи, облизанной животным, классифицируется как III уровень воздействия, при котором «необходимо обработать рану, ввести пассивную иммунизацию и сделать прививку от бешенства». По данным ВОЗ ежегодно в мире от бешенства умирает около 59 тысяч человек, причём в 99% случаев причиной являются собаки."
    en: "According to the 2023 guidelines issued by China’s National Disease Control and Prevention Administration and Health Commission, “The fatality rate from rabies is practically 100%.” Recommended first aid is “to thoroughly rinse all bite and scratch sites with alternating streams of soap (or another mildly alkaline cleanser) and running water under adequate pressure for roughly 15 minutes.” For minor bites where skin remains intact or superficial scratches without bleeding—classified as category II exposures—vaccination alone is sufficient. Category III exposures, involving penetrating wounds or licked broken skin, mandate both wound treatment, passive immunization, and full vaccination. The WHO reports that roughly 59,000 people worldwide die from rabies each year, 99% of cases linked to dog bites."
  sources:
    - {citation: "国家疾控局综合司、国家卫生健康委办公厅 (2023). 关于印发狂犬病暴露预防处置工作规范（2023 年版）的通知", url: "https://www.ndcpa.gov.cn/jbkzzx/c100014/common/content/content_1706569159854649344.html"}
    - {citation: "WHO. 狂犬病 实况报道", url: "https://www.who.int/zh/news-room/fact-sheets/detail/rabies"}

- id: ch13_i14
  chapter: 13
  item: 14
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "Сразу после ожога промойте пораженное место холодной проточной водой в течение 20 минут, не наносите зубную пасту или соевый соус", en: "Immediately rinse a burn with cool running water for 20 minutes; avoid applying toothpaste or soy sauce"}
  grade: A
  measure: mortality
  plain:
    ru: "Если в течение 3 часов после получения ожога промывать рану холодной проточной водой минимум 20 минут, вероятность необходимости последующей пересадки кожи снижается примерно до 60% от исходного уровня. Вода должна быть просто холодной, а не ледяной — применение льда может усугубить повреждение тканей. Если одежда прилипла к ране, не пытайтесь её оторвать силой; после промывания накройте место чистой тканью и обратитесь к врачу. Ни в коем случае не наносите зубную пасту, соевый соус, арахисовое масло или муку. Если вы вспомнили об этом позже, но успели промыть рану в течение 3 часов, такой подход всё равно даст положительный эффект."
    en: "Rinsing a burn with cool running water for at least 20 minutes within 3 hours of injury reduces the likelihood of needing skin grafts to roughly 60% of the rate for those who do not perform this step. Use cool water, not ice water, as ice application can worsen the damage. If clothing sticks to the wound, do not pull it off forcefully; after rinsing, cover the area with a clean cloth and head to the hospital. Never apply toothpaste, soy sauce, sesame oil, or flour to the burn. Even if you remember to rinse later, doing so within 3 hours still provides benefit."
  benefit:
    ru: "В Австралии проводилось исследование с участием 2495 детей, получивших ожоги. У тех, кто в течение 3 часов после травмы промывал рану холодной проточной водой в течение 20 минут, вероятность необходимости пересадки кожи оказалась в 0,6 раза ниже, чем у остальных. Доверительный интервал для этого показателя при уровне значимости 95% составляет от 0,4 до 0,8. Анализ семи исследований также подтвердил, что промывание раны холодной проточной водой в течение 20 минут в первые три часы после ожога существенно снижает риск необходимости пересадки кожи и хирургического вмешательства."
    en: "An Australian study followed 2,495 children with burns. For kids who rinsed the burn with cool running water for 20 minutes within 3 hours of injury, the relative risk of needing a skin graft was 0.6. The 95% confidence interval for this value is 0.4–0.8, meaning the likelihood of needing a graft is roughly 60% lower than for those who did not rinse. Results from 7 combined studies also confirm that 20 minutes of cool running water irrigation within 3 hours of injury significantly lowers the chance of needing skin grafts or surgical wound treatment."
  sources:
    - {citation: "Griffin BR, Frear CC, Babl F, Oakley E, Kimble RM (2020). Cool Running Water First Aid Decreases Skin Grafting Requirements in Pediatric Burns: A Cohort Study of Two Thousand Four Hundred Ninety-five Children. Annals of Emergency Medicine, 75(1), 75-85", url: "https://doi.org/10.1016/j.annemergmed.2019.06.028"}
    - {citation: "Griffin B, Cabilan CJ, Ayoub B, et al. (2022). The effect of 20 minutes of cool running water first aid within three hours of thermal burn injury on patient outcomes: A systematic review and meta-analysis. Australasian Emergency Care, 25(4), 367-376", url: "https://doi.org/10.1016/j.auec.2022.05.004"}
    - {citation: "International Federation of Red Cross and Red Crescent Societies (2025). International First Aid, Resuscitation and Education Guidelines 2025，第 289 页：「Do not use ice-cold water」「Do not apply ice, as this may aggravate the injury」，第 288 页：「Covering a burn with a clean wet cloth or plastic cling wrap can protect it during transit to medical care」", url: "https://www.ifrc.org/sites/default/files/2026-03/IFRC%20International%20First%20Aid,%20Resuscitation%20and%20Education%20Guidelines%202025.pdf"}
    - {citation: "NHS. Burns and scalds：「do not remove anything that is stuck to the affected area」「do not put any creams, oils or butter on burns or scalds」", url: "https://www.nhs.uk/conditions/burns-and-scalds/treatment/"}
  doi: "10.1016/j.annemergmed.2019.06.028"

- id: ch13_i19
  chapter: 13
  item: 19
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "Сработал сигнализатор угарного газа, или у всех в комнате одновременно болит голова и тошнит — сначала выйдите на улицу, а потом звоните", en: "If a carbon monoxide alarm goes off, or if several people in a room suddenly get headaches, nausea, or dizziness, get everyone outside before calling for help"}
  grade: B
  measure: mortality
  plain:
    ru: "Если сработал сигнализатор угарного газа, или у всех в комнате одновременно болит голова, тошнит и кружится голова, сначала выведите всех на улицу, а потом звоните. Не оставайтесь в помещении в поисках причины и не возвращайтесь внутрь, чтобы закрыть вентиль. Симптомы похожи на простуду, а улучшение состояния после выхода на улицу — самый важный признак. По данным ВОЗ за 2018 год, в Китае от отравления угарным газом умерли 11 523 человека, большинство случаев пришлось на зимние месяцы, а большинство смертей произошло дома."
    en: "When the alarm sounds, or when multiple people in one room start experiencing headaches, nausea, and dizziness, move everyone outdoors first and then call for help. Do not stay inside trying to figure out what’s happening, and do not go back inside to turn off any valves. The fact that symptoms improve once outside is a very strong indicator of carbon monoxide exposure. In 2018 alone, China reported 11,523 deaths caused by carbon monoxide poisoning; most of these occurred in winter, and the majority of victims were at home."
  benefit:
    ru: "По данным системы мониторинга причин смерти Китайского центра по контролю и профилактике заболеваний за 2018 год, было зарегистрировано 11 523 случая смерти от отравления угарным газом. Наибольшее количество смертей пришлось на январь (2 845 случаев), февраль (2 321 случай) и декабрь (2 010 случаев). В эти три зимних месяца от 66% до 73% смертей произошли в домашних условиях. Эти цифры основаны на официальной статистике, а не на расчётах по всему населению страны. В США ежегодно более 400 человек умирают от случайного отравления угарным газом, не связанного с пожарами. Более 100 000 человек ежегодно обращаются в отделения неотложной помощи, а более 14 000 госпитализируются."
    en: "According to China’s disease surveillance system, 11,523 people died from carbon monoxide poisoning in 2018. The highest numbers were recorded in January (2,845 cases), February (2,321 cases), and December (2,010 cases). During those three winter months, 66% to 73% of all deaths happened at home. These figures come directly from official reports, not from population-based estimates. In the United States, over 400 people die each year from accidental carbon monoxide poisoning unrelated to fires; more than 100,000 people seek emergency treatment, and over 14,000 are hospitalized."
  sources:
    - {citation: "You J, Liu J, Zhou M (2020). Number of Deaths due to Carbon Monoxide Poisoning by Month and by Place of Death — China, 2018. China CDC Weekly 2(2):32：「In 2018, there were 11,523 deaths caused by carbon monoxide poisoning reported in China」", url: "https://doi.org/10.46234/ccdcw2020.008"}
    - {citation: "美国疾病控制与预防中心. 一氧化碳中毒：「More than 400 Americans die from unintentional CO poisoning not linked to fires」「More than 100,000 visit an emergency department」「More than 14,000 are hospitalized」，常见症状「headache, dizziness, weakness, upset stomach, vomiting, chest pain, and confusion」「CO symptoms are often described as \"flu-like.\"」", url: "https://www.cdc.gov/carbon-monoxide/about/index.html"}
    - {citation: "美国消费品安全委员会. 一氧化碳信息中心：「Know the symptoms of carbon monoxide poisoning: headache, dizziness, weakness, nausea, vomiting, sleepiness, and confusion」「If you suspect CO poisoning, get outside to fresh air immediately, and then call 911」", url: "https://www.cpsc.gov/Safety-Education/Safety-Education-Centers/Carbon-Monoxide-Information-Center"}
    - {citation: "NHS. Carbon monoxide poisoning：「They may get worse when you spend time in an affected room or building and get better when you leave or go outside」", url: "https://www.nhs.uk/conditions/carbon-monoxide-poisoning/"}
  doi: "10.46234/ccdcw2020.008"

- id: ch13_i24
  chapter: 13
  item: 24
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "При пожаре ползите по полу, потрогайте дверь перед тем, как открыть, если она горячая — не открывайте; пользуйтесь лестницей, а не лифтом, и не возвращайтесь обратно после выхода на улицу", en: "Stay low to the ground during a fire, test doors before opening them, and never use elevators — once outside, don’t look back"}
  grade: B
  measure: mortality
  plain:
    ru: "При пожаре лягте на пол и ползите под слоем дыма к выходу. Перед тем как открыть дверь, обязательно потрогайте ручку и саму дверь: если они горячие или из щели идёт дым — не открывайте её, а выбирайте второй путь. Открывайте дверь медленно, а как только увидите густой дым — сразу закрывайте её обратно. Пользуйтесь только лестницей, так как при отключении электричества лифт может стать ловушкой. После выхода на улицу не возвращайтесь обратно даже за вещами. Если на одежде вспыхнул огонь, немедленно остановитесь, лягте на пол, катайтесь по нему, прикрывая лицо руками."
    en: "Drop to the ground and crawl toward the nearest exit, staying under any smoke layer. Before opening a door, touch the handle and door surface first; if either feels hot or smoke is seeping through the crack, don’t open it — instead, head toward the other exit. Open the door slowly, and shut it immediately if thick smoke rushes in. Always use stairs instead of elevators, since power outages can trap you inside them. Once outside, never turn back to retrieve belongings. If your clothes catch fire, stop where you are, lie down, roll on the ground, and shield your face with your hands."
  benefit:
    ru: "Официальные рекомендации американской службы FEMA гласят: «Лягте на пол и ползите под слоем дыма к выходу». Перед открытием двери нужно потрогать её ручку и поверхность: «Если она горячая или из щели идёт дым — не открывайте её, а выбирайте второй путь». Открывать дверь следует медленно, а при появлении густого дыма — сразу закрывать. В случае возгорания одежды нужно «остановиться, лечь на пол и кататься по нему», прикрывая лицо руками. Если выбраться не получается, закройте дверь и заткните щели и вентиляционные отверстия тканью или скотчем, после чего позвоните и сообщите своё местоположение. Схожие рекомендации даёт и Министерство по чрезвычайным ситуациям: при пожаре нельзя пользоваться лифтом, при небольшом огне стоит спускаться вниз по лестнице, прикрывая нос и рот влажным полотенцем или маской, а также ползти или идти в наклонном положении."
    en: "FEMA’s official fire escape guidance matches these steps exactly: “Drop to the ground and crawl under smoke toward an exit.” It also advises testing door handles and surfaces first — “If they’re hot, or smoke is coming through the crack, don’t open the door; use the other exit instead.” Open doors slowly, and close them at once if heavy smoke appears. For clothing fires, the same advice applies: “Stop, lie down, roll, and shield your face.” If escape proves impossible, close the door and seal any gaps or vents with cloth or tape, then call for help and state your location. China’s emergency management department shares these same recommendations: never use elevators, head downward if the fire is small, cover your nose and mouth with a wet towel or mask, and evacuate while staying low to the ground."
  sources:
    - {citation: "US FEMA Ready.gov. Home Fires", url: "https://www.ready.gov/home-fires"}
    - {citation: "应急管理部 (2019). 公共场所火灾自救方法：「逃生时不要乘坐电梯，当火势不大时，要尽量往楼层下面跑」「可用湿毛巾或口罩蒙鼻，匍匐或弯腰撤离」", url: "https://www.mem.gov.cn/kp/shaq/201904/t20190401_366015.shtml"}
    - {citation: "贵州省消防救援总队 (2020). 消防常识丨逃生三要点：「湿毛巾对折3次（叠成8层），除烟率比较高，但烟和毒气浓度过高时，过滤效果就无法保证了。另外，毛巾过湿会导致呼吸困难」", url: "https://gz.119.gov.cn/xfkp/xfcs/202010/t20201026_71437855.html"}

- id: ch13_i25
  chapter: 13
  item: 25
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "Увидели, что кто-то тонет: сначала кричите, зовите на помощь и звоните в 110/120, затем подавайте шест, бросайте плавучие предметы — сами не заходите в воду", en: "Upon seeing someone drowning, shout for help and call 110/120, then reach out a pole or floating objects — never enter the water yourself"}
  grade: C
  measure: mortality
  plain:
    ru: "Человек, тонущий в воде, инстинктивно тянет спасателя под воду, поэтому тот тоже может утонуть. Порядок действий таков: громко кричите, зовите людей → звоните в 110/120 → подавайте длинный шест, веревку → бросайте спасательный круг, пустые ведра, бутылки с водой → если человек выбрался на берег и не дышит, сразу начинайте сердечно-легочную реанимацию. Ни в коем случае не заходите в воду, образуя цепочку из людей, держась за руки. Ежегодно во всем мире тонет около 300 тысяч человек, это четвертая по частоте причина смерти у детей в возрасте от 1 до 4 лет."
    en: "A drowning person instinctively pulls their rescuer underwater, so anyone who enters the water risks drowning too. The proper sequence is: shout for help → call emergency services → extend a long pole or rope → throw life rings, empty buckets, or plastic bottles → if the victim is on shore and not breathing, start CPR immediately. Never form a human chain by holding hands and entering the water. Globally, roughly 300,000 people drown each year; this ranks as the fourth leading cause of death among children aged 1–4."
  benefit:
    ru: "По данным ВОЗ, ежегодно во всем мире тонет около 300 тысяч человек, причем 92% таких случаев приходится на страны с низким и средним уровнем дохода. Для детей от 1 до 4 лет утопление — четвертая по частоте причина смерти, а для детей от 5 до 14 лет — третья. ВОЗ рекомендует обучать людей именно безопасным методам спасения, то есть действиям, при которых не нужно заходить в воду. Порядок действий такой же: кричите, зовите людей → звоните в службы спасения → подавайте шест, веревку, бросайте спасательные средства → если человек выбрался на берег и не дышит, сразу начинайте реанимацию."
    en: "WHO reports that about 300,000 drownings occur worldwide each year, with 92% occurring in low- and middle-income countries. Drowning is the fourth leading cause of death for kids aged 1–4 and the third leading cause for those aged 5–14. WHO recommends “safe rescue and resuscitation training” — essentially learning how to help without entering the water. The recommended steps are identical: shout for help → call emergency services → reach out poles or ropes, toss life rings, empty buckets, or bottles → if the victim is out of water and not breathing, perform CPR right away."
  sources:
    - {citation: "WHO. 溺水 实况报道", url: "https://www.who.int/zh/news-room/fact-sheets/detail/drowning"}
    - {citation: "International Federation of Red Cross and Red Crescent Societies (2025). International First Aid, Resuscitation and Education Guidelines 2025，第 214–215 页：「An attempted rescue by first aid providers should be made without entering the water, either from land or a boat, by reaching with something rigid (e.g. a pole or tree branch), or by throwing a rope or buoyant object. Providers should not touch an actively drowning person because of the risk of being pulled into the water」", url: "https://www.ifrc.org/sites/default/files/2026-03/IFRC%20International%20First%20Aid,%20Resuscitation%20and%20Education%20Guidelines%202025.pdf"}
    - {citation: "American Heart Association / American Academy of Pediatrics (2024). Highlights of the 2024 Focused Update on Resuscitation Following Drowning，第 3–4 页", url: "https://www.heart.org/-/media/CPR-Files/CPR-Guidelines-Files/Highlights/2024_Drowning/Hghlghts_2024GLFU_Drowning_240927.pdf"}

- id: ch13_i26
  chapter: 13
  item: 26
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "Если человек подавился и не может говорить, (если ему больше 1 года) встаньте позади него и сделайте 5 ударов по спине и 5 нажатий на живот; если он упадёт — начинайте сердечно-лёгочную реанимацию", en: "If someone is choking and can’t speak, stand behind them (age 1 and over) and perform 5 back blows followed by 5 abdominal thrusts; if they collapse, start CPR immediately"}
  grade: B
  measure: mortality
  plain:
    ru: "Сначала спросите: «Вы подавились? Можете говорить?» Если человек может кашлять или издавать звуки, пусть откашливается сам. Если ему больше 1 года и он не может говорить, встаньте позади него и выполните 5 ударов по спине, затем 5 нажатий на живот; повторяйте этот цикл, пока инородное тело не выйдет или человек не упадёт. В случае падения немедленно начинайте сердечно-лёгочную реанимацию и позовите кого-нибудь вызвать скорую помощь. Беременным женщинам и очень полным людям следует наносить удары по грудине. Ни в коем случае не пытайтесь рукой достать невидимый предмет изо рта."
    en: "First ask, “Are you choking? Can you speak?” If the person can still cough or make sounds, let them cough on their own. For anyone over 1 year old who can’t speak, stand behind them and give 5 back blows followed by 5 abdominal thrusts, repeating this sequence until the object comes out or the person loses consciousness. Once they collapse, begin CPR right away and call emergency services. For pregnant women or very overweight individuals, perform chest thrusts instead. Never reach into someone’s mouth to try to remove an unseen object."
  benefit:
    ru: "Согласно данным Национальной медицинской библиотеки США, сначала необходимо задать вопрос: «Вы подавились? Можете говорить?» Если человек способен кашлять или говорить, вмешиваться не следует, так как сам кашель часто помогает вытолкнуть инородное тело. Если же он не может говорить, нужно «повторять 5 ударов по спине и 5 нажатий на живот до тех пор, пока предмет не выйдет или человек не потеряет сознание». Как только человек теряет сознание, следует немедленно начинать сердечно-лёгочную реанимацию и вызывать скорую помощь. Беременным и полным людям рекомендуется наносить удары по грудине."
    en: "According to the original text from the U.S. National Library of Medicine: First ask, “Are you choking? Can you speak?” It also states that “if the person can still cough forcefully or speak, do not intervene” since coughing often removes the obstruction on its own. If they can’t speak, “repeatedly perform 5 back blows followed by 5 abdominal thrusts until the object is dislodged or the person loses consciousness.” At that point, “begin CPR immediately” while calling emergency services. Chest thrusts are recommended for pregnant women and those with obesity."
  sources:
    - {citation: "US National Library of Medicine, MedlinePlus. Choking – adult or child over 1 year", url: "https://medlineplus.gov/ency/article/000047.htm"}
    - {citation: "福州市卫生健康委员会 (2026). 海姆立克急救法更新了：「1岁以上幼儿、儿童及成人：从旧版单一腹部冲击改为\"5次背部拍击+5次腹部冲击\"的循环」「中国红十字系统急救培训一直都是按\"5次背部拍击+5次腹部冲击\"循环进行的方式进行教学」", url: "https://www.fuzhou.gov.cn/zgfzzt/swjw/fzwj/jkkp/202601/t20260108_5268351.htm"}
    - {citation: "International Federation of Red Cross and Red Crescent Societies (2025). International First Aid, Resuscitation and Education Guidelines 2025，第 238 页：「First aid providers should not use a blind finger sweep in people with a foreign-body airway obstruction as this may push the object further down the person's airway」", url: "https://www.ifrc.org/sites/default/files/2026-03/IFRC%20International%20First%20Aid,%20Resuscitation%20and%20Education%20Guidelines%202025.pdf"}

- id: ch13_i37
  chapter: 13
  item: 37
  chapter_title: {ru: "Что делать в экстренных ситуациях", en: "Emergency situations: what to do first"}
  title: {ru: "Увидели группу людей, которые дерутся — отойдите и уходите прочь. Не вмешивайтесь, не стойте в толпе зрителей, не поднимайте с земли оружие. Если хотите вызвать полицию, отойдите на безопасное расстояние и наберите 110", en: "If you stumble upon a group fight, walk away immediately — don’t try to break it up, don’t stand around watching, and don’t pick up any weapons on the ground. If you want to call the police, retreat to a safe distance and dial 110"}
  grade: B
  measure: freedom
  plain:
    ru: "Как только вы начинаете действовать, ваше поведение уже не считается попыткой урегулировать конфликт, а становится участием в драке. Участие в массовой потасовке наказывается лишением свободы до 3 лет; если участников много, драка происходит на дороге и с применением оружия, срок увеличивается до 3–10 лет. Стоять в толпе зрителей тоже невыгодно: чем больше людей, тем больше хаоса, и вы легко можете пострадать. Правильное действие — просто отойти и уйти. Если вы решите вызвать полицию, отойдите на безопасное расстояние и наберите 110, сообщив точное место происшествия, количество участников, наличие оружия и информацию о том, лежит ли кто-то без сознания."
    en: "If you intervene, your actions shift from “trying to calm things down” to “taking part in a fight.” Participating in a group brawl can land you in prison for up to three years; if many people are involved, it happens on a road, or weapons are used, the sentence rises to three to ten years. Watching isn’t worth it either — the more onlookers there are, the messier the scene gets, and you’re more likely to get hurt. The right move is to walk away. If you do want to call the police, step back to a safe spot and dial 110, clearly stating the location, how many people are involved, whether anyone is carrying knives or sticks, and if anyone has collapsed."
  benefit:
    ru: "Статья 292 Уголовного кодекса гласит: «За участие в массовых драках главарям и активным участникам грозит лишение свободы до 3 лет, арест или принудительные работы». В случае многократных драк, большого числа участников, серьезного общественного резонанса, нарушения порядка на публике или на дорогах, а также при применении оружия срок увеличивается до 3–10 лет. Если в результате драки пострадавшие получают тяжелые травмы или погибают, виновные привлекаются к ответственности по статьям о умышленном причинении вреда здоровью или убийстве. Кроме того, предусмотрены наказания по Кодексу об административных правонарушениях: за избиение человека грозит арест на 5–10 суток и штраф от 500 до 1000 юаней. Групповые драки рассматриваются как хулиганство, максимальное наказание — 15 суток ареста и штраф до 2000 юаней. Пункт 5 Руководящих принципов по применению самообороны гласит, что незаконное посягательство «включает в себя нападения как на самого человека, так и на государство, общественные интересы или других лиц». Согласно пункту 9 этих же принципов, если одна сторона первой начала агрессию и применяет явно чрезмерные меры, либо продолжает нападение после того, как другая сторона пытается избежать конфликта, ответные действия обычно признаются законной самообороной."
    en: "Article 292 of the Criminal Law states: “Those who lead or actively take part in group brawls shall be sentenced to up to three years in prison, criminal detention, or surveillance.” If the brawls happen repeatedly, involve many people, have a big social impact, occur in public spaces or on busy roads, or involve weapons, the punishment rises to three to ten years. If such fights cause serious injury or death, perpetrators are charged under laws on intentional injury or homicide. The Public Security Administration Punishment Law also sets penalties: assaulting others brings a detention of five to ten days plus fines of 500 to 1,000 yuan. Group fights handled as hooliganism can lead to up to fifteen days in jail and fines up to 2,000 yuan. Guideline 5 of the “Opinions on Properly Applying Self‑Defence” says unlawful attacks include those aimed at you, at the public, or at others. Guideline 9 adds that if one side starts the fight with excessive force, or continues attacking even after the other side tries to avoid conflict, the responding party is usually considered acting in self‑defence."

- id: ch29_i1
  chapter: 29
  item: 1
  chapter_title: {ru: "После тяжёлого удара", en: "After a major blow"}
  title: {ru: "В первые дни после смерти близкого не оставайтесь одни; при болезни сердца, гипертонии и диабете пейте лекарства как обычно, а при давящей боли в груди звоните 120", en: "In the first days after a relative dies, do not stay alone; if you have heart disease, hypertension, or diabetes, keep taking the medicine; if the chest feels pressed and hurts, call 120"}
  grade: A
  measure: mortality
  plain:
    ru: "В первый день после смерти близкого вероятность инфаркта в 21,1 раза выше обычной, дальше день ото дня ниже. У людей от 60 до 89 лет в первые 30 дней после смерти супруга доля инфарктов или инсультов примерно удваивается, через месяц спадает. У кого болезнь сосудов и сердца уже есть, в эти дни лекарства не бросайте. Давящая боль в груди, нехватка воздуха, слабость в руке или ноге с одной стороны — сразу звоните 120."
    en: "On the day after a relative dies, the chance of a heart attack is 21.1 times the usual chance, and each day after that it is lower. Among people aged 60 to 89, the share who have a heart attack or a stroke within 30 days after a spouse dies is about double, and it falls back after a month. If you already have cardiovascular disease, do not stop the medicine these days. If the chest feels pressed and hurts, you cannot catch your breath, or an arm or a leg on a single side has no strength, call 120 at once."
  benefit:
    ru: "1985 человек с острым инфарктом; у каждого сравнивали разные отрезки времени до и после приступа, человек сам с собой. Из них у 270 (13,6%) за 6 месяцев до приступа умер кто-то важный, у 19 это случилось в пределах 1 дня до инфаркта. В первые 24 часа после смерти важного человека частота острого инфаркта выше в 21,1 раза (95% доверительный интервал (ДИ) 13,1–34,1; истинный множитель примерно от 13 до 34). Дальше спад день за днём. В пересчёте на людей: среди тех, у кого десятилетний риск инфаркта 5%, на каждые 1394 только что потерявших близкого приходится 1 лишний случай. Среди тех, у кого риск 20%, 1 лишний случай на каждые 320. Другое исследование в Великобритании сравнило 30447 овдовевших в возрасте от 60 до 89 лет и 83588 сопоставимых людей для сравнения. За 30 дней после утраты супруга инфаркт или инсульт случился у 50 человек на стороне овдовевших (0,16%) и у 67 на стороне сравнения (0,08%). Отношение частот (IRR) 2,20 (1,52–3,15), то есть вероятность события примерно в 2,2 раза выше, чем у сравнения. Инфаркт отдельно: 2,14 (1,20–3,81), примерно в 2,1 раза. Инсульт: 2,40 (1,22–4,71), примерно в 2,4 раза. После 30 дней связь слабеет. За 90 дней смотрели ещё две болезни. Первая — острый коронарный синдром без инфаркта (острый сбой кровоснабжения сердца, которого ещё не хватает, чтобы назвать это инфарктом), IRR 2,20 (1,12–4,29). Вторая — лёгочная эмболия (сгусток крови закупорил сосуд в лёгком), IRR 2,37 (1,18–4,75). Как узнать эти болезни: Национальная служба здравоохранения Великобритании (NHS) перечислила признаки, при которых надо сразу звонить в скорую. Инфаркт — боль в груди, как будто её давят и сжимают; боль может отдавать в руку, шею, челюсть, плюс нехватка воздуха. Инсульт — одна сторона лица обвисает, одна рука или одна сторона тела без силы и немеет, речь невнятная."
    en: "1985 patients with an acute heart attack, comparing different stretches of time in the same person, before and after the attack. Of them, 270 (13.6%) had lost an important person in the 6 months before the attack, and 19 had lost that person within 1 day before the heart attack. Within 24 hours after an important person died, the rate of acute heart attack was 21.1 times higher (95% CI 13.1–34.1, and the true multiple sits roughly between 13 and 34). After that it fell day by day. In actual counts: among people with a decade-long heart-attack risk of 5%, each 1394 people who had just lost a relative produced 1 extra case. Among people with a risk of 20%, each 320 people produced 1 extra case. Another study in Britain compared 30447 widowed people aged 60 to 89 with 83588 controls in similar circumstances. Within 30 days after the death of the spouse, a heart attack or a stroke occurred in 50 people on the widowed side (0.16%) and in 67 people on the control side (0.08%). The IRR was 2.20 (1.52–3.15), that is, the chance of the event was about 2.2 times the control group. Of that, heart attack was 2.14 (1.20–3.81), about 2.1 times. Stroke was 2.40 (1.22–4.71), about 2.4 times. After 30 days it weakened. Within 90 days they also looked at further illnesses. The first was acute coronary syndrome that was not a heart attack (an acute problem with the blood supply to the heart that still falls short of a heart attack), IRR 2.20 (1.12–4.29). The other was pulmonary embolism (a clot blocking a blood vessel in the lung), IRR 2.37 (1.18–4.75). The British National Health Service (NHS) lists the signs for which you should call the emergency number at once. A heart attack is pain in the chest as if it were being pressed or squeezed. The pain can spread to the arm, the neck, or the jaw, and there is also shortness of breath. A stroke is a side of the face drooping, an arm or a side of the body weak or numb, and slurred speech."
  numbers:
    - {kind: IRR, value: 2.2}
    - {kind: IRR, value: 2.37}
  sources:
    - {citation: "Mostofsky E, et al. (2012). Risk of acute myocardial infarction after the death of a significant person in one's life: the Determinants of Myocardial Infarction Onset Study. Circulation", url: "https://doi.org/10.1161/CIRCULATIONAHA.111.061770"}
    - {citation: "Carey IM, et al. (2014). Increased risk of acute cardiovascular events after partner bereavement: a matched cohort study. JAMA Internal Medicine", url: "https://doi.org/10.1001/jamainternmed.2013.14558"}
    - {citation: "NHS. Heart attack: symptoms", url: "https://www.nhs.uk/conditions/heart-attack/symptoms/"}
    - {citation: "NHS. Symptoms of a stroke", url: "https://www.nhs.uk/conditions/stroke/symptoms/"}
  doi: "10.1161/CIRCULATIONAHA.111.061770"

- id: ch29_i3
  chapter: 29
  item: 3
  chapter_title: {ru: "После тяжёлого удара", en: "After a major blow"}
  title: {ru: "После потери работы важно наладить режим дня, оформить медстраховку (ибао) и составить четкий график поиска работы — не стоит целыми днями сидеть дома", en: "After losing a job, it’s important to set a regular sleep schedule, keep yibao (basic medical insurance) active, and plan job searches methodically — don’t just stay at home all day"}
  grade: A
  measure: mortality
  plain:
    ru: "У человека без работы вероятность потом умереть примерно на шесть десятых выше, чем у того, кто работает; у мужчин и у тех, кто ещё не в годах, это заметнее, и выше всего в первые десять лет. Если вычесть влияние курения и алкоголя, прирост меньше примерно на четверть — эту часть можно удержать самому. Сначала оформите регистрацию безработного и получите пособие по безработице."
    en: "People who have lost a job later die at a rate about 60% higher than people still in work. The gap is clearer for men, and for people who are not old, and it is highest in the first 10 years. Once smoking and drinking are taken out, the rise is about a quarter smaller, and that part is in your own hands. Register as unemployed first, and claim the unemployment insurance benefit."
  benefit:
    ru: "В основе этих лежат 42 исследования, охватывающие 235 оценок риска смерти и более 20 миллионов населения. После учета возраста и других факторов средний показатель HR для безработных составил 1,63, то есть риск смерти выше на 60% по сравнению с работающими людьми. У мужчин этот показатель выше, чем у женщин; наиболее заметен эффект у людей в начале и середине карьеры, а в конце — меньше. Пик риска приходится на первые десять лет после увольнения, затем он снижается. В исследованиях, учитывающих влияние вредных привычек, средний показатель HR снижается на 24%, то есть прирост риска уменьшается примерно на четверть."
    en: "Data from 42 studies involving over 20 million participants and 235 mortality risk estimates show that, after adjusting for age and other factors, unemployed individuals face an average HR of 1.63 for all causes of death — meaning their risk is about 63% higher than that of employed people. This effect is more pronounced in men and in people early or midway through their careers; it diminishes after the first ten years. When lifestyle factors like smoking and drinking are included in the analysis, the average HR drops by 24%, reflecting a similar reduction in overall risk."
  numbers:
    - {kind: HR, value: 1.63}
  sources:
    - {citation: "Roelfs DJ, et al. (2011). Losing life and livelihood: a systematic review and meta-analysis of unemployment and all-cause mortality. Social Science & Medicine", url: "https://doi.org/10.1016/j.socscimed.2011.01.005"}
  doi: "10.1016/j.socscimed.2011.01.005"

- id: ch29_i8
  chapter: 29
  item: 8
  chapter_title: {ru: "После тяжёлого удара", en: "After a major blow"}
  title: {ru: "Горе длится более полугода, жизнь не налаживается: когда обращаться к психиатру или клиническому психологу", en: "Still stuck in grief after half a year, unable to move on — when to see a psychiatrist or clinical psychologist"}
  grade: A
  measure: mortality
  plain:
    ru: "Примерно у одного из десяти взрослых, потерявших близкого, состояние застревает. Больше полугода человек всё ещё так скучает по умершему, что не может есть, выходить на работу и заниматься детьми; внутри онемение, и жизнь кажется бессмысленной. Это не оттого, что не хватает стойкости: у этого есть критерии диагноза и отдельное лечение. Эффективность целенаправленного лечения 51%, обычной психотерапии 28%, и оно начинает действовать быстрее."
    en: "About 1 in 10 bereaved adults gets stuck. After more than half a year they still miss the person so much that they cannot eat, cannot go to work, and cannot look after a child. They feel numb, and life seems to have no point. This is not a lack of strength. It has diagnostic criteria, and it has a treatment made for it. Targeted treatment works in 51% of cases, ordinary psychotherapy in 28%, and the targeted treatment also starts to work sooner."
  benefit:
    ru: "В 14 исследованиях приняли участие взрослые, чьи близкие умерли не в результате насильственных действий, и которые ранее не обращались к психиатрам. Частота встречаемости расстройства продолжительного горя составила 9,8% (95% ДИ 6,8–14,0), то есть примерно у 10 из 100 таких людей. С возрастом этот показатель растет. В другом исследовании проверяли точность диагностических критериев: 291 человека опрашивали трижды — через 0–6, 6–12 и 12–24 месяца после утраты. Основным признаком диагноза является сильная тоска по умершему. Кроме того, должны присутствовать минимум пять из следующих девяти признаков. Первые пять — эмоциональная апатия, шок, ощущение бессмысленности жизни, недоверие к окружающим, страдания из-за потери. Остальные четыре — неспособность принять случившееся, утрата представления о собственной личности, избегание реальности, невозможность жить дальше. Все эти симптомы должны проявляться ежедневно или быть настолько выраженными, что мешают вести обычный образ жизни. Они сохраняются минимум 6 месяцев после смерти близкого и серьезно влияют на повседневную жизнь. В еще одном исследовании 95 участников разделили на две группы, каждой провели 16 сеансов терапии в течение 19 недель. Эффективность лечения сложного горя составила 51%, обычной межличностной психотерапии — 28% (P=0,02, разница вряд ли случайна). Первая методика также дает результаты быстрее. Число пациентов, нуждающихся в лечении, равно 4,3: это означает, что в среднем на каждые 4,3 человека один получает улучшение состояния."
    en: "Fourteen studies involving adults whose loved ones died of non‑violent causes and who had not previously sought mental‑health care reveal that prolonged grief disorder affects 9.8% of this group (95% CI 6.8–14.0), meaning about 10 out of every 100 bereaved adults are impacted. The rate rises with age. Another study tested the diagnostic criteria on 291 bereaved individuals through interviews at 0–6, 6–12, and 12–24 months after loss. The core symptom is intense longing for the deceased; at least five of nine additional criteria must also be present. The first five criteria are emotional numbness, shock, feeling life lacks meaning, distrust of others, and distress caused by the loss. The remaining four are difficulty accepting the loss, trouble defining one’s own identity, avoidance of reality, and an inability to carry on daily life. All these symptoms must appear daily or be severe enough to impair functioning, and they must persist for at least six months after the death. A randomized trial of 95 participants receiving 16 therapy sessions over 19 weeks found a 51% success rate for specialized treatment versus 28% for standard interpersonal psychotherapy (P = 0.02, a statistically significant difference). Consequently, only 4.3 patients need to be treated for one additional person to experience improvement."
  sources:
    - {citation: "Lundorff M, et al. (2017). Prevalence of prolonged grief disorder in adult bereavement: A systematic review and meta-analysis. Journal of Affective Disorders", url: "https://doi.org/10.1016/j.jad.2017.01.030"}
    - {citation: "Prigerson HG, et al. (2009). Prolonged grief disorder: Psychometric validation of criteria proposed for DSM-V and ICD-11. PLoS Medicine", url: "https://doi.org/10.1371/journal.pmed.1000121"}
    - {citation: "Shear MK, et al. (2005). Treatment of complicated grief: a randomized controlled trial. JAMA", url: "https://doi.org/10.1001/jama.293.21.2601"}
  doi: "10.1016/j.jad.2017.01.030"

- id: ch29_i12
  chapter: 29
  item: 12
  chapter_title: {ru: "После тяжёлого удара", en: "After a major blow"}
  title: {ru: "В первые три месяца после случившегося отодвигайте все необратимые крупные решения", en: "In the first months after a blow, push back every big decision that cannot be undone"}
  grade: B
  measure: money
  plain:
    ru: "В этот период вы хуже всего судите о разных «шансах». В опыте опечаленные люди, чтобы не ждать 3 месяца, соглашались взять меньше денег: больше чем на одну десятую и вплоть до больше чем на три десятых. Всё, что больше дохода за один месяц или где цена отмены велика, отодвигайте на три месяца. Сначала расскажите человеку, у которого в этом деле нет своей выгоды, и не решайте в тот же день."
    en: "In this stretch your judgment of every \"opportunity\" is at its worst. In an experiment, sad people were willing to take a bit over 10% less money, and up to a bit over 30% less, so they would not have to wait 3 months. Anything larger than a month of income, or anything that would cost a lot to undo, gets pushed back for 3 months. Tell it first to a person who has no stake in the matter. Do not decide the same day."
  benefit:
    ru: "Так вы не распоряжаетесь имуществом безвозвратно в тот отрезок, когда удар только что случился и суждение хуже всего. Сюда входят продажа жилья, увольнение, вложение пособия по утрате или компенсации одним разом, поспешный новый брак, поручительство за кого-то. Суммы таких решений обычно от нескольких десятков тысяч юаней до стоимости одной квартиры, поэтому эффект принят как средний. Официальные документы тоже относят «беду в семье, потерю работы, уход из учёбы» к рискам психологического кризиса, которые сообщество должно само выявлять: это время уже считают временем, когда нужна чужая рука. В руководстве по горю Национального института старения США (NIA) «трудно принимать решения» названо обычным проявлением горя. Там совет: если можно выбрать, отодвиньте крупные жизненные решения на время, когда станет легче. Пока вы в горе и можете думать неясно, лучше не делать крупных перемен вроде продажи жилья и увольнения. В одном исследовании сделали три опыта. Исследователи случайно делили людей, часть вводили в опечаленное состояние и предлагали выбрать «деньги сейчас» или «деньги через 3 месяца». По сравнению с людьми в спокойном настроении опечаленные, чтобы не ждать 3 месяца, соглашались взять на 13% до 34% меньше. Это печаль, вызванная в опыте, а не настоящая утрата близкого. Федеральная торговая комиссия США (FTC) в 2023 году предупреждала об одном обмане: человек выдаёт себя за похоронное бюро и говорит семье, что если сразу не доплатить, похороны отменят. Первый способ, который она даёт: не поддаваться давлению «сделайте сейчас»; нормальный продавец даст вам время решить."
    en: "Avoid making a property disposal you cannot undo, in the stretch just after the blow, when judgment is at its worst. This kind of thing includes selling a home, quitting a job, putting a pension or a compensation payment out as a lump sum, remarrying in a hurry, and standing guarantee for someone. The amount of this kind of decision is usually on the scale of several tens of thousands of yuan up to a home, so the benefit is set at medium. Official documents likewise list \"a family blow, job loss, and dropping out of school\" as psychological-crisis risks that the community should go and look for on its own initiative. The state of this stretch is already treated as a state that needs an outsider to lend a hand. The grief guide of the US National Institute on Aging (NIA) lists \"making decisions is hard\" as a common feature of grief. It suggests: if you can choose, push major life decisions back until you feel better. While you are grieving and may not be able to think clearly, it is better not to make a large change such as selling a home or quitting a job. A study ran a set of experiments. The researchers assigned people at random, put some of them into a sad state, and then had them choose \"take the money now\" or \"take the money after 3 months.\" Compared with people in a calm mood, sad people were willing to take 13% to 34% less money so they would not have to wait 3 months. This was sadness brought on in an experiment, not a real bereavement. In 2023 the US Federal Trade Commission (FTC) warned about a scam: someone poses as a funeral home and tells the family that if they do not pay more at once, the funeral will be cancelled. The first step it gives is to resist the pressure to \"do it right now.\" A proper business will give you time to decide."
  sources:
    - {citation: "国家卫生健康委等 25 部门 (2026). 健全社会心理服务体系和危机干预机制实施方案（国卫医政发〔2026〕8 号）", url: "https://www.gov.cn/zhengce/zhengceku/202604/content_7065035.htm"}
    - {citation: "National Institute on Aging. Coping With Grief and Loss（「Postpone major decisions if possible」一段，页面 2026-01-26 更新）", url: "https://www.nia.nih.gov/health/grief-and-mourning/coping-grief-and-loss"}
    - {citation: "Lerner JS, Li Y, Weber EU (2013). The financial costs of sadness. Psychological Science, 24(1), 72-79", url: "https://doi.org/10.1177/0956797612450302"}
    - {citation: "Puig A, Federal Trade Commission (2023-06-15). Imposters prey on families preparing for the funeral of a loved one", url: "https://consumer.ftc.gov/consumer-alerts/2023/06/imposters-prey-families-preparing-funeral-loved-one"}
  doi: "10.1177/0956797612450302"

- id: ch29_i13
  chapter: 29
  item: 13
  chapter_title: {ru: "После тяжёлого удара", en: "After a major blow"}
  title: {ru: "Не берите смерть как способ закрыть долги: за два года страховка жизни не платит, гибель на работе не признают, а долг всё равно сначала вычитают из наследства", en: "Do not treat death as a way to pay a debt: life insurance within 2 years does not pay, a work injury is not recognized, and the debt is still taken from the estate first"}
  grade: A
  measure: money
  plain:
    ru: "Если по договору страхования жизни человек уходит из жизни сам в течение двух лет, выплату не делают и возвращают только те деньги из полиса, которые можно вернуть. Гибель на работе тоже не признают, и из трёх выплат при такой гибели нет ни одной. Долги сначала вычитают из оставленного наследства, семье достаётся остаток. На них ещё ложится та цена для здоровья, о которой говорит «пункт 4 этого раздела» (утрата из-за самоубийства или насильственной смерти)."
    en: "A suicide within 2 years of a life-insurance contract is not paid. Only the small sum that can be refunded from the policy is returned. A work injury is not recognized either, and the three work-death payments are not paid at all. Debts owed are taken from the estate you leave first. The family only gets what is left. They also have to bear the health cost described in item 4 of this section (bereavement by suicide or by a violent death)."
  benefit:
    ru: "Статья 44 закона о страховании касается договоров, по которым страховую выплату делают при смерти застрахованного. Если застрахованный уходит из жизни сам в течение 2 лет со дня заключения договора или со дня восстановления силы договора, страховщик не несёт обязанности выплатить страховую сумму. Сюда не входит случай, когда в этот момент застрахованный был лицом без гражданской дееспособности, то есть по закону не отвечает за свои действия. Тогда страховая компания по договору возвращает выкупную стоимость полиса: только те деньги из полиса, которые можно вернуть, а страховую сумму не платит. Страховая сумма по страхованию жизни обычно на уровне порядка 100000 юаней, поэтому эффект принят как большой. Пункт 3 статьи 16 положения о страховании от производственных травм: кто сам причинил себе вред или ушёл из жизни сам, тому не устанавливают производственную травму и не приравнивают случившееся к производственной травме. Три выплаты при гибели на работе из статьи 39 тогда срываются все. Первая — пособие на похороны: его выдают за 6 месяцев по средней месячной зарплате работников данной местности за прошлый год. Вторая — пособие на содержание родственников, которые были на иждивении. Третья — единовременное пособие при гибели на работе, в размере 20-кратного среднедушевого располагаемого дохода городских жителей страны за прошлый год. Статья 1159 Гражданского кодекса: при разделе наследства надо погасить налоги и долги, которые умерший по закону должен был уплатить, то есть сначала из наследства платят налоги и долги, и только остаток делят. Статья 1161: наследник погашает долг в пределах действительной стоимости полученного наследства, то есть отдаёт только тем, что унаследовал, и своих денег сверху не кладёт; кто от наследства отказался, может не нести обязанности погашения."
    en: "Article 44 of the Insurance Law governs contracts that pay the insurance money on the condition that the insured person dies. Counted from the day the contract is formed, or from the day the contract's effect is restored, if the insured person dies by suicide within 2 years, the insurer does not bear the duty to pay the insurance money. This does not apply when the insured person, at the time of the suicide, is a person with no capacity for civil conduct, that is, a person the law does not treat as responsible for their own acts. In that case the insurer shall refund the cash value of the policy as the contract provides, that is, only the small sum that can be refunded from the policy, not the insured amount. Life-insurance cover is usually on the order of 100000 yuan, so the benefit is set at large. Item 3 of Article 16 of the Regulations on Work Injury Insurance provides: self-harm or suicide shall not be recognized as a work injury, or as deemed a work injury. The three work-death benefits in Article 39 then all fall through. The first is a funeral subsidy, paid as 6 months of the previous year's local average monthly wage of employees. The second is a pension for relatives who were supported by the deceased. The third is a lump-sum work-death subsidy, equal to 20 times the previous year's national per capita disposable income of urban residents. Article 1159 of the Civil Code provides: when the estate is divided, the taxes and debts the deceased legally owed shall be paid, that is, the estate pays the taxes and the debts first, and only what is left is divided. Article 1161 provides: an heir pays only up to the actual value of the estate they received, that is, they use only the part they inherited and do not put in more of their own money. A person who gives up the inheritance can bear no duty to pay."

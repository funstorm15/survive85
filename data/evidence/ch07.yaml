- id: ch07_i15
  chapter: 7
  item: 15
  chapter_title: {ru: "Как выжить, когда нет денег", en: "How to get by when you have no money"}
  title: {ru: "Не платите залог, не сдавайте документы, не подписывайте «кредит на обучение», не вступайте в финансовую пирамиду, не берите ломбардные займы", en: "No deposits, no ID retention, no “training loans”, no pyramid schemes, no usury"}
  grade: A
  measure: money
  plain:
    ru: "Работодатель не вправе задерживать ваш удостоверение личности, брать залог или собирать деньги под другим названием. Агентство, которое не нашло вам работу, обязано вернуть комиссию. «Кредит на обучение» (сначала плата за обучение, потом работа) и схемы, где доход считают за привлечённых людей, — мошенничество, на которое указывают официально. Проценты по займу выше четырёхкратной годовой LPR на дату договора суд не поддерживает, но основной долг всё равно нужно вернуть."
    en: "Employers cannot keep your ID or demand a deposit, nor can they charge you under any other pretext. If a job placement agency fails to find you a job, it must refund the placement fee. “Training loans” that require upfront fees, as well as pyramid schemes that pay out based on recruitment, are all officially recognized scams. Any interest on a loan exceeding four times the one-year LPR is not legally enforceable by courts, though the principal amount must still be repaid."
  benefit:
    ru: "Компания не вправе задерживать удостоверение личности и другие документы, требовать поручителей или собирать ваши деньги и вещи под другим видом. При нарушении — приказ вернуть и штраф от 500 юаней до 2000 юаней на каждого пострадавшего. Кадровое агентство не вправе задерживать документы и брать залог; если работу не нашли — комиссию возвращают. Под видом найма заставить сначала заплатить за обучение или оформить кредит — схемы «найм → обучение» и «кредит на обучение», на которые указали Минтруд и ещё четыре ведомства. Схема, где доход считают за привлечённых и нужно заплатить, чтобы вступить, — финансовая пирамида; участнику грозит штраф до 2000 юаней. По частному займу суд не поддерживает проценты выше четырёхкратной годовой LPR на дату договора. Это правило с августа 2020 года заменило старую схему с двумя линиями 24% и 36% (по всей стране)."
    en: "Employers are prohibited from withholding IDs or demanding guarantees or deposits. Violations result in mandatory refunds and fines ranging from 500 to 2,000 RMB per worker. Job placement agencies likewise cannot retain IDs or collect deposits; if they fail to place you, they must return all fees. Schemes that demand training fees or loans under the guise of employment are flagged by multiple government agencies as “training loan” scams. Pyramid schemes, where earnings depend on recruiting others, are illegal; participants face fines up to 2,000 RMB. Interest on private loans exceeding four times the one-year LPR is not legally binding. This regulation replaced the previous tiered limits of 24% and 36% (nationwide, effective August 2020)."
  sources:
    - {citation: "全国人大常委会 (2007). 劳动合同法（主席令第六十五号，第九、八十四条）", url: "https://www.gov.cn/gongbao/content/2007/content_711013.htm"}
    - {citation: "劳动保障部 (2007). 就业服务与就业管理规定（劳动保障部令第 28 号，第十四、五十五、五十八条）", url: "https://www.gov.cn/zhengce/2022-11/28/content_5711307.htm"}
    - {citation: "人力资源社会保障部等五部门 (2026). 警惕「招转培」「培训贷」等风险提示", url: "https://chinajob.mohrss.gov.cn/h5/c/2026-05-18/543038.shtml"}
    - {citation: "国务院 (2005). 禁止传销条例（国务院令第 444 号，第二、七、二十四条）", url: "https://www.gov.cn/gongbao/content/2005/content_80604.htm"}
    - {citation: "最高人民法院 (2020). 关于修改《关于审理民间借贷案件适用法律若干问题的规定》的决定（法释〔2020〕6 号，第二十六条）", url: "https://www.court.gov.cn/fabu/xiangqing/249031.html"}

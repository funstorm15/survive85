- id: ch07_i23
  chapter: 7
  item: 23
  chapter_title: {ru: "Как выжить, когда нет денег", en: "How to get by when you have no money"}
  title: {ru: "Кредитную карту и онлайн-займы уже не тянете — сами звоните в банк или на платформу и просите индивидуальную рассрочку или отсрочку; не берите новое, чтобы гасить старое, и не платите посредникам за «заморозку процентов», «починку кредитной истории» или «анти-взыскание»", en: "When you already cannot repay credit cards or online loans, call the bank or platform customer service yourself to apply for a personalized installment or deferral; do not borrow new to pay old, and do not pay intermediaries for “interest freeze,” “credit-report repair,” or “anti-collection”"}
  grade: B
  measure: money
  plain:
    ru: "Если карту не тянете, но готовы платить, с банком можно согласовать индивидуальную рассрочку — максимум 5 лет; после подписания соглашения банк должен прекратить взыскание. Но банк может отказать; уже просроченная запись в кредитной истории остаётся. Посредники, которые за деньги обещают «заморозку процентов» или «отбеливание кредитной истории», регулятор уже предупреждал — к ним не ходите."
    en: "If you cannot repay a credit card but are still willing to, you can negotiate a personalized installment with the bank for up to 5 years; once the agreement is signed the bank must stop collection. But the bank may refuse, and overdue records already on the credit report stay. Intermediaries who charge to “freeze interest” or “clean the credit report” have been specifically flagged by regulators — do not use them."
  benefit:
    ru: "По кредитным картам есть прямые правила. Если долг превышает возможности погашения, а вы всё ещё готовы платить, банк «может» на равных согласовать с вами соглашение об индивидуальной рассрочке. Срок соглашения — не больше 5 лет. В соглашении пишут сумму долга, размер каждого платежа, берут ли в период погашения годовую плату и проценты. После подписания банк и привлечённые им взыскатели должны прекратить взыскание. Если вы не платите по соглашению — это ограничение не действует. Устное соглашение банк обязан записать; запись хранить как минимум до полного погашения. Долг, который уже оформлен в обычную рассрочку, снова делить нельзя; индивидуальная рассрочка — единственное исключение (уведомление регулятора 2022 года). В 2025 году Народный банк, отменяя старые правила по банковским картам, прямо указал, что кредитные карты по-прежнему регулируются этими нормами. У онлайн-займов единых правил индивидуальной рассрочки нет; отсрочка и рассрочка зависят от договора и кредитора. Если деньги дала потребительская финансовая компания, правила запрещают взыскание насилием, угрозами, запугиванием и домогательствами. Банкам и потребительским финансовым компаниям нельзя взыскивать с людей, не связанных с долгом. По платным посредникам пять ведомств во главе с финансовым регулятором в 2026 году выпустили совместное предупреждение о рисках. В нём сказано, что «кредит / карту можно не возвращать», «согласование долга», «замена долга», «отбеливание кредитной истории» — недостоверная информация. Такое «представительство в защите прав» берёт высокую плату за услуги; если вы захотите выйти посередине, вас могут судить за нарушение договора. Они собирают данные вашей банковской карты, SIM-карты, домашний адрес и школу ребёнка. По их указке подделывать документы, злонамеренно уклоняться от долга, давить жалобами при тяжёлых обстоятельствах может тянуть на правонарушение или преступление. Пекинское управление страхования в 2022 году тоже указало на рекламу вроде «заморозка процентов», «остановка взыскания», «полное освобождение от процентов». Оно пишет: поверить им, тянуть и не связываться с банком — почти наверняка оставит в кредитной истории просрочку. Госкомитет по развитию и реформам в 2022 году отдельно боролся с «починкой кредитной истории». В уведомлении сказано: такие люди смешивают возражение по кредитной истории и восстановление кредита и обманывают под видом «починки, отбеливания, снятия записей». Негативные сведения в кредитной истории хранят 5 лет с дня окончания неблагоприятного поведения или события; по истечении 5 лет удаляют. В срок хранения вы можете добавить пояснение к записи; бюро кредитных историй обязано его зафиксировать (по всей стране)"
    en: "For credit cards there are express rules. When debt exceeds your repayment capacity and you are still willing to repay, the bank “may” negotiate equally with you and sign a personalized installment repayment agreement. The agreement lasts at most 5 years. It must state how much is owed, how much each installment is, and whether annual fees and interest are charged during repayment. Once both sides sign, the bank and collection agencies it engages must stop collection. If you do not repay per the agreement, that limit does not apply. If the deal is only oral, the bank must keep a recording at least until the debt is paid off. Debt already under installment cannot be installmented again; personalized installment is the only exception (2022 regulatory notice). When the People’s Bank of China repealed the old bank-card rules in 2025, it stated that credit cards continue under these rules. Online loans have no unified personalized-installment rule; whether deferral or installment is possible depends on the contract and the lender. When the lender is a consumer finance company, rules forbid collection by violence, threats, intimidation, or harassment. Banks and consumer finance companies may not collect from people unrelated to the debt. On paid intermediaries, five departments including the financial regulator issued a joint risk alert in 2026. It says claims such as “loans/credit cards need not be repaid,” “debt negotiation,” “debt swap,” and “credit-report whitewash” are false. Such “agency rights defense” charges high service fees; if you try to quit mid-way you may be sued for breach. They collect your bank cards, phone SIMs, home address, and children’s schools. Providing false materials as they teach, maliciously fleeing debt, or pressing with complaints may, in serious cases, involve crime. The Beijing banking and insurance regulator in 2022 also named ads for “interest freeze,” “stop collection,” and “full interest waiver.” It said that listening to such people, delaying repayment, and not contacting the bank can leave overdue bad records on the credit report. The National Development and Reform Commission ran a 2022 special campaign on “credit-report repair.” The notice says these people blur credit-report objections and credit repair, and defraud under names such as “credit-report repair, whitewash, wipe the slate.” Bad information on a credit report is kept for 5 years from the day the bad act or event ends, then deleted. During the retention period you may add a statement to that record, and the credit-reporting institution must record it (nationwide)"
  sources:

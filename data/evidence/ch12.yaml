- id: ch12_i1
  chapter: 12
  item: 1
  chapter_title: {ru: "Своё дело: как не потерять все сбережения", en: "Starting a business: don't bet the family savings"}
  title: {ru: "Вкладывайте только те деньги, которые готовы потерять: не трогайте семейные сбережения и не открывайтесь в долг", en: "Only put in money you can afford to lose; don't touch family savings or borrow to open"}
  grade: B
  measure: money
  plain:
    ru: "Долги индивидуального предпринимателя погашаются из его личного имущества. Если непонятно, вёл ли дело один человек или вся семья, отвечают семейным имуществом. Компания тоже не панацея: когда она не платит по срочным долгам, кредитор может потребовать досрочно ту часть заявленного вклада, срок внесения которой ещё не наступил. Поэтому размер вложений считайте так: «даже если всё сгорит, ипотеку и лечение всё равно потяну»."
    en: "Debts of a sole proprietorship come out of assets in your name. If it's unclear whether the whole family ran the business, creditors can reach family property. A company doesn't fully shield you either: when the company can't pay, what you promised as subscribed capital but haven't paid yet can be called in early. Size your stake by «I could lose it all and still pay the mortgage and medical bills»."
  benefit:
    ru: "Убыток — это не только пропавшие деньги. Долги индивидуального предпринимателя, если бизнес вёл один человек, погашаются из его личного имущества. Если дело вели всей семьёй или непонятно, кто именно, — из семейного имущества. Долг, который подписали оба супруга, — общий; если второй супруг потом согласился — тоже. Деньги, взятые одним супругом на своё имя, если кредитор докажет, что они пошли на совместный бизнес, тоже погашают оба. У компании есть своя линия: заявленный вклад акционера в уставный капитал. Когда компания не платит по срочным долгам, кредитор может потребовать досрочно ту часть, срок внесения которой ещё не наступил (по всей стране)"
    en: "Losing money isn't the only risk. For a sole proprietorship, if you ran the business alone, debts are paid from property in your name (personal property). If the family ran it together or who ran it is unclear, debts are paid from family property. Debts both spouses signed count as joint marital debt; later assent by one spouse counts too. A loan in one spouse's name still counts as joint debt if the creditor shows it went into the couple's shared business. For companies there is another rule: subscribed capital is what a shareholder promised at registration. When the company can't pay a due debt, creditors may demand early payment of the portion not yet due (nationwide)."
  sources:
    - {citation: "全国人大 (2020). 民法典（第五十六、一千零六十四条）", url: "https://www.spp.gov.cn/spp/fl/202006/t20200602_463888.shtml"}
    - {citation: "全国人大常委会 (2023). 公司法（2023 年修订，第四十七、五十四条）", url: "https://www.gov.cn/yaowen/liebiao/202312/content_6923395.htm"}

- id: ch12_i2
  chapter: 12
  item: 2
  chapter_title: {ru: "Своё дело: как не потерять все сбережения", en: "Starting a business: don't bet the family savings"}
  title: {ru: "Не подписывайте личное поручительство за кредит компании, супруга тем более не вовлекайте", en: "Don't sign personal guarantees on company loans; spouses should stay off the signature line"}
  grade: A
  measure: money
  plain:
    ru: "При «солидарном поручительстве» кредитор может обойти компанию и сразу требовать с вас. «Обычное поручительство» — сначала иск или арбитраж к компании, принудительная продажа её имущества, и только остаток — с вас. Подпись супруга втягивает общее имущество обоих; «ограниченность» ООО для вас лично перестаёт работать."
    en: "«Joint-and-several guarantee» means if the company doesn't pay, the creditor can skip the company and come straight to you. «General guarantee» means sue or arbitrate against the company first, sell company assets, and only then collect any shortfall from you. If your spouse signs too, both households' assets are in play and the company's «limited» liability stops protecting you personally."
  benefit:
    ru: "Формулировка в поручительстве значит: «если должник не платит — платите вы». При «солидарном поручительстве» кредитор может не идти к компании, а сразу к вам. При «обычном» — сначала иск или арбитраж к компании, затем принудительная продажа её имущества в счёт долга; сколько не хватило — доплачиваете вы. Долг, подписанный обоими супругами, — общий; последующее согласие одного — тоже. Подпись супруга значит, что в риске общее имущество обоих (по всей стране, с 2021 года)"
    en: "Guarantee wording means «if the debtor doesn't pay, you pay». With «joint-and-several guarantee», creditors need not pursue the company first—they can demand payment from you directly. With «general guarantee», they must sue or arbitrate against the company and have the court enforce on its assets first; only the remainder can be collected from you. Debts both spouses signed count as joint marital debt; later assent counts too. A spouse's signature puts both sides' family assets on the hook (nationwide, from 2021)."
  sources:
    - {citation: "全国人大 (2020). 民法典（第六百八十一、六百八十七、六百八十八、一千零六十四条）", url: "https://www.spp.gov.cn/spp/fl/202006/t20200602_463888.shtml"}

- id: ch12_i4
  chapter: 12
  item: 4
  chapter_title: {ru: "Своё дело: как не потерять все сбережения", en: "Starting a business: don't bet the family savings"}
  title: {ru: "Не будьте номинальным акционером и не держите чужие доли", en: "Don't be a nominal shareholder or hold shares for someone else"}
  grade: A
  measure: money
  plain:
    ru: "Имя в реестре — вы уже акционер по закону. Обещанный при регистрации вклад нужно внести в срок; не внесёте — доплата плюс убытки компании. Если при создании другие акционеры реально не внесли деньги, недостачу закрываете и вы. Бизнес ведёт другой человек, долги — на вас."
    en: "If your name is on the register, you're a shareholder in law. Pay subscribed capital on time; miss the deadline and you owe make-up plus company losses. If another founder didn't really pay in at formation, you share liability for the gap. Someone else runs the business; the debt sits on your name."
  benefit:
    ru: "Акционер в реестре — акционер по закону. Нужно в срок по уставу внести весь обещанный вклад. Не внесли в срок — доплата плюс убытки компании. Если при создании кто-то из акционеров реально не внёс деньги, остальные учредители по этой недостаче отвечают солидарно. Когда компания не платит по срочным долгам, кредитор может потребовать досрочного внесения ещё не наступившей части. Реальный бизнесмен не в реестре, долги — на вас (по всей стране, с июля 2024 года)"
    en: "A registered shareholder is a legal shareholder. Pay subscribed capital in full by the deadline in the articles; otherwise pay the shortfall and compensate company losses. If a founder didn't contribute at formation, other founders at formation share joint liability for that gap. When the company can't pay due debts, creditors may demand early payment of capital not yet due. The operator isn't on the register; the obligation is still yours (nationwide, from July 2024)."
  sources:
    - {citation: "全国人大常委会 (2023). 公司法（2023 年修订，第四十七、四十九、五十、五十四条）", url: "https://www.gov.cn/yaowen/liebiao/202312/content_6923395.htm"}
    - {citation: "最高人民法院 (2020 修正). 关于适用《中华人民共和国公司法》若干问题的规定（三）（法释〔2011〕3 号，2014 年法释〔2014〕2 号、2020 年法释〔2020〕18 号两次修正，第二十四、二十五条）：「如无法律规定的无效情形，人民法院应当认定该合同有效」「实际出资人未经公司其他股东半数以上同意，请求公司变更股东……人民法院不予支持」「名义股东处分股权造成实际出资人损失，实际出资人请求名义股东承担赔偿责任的，人民法院应予支持」. <https://flk.npc.gov.cn/detail?id=ff808181799def980179ac07a9ca117c>（国家法律法规数据库）；最高人民法院 (2025). 关于适用《中华人民共和国公司法》若干问题的解释（征求意见稿）第九十条", url: "https://www.court.gov.cn/zixun/xiangqing/477881.html"}

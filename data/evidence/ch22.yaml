- id: ch22_i3
  chapter: 22
  item: 3
  chapter_title: {ru: "Как расслабиться: развлекательные заведения и способы снятия стресса", en: "How to relax: entertainment venues and stress relief"}
  title: {ru: "Если в зале протягивают «кое-что», сразу уходите: и оставить человека употребить, и дать ему вещество — это не «помощь другу»", en: "If someone at the venue hands you \"something,\" leave at once. Sheltering drug use and supplying drugs are not \"helping a friend\""}
  grade: A
  measure: freedom
  plain:
    ru: "Развлекательному заведению нельзя торговать наркотиками, нельзя их давать и нельзя оставлять людей употреблять внутри. За нарушение работу останавливают на 3–6 месяцев, в тяжёлом случае отзывают лицензию. Если в заказанном вами зале или у вас дома вы даёте человеку «воспользоваться», это может быть преступлением: предоставление места для употребления наркотиков. Достали неизвестный порошок, таблетки или картридж и предлагают попробовать — уходите сразу."
    en: "An entertainment venue must not sell drugs, must not supply drugs, and must not let people use drugs inside. A violation means a business suspension for rectification of 3 to 6 months, and in a serious case the license is revoked. Letting someone \"use a bit\" in a private room you booked, or at your home, can be the crime of providing a place for others to use drugs. If someone pulls out an unknown powder, tablet, or vape cartridge and asks you to try it, leave on the spot."
  benefit:
    ru: "Правила прямо запрещают развлекательному заведению «продавать и предоставлять наркотики, а также организовывать, принуждать, подстрекать, склонять, обманывать или оставлять других употреблять или вводить наркотики». Работникам тоже нельзя употреблять наркотики и нельзя создавать клиентам условия для этого. При нарушении полиция изымает незаконный доход и имущество и приказывает остановить работу на 3–6 месяцев. В тяжёлом случае отзывают лицензию на развлекательную деятельность. Правила также требуют повесить на видном месте в общем зале, отдельной комнате и кабинете предупреждение о запрете наркотиков, азартных игр и проституции и указать телефон для жалоб. Для самого человека Уголовный кодекс говорит: кто предоставляет другому место, чтобы тот употреблял или вводил наркотики, наказывается лишением свободы до 3 лет, краткосрочным арестом или надзором без изоляции, и штрафом. Разъяснение Верховного суда перечисляет, когда это уже состав преступления: оставить сразу нескольких человек, неоднократно в течение 2 лет, оставить несовершеннолетнего, оставить ради выгоды. Если до преступления не дотягивает, по закону об административных наказаниях — арест на 10–15 суток, и можно штраф до 3000 юаней. При более лёгких обстоятельствах — арест до 5 суток или штраф до 1000 юаней. За собственное употребление или инъекцию — так же арест на 10–15 суток, и можно штраф до 3000 юаней."
    en: "The regulation expressly forbids entertainment venues to \"sell or supply drugs, or organize, force, abet, lure, deceive, or provide a place for others to ingest or inject drugs.\" Staff must not use drugs, and must not provide conditions for customers to do any of the above. For a violation, the public security department confiscates illegal gains and illegal property and orders a business suspension for rectification of 3 to 6 months. In a serious case the entertainment business license is revoked. The regulation also requires the venue to hang warning signs against drugs, gambling, and prostitution in a conspicuous place in the hall and in the private rooms, and to state the report phone number on them. On the personal side, the Criminal Law provides: \"Whoever provides a place for another person to ingest or inject drugs shall be sentenced to fixed-term imprisonment of not more than 3 years, criminal detention, or public surveillance, and shall also be fined.\" A judicial interpretation of the Supreme People's Court lists the situations that count as the crime, including providing a place for several people at 1 time, doing so repeatedly within 2 years, providing a place for a minor, and doing so for profit. If it does not amount to a crime, the Public Security Administration Punishments Law provides detention of 10 to 15 days, and a fine of up to 3000 yuan may be added. In a lighter case, detention of up to 5 days, or a fine of up to 1000 yuan. Ingesting or injecting drugs yourself likewise brings detention of 10 to 15 days, and a fine of up to 3000 yuan may be added."
  sources:
    - {citation: "国务院 (2006). 娱乐场所管理条例（国令第 458 号，第十四、三十、四十二条）", url: "http://www.gov.cn/zhengce/zhengceku/2008-03/28/content_6297.htm"}
    - {citation: "全国人大 (1997). 刑法（第三百五十四条）", url: "https://www.spp.gov.cn/spp/fl/201802/t20180206_364975.shtml"}
    - {citation: "最高人民法院 (2016). 关于审理毒品犯罪案件适用法律若干问题的解释（法释〔2016〕8 号，第十二条）. <https://www.sc.jcy.gov.cn/zlxx/sfjs/201606/t20160617_1809560.shtml>（四川省人民检察院转载）；全国人大常委会 (2025). 治安管理处罚法（2025 年修订，第八十四、八十五条）", url: "https://www.spp.gov.cn/spp/fl/202506/t20250627_699863.shtml"}

- id: ch22_i4
  chapter: 22
  item: 4
  chapter_title: {ru: "Как расслабиться: развлекательные заведения и способы снятия стресса", en: "How to relax: entertainment venues and stress relief"}
  title: {ru: "Не берите у незнакомцев конфеты и закуски, не пейте напиток, который уходил из поля зрения, не принимайте чужой картридж", en: "Do not eat candy or snacks from strangers, do not drink a beverage that has left your sight, and do not take a vape cartridge someone hands you"}
  grade: A
  measure: freedom
  plain:
    ru: "Теперешние наркотики не выглядят как наркотики. «Дурманящая» электронная сигарета с синтетическим каннабиноидом выглядит почти как обычная. Кто-то специально раздаёт их попробовать в барах, караоке и гостиницах. Кто обманом подталкивает к употреблению, получает арест на 10–15 суток и штраф. Кто употребил сам, тоже получает арест. Кого обманом втянули, могут наказать мягче или не наказать. Напиток ушёл из поля зрения — берите другой."
    en: "Today's drugs do not look like drugs. A \"high\" e-cigarette mixed with synthetic cannabinoids looks much like an ordinary e-cigarette, and some people specifically hand them out to try in bars, KTVs, and hotels. Tricking someone into using them brings detention of 10 to 15 days plus a fine. Using them yourself also brings detention. Someone who was tricked into using them can get a lighter penalty, or none. If a drink has left your sight, get a new drink."
  benefit:
    ru: "Теперешние наркотики не выглядят как наркотики. Синтетические каннабиноиды с 1 июля 2021 года целиком, всем классом, поставлены под контроль и считаются наркотиками. Их подмешивают в жидкость и делают «дурманящую» электронную сигарету. В деле, о котором писала Верховная народная прокуратура, следователи описывают жидкость так: «пищевым красителем ей придают любой цвет и любой вкус», «на вид она почти не отличается от обычной жидкости для электронной сигареты». Продавцы зовут компанию и сбывают её в барах, караоке и гостиницах, подталкивая других к употреблению. В том сообщении среди дел об употреблении за тот год в этом месте несовершеннолетние составили почти 40%. Этомидат с 1 октября 2023 года внесён во второй перечень психотропных веществ. Обманом подтолкнуть к употреблению — отдельное нарушение. За склонение, подстрекательство, обман или принуждение к употреблению или инъекции наркотиков — арест на 10–15 суток и штраф от 1000 до 5000 юаней. Если есть состав преступления, срок до 3 лет; при тяжких обстоятельствах от 3 до 7 лет; при принуждении от 3 до 10 лет; если пострадали несовершеннолетние, наказание строже. За собственное употребление или инъекцию — арест на 10–15 суток и можно штраф до 3000 юаней. При более лёгких обстоятельствах — арест до 5 суток или штраф до 1000 юаней. Кто употребил только потому, что его принудили или обманом втянули, по тому же закону «наказывается мягче, срок снижают или не наказывают». Одновременно могут запретить входить в развлекательные заведения на срок от 6 месяцев до 1 года. При зависимости назначают общинное лечение от зависимости на 3 года. Кто отказался от общинного лечения или во время лечения употребил снова, проходит принудительную изоляцию на 2 года, и этот срок можно продлить ещё максимум на 1 год (по всей стране, закон об административных наказаниях с января 2026 года)."
    en: "Today's drugs do not look like drugs. Synthetic cannabinoids have been controlled as a whole class since July 1, 2021, and the whole class is regulated as drugs. Some people mix them into vape liquid and make \"high\" e-cigarettes. In a case reported by the Supreme People's Procuratorate, investigators described this liquid as something that \"can be turned into all kinds of colors and flavors by adding food coloring\" and that is \"basically the same in appearance as an ordinary e-cigarette.\" Sellers gather people in bars, KTVs, and hotels to push it and induce others to use it. In that report, among the drug-use cases handled locally that year, minor users were nearly 40%. Etomidate has been listed in the catalog of category II psychotropic substances since October 1, 2023. Tricking someone into using drugs is itself 1 grade of illegality. Whoever lures, abets, deceives, or forces another person to ingest or inject drugs is detained for 10 to 15 days and fined 1000 to 5000 yuan. If it constitutes a crime, the sentence is up to 3 years; if the circumstances are serious, 3 to 7 years; if force is used, 3 to 10 years; and if the target is a minor, the penalty is heavier. Whoever ingests or injects drugs is detained for 10 to 15 days and may be fined up to 3000 yuan. In a lighter case, detention of up to 5 days or a fine of up to 1000 yuan. If the person used drugs only because they were coerced or tricked, the same law provides \"a lighter penalty, a mitigated penalty, or no penalty.\" They may also be ordered at the same time not to enter entertainment venues for 6 months to 1 year. If addicted, they are ordered into community drug rehabilitation for 3 years. If they refuse community rehabilitation, or use again during rehabilitation, they are sent to compulsory isolated detoxification for 2 years, which can be extended by up to another 1 year (nationwide, the Public Security Administration Punishments Law, from January 2026)."
  sources:
    - {citation: "最高人民检察院 (2021). 江苏苏州吴江区：办案检察官揭秘披着潮流外衣的新型毒品", url: "https://www.spp.gov.cn/spp/zdgz/202110/t20211011_531831.shtml"}
    - {citation: "国家药监局、公安部、国家卫生健康委 (2023). 关于调整麻醉药品和精神药品目录的公告（2023 年第 120 号）. <https://yjj.sh.gov.cn/qtgzwj/20230911/3b612c94e35b4b63abba314c972a2593.html>（上海市药监局转载，原文页 nmpa.gov.cn 在本机返回 412）；全国人大常委会 (2025). 治安管理处罚法（2025 年修订，第二十、八十四、八十五条）", url: "https://www.spp.gov.cn/spp/fl/202506/t20250627_699863.shtml"}
    - {citation: "全国人大 (1997). 刑法（第三百五十三条）", url: "https://www.spp.gov.cn/spp/fl/201802/t20180206_364975.shtml"}

- id: ch22_i6
  chapter: 22
  item: 6
  chapter_title: {ru: "Как расслабиться: развлекательные заведения и способы снятия стресса", en: "How to relax: entertainment venues and stress relief"}
  title: {ru: "Прогулки или бег при плохом настроении: величина терапевтического эффекта растёт с увеличением интенсивности нагрузки", en: "Going for a brisk walk or a jog when feeling down: the effect size of exercise on depression is proportional to its intensity"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "Человеку с тяжёлой депрессией движение помогает. Сильнее всего улучшают состояние быстрая ходьба и бег трусцой. Дальше идут йога, силовые тренировки, тайцзи и цигун; разница между ними небольшая. Чем выше нагрузка, тем лучше эффект. Силовые тренировки и йогу легче всего не бросить. Качество доказательств здесь невысокое. Ясно следующее: двигаться лучше, чем не двигаться. Выбирайте тот вид, который сможете продолжать."
    en: "For people with severe depression who exercise, brisk walking or jogging shows the clearest improvement. Next are yoga, strength training, and tai chi or qigong, and the gap among them is small. The higher the intensity, the better the effect. Strength training and yoga are the easiest to keep up. The quality of the evidence on this is on the low side. What can be said for sure is that moving is better than not moving. Pick the kind you can stick with."
  benefit:
    ru: "Результаты получены путём объединения этих 218 рандомизированных двойных слепых исследований, в которых участвовали 495 групп и 14170 человек, соответствующих критериям тяжёлой депрессии. Для сравнения различных видов физической активности применили метод байесовского сетевого метаанализа. В качестве контрольных вариантов выступали стандартная терапия и плацебо. Величина эффекта выражена в показателе Hedges' g: чем ближе это число к отрицательным значениям, тем сильнее уменьшаются симптомы депрессии. Для быстрой ходьбы или бега этот показатель равен −0,62 (95% доверительный интервал от −0,80 до −0,45). Для йоги — −0,55 (−0,73…−0,36), для силовых тренировок — −0,49 (−0,69…−0,29), для смешанных аэробных упражнений — −0,43 (−0,61…−0,24), для тайцзицюаня и цигун — −0,42 (−0,65…−0,21). Как отмечают авторы, «эффективность физических упражнений прямо пропорциональна их интенсивности», то есть чем выше нагрузка, тем лучше результат. Силовые тренировки и йога оказались наиболее приемлемыми для длительного выполнения."
    en: "This result comes from combining data across 218 randomized controlled trials split into two groups, covering 495 treatment arms and 14,170 participants who met clinical criteria for major depression. A Bayesian network meta-analysis was used to compare all these different forms of exercise against each other, using standard care or placebo pills as control groups. The effect size is expressed as Hedges’ g; the more negative this value, the greater the symptom improvement. For brisk walking or jogging, the value was −0.62 (95% confidence interval: −0.80 to −0.45). Yoga came in at −0.55 (−0.73 to −0.36), strength training at −0.49 (−0.69 to −0.29), mixed aerobic exercise at −0.43 (−0.61 to −0.24), and tai chi/Qigong at −0.42 (−0.65 to −0.21). The original paper states that “the effect of exercise is directly proportional to its intensity”, meaning higher intensity yields better results. Strength training and yoga also score highest on acceptability, making them the most sustainable choices for most people."
  sources:
    - {citation: "Noetel M, Sanders T, Gallardo-Gómez D, et al. (2024). Effect of exercise for depression: systematic review and network meta-analysis of randomised controlled trials. BMJ, 384, e075847", url: "https://doi.org/10.1136/bmj-2023-075847"}
  doi: "10.1136/bmj-2023-075847"

- id: ch22_i9
  chapter: 22
  item: 9
  chapter_title: {ru: "Как расслабиться: развлекательные заведения и способы снятия стресса", en: "How to relax: entertainment venues and stress relief"}
  title: {ru: "Воспринимайте «регулярные встречи с людьми» как расходы на здоровье, а не только как способ поднять настроение", en: "Treat “regular social contact” as a health expense — don’t wait until you’re feeling down to reach out"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "В ходе 70 исследований, охвативших 3,4 миллиона человек, в течение 7 лет наблюдения выяснилось: у людей, испытывающих социальную изоляцию, вероятность смерти в тот же период оказалась примерно на 30% выше, чем у тех, кто не испытывает изоляции. У людей, чувствующих одиночество, этот показатель выше примерно на четверть, а у одиноко живущих — примерно на 30%. Величина этих показателей сопоставима, причём особенно заметна в группе людей младше 65 лет. Важно отметить, что эти данные получены в ходе наблюдений, поэтому нельзя исключить обратную причинно-следственную связь: люди с плохим здоровьем чаще оказываются в одиночестве."
    en: "This conclusion comes from a meta-analysis of 70 studies involving 3.4 million people, tracked for an average of 7 years. Those experiencing social isolation had a roughly 30% higher risk of dying during that period compared to non-isolated individuals. People reporting loneliness faced a 25% higher risk, while those living alone faced a 30% higher risk. These figures are similar in magnitude and are even more pronounced among people under 65. Keep in mind these are observational data; it’s also possible that people in poorer health are more likely to end up isolated."
  benefit:
    ru: "Эти результаты получены по итогам метаанализа, в котором объединены эти 70 исследований с участием 3,4 миллиона человек, наблюдавшихся в среднем 7 лет. Социальная изоляция, чувство одиночества и одинокое проживание все три фактора коррелируют с повышенной смертностью. После исключения влияния возраста и состояния здоровья средние значения относительного риска составили: для социальной изоляции — 1,29, для чувства одиночества — 1,26, для одинокого проживания — 1,32. То есть вероятность смерти в тот же период повышается соответственно примерно на 30%, на четверть и на 30%. Эффективность всех трёх факторов сопоставима, причём в группе людей младше 65 лет она проявляется сильнее, чем у пожилых людей."
    en: "As noted, this is a meta-analysis of 70 studies with 3.4 million participants observed over 7 years. Social isolation, loneliness, and living alone all correlate with higher mortality. After adjusting for age and health status, the weighted average risk ratios were: 1.29 for social isolation, 1.26 for loneliness, and 1.32 for living alone. In other words, each condition raised the risk of dying during the study period by roughly 30%, 25%, and 30% respectively. The effects are comparable across all three factors and are stronger among people under 65 than among older people."
  sources:
    - {citation: "Holt-Lunstad J, Smith TB, Baker M, Harris T, Stephenson D (2015). Loneliness and social isolation as risk factors for mortality: a meta-analytic review. Perspectives on Psychological Science, 10(2), 227-237", url: "https://doi.org/10.1177/1745691614568352"}
  doi: "10.1177/1745691614568352"

- id: ch22_i12
  chapter: 22
  item: 12
  chapter_title: {ru: "Как расслабиться: развлекательные заведения и способы снятия стресса", en: "How to relax: entertainment venues and stress relief"}
  title: {ru: "На лыжах, сноуборде, роликах и горном велосипеде надевайте шлем", en: "Wear a helmet when skiing, snowboarding, rollerblading, or mountain biking"}
  grade: A
  measure: mortality
  plain:
    ru: "Шлем на лыжах и сноуборде снижает шанс травмы головы при падении и ударе примерно на треть, а у детей младше 13 лет — примерно на 60%. На велосипеде шанс тяжёлой травмы головы ниже примерно на 70%, а шанс смертельной — примерно втрое ниже. Шлем не делает травму шеи более вероятной."
    en: "When skiing or snowboarding, wearing a helmet makes the chance of a head injury in a fall or a collision about 1/3 lower, and for a child under 13 it makes that chance about 60% lower. When riding a bicycle, wearing a helmet makes the chance of a serious head injury about 70% lower, and makes the chance of a fatal head injury about 2/3 lower. Wearing a helmet did not make the neck easier to injure."
  benefit:
    ru: "Цифры по лыжам и сноуборду — сводка 12 исследований. В большинстве брали людей с травмой головы и других людей и смотрели, кто был в шлеме (сравнение случаев с контролем). У тех, кто в шлеме, отношение шансов травмы головы OR 0,65 (95% доверительный интервал 0,55–0,79), ниже примерно на 35%. В исследованиях, где были дети младше 13 лет, OR 0,41 (0,27–0,59), ниже примерно на 59%. Травма шеи OR 0,89 (0,72–1,09), повышения нет. Цифры по велосипеду — из 40 исследований, больше 64000 человек, которые упали или столкнулись. Травма головы OR 0,49 (0,42–0,57), ниже примерно на 51%. Тяжёлая травма головы OR 0,31 (0,25–0,37), ниже примерно на 69%. Смертельная травма головы OR 0,35 (0,14–0,88), ниже примерно на 65%. Травма лица OR 0,67 (0,56–0,81), ниже примерно на 33%. Травма шеи OR 0,96 (0,74–1,25), связи не видно. Пекинское управление спорта говорит: после пересмотра местного стандарта для горнолыжных комплексов Пекина в 2017 году на продвинутую трассу пускают только в шлеме."
    en: "The skiing and snowboarding figures come from a pooled analysis of 12 studies. Most of the studies compared people with a head injury to other people and looked at who was wearing a helmet (case-control). For people wearing a helmet, the odds ratio for a head injury was OR 0.65 (95% CI 0.55–0.79), about 35% lower. In the studies that included children under 13, OR 0.41 (0.27–0.59), about 59% lower. For a neck injury, OR 0.89 (0.72–1.09), not higher. The bicycle figures come from 40 studies and more than 64000 people who fell off a bike or were in a crash. Head injury OR 0.49 (0.42–0.57), about 51% lower. A serious head injury OR 0.31 (0.25–0.37), about 69% lower. A fatal head injury OR 0.35 (0.14–0.88), about 65% lower. A facial injury OR 0.67 (0.56–0.81), about 33% lower. A neck injury OR 0.96 (0.74–1.25), no link visible. The Beijing Municipal Bureau of Sports says that after Beijing's local standard for ski resorts was revised in 2017, a helmet is required to enter an advanced run."

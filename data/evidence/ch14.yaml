  chapter_title: {ru: "Безопасность аккаунтов и личных данных", en: "Account and Information Security"}
  title: {ru: "Включите двухфакторную аутентификацию для почты, платёжных сервисов и соцсетей: в первую очередь подтверждение всплывающим окном на телефоне, запасной вариант — SMS-код", en: "Turn on two-factor authentication for email, payment, and social accounts; prefer phone pop-up confirmation, with SMS codes second"}
  grade: A
  measure: money
  plain:
    ru: "Двухфакторная аутентификация — это когда при входе, кроме пароля, нужно ещё раз подтвердить, что это вы. Если на телефоне всплывает окно и вы нажимаете «подтвердить», так отсекается более девяти десятых фишинговых захватов аккаунта. SMS-код при этом увести обманом легче, чем такое окно. Старые способы вроде ответов «где вы последний раз входили» или «какой резервный ящик» в худшем случае останавливают лишь около десятой части фишинговых захватов."
    en: "Two-factor authentication means that besides your password, you confirm once more that it is really you when you log in. With a pop-up on your phone that you tap to confirm, more than nine out of ten phishing account takeovers are blocked. An SMS code is easier to trick out of you than a pop-up. Old methods like answering “where did you last log in?” or “what is your backup email?” block as few as one in ten phishing takeovers."
  benefit:
    ru: "Google подсчитала 350000 реальных попыток захвата аккаунта (account takeover). Первый тип проверки опирается на устройство: всплывающее окно на телефоне, физический ключ безопасности. Он остановил «более 94% попыток захвата из‑за фишинга и 100% автоматизированных попыток захвата». Фишинг — когда вас уводят на поддельный сайт и вы вводите пароль; автоматизация — когда программа перебирает утёкшие пароли. Другой тип — ответы на вопросы, например где вы последний раз входили или какой резервный ящик. Он «остановил лишь до 10% фишинговых захватов и 73% автоматизированных захватов». При той же проверке через устройство SMS-код слабее окна на телефоне: фишеры получили верный SMS-код в 4% случаев, а окно удалось обмануть только в 1%. В атаке на конкретного человека SMS остановил 76%, окно — 90%"
    en: "Google counted 350000 real account takeover attempts (also called account hijacking). One class uses device-based verification, such as a pop-up on your phone for you to confirm, or plugging in a security key. That class blocked “more than 94% of phishing-related hijacking attempts and 100% of automated hijacking attempts.” Phishing means tricking you into entering your password on a fake site; automated means machines trying leaked passwords in bulk. Another class uses knowledge-based verification, such as where you last logged in or what your backup email is. That class “blocked as little as 10% of phishing hijacking and 73% of automated hijacking.” Within device verification, an SMS code is weaker than a phone pop-up. Phishers got 4% of the SMS codes right; the pop-up was fooled only 1% of the time. In targeted attacks aimed at a specific person, SMS blocked only 76%, and the pop-up blocked 90%"
  sources:
    - {citation: "Doerfler P, Thomas K, Marincenko M, et al. (2019). Evaluating Login Challenges as a Defense Against Account Takeover. The World Wide Web Conference (WWW '19)", url: "https://doi.org/10.1145/3308558.3313481"}
  doi: "10.1145/3308558.3313481"

- id: ch10_i8
  chapter: 10
  item: 8
  chapter_title: {ru: "Окупаются ли отношения и брак", en: "Is dating and marriage worth it"}
  title: {ru: "Считайте пользу брака для здоровья, но со скидкой на наблюдательные данные", en: "Count marriage’s health benefit in, but discount it as observational data"}
  grade: A
  contested: true
  measure: mortality
  plain:
    ru: "Среди пожилых у состоящих в браке вероятность умереть за тот же срок примерно на 12% ниже, чем у не состоящих в браке; у никогда не состоявших в браке — примерно на 24% выше, чем у состоящих. Но это лишь два явления рядом: неясно, виноват ли брак. Цифры в основном из Европы и США; для Китая — только ориентир по порядку величины."
    en: "Among older adults, married people’s probability of dying in the same period is about 12% lower than non-married people’s, and never-married people’s is about 24% higher than married people’s. But that is only two things occurring together; you cannot tell whether marriage caused it. These figures are mostly from Europe and North America; for China they are only an order-of-magnitude reference."
  benefit:
    ru: "Метаанализ по пожилым: сводка нескольких исследований, 53 сравнения, больше 250000 человек. Все включённые работы — отслеживание без контрольных групп. RR смерти от всех причин у состоящих в браке относительно не состоящих 0.88, 95% CI 0.85–0.91 (RR — отношение рисков, CI — диапазон достоверности); вероятность умереть за тот же срок ниже примерно на 12%. В той же сводке вдовство 1.11, развод или раздельное проживание 1.16, никогда не состоявшие в браке 1.11 — выше примерно на 11%, 16%, 11%. Разницы между мужчинами и женщинами нет. Самая осторожная оценка — RR 0.94, ниже лишь примерно на 6%. Другой метаанализ сравнивал никогда не состоявших в браке с состоящими: 95 работ, больше 500000000 человек. HR 1.24 (1.19–1.30), вероятность умереть за тот же срок выше примерно на 24%. И чем старше возраст, тем меньше разрыв. Ещё один метаанализ с разбивкой по полу: 21 исследование, больше 7890000 человек: и у мужчин, и у женщин отсутствие брака шло рядом с общей смертью, смертью от рака и сердечно-сосудистой смертью. У мужчин разрыв по сердечно-сосудистой и общей смерти больше. Никогда не состоявшие в браке мужчины относительно таких же женщин: смерть от инсульта выше на 31%, смерть от всех причин — на 9%."
    en: "A meta-analysis of older adults pooled multiple studies and recalculated them, covering 53 comparisons and more than 250000 people. All were cohort studies — follow-up only, with no randomized comparison groups. Married versus non-married all-cause mortality RR 0.88, 95% CI 0.85–0.91 (RR is the risk ratio; CI is the credible range), about 12% lower probability of dying in the same period. In the same analysis, widowed 1.11, divorced or separated 1.16, never married 1.11 — about 11%, 16%, and 11% higher respectively. No difference by sex. The most conservative estimate was RR 0.94, only about 6% lower. Another meta-analysis compared never-married versus married, using 95 papers and more than 500000000 people. Result HR 1.24 (1.19–1.30), about 24% higher probability of dying in the same period. And the older the age, the smaller the gap. A further meta-analysis split by sex, 21 studies and more than 7890000 people: for both sexes, non-married status co-occurred with total mortality, cancer death, and cardiovascular death. On the male side the gaps for cardiovascular death and total mortality were larger. Never-married men versus never-married women had 31% more stroke deaths and 9% more all-cause deaths."
  numbers:
    - {kind: RR, value: 0.88, ci_low: 0.85, ci_high: 0.91}
    - {kind: RR, value: 0.94}
    - {kind: HR, value: 1.24}
  sources:
    - {citation: "Manzoli L, et al. (2007). Marital status and mortality in the elderly: a systematic review and meta-analysis. Soc Sci Med 64:77–94", url: "https://doi.org/10.1016/j.socscimed.2006.08.031"}
    - {citation: "Roelfs DJ, et al. (2011). The rising relative risk of mortality for singles: meta-analysis and meta-regression. Am J Epidemiol 174(4):379–389", url: "https://doi.org/10.1093/aje/kwr111"}
    - {citation: "Wang Y, et al. (2020). Sex differences in the association between marital status and the risk of cardiovascular, cancer, and all-cause mortality: a systematic review and meta-analysis of 7,881,040 individuals. Glob Health Res Policy 5:4", url: "https://doi.org/10.1186/s41256-020-00133-8"}
  doi: "10.1016/j.socscimed.2006.08.031"

- id: ch10_i17
  chapter: 10
  item: 17
  chapter_title: {ru: "Окупаются ли отношения и брак", en: "Is dating and marriage worth it"}
  title: {ru: "Качество отношений как счёт здоровья: в ссоре о деле, а не о человеке — без оскорблений и насмешек", en: "Treat relationship quality as a health account: argue about the matter not the person — no name-calling, no sarcasm"}
  grade: B
  measure: mortality
  plain:
    ru: "У пар с хорошими отношениями здоровье чуть лучше и риск смерти чуть ниже. Связь небольшая — примерно как связь питания со здоровьем. В одном эксперименте у супругов, которые в ссоре всё время были враждебны, маленькая рана заживала примерно с 60% скорости спокойных пар."
    en: "Couples with a better relationship tend to have somewhat better health and somewhat lower death risk. The association is not large — about as large as diet’s link to health. In one experiment, couples who kept hostility in arguments had experimentally made small wounds heal at only about 60% the speed of calmer couples."
  benefit:
    ru: "Сводка 126 исследований, больше 72000 человек (метаанализ). Чем выше качество брака, тем лучше здоровье; коэффициент корреляции r от .07 до .21. Корреляция 0 — нет связи, 1 — полное совпадение. Связь с более низким риском смерти — r = .11. Меньшая сердечно-сосудистая реакция в ссоре — r = -.13. Авторы пишут: эффекты малы, по величине как связь привычек питания со здоровьем. В другом перекрёстном эксперименте 42 здоровые пары по два раза лежали в больнице по 24 часа. Один раз — поддерживающий разговор, другой — спорный вопрос. После ссоры экспериментальная рана-пузырь заживала медленнее. У пар, оба раза более враждебных, скорость заживления была 60% от пар с низкой враждебностью. На следующее утро после ссоры у них сильнее росли воспалительные показатели в крови (IL-6, фактор некроза опухоли)."
    en: "Pooling 126 studies and more than 72000 people (a meta-analysis). Higher marital quality went with better physical health; the correlation r was between .07 and .21. A correlation of 0 is no relationship; 1 is perfect lockstep. The correlation with lower death risk was r = .11. Smaller cardiovascular reaction when arguing was r = -.13. The authors said these effects are all small — about as large as the link between habits such as diet and health. In another crossover experiment, 42 healthy couples each stayed in hospital twice for 24 hours. Once they had a mutually supportive talk; once they discussed a disagreement. After arguing, experimentally made blister wounds healed more slowly. Couples who showed more hostility in both sessions had wound healing at only 60% the speed of low-hostility couples. On the morning after arguing, their blood inflammation markers (IL-6, tumor necrosis factor) also rose more."
  sources:
    - {citation: "Robles TF, Slatcher RB, Trombello JM, McGinn MM (2014). Marital quality and health: a meta-analytic review. Psychological Bulletin", url: "https://doi.org/10.1037/a0031859"}
    - {citation: "Kiecolt-Glaser JK et al. (2005). Hostile marital interactions, proinflammatory cytokine production, and wound healing. Archives of General Psychiatry", url: "https://doi.org/10.1001/archpsyc.62.12.1377"}
  doi: "10.1037/a0031859"

- id: ch10_i20
  chapter: 10
  item: 20
  chapter_title: {ru: "Окупаются ли отношения и брак", en: "Is dating and marriage worth it"}
  title: {ru: "Если отношения застряли в повторных ссорах и холодной войне — идите вместе к терапевту для пар: просто ждать почти не помогает", en: "When a relationship is stuck in repeated arguments and cold wars, go to couples therapy together: waiting it out almost never fixes itself"}
  grade: A
  contested: true
  measure: time
  plain:
    ru: "Пары, у которых отношения застряли, после курса терапии для пар заметно довольнее связью; примерно у семи из десяти есть улучшение. У тех, кто только стоит в очереди и ждёт, почти нет изменений. Но эффект слабеет: к 5-му году примерно у половины всё ещё заметное улучшение, примерно у четверти уже раздельное проживание или развод."
    en: "Couples stuck in a relationship who finish couples therapy together are clearly more satisfied with the relationship; about seven tenths improve. Couples who only wait in line show basically no change. But effects fade: by year 5, about half are still clearly better, and about one quarter have already separated or divorced."
  benefit:
    ru: "Метаанализ 2020 года: 58 исследований, 2092 пары. После терапии для пар изменение удовлетворённости связью g = 1.12 (диапазон достоверности 0.92–1.31); авторы называют это большим эффектом. g — величина эффекта, см. глоссарий в README. У пар в очереди ожидания за тот же срок g = 0.12 (−0.04 до 0.29) — без явного улучшения. Чем хуже связь в начале, тем больше улучшение. Обзор 2012 года: терапия для пар давала улучшение у 70% прошедших её пар. В другом рандомизированном испытании 134 пары с долгим тяжёлым разладом проходили около 8 месяцев два вида поведенческой терапии для пар. К концу изменение удовлетворённости d = 0.90 и 0.71. К 5-му году при двух подходах у 50.0% и 45.9% пар всё ещё было заметное улучшение. Заметное улучшение авторы называют «клинически значимым улучшением». Одновременно у 25.7% и 27.9% уже раздельное проживание или развод."
    en: "A 2020 meta-analysis pooled 58 studies and 2092 couples. After couples therapy, the before–after change in relationship satisfaction was g = 1.12 (credible range 0.92–1.31); the authors called it a large effect. g is an effect size; see the README glossary. For couples assigned to wait, over the same period g = 0.12 (−0.04 to 0.29), with no clear improvement. Couples who started worse improved more. A 2012 review wrote that couples therapy brought improvement for 70% of treated couples. Another randomized trial took 134 couples in long-term, serious discord through about 8 months of two kinds of behavioral couples therapy. At completion, satisfaction change was d = 0.90 and 0.71. By year 5, 50.0% and 45.9% of couples in the two approaches still had clear improvement. The authors call that clear improvement “clinically meaningful improvement.” At the same time, 25.7% and 27.9% had already separated or divorced."
  sources:
    - {citation: "Roddy MK, Walsh LM, Rothman K, Hatch SG, Doss BD (2020). Meta-analysis of couple therapy: effects across outcomes, designs, timeframes, and other moderators. Journal of Consulting and Clinical Psychology, 88(7), 583-596", url: "https://doi.org/10.1037/ccp0000514"}
    - {citation: "Lebow JL, Chambers AL, Christensen A, Johnson SM (2012). Research on the treatment of couple distress. Journal of Marital and Family Therapy, 38(1), 145-168", url: "https://doi.org/10.1111/j.1752-0606.2011.00249.x"}
    - {citation: "Christensen A, Atkins DC, Baucom B, Yi J (2010). Marital status and satisfaction five years following a randomized clinical trial comparing traditional versus integrative behavioral couple therapy. Journal of Consulting and Clinical Psychology, 78(2), 225-235", url: "https://doi.org/10.1037/a0018132"}
    - {citation: "Rathgeber M, Bürkner PC, Schiller EM, Holling H (2019). The efficacy of emotionally focused couples therapy and behavioral couples therapy: a meta-analysis. Journal of Marital and Family Therapy, 45(3), 447-463. <https://doi.org/10.1111/jmft.12336>（争议方）；Shadish WR, Baldwin SA (2003). Meta-analysis of MFT interventions. Journal of Marital and Family Therapy, 29(4), 547-570. <https://doi.org/10.1111/j.1752-0606.2003.tb01694.x>（争议方）；Karakurt G, Whiting K, van Esch C, Bolen SD, Calabrese JR (2016). Couples therapy for intimate partner violence: a systematic review and meta-analysis. Journal of Marital and Family Therapy, 42(4), 567-583", url: "https://doi.org/10.1111/jmft.12178"}
  doi: "10.1037/ccp0000514"

- id: ch13_brawl
  title: {ru: "Драка у бара", en: "A brawl outside the bar"}
  min_age: 18
  max_age: 45
  category: legal
  evidence: ch13_i37
  narrative:
    ru: |
      У бара сцепились две компании. Ваш приятель уже в гуще, кто-то достаёт из багажника биту.
      Остальные снимают на телефоны.
    en: |
      Two groups are fighting outside a bar. Your mate is already in the thick of it and someone
      pulls a bat from a car boot. Everyone else is filming.
  choices:
    - id: leave
      text: {ru: "Уйти и вызвать полицию из-за угла", en: "Walk away and call the police from round the corner"}
      tag: wise
      delta_sanity: -3
      evidence: ch13_i37
      outcome:
        ru: "Приятель неделю не разговаривал. Потом его допрашивали как участника групповой драки."
        en: "Your mate didn't speak to you for a week. Then the police questioned him as a participant in a group brawl."
    - id: separate
      text: {ru: "Влезть и разнять", en: "Wade in and break it up"}
      tag: risky
      delta_health: -10
      stat_effects: {legal_prison_risk: {factor: 2.0, years: 3}}
      catastrophe_check:
        chance: 0.06 # game approximation; group brawl: up to 3 years, 3–10 with weapons (ch13_i37)
        kind: prison
        years: 2
        delta_sanity: -10
        text:
          ru: "На видео видно, как вы толкаете парня с битой. Следователь называет это «участием в групповой драке»."
          en: "The video shows you shoving the man with the bat. The investigator calls it \"taking part in a group brawl\"."
        evidence: ch13_i37
      evidence: ch13_i37
      outcome:
        ru: "Из «я разнимал» быстро получается «я дрался»."
        en: "\"I was breaking it up\" quickly becomes \"I was fighting\"."
    - id: film
      text: {ru: "Остаться и снимать, как все", en: "Stay and film like everyone else"}
      tag: risky
      catastrophe_check:
        chance: 0.04 # game approximation
        kind: injury
        delta_health: -25
        text: {ru: "Бутылка, брошенная в толпу, попала вам в висок.", en: "A bottle thrown into the crowd hit you in the temple."}
        evidence: ch13_i37
      evidence: ch13_i37
      outcome:
        ru: "Чем больше зевак, тем больше хаоса — и тем вероятнее задеть случайного."
        en: "The more onlookers, the messier it gets — and the likelier a bystander gets hurt."

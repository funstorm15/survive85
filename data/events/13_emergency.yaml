        en: "On the second round the piece flew onto the tablecloth. Your uncle now invites you to every celebration."
    - id: water
      text: {ru: "Дать ему воды и звать официанта", en: "Give him water and call the waiter"}
      tag: risky
      catastrophe_check:
        chance: 0.25 # game approximation
        kind: loss
        delta_sanity: -25
        text: {ru: "Скорая приехала через 12 минут. Слишком поздно.", en: "The ambulance came in twelve minutes. Too late."}

  choices:
    - id: cool
      text: {ru: "20 минут под прохладной проточной водой", en: "Twenty minutes under cool running water"}
      tag: wise
      cost_will: 1
      delta_health: -5
      catastrophe_check:
        chance: 0.06 # game approximation; ×0.6 vs not cooling (ch13_i14)
        kind: injury
        delta_health: -10
        text: {ru: "Ожог всё же оказался глубоким: пересадка кожи.", en: "The burn was deep after all: a skin graft."}
        evidence: ch13_i14
      evidence: ch13_i14
      outcome:
        ru: "Охлаждение в первые 3 часа снижает потребность в пересадке кожи примерно до 60% от уровня без охлаждения."
        en: "Cooling within three hours cuts the need for skin grafts to about 60% of the rate without it."
    - id: paste
      text: {ru: "Намазать пастой, как велит бабушка", en: "Toothpaste, as Grandma says"}
      tag: risky
      delta_health: -10
      catastrophe_check:
        chance: 0.1 # game approximation
        kind: injury
        delta_health: -15
        text: {ru: "Глубокий ожог и пересадка кожи. Пасту из раны вычищали под наркозом.", en: "A deep burn and a skin graft. They cleaned the toothpaste out under anaesthesia."}
        evidence: ch13_i14
      evidence: ch13_i14
      outcome:
        ru: "Паста, соевый соус и масло только мешают. Лечится долго."
        en: "Toothpaste, soy sauce and oil only get in the way. It took ages to heal."

- id: ch13_carbon_monoxide
  title: {ru: "Головная боль у всех сразу", en: "Everyone has a headache"}
  min_age: 18
  max_age: 84
  category: emergency
  evidence: ch13_i19
  narrative:
    ru: |
      Зимний вечер на даче, топится газовый котёл. У вас и у гостей одновременно болит голова и
      тошнит. Кто-то предлагает лечь подремать.
    en: |
      A winter evening at the dacha, the gas boiler is running. You and your guests all have a
      headache and nausea at once. Someone suggests lying down for a nap.
  choices:
    - id: out
      text: {ru: "Всех на улицу, звонить газовой службе оттуда", en: "Everyone outside, call the gas service from there"}
      tag: wise
      evidence: ch13_i19
      outcome:
        ru: "На морозе через десять минут всем полегчало — это и есть главный признак угарного газа."
        en: "Ten minutes out in the cold and everyone felt better — the classic sign of carbon monoxide."
    - id: valve
      text: {ru: "Сначала зайти обратно и выключить котёл", en: "Go back in first to switch off the boiler"}
      tag: risky
      delta_health: -15
      instant_death_check:
        chance: 0.02 # game approximation; never go back inside (ch13_i19)
        cause: liver
        death_reason: {ru: "Отравление угарным газом", en: "Carbon monoxide poisoning"}
        evidence: ch13_i19
      evidence: ch13_i19
      outcome:
        ru: "Вы вышли шатаясь и упали в сугроб. В 2018 году в Китае от угарного газа погибли 11 523 человека."
        en: "You staggered out and fell into a snowdrift. In 2018, 11,523 people died of carbon monoxide poisoning in China."
    - id: nap
      text: {ru: "Открыть форточку и прилечь", en: "Open a window and lie down"}
      tag: risky
      instant_death_check:
        chance: 0.05 # game approximation
        cause: liver
        death_reason: {ru: "Отравление угарным газом во сне", en: "Carbon monoxide poisoning in their sleep"}
        evidence: ch13_i19
      evidence: ch13_i19
      outcome:
        ru: "Вас разбудил сосед, заметивший, что никто не отвечает на звонки. Повезло."
        en: "A neighbour woke you after nobody answered the phone. You were lucky."

- id: ch13_drowning
  title: {ru: "Крик с реки", en: "A shout from the river"}
  min_age: 18
  max_age: 70
  category: emergency
  evidence: ch13_i25
  narrative:
    ru: |
      Подросток в двадцати метрах от берега то исчезает под водой, то появляется. Вы хорошо
      плаваете. На берегу пустые пластиковые бутылки и длинная ветка.
    en: |
      A teenager twenty metres out keeps going under and coming back up. You're a good swimmer.
      On the bank lie empty plastic bottles and a long branch.
  choices:
    - id: reach
      text: {ru: "Кричать, звонить 112, тянуть ветку и кидать бутылки", en: "Shout, call 112, reach with the branch, throw bottles"}
      tag: wise
      catastrophe_check:
        chance: 0.175 # game approximation
        kind: loss
        delta_sanity: -15
        text: {ru: "Он не дотянулся. Спасатели нашли его через час.", en: "He couldn't reach. Rescuers found him an hour later."}
        evidence: ch13_i25
      evidence: ch13_i25
      outcome:
        ru: "Он вцепился в бутылку, и вы подтянули его веткой. Тонущий инстинктивно топит спасателя."
        en: "He grabbed a bottle and you pulled him in with the branch. A drowning person instinctively pulls the rescuer under."
    - id: swim
      text: {ru: "Прыгнуть в воду и плыть к нему", en: "Jump in and swim to him"}
      tag: risky
      instant_death_check:
        chance: 0.075 # game approximation; rescuers who enter the water often drown too (ch13_i25)
        cause: trauma
        death_reason: {ru: "Утонул, спасая тонущего", en: "Drowned trying to save a drowning person"}
        evidence: ch13_i25
      evidence: ch13_i25
      outcome:
        ru: "Он вцепился вам в шею и потащил вниз. Вы выбрались чудом — вдвоём."
        en: "He clamped onto your neck and dragged you down. By some miracle you both got out."


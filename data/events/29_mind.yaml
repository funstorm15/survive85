      рыбьего жира и «эликсир для сосудов» — курс на год за 60 000.
    en: |
      At a free "longevity lecture", a presenter in a white coat sells a bundle of vitamins, fish
      oil and a "vascular elixir" — a year's course for 60,000.
  choices:
    - id: buy
      text: {ru: "Купить курс: здоровье дороже", en: "Buy the course: health comes first"}
      tag: risky
      cost_money: 60000
      delta_sanity: 3
      evidence: ch06_i1
      outcome:
        ru: "14 400 врачей пили поливитамины 11 лет — ни меньше инфарктов, ни меньше смертей. Минус 60 000."
        en: "14,400 doctors took multivitamins for 11 years: no fewer heart attacks, no fewer deaths. Minus 60,000."
    - id: leave
      text: {ru: "Уйти с чаем и печеньем", en: "Leave with the free tea and biscuits"}

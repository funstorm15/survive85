  choices:
    - id: negotiate
      text: {ru: "Самому позвонить кредитору и договориться о рассрочке", en: "Call the lender yourself and negotiate instalments"}
      tag: wise
      cost_will: 3
      delta_wealth: -120000
      remove_conditions: [microloan_debt]

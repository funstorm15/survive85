  choices:
    - id: lawyer
      text: {ru: "Нанять адвоката и сотрудничать со следствием", en: "Hire a lawyer and cooperate with the investigation"}
      tag: wise
      cost_money: 150000
      delta_sanity: -15
      clear_flags: [nominee_director]
      evidence: ch08_i5
      outcome:
        ru: "Год допросов. Субсидиарную ответственность снизили, но не сняли."
        en: "A year of interrogations. Your personal liability was reduced, not removed."
      delta_wealth: -400000
    - id: ignore
      text: {ru: "Не ходить: я тут ни при чём", en: "Ignore it: none of this is mine"}
      tag: risky
      clear_flags: [nominee_director]
      catastrophe_check:
        chance: 0.3 # game approximation
        kind: prison
        years: 2
        wealth_fraction: 0.5
        text:
          ru: "Неявка превратилась в розыск. Суд не поверил, что вы ничего не знали."
          en: "Not showing up turned into a warrant. The court didn't believe you knew nothing."
        evidence: ch08_i28
      evidence: ch08_i28
      outcome:
        ru: "Дело приостановили — до поры."
        en: "The case was suspended — for now."


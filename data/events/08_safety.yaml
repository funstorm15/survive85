# Chapter 8 — "Protect yourself: laws and personal safety", with chapters 5
# (money), 7 (getting by with no money) and 12 (starting a business). These are
# money and freedom items: amounts follow the book's cases (1 yuan ≈ 12 ₽).

- id: ch08_guarantor
  title: {ru: "«Ты же мне друг»", en: "\"You're my friend, right?\""}
  min_age: 22
  max_age: 60
  category: money
  evidence: ch08_i18
  narrative:
    ru: |
      Старый друг открывает автосервис и берёт кредит на полтора миллиона. Банк просит
      поручителя. «Это формальность, я же плачу. Просто подпиши тут и тут».
    en: |
      An old friend is opening a car repair shop and taking a 1.5-million loan. The bank wants a
      guarantor. "It's a formality, I'm paying. Just sign here and here."
  choices:
    - id: sign
      text: {ru: "Подписать не читая — дружба дороже", en: "Sign without reading — friendship matters more"}
      tag: risky
      delta_sanity: 4
      set_flags: [guarantor]
      evidence: ch08_i18
      outcome:
        ru: "Друг обнял вас. В договоре было написано «солидарная ответственность», но вы не читали."
        en: "Your friend hugged you. The contract said \"joint and several liability\", but you didn't read it."
    - id: read
      text: {ru: "Прочитать договор и отказаться от солидарного поручительства", en: "Read the contract and refuse a joint-and-several guarantee"}
      tag: wise
      cost_will: 2
      delta_sanity: -4
      evidence: ch08_i18
      outcome:
        ru: "Друг обиделся. При солидном поручительстве банк может идти сразу к вам, минуя должника."
        en: "Your friend took offence. Under a joint-and-several guarantee the bank can come straight to you, skipping the borrower."
    - id: lend_small
      text: {ru: "Отказать, но дать в долг сумму, которую не жалко, по расписке", en: "Say no, but lend an amount you can afford to lose, with a signed note"}
      tag: wise
      cost_money: 50000
      evidence: ch08_i18
      outcome:
        ru: "Расписка с суммой, сроком и подписями, перевод — только через банк. Друг вернул через год."
        en: "A note with amount, term and signatures, money sent by bank transfer. He paid it back a year later."
      delta_wealth: 50000

- id: ch08_guarantee_called
  title: {ru: "Звонок из банка", en: "A call from the bank"}
  min_age: 24
  max_age: 70
  category: money
  weight: 4
  evidence: ch08_i18
  requires: {flags: [guarantor], flag_years: {guarantor: 2}}
  narrative:
    ru: |
      Автосервис друга закрылся, сам он не берёт трубку. Банк вежливо сообщает: долг 1 400 000
      плюс пени, вы — солидарный поручитель. Счета скоро арестуют.
    en: |
      Your friend's garage has closed and he won't pick up. The bank politely informs you: the
      debt is 1,400,000 plus penalties, and you are a joint-and-several guarantor. Your accounts
      will be frozen soon.
  choices:
    - id: pay
      text: {ru: "Платить: продать машину, занять у родителей", en: "Pay: sell the car, borrow from your parents"}
      tag: neutral
      delta_wealth: -1400000
      delta_sanity: -20
      clear_flags: [guarantor]
      evidence: ch08_i18
      outcome:
        ru: "Пять лет вы отдаёте чужой долг. Подпись — это обязательство, отпечаток пальца — тоже."
        en: "For five years you pay off someone else's debt. A signature is binding, and so is a fingerprint."
    - id: lawyer
      text: {ru: "Нанять юриста и требовать сначала взыскания с должника", en: "Hire a lawyer and demand they pursue the borrower first"}
      tag: neutral
      cost_money: 80000
      delta_wealth: -900000
      delta_sanity: -12
      clear_flags: [guarantor]
      evidence: ch08_i18
      outcome:
        ru: "Юрист отыграл часть: продали оборудование сервиса. Остаток всё равно ваш."
        en: "The lawyer clawed back some: the garage equipment was sold. The rest is still on you."

- id: ch08_card_rent
  title: {ru: "Подработка на карте", en: "A side job with your card"}
  min_age: 18
  max_age: 35
  category: legal
  evidence: ch09_i5
  narrative:
    ru: |
      В телеграм-канале «подработки для студентов» предлагают 30 000 в месяц: оформить карту
      и «просто принимать переводы» от «партнёров», а потом пересылать дальше.
    en: |
      A "student side gigs" channel offers 30,000 a month to open a bank card and "just receive
      transfers" from "partners", then forward them on.
  choices:
    - id: accept
      text: {ru: "Согласиться: деньги лёгкие", en: "Agree: easy money"}
      tag: risky
      delta_wealth: 60000
      stat_effects: {legal_prison_risk: 3.0} # game approximation; renting out cards is illegal in itself (ch08_i8)
      catastrophe_check:
        chance: 0.15 # game approximation
        kind: prison
        years: 2
        delta_sanity: -15
        text:
          ru: "Через ваши карты прошли деньги обманутых пенсионеров. Два года и три месяца — как в деле из книги."
          en: "Money stolen from defrauded pensioners went through your cards. Two years and three months — just like the case in the book."
        evidence: ch09_i5
      evidence: ch08_i8
      outcome:
        ru: "Два месяца всё шло отлично. Подработки за пару тысяч обходятся судимостью."
        en: "Two months went perfectly. Side jobs worth a few thousand cost people a criminal record."
    - id: refuse
      text: {ru: "Отказаться: карта — только для себя", en: "Refuse: your card is for you alone"}
      tag: wise
      evidence: ch08_i8
      outcome:
        ru: "Аренда, передача или продажа своей карты незаконна сама по себе."
        en: "Renting out, lending or selling your bank card is illegal in itself."

- id: ch08_move_car
  title: {ru: "Переставить машину", en: "Just move the car"}
  min_age: 20
  max_age: 70
  category: legal
  evidence: ch08_i7
  narrative:
    ru: |
      Корпоратив, три бокала вина. Звонит сосед: ваша машина перекрыла выезд скорой. Надо
      проехать пятьдесят метров до соседнего двора.
    en: |
      A work party, three glasses of wine. A neighbour calls: your car is blocking the ambulance
      exit. You just need to drive fifty metres to the next yard.
  choices:
    - id: drive
      text: {ru: "Пятьдесят метров — ерунда, переставлю сам", en: "Fifty metres is nothing, I'll move it myself"}
      tag: risky
      catastrophe_check:
        chance: 0.125 # game approximation
        kind: prison
        years: 1
        delta_wealth: -50000
        delta_sanity: -10
        text:
          ru: "Патруль стоял прямо у выезда. Лишение прав, уголовное дело за повторное — и запись в биографии."
          en: "A patrol car was parked right at the exit. A lost licence, a criminal case — and a record that follows you."
        evidence: ch08_i7
      evidence: ch08_i7
      outcome:
        ru: "Пронесло. Пьяная езда — это лишение прав, а пьяное «ещё раз» — уголовная статья, и страховка не платит."
        en: "Got away with it. Drink-driving costs your licence, a repeat costs a criminal case, and insurance won't pay."
    - id: driver
      text: {ru: "Вызвать трезвого водителя", en: "Call a sober driver service"}
      tag: wise
      cost_money: 1500
      evidence: ch08_i7
      outcome:
        ru: "1500 рублей и десять минут ожидания."
        en: "1,500 rubles and ten minutes of waiting."
    - id: keys
      text: {ru: "Отдать ключи непьющему коллеге", en: "Hand the keys to a sober colleague"}
      tag: wise
      evidence: ch08_i7
      outcome:
        ru: "Коллега переставил машину и забрал у вас кусок торта в качестве оплаты."
        en: "A colleague moved the car and took a slice of cake as payment."

- id: ch08_scam_call
  title: {ru: "«Служба безопасности банка»", en: "\"Your bank's security department\""}
  min_age: 25
  max_age: 84
  category: money
  weight: 1.2
  evidence: ch08_i3
  requires: {min_wealth: 100000}
  narrative:
    ru: |
      Вежливый мужчина называет вас по имени-отчеству и последние цифры карты: «С вашего счёта
      пытаются вывести деньги. Срочно переведите всё на защищённый счёт, я продиктую».
    en: |
      A polite man knows your full name and the last digits of your card: "Someone is trying to
      drain your account. Transfer everything to a protected account right now, I'll dictate it."
  choices:
    - id: hang_up
      text: {ru: "Положить трубку и перезвонить по номеру на карте", en: "Hang up and call the number on the back of your card"}
      tag: wise
      cost_will: 1
      evidence: ch08_i3
      outcome:
        ru: "Банк ни о каких попытках не знал. Звонят — кладите трубку, перезванивайте сами."
        en: "The bank knew of no attempts. If they call you, hang up and call back yourself."
    - id: transfer
      text: {ru: "Скорее перевести, пока не украли", en: "Transfer quickly before it's stolen"}
      tag: risky
      catastrophe_check:
        chance: 0.95 # it is always a scam
        kind: ruin
        wealth_fraction: 0.7
        delta_sanity: -20
        text:
          ru: "«Защищённый счёт» принадлежал мошенникам. Вы перевели всё, что было на счетах."
          en: "The \"protected account\" belonged to scammers. You transferred everything you had."
        evidence: ch08_i3
      evidence: ch08_i3
      outcome:
        ru: "Связь прервалась на середине перевода. Повезло."
        en: "The line dropped mid-transfer. Lucky."

- id: ch08_punch
  title: {ru: "Толчок в очереди", en: "A shove in the queue"}
  min_age: 18
  max_age: 55
  category: legal
  evidence: ch09_i19
  narrative:
    ru: |
      Подвыпивший мужчина толкает вас в очереди к кассе и обзывает. Ваш кулак уже сжался сам.
      Вокруг смотрят.
    en: |
      A tipsy man shoves you in the checkout queue and calls you names. Your fist is already
      clenched. People are watching.
  choices:
    - id: hit
      text: {ru: "Ударить первым — сам напросился", en: "Hit him first — he asked for it"}
      tag: risky
      delta_sanity: 4
      stat_effects: {legal_prison_risk: {factor: 2.0, years: 3}}
      catastrophe_check:
        chance: 0.175 # game approximation
        kind: ruin
        delta_wealth: -1350000
        delta_sanity: -15
        text:
          ru: "Он упал и сломал три ребра. Чтобы не было уголовного дела, вы заплатили ему 1 350 000 — как в деле из книги (113 000 юаней)."
          en: "He fell and broke three ribs. To avoid a criminal case you paid him 1,350,000 — like the case in the book (113,000 yuan)."
        evidence: ch09_i19
      evidence: ch09_i19
      outcome:
        ru: "Ударивший первым почти всегда проигрывает: арест до 10 суток и штраф, а при травме — уголовное дело."
        en: "Whoever strikes first almost always loses: up to ten days' detention and a fine, and a criminal case if someone is hurt."
    - id: police
      text: {ru: "Отойти и вызвать охрану", en: "Step back and call security"}
      tag: wise
      cost_will: 2
      delta_sanity: -4
      evidence: ch08_i10
      outcome:
        ru: "Охрана вывела его. Злость ушла к вечеру, судимости не появилось."
        en: "Security escorted him out. The anger faded by evening, and no criminal record appeared."

- id: ch08_blank_paper
  title: {ru: "Подпись на пустом листе", en: "A signature on a blank sheet"}
  min_age: 20
  max_age: 65
  category: legal
  evidence: ch08_i17
  narrative:
    ru: |
      Новый работодатель просит при оформлении подписать пустой лист «на всякий случай, для
      бухгалтерии». Все новенькие подписывают.
    en: |
      Your new employer asks you to sign a blank sheet during onboarding "just in case, for
      accounting". All the new hires sign.
  choices:
    - id: sign
      text: {ru: "Подписать: все подписывают", en: "Sign: everyone does"}
      tag: risky
      catastrophe_check:
        chance: 0.125 # game approximation
        kind: ruin
        delta_wealth: -300000
        delta_sanity: -10
        text:
          ru: "Через год на вашем листе появилось «заявление по собственному» и расписка о недостаче."
          en: "A year later your sheet turned into a resignation letter and an admission of a stock shortfall."
        evidence: ch08_i17
      evidence: ch08_i17
      outcome:
        ru: "Подпись на пустом листе — это чек без суммы. В суде «я не читал» почти никогда не помогает."
        en: "A signature on a blank sheet is a cheque without an amount. \"I didn't read it\" almost never works in court."
    - id: refuse
      text: {ru: "Отказаться и подписывать только заполненные документы", en: "Refuse and sign only filled-in documents"}
      tag: wise
      cost_will: 2
      evidence: ch08_i17
      outcome:
        ru: "Кадровик поморщился, но лист убрал."
        en: "The HR officer winced but put the sheet away."

- id: ch08_nominee
  title: {ru: "Директор на бумаге", en: "A director on paper"}
  min_age: 20
  max_age: 50
  category: legal
  evidence: ch08_i28
  narrative:
    ru: |
      Знакомый предлагает 25 000 за то, чтобы записать фирму на ваш паспорт: «Ты ничего не
      делаешь, я всем управляю. Просто числишься директором».
    en: |
      An acquaintance offers 25,000 to register a company in your name: "You do nothing, I run
      everything. You're just the director on paper."
  choices:
    - id: accept
      text: {ru: "Взять деньги — что тут такого", en: "Take the money — what's the harm"}
      tag: risky
      delta_wealth: 25000
      set_flags: [nominee_director]
      stat_effects: {legal_prison_risk: 2.0} # game approximation; "I was just a figurehead" is no defence (ch08_i28)
      evidence: ch08_i28
      outcome:
        ru: "Паспорт вернули через день. Закон считает директором того, кто записан, а не того, кто управлял."
        en: "You got your passport back the next day. The law treats the registered director as the one in charge."
    - id: refuse
      text: {ru: "Отказаться", en: "Refuse"}
      tag: wise
      evidence: ch08_i28
      outcome:
        ru: "«Подставное лицо» — не оправдание ни для налоговой, ни для суда."
        en: "\"I was a figurehead\" is no excuse to the tax office or the court."

- id: ch08_nominee_debts
  title: {ru: "Повестка", en: "A summons"}
  min_age: 22
  max_age: 70
  category: legal
  weight: 4
  evidence: ch08_i28
  requires: {flags: [nominee_director], flag_years: {nominee_director: 2}}
  narrative:
    ru: |
      Фирма, где вы «числились», набрала долгов перед поставщиками и не платила налоги. Знакомый

      the socket in the hallway is so convenient. It will have to charge overnight.
  choices:
    - id: hallway
      text: {ru: "Заряжать в прихожей, у входной двери", en: "Charge it in the hallway, by the front door"}
      tag: risky
      delta_wealth: 40000
      catastrophe_check:
        chance: 0.03 # game approximation
        kind: injury
        delta_health: -40
        wealth_fraction: 0.3
        text:
          ru: "Ночью батарея вспыхнула прямо у единственного выхода. Вы выпрыгнули со второго этажа."
          en: "At night the battery burst into flames right by the only exit. You jumped from the second floor."
        evidence: ch01_i6
      evidence: ch01_i6
      outcome:
        ru: "Удобно. Подработка приносит деньги, а батарея каждую ночь греется у двери."

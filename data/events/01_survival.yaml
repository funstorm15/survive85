# Chapter 1 — "How to avoid premature death": roads, fire, water, screening,
# vaccines, crises. Absolute chances of instant checks are game
# approximations; the ratios between choices come from the cited evidence.

- id: ch01_seatbelt
  title: {ru: "Заднее сиденье", en: "The back seat"}
  min_age: 18
  max_age: 40
  category: safety
  weight: 1.5
  evidence: ch01_i1
  narrative:
    ru: |
      Ночное такси после дня рождения друга. Водитель гонит по пустому проспекту, в салоне
      пахнет ёлочкой-ароматизатором. Ремень на заднем сиденье засунут глубоко между подушками.
    en: |
      A late-night taxi after a friend's birthday. The driver races down an empty avenue, the
      car smells of a pine air freshener. The back-seat belt is buried deep between the cushions.
  choices:
    - id: buckle
      text: {ru: "Выкопать ремень и пристегнуться — и делать так всегда", en: "Dig out the belt and buckle up — and always do it"}
      tag: wise
      cost_will: 1
      add_conditions: [seatbelt]
      evidence: ch01_i1
      outcome:
        ru: "Водитель усмехнулся в зеркало. Пусть. Вы приучили себя пристёгиваться даже сзади."
        en: "The driver smirked in the mirror. Fine. You trained yourself to buckle up even in the back."
    - id: skip
      text: {ru: "Сзади же не штрафуют. Доеду так", en: "Nobody fines you in the back. I'll ride like this"}
      tag: risky
      add_conditions: [no_seatbelt]
      evidence: ch01_i1
      outcome:
        ru: "Доехали. В этот раз. Привычка «сзади можно» осталась с вами надолго."
        en: "You got home. This time. The \"back seat doesn't count\" habit stayed with you for years."
      death_reasons:
        trauma: {ru: "Вылетел через лобовое стекло с заднего сиденья", en: "Thrown through the windscreen from the back seat"}

- id: ch01_motorbike
  title: {ru: "Свой мотоцикл", en: "A bike of your own"}
  min_age: 18
  max_age: 45
  category: safety
  evidence: ch01_i2
  requires: {min_wealth: 60000}
  narrative:
    ru: |
      Пробки съедают два часа в день. Подержанный мотоцикл стоит как три месячные проездные
      за год. Продавец кидает в придачу старый шлем с порванным ремешком.
    en: |
      Traffic eats two hours a day. A used motorbike costs less than a year of transit passes.
      The seller throws in an old helmet with a torn chin strap.
  choices:
    - id: good_helmet
      text: {ru: "Купить мотоцикл и нормальный шлем, всегда застёгивать ремешок", en: "Buy the bike and a proper helmet, always fasten the strap"}
      tag: wise
      cost_money: 60000
      cost_will: 1
      add_conditions: [rider_helmet]
      set_flags: [motorbike]
      evidence: ch01_i2
      outcome:
        ru: "Ремешок под подбородком щёлкает каждый раз. Шлем, который висит на руле, не считается."
        en: "The strap clicks under your chin every time. A helmet hanging off the handlebar doesn't count."
    - id: old_helmet
      text: {ru: "Купить мотоцикл, а шлем… потом. Летом в нём жарко", en: "Buy the bike; the helmet can wait. It's hot in summer"}
      tag: risky
      cost_money: 52000
      add_conditions: [rider_no_helmet]
      set_flags: [motorbike]
      evidence: ch01_i2
      outcome:
        ru: "Ветер в лицо, свобода. Шлем болтается на зеркале, как сувенир."
        en: "Wind in your face, freedom. The helmet dangles from the mirror like a souvenir."
    - id: bus
      text: {ru: "Остаться на автобусе и слушать подкасты", en: "Stay on the bus and listen to podcasts"}
      tag: neutral
      delta_sanity: -3
      outcome:
        ru: "Ещё один год в пробках. Зато вы дослушали все сезоны любимого подкаста."
        en: "Another year in traffic. At least you finished every season of your favourite podcast."

- id: ch01_motorbike_crash
  title: {ru: "Мокрый асфальт", en: "Wet asphalt"}
  min_age: 18
  max_age: 70
  category: emergency
  weight: 1.5
  weight_by: {trauma_accident_risk: 1}
  evidence: ch01_i2
  requires: {flags: [motorbike], flag_years: {motorbike: 1}}
  narrative:
    ru: |
      Дождь, вечер, такси резко перестраивается в ваш ряд. Тормозить поздно: колесо уходит
      на разметке, и асфальт летит навстречу.
    en: |
      Rain, evening, a taxi cuts into your lane. Too late to brake: the wheel slides on the
      road paint and the asphalt rushes up at you.
  choices:
    - id: fall_helmet
      text: {ru: "Сгруппироваться — голова в застёгнутом шлеме", en: "Tuck and roll — head inside a strapped helmet"}
      tag: wise
      requires: {conditions: [rider_helmet]}
      delta_health: -20
      instant_death_check:
        chance: 0.0175 # game approximation; OR 0.58 vs the unprotected choice (0.03 × 0.58)
        cause: trauma
        death_reason: {ru: "Сочетанная травма в мотоаварии", en: "Multiple injuries in a motorbike crash"}
        evidence: ch01_i2
      evidence: ch01_i2
      outcome:
        ru: "Сломанная ключица и расколотый шлем. Шлем можно купить новый — голову нет."
        en: "A broken collarbone and a cracked helmet. You can buy a new helmet, not a new head."
    - id: fall_bare
      text: {ru: "Сгруппироваться — шлем остался на зеркале", en: "Tuck and roll — the helmet is still on the mirror"}
      tag: risky
      requires: {conditions: [rider_no_helmet]}
      delta_health: -35
      instant_death_check:
        chance: 0.03 # game approximation
        cause: trauma
        death_reason: {ru: "Черепно-мозговая травма: мотоцикл без шлема", en: "Head injury: motorbike crash without a helmet"}
        evidence: ch01_i2
      evidence: ch01_i2
      outcome:
        ru: "Сотрясение, швы на голове, месяц в больнице. Шлем вы теперь видите во сне."
        en: "A concussion, stitches in your scalp, a month in hospital. Now you dream of helmets."
    - id: sell
      text: {ru: "После больницы продать мотоцикл", en: "After hospital, sell the bike"}
      tag: neutral
      delta_health: -25
      delta_wealth: 35000
      remove_conditions: [rider_helmet, rider_no_helmet]
      clear_flags: [motorbike]
      outcome:
        ru: "Удачно отделались. Мотоцикл ушёл первому же покупателю."
        en: "A lucky escape. The bike went to the first buyer."

- id: ch01_smoke_alarm
  title: {ru: "Датчик дыма за 1200", en: "A 1,200-ruble smoke alarm"}
  min_age: 20
  max_age: 75
  category: safety
  evidence: ch01_i3
  requires: {not_flags: [smoke_alarm]}
  narrative:
    ru: |
      В соседнем подъезде ночью сгорела квартира: хозяин спал и не почувствовал дыма. В лифте
      висит объявление — управляющая компания продаёт автономные датчики дыма по 1200 рублей.
    en: |
      A flat burnt out in the next building last night: the owner was asleep and never smelled
      the smoke. A notice in the lift says the building manager sells smoke alarms at 1,200 rubles.
  choices:
    - id: install
      text: {ru: "Купить два датчика и менять батарейки раз в год", en: "Buy two alarms and change the batteries every year"}
      tag: wise
      cost_money: 2400
      set_flags: [smoke_alarm]
      evidence: ch01_i3
      outcome:
        ru: "Пищит при каждой подгоревшей яичнице. Зато разбудит, если загорится по-настоящему."
        en: "It beeps at every burnt omelette. But it will wake you if there is a real fire."
    - id: skip
      text: {ru: "Ерунда, я же почувствую запах", en: "Nonsense, I'd smell it"}
      tag: risky
      evidence: ch01_i3
      outcome:
        ru: "Вы сэкономили 2400 рублей. Четыре из десяти погибших при пожаре в момент возгорания спали."
        en: "You saved 2,400 rubles. Four in ten fire victims were asleep when the fire started."

- id: ch01_house_fire
  title: {ru: "Три часа ночи, запах гари", en: "3 a.m., the smell of smoke"}
  min_age: 20
  max_age: 84
  category: emergency
  weight: 0.6
  evidence: ch13_i24
  narrative:
    ru: |
      Вы просыпаетесь в темноте. В горле першит, под дверью спальни тянется серая полоса дыма.
      Где-то трещит проводка.
    en: |
      You wake in the dark. Your throat burns and a grey ribbon of smoke slides under the
      bedroom door. Wiring crackles somewhere.
  choices:
    - id: alarm_crawl
      text: {ru: "Датчик орёт. Ползком к лестнице, проверяя двери ладонью", en: "The alarm is screaming. Crawl to the stairs, testing doors by hand"}
      tag: wise
      requires: {flags: [smoke_alarm]}
      delta_health: -5
      instant_death_check:
        chance: 0.006 # game approximation; OR 0.39 with a working alarm (0.015 × 0.39)
        cause: trauma
        death_reason: {ru: "Отравление продуктами горения при пожаре", en: "Smoke inhalation in a house fire"}
        evidence: ch01_i3
      evidence: ch13_i24
      outcome:
        ru: "Датчик разбудил вас минутами раньше. Вы выбрались по лестнице, пока дым ещё стоял под потолком."
        en: "The alarm woke you minutes earlier. You got down the stairs while the smoke still hung under the ceiling."
    - id: crawl
      text: {ru: "Ползком к лестнице, проверяя двери ладонью", en: "Crawl to the stairs, testing doors by hand"}
      tag: wise
      requires: {not_flags: [smoke_alarm]}
      delta_health: -15
      instant_death_check:
        chance: 0.015 # game approximation
        cause: trauma
        death_reason: {ru: "Отравление продуктами горения: в квартире не было датчика дыма", en: "Smoke inhalation: there was no smoke alarm in the flat"}
        evidence: ch01_i3
      evidence: ch13_i24
      outcome:
        ru: "Вы проснулись поздно, но ползли под дымом и не открыли горячую дверь. Это и спасло."
        en: "You woke late, but you crawled under the smoke and never opened the hot door. That saved you."
    - id: elevator
      text: {ru: "Схватить телефон и бегом к лифту", en: "Grab the phone and run for the lift"}
      tag: risky
      delta_health: -20
      instant_death_check:
        chance: 0.045 # game approximation: lifts lose power and fill with smoke (ch13_i24)
        scale_by: [trauma_accident_risk]
        cause: trauma
        death_reason: {ru: "Задохнулся в застрявшем при пожаре лифте", en: "Suffocated in a lift that stalled during a fire"}
        evidence: ch13_i24
      evidence: ch13_i24
      outcome:
        ru: "Лифт дёрнулся и встал между этажами. Пожарные вытащили вас через люк, уже без сознания."
        en: "The lift jerked and stopped between floors. Firefighters pulled you out through the hatch, unconscious."

- id: ch01_mushrooms
  title: {ru: "Грибная поляна", en: "A clearing full of mushrooms"}
  min_age: 18
  max_age: 84
  category: safety
  evidence: ch01_i5
  narrative:
    ru: |
      На даче сосед хвастается корзиной грибов: «Червивые — значит, не ядовитые, проверено!»
      На опушке их ещё полно, и вечером обещают жарить с картошкой.
    en: |
      At the dacha a neighbour shows off a basket of mushrooms: "Worms eat them, so they're not
      poisonous — proven!" The forest edge is full of them, and tonight they'll be fried with potatoes.
  choices:
    - id: eat
      text: {ru: "Набрать и пожарить — сосед же разбирается", en: "Pick some and fry them — the neighbour knows his stuff"}
      tag: risky
      delta_health: -15
      instant_death_check:
        chance: 0.015 # game approximation; folk identification tricks do not work (ch01_i5)
        cause: liver
        death_reason: {ru: "Отравление бледной поганкой: печёночная недостаточность", en: "Death-cap poisoning: liver failure"}
        evidence: ch01_i5
      evidence: ch01_i5
      outcome:
        ru: "Ночью скрутило живот. Скорая, капельницы, три дня в токсикологии. Сосед клянётся, что грибы были «те самые»."
        en: "At night your stomach cramped. An ambulance, drips, three days in toxicology. The neighbour swears they were \"the right ones\"."
    - id: refuse
      text: {ru: "Грибы — только из магазина. Народные приметы не работают", en: "Mushrooms only from a shop. Folk tricks don't work"}
      tag: wise
      evidence: ch01_i5
      outcome:
        ru: "Над вами посмеялись за ужином. Серебряная ложка, червяки и «яркий значит ядовитый» — всё это мифы."
        en: "They laughed at you over dinner. Silver spoons, worms and \"bright means poisonous\" are all myths."


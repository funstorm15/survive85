  choices:
    - id: vaccinate
      text: {ru: "Привиться: чем раньше, тем лучше", en: "Get vaccinated: the earlier the better"}
      tag: wise
      cost_money: 30000
      # IRR 0.47 for invasive cervical cancer when vaccinated at 17–30; cervical
      # cancer ≈ 7% of women's cancer deaths → 1 - 0.07×0.53 ≈ 0.96

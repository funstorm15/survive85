      delta_wealth: 40000
      evidence: ch01_i6
      outcome:
        ru: "Минус 500 в месяц. Пожар на лестнице отрезал бы единственный путь на улицу."
        en: "Minus 500 a month. A fire on the stairs would cut off the only way out."

- id: ch01_blood_pressure
  title: {ru: "Тонометр в аптеке", en: "The pharmacy blood-pressure cuff"}
  min_age: 35
  max_age: 80
  category: chronic
  weight: 1.5
  evidence: ch01_i7
  requires: {not_conditions: [hypertension, hypertension_treated]}
  narrative:
    ru: |
      Пока ждёте очередь в аптеке, от скуки суёте руку в автоматический тонометр. Экран мигает:
      162/101. Голова не болит, чувствуете себя отлично.
    en: |
      Waiting in line at the pharmacy, you idly slip your arm into the automatic cuff. The screen
      blinks: 162/101. No headache, you feel great.
  choices:
    - id: treat
      text: {ru: "Сходить к терапевту, подобрать таблетки, мерить дома", en: "See a GP, get pills, measure at home"}
      tag: wise
      cost_money: 4000
      cost_will: 2
      add_conditions: [hypertension_treated]
      evidence: ch01_i7
      outcome:
        ru: "Каждые 10 мм рт. ст. снижения — на 20% меньше сердечно-сосудистых катастроф. Таблетка утром стала привычкой."
        en: "Every 10 mmHg lower means 20% fewer major cardiovascular events. The morning pill became a habit."
    - id: ignore
      text: {ru: "Автомат врёт. Я же ничего не чувствую", en: "The machine is lying. I don't feel a thing"}
      tag: risky
      add_conditions: [hypertension]
      evidence: ch01_i7
      outcome:
        ru: "Гипертония не болит. Среди взрослых 35–75 лет она у 44,7%, под контролем — у 7,2%."
        en: "Hypertension doesn't hurt. 44.7% of adults aged 35–75 have it; 7.2% have it under control."


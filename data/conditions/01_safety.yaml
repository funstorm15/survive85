# Safety habits, debts and other lasting states from chapters 1, 5, 7, 8, 19, 29.

- id: seatbelt
  icon: "⛨"
  kind: good
  name: {ru: "Пристёгивается всегда", en: "Always buckles up"}
  description:
    ru: "Ремень спереди снижает риск гибели в аварии на 45%."
    en: "A front seat belt cuts the risk of dying in a crash by 45%."
  evidence: ch01_i1
  # −45% for car occupants; occupant deaths ≈ 20% of injury deaths → 1-0.2×0.45 ≈ 0.91
  modifiers: {trauma_accident_risk: 0.91}

- id: no_seatbelt
  icon: "⚠"
  kind: bad
  name: {ru: "Не пристёгивается", en: "Never buckles up"}
  description:
    ru: "«Да я недалеко». Каждая вторая жертва ДТП была не пристёгнута."
    en: "\"It's just around the corner.\" Half of crash victims were unbelted."
  evidence: ch01_i1
  modifiers: {trauma_accident_risk: 1.1} # 1/0.91
  death_reasons:
    trauma: {ru: "Вылетел через лобовое стекло: не был пристёгнут", en: "Thrown through the windscreen: not wearing a seat belt"}

- id: rider_helmet
  icon: "⛑"
  kind: neutral
  name: {ru: "Мотоцикл и шлем", en: "Motorbike, helmet on"}
  description:
    ru: "Ездите на мотоцикле, шлем застёгнут."
    en: "You ride a motorbike with the helmet strapped."
  evidence: ch01_i2
  # riding itself: game approximation ×1.25 on injuries
  modifiers: {trauma_accident_risk: 1.25}

- id: rider_no_helmet
  icon: "☠"
  kind: bad
  name: {ru: "Мотоцикл без шлема", en: "Motorbike, no helmet"}
  description:
    ru: "Шлем висит на руле. Без шлема гибель при аварии примерно в 1,7 раза вероятнее."
    en: "The helmet hangs on the handlebar. Without it, death in a crash is about 1.7 times as likely."
  evidence: ch01_i2
  # OR 0.58 for death with a helmet → 1.25 / 0.58 ≈ 2.15
  modifiers: {trauma_accident_risk: 2.15}
  death_reasons:
    trauma: {ru: "Черепно-мозговая травма: мотоцикл, шлем не надет", en: "Head injury: motorbike crash without a helmet"}

